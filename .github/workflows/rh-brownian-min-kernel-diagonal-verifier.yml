name: Verify RH Brownian min-kernel diagonal optimizer

on:
  push:
    branches:
      - agent/rh-brownian-min-kernel-diagonal-verifier-20260813
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Canonical-source and trust preflight
        shell: bash
        run: |
          set -euo pipefail
          SRC=verification/rh-brownian-min-kernel/RHBrownianMinKernelDiagonal.lean
          EXPECTED_BLOB=2d897ac00cb901124d8862c47d729711e317d3e0
          ACTUAL_BLOB=$(git hash-object "$SRC")
          test "$ACTUAL_BLOB" = "$EXPECTED_BLOB"
          python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path('verification/rh-brownian-min-kernel/RHBrownianMinKernelDiagonal.lean')
          text = p.read_text()
          forbidden = re.compile(r'(^|[^A-Za-z0-9_])(sorry|admit|sorryAx|axiom|opaque|unsafe)([^A-Za-z0-9_]|$)')
          match = forbidden.search(text)
          if match:
              raise SystemExit(f'forbidden source token: {match.group(2)}')
          if 'Lean.ofReduceBool' in text or 'native_decide' in text:
              raise SystemExit('forbidden source oracle')
          if text.count('#print axioms') != 8:
              raise SystemExit('expected exactly eight staged #print axioms commands')
          print('source trust preflight: clean')
          PY

      - name: Execute AXLE Lean 4.30 and preserve raw response
        shell: bash
        run: |
          set -euo pipefail
          OUT=verification/rh-brownian-min-kernel/evidence
          mkdir -p "$OUT"
          python3 - <<'PY'
          import json
          import pathlib
          import urllib.request

          source_path = pathlib.Path(
              'verification/rh-brownian-min-kernel/RHBrownianMinKernelDiagonal.lean'
          )
          out = pathlib.Path(
              'verification/rh-brownian-min-kernel/evidence/axle-response.json'
          )
          payload = json.dumps({
              'content': source_path.read_text(),
              'environment': 'lean-4.30.0',
              'ignore_imports': True,
              'mathlib_options': False,
              'timeout_seconds': 900,
          }).encode()
          request = urllib.request.Request(
              'https://axle.axiommath.ai/api/v1/check',
              data=payload,
              headers={'Content-Type': 'application/json'},
              method='POST',
          )
          try:
              with urllib.request.urlopen(request, timeout=960) as response:
                  result = json.load(response)
          except Exception as exc:
              result = {
                  'okay': False,
                  'request_exception': repr(exc),
                  'lean_messages': {'errors': []},
                  'tool_messages': {'errors': []},
                  'failed_declarations': [],
              }
          out.write_text(json.dumps(result, indent=2, sort_keys=True))
          print(json.dumps(result, indent=2))
          PY

      - name: Record replay metadata
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT=verification/rh-brownian-min-kernel/evidence
          mkdir -p "$OUT"
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "ref=${GITHUB_REF}"
            echo "commit=${GITHUB_SHA}"
            echo "runner_name=${RUNNER_NAME}"
            echo "runner_os=${RUNNER_OS}"
            echo "source_blob=$(git hash-object verification/rh-brownian-min-kernel/RHBrownianMinKernelDiagonal.lean)"
            echo "source_sha256=$(sha256sum verification/rh-brownian-min-kernel/RHBrownianMinKernelDiagonal.lean | awk '{print $1}')"
            echo "environment=lean-4.30.0"
          } > "$OUT/replay-metadata.txt"

      - name: Upload exact compiler evidence before verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rh-brownian-min-kernel-diagonal-evidence
          path: verification/rh-brownian-min-kernel/evidence/
          if-no-files-found: error

      - name: Enforce compiler and postcompile trust verdict
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib

          def annotate(kind, item):
              if isinstance(item, dict):
                  message = item.get('message') or item.get('text') or json.dumps(item, sort_keys=True)
              else:
                  message = str(item)
              message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::{kind} title=AXLE Lean diagnostic::{message}')

          p = pathlib.Path(
              'verification/rh-brownian-min-kernel/evidence/axle-response.json'
          )
          if not p.exists():
              print('::error title=AXLE evidence::missing AXLE response evidence')
              raise SystemExit(1)
          result = json.loads(p.read_text())
          lean_errors = result.get('lean_messages', {}).get('errors', [])
          lean_warnings = result.get('lean_messages', {}).get('warnings', [])
          tool_errors = result.get('tool_messages', {}).get('errors', [])
          tool_warnings = result.get('tool_messages', {}).get('warnings', [])
          failed = result.get('failed_declarations', [])
          if result.get('request_exception'):
              annotate('error', result['request_exception'])
          for item in lean_errors:
              annotate('error', item)
          for item in lean_warnings:
              annotate('warning', item)
          for item in tool_errors:
              annotate('error', item)
          for item in tool_warnings:
              annotate('warning', item)
          for item in failed:
              annotate('error', f'failed declaration: {item}')
          if not result.get('okay') or lean_errors or lean_warnings or tool_errors or tool_warnings or failed:
              raise SystemExit('Lean/AXLE verification failed or warned; diagnostics emitted above')
          rendered = json.dumps(result)
          for forbidden in ('sorryAx', 'Lean.ofReduceBool'):
              if forbidden in rendered:
                  annotate('error', f'postcompile forbidden dependency: {forbidden}')
                  raise SystemExit(1)
          print('VERIFIED WARNING-FREE: exact Brownian min-kernel source compiled under AXLE Lean 4.30')
          PY
