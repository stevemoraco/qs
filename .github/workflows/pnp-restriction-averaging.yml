name: PNP restriction averaging Lean replay

on:
  push:
    branches:
      - main
      - automation/b1-pnp-positive-mass-suffices-20260813
    paths:
      - 'verification/pnp-restriction-averaging/**'
      - '.github/workflows/pnp-restriction-averaging.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Reject explicit proof holes and conclusion-carrying escape hatches
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            verification/pnp-restriction-averaging/PNPRestrictionAveraging.lean \
            verification/pnp-restriction-averaging/PNPPathologyMassFinite.lean \
            verification/pnp-restriction-averaging/PNPPathologyCatalogueFinite.lean \
            verification/pnp-restriction-averaging/PNPConditioningFinite.lean
          do
            if grep -nE '\b(sorry|admit|sorryAx)\b' "$file"; then
              echo "Explicit proof hole found in $file"
              exit 1
            fi
            if grep -nE '\b(axiom|opaque|unsafe|native_decide|Lean\.ofReduceBool)\b' "$file"; then
              echo "Forbidden escape hatch found in $file"
              exit 1
            fi
          done

      - name: Install Lean
        shell: bash
        run: |
          set -euo pipefail
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve pinned Mathlib and fetch cache
        shell: bash
        working-directory: verification/pnp-restriction-averaging
        run: |
          set -euo pipefail
          lake update
          lake exe cache get

      - name: Kernel replay and axiom report
        shell: bash
        working-directory: verification/pnp-restriction-averaging
        run: |
          set -euo pipefail
          : > lean-replay.log
          for file in \
            PNPRestrictionAveraging.lean \
            PNPPathologyMassFinite.lean \
            PNPPathologyCatalogueFinite.lean \
            PNPConditioningFinite.lean
          do
            lake env lean "$file" | tee -a lean-replay.log
          done
          test "$(grep -c '^warning: declaration uses' lean-replay.log || true)" -eq 0
