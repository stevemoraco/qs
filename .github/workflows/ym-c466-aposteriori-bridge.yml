name: YM C466 a posteriori Wilson bridge finite core

on:
  push:
    branches:
      - agent/ym-c466-aposteriori-wilson-bridge-certificate-20260821-gpt56
  pull_request:
    branches: [main]
    paths:
      - 'verification/ym-c466-aposteriori-bridge/**'
      - '.github/workflows/ym-c466-aposteriori-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Reject proof holes and trust escapes
        shell: bash
        run: |
          set -euo pipefail
          file=verification/ym-c466-aposteriori-bridge/YMAposterioriWilsonBridgeFinite.lean
          if grep -nE '\b(sorry|admit|sorryAx|axiom|opaque|unsafe|native_decide|Lean\.ofReduceBool)\b' "$file"; then
            echo 'Forbidden proof token found'
            exit 1
          fi

      - name: Install pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve Mathlib and fetch cache
        shell: bash
        working-directory: verification/ym-c466-aposteriori-bridge
        run: |
          set -euo pipefail
          lake update
          lake exe cache get

      - name: Kernel replay and axiom audit
        shell: bash
        working-directory: verification/ym-c466-aposteriori-bridge
        run: |
          set -euo pipefail
          lake env lean YMAposterioriWilsonBridgeFinite.lean 2>&1 | tee lean-replay.log
          if grep -Eq 'sorryAx|declaration uses .sorry.' lean-replay.log; then
            exit 1
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ym-c466-aposteriori-bridge-lean-evidence
          path: |
            verification/ym-c466-aposteriori-bridge/YMAposterioriWilsonBridgeFinite.lean
            verification/ym-c466-aposteriori-bridge/lean-replay.log
          if-no-files-found: warn
