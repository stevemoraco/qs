name: PNP Markov return public verifier

on:
  push:
    branches:
      - agent/pnp-markov-return-public-verifier-20260813
  pull_request:
    paths:
      - 'verification/pnp-markov-return-public/**'
      - '.github/workflows/pnp-markov-return-public-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Verify trust boundary and exact mirror
        shell: bash
        run: |
          set -euo pipefail
          dir='verification/pnp-markov-return-public'
          file="$dir/PNPMarkovReturnContraction.lean"
          actual_blob="$(git hash-object "$file")"
          expected_blob='ed6210b2b3ea22db73ac1e7a6985c95beb9f3868'
          test "$actual_blob" = "$expected_blob"
          printf 'canonical_rh_lean_commit=%s\n' \
            '861b59ab187a4667a2832c06874ef1b860d4643a' \
            | tee "$dir/origin.txt"
          printf 'canonical_rh_lean_blob=%s\n' "$actual_blob" \
            | tee -a "$dir/origin.txt"
          sha256sum "$file" | tee "$dir/source-sha256.txt"
          if grep -En '(^|[^[:alnum:]_])(sorry|admit|sorryAx)([^[:alnum:]_]|$)' "$file"; then
            exit 1
          fi
          if grep -En '^[[:space:]]*(axiom|opaque|unsafe)[[:space:]]' "$file"; then
            exit 1
          fi
          if grep -En '(native_decide|Lean\.ofReduceBool)' "$file"; then
            exit 1
          fi

      - name: Install pinned Lean and compile exact source
        shell: bash
        run: |
          set -euo pipefail
          dir='verification/pnp-markov-return-public'
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.32.1
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version | tee "$dir/lean-version.txt"
          lake --version | tee -a "$dir/lean-version.txt"
          cd "$dir"
          lake update
          lake exe cache get
          set +e
          lake env lean PNPMarkovReturnContraction.lean > lean-output.log 2>&1
          status=$?
          set -e
          cat lean-output.log
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          if grep -Eq 'declaration uses .sorry.|sorryAx|admit|Lean.ofReduceBool' lean-output.log; then
            exit 1
          fi
          echo 'VERIFIED PNP Markov return-contraction finite core.'

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pnp-markov-return-public-evidence
          path: |
            verification/pnp-markov-return-public/origin.txt
            verification/pnp-markov-return-public/source-sha256.txt
            verification/pnp-markov-return-public/lean-version.txt
            verification/pnp-markov-return-public/lean-output.log
