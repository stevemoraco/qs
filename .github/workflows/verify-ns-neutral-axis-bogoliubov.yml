name: Verify NS neutral-axis Bogoliubov core

on:
  push:
    branches:
      - agent/ns-neutral-axis-bogoliubov-verifier-20260813
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify exact source and trust preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification/ns-neutral-axis-bogoliubov/evidence
          python3 - <<'PY'
          import hashlib, pathlib, re
          p = pathlib.Path('NSNeutralAxisBogoliubovFinite.lean')
          text = p.read_text()
          sha = hashlib.sha256(text.encode()).hexdigest()
          if sha != '99d5a7f14b34af4ce2407233d02db776f179d828763a81fa11666cc22883f388':
              raise SystemExit(f'source hash mismatch: {sha}')
          forbidden = re.compile(r'(^|[^A-Za-z0-9_])(sorry|admit|sorryAx|axiom|opaque|unsafe)([^A-Za-z0-9_]|$)')
          if forbidden.search(text) or 'Lean.ofReduceBool' in text or 'native_decide' in text:
              raise SystemExit('source contains forbidden trust token')
          if text.count('#print axioms') != 11:
              raise SystemExit('expected eleven axiom reports')
          out = pathlib.Path('verification/ns-neutral-axis-bogoliubov/evidence/canonical-source.lean')
          out.write_text(text)
          print('canonical SHA-256', sha)
          PY

      - name: Execute AXLE Lean 4.30
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, urllib.request
          src = pathlib.Path('verification/ns-neutral-axis-bogoliubov/evidence/canonical-source.lean').read_text()
          payload = json.dumps({
              'content': src,
              'environment': 'lean-4.30.0',
              'ignore_imports': True,
              'mathlib_options': False,
              'timeout_seconds': 900,
          }).encode()
          req = urllib.request.Request(
              'https://axle.axiommath.ai/api/v1/check',
              data=payload,
              headers={'Content-Type': 'application/json'},
              method='POST',
          )
          try:
              with urllib.request.urlopen(req, timeout=960) as r:
                  result = json.load(r)
          except Exception as exc:
              result = {
                  'okay': False,
                  'request_exception': repr(exc),
                  'lean_messages': {'errors': [], 'warnings': []},
                  'tool_messages': {'errors': []},
                  'failed_declarations': [],
              }
          out = pathlib.Path('verification/ns-neutral-axis-bogoliubov/evidence/axle-response.json')
          out.write_text(json.dumps(result, indent=2, sort_keys=True))
          print(json.dumps(result, indent=2))
          PY

      - name: Record metadata
        if: always()
        shell: bash
        run: |
          OUT=verification/ns-neutral-axis-bogoliubov/evidence
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "commit=${GITHUB_SHA}"
            echo "runner=${RUNNER_NAME}"
            echo "canonical_private_commit=7735f5712960dfc6547d8a2500c5956eb7b2a584"
            echo "canonical_git_blob=5e39a661fca5b30dc3b91c8af8d8dafe7c9c308e"
            echo "canonical_sha256=99d5a7f14b34af4ce2407233d02db776f179d828763a81fa11666cc22883f388"
            echo "environment=lean-4.30.0"
          } > "$OUT/replay-metadata.txt"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ns-neutral-axis-bogoliubov-evidence
          path: verification/ns-neutral-axis-bogoliubov/evidence/
          if-no-files-found: error

      - name: Enforce verdict
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path('verification/ns-neutral-axis-bogoliubov/evidence/axle-response.json')
          if not p.exists():
              raise SystemExit('missing compiler evidence')
          r = json.loads(p.read_text())
          errs = r.get('lean_messages', {}).get('errors', [])
          warns = r.get('lean_messages', {}).get('warnings', [])
          terrs = r.get('tool_messages', {}).get('errors', [])
          twarns = r.get('tool_messages', {}).get('warnings', [])
          failed = r.get('failed_declarations', [])
          if not r.get('okay') or errs or warns or terrs or twarns or failed:
              raise SystemExit('Lean/AXLE failed or warned')
          rendered = json.dumps(r)
          if 'sorryAx' in rendered or 'Lean.ofReduceBool' in rendered:
              raise SystemExit('forbidden postcompile dependency')
          print('VERIFIED WARNING-FREE')
          PY
