name: YM Kirk v4 bi-graded U5 source audit

on:
  push:
    branches:
      - verification/ym-kirk-v4-bigraded-u5-audit-20260816
    paths:
      - .github/workflows/ym-kirk-v4-bigraded-u5-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verification/ym-kirk-v4-bigraded-u5-audit-20260816
      - name: Ensure PDF text tools
        run: |
          if ! command -v pdftotext >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi
      - name: Pin immutable Kirk source
        run: python3 tools/probe_kirk_latest_source.py >/tmp/probe.json
      - name: Extract bi-graded rooted U5 supplier interfaces
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          src = Path('latest.txt')
          if not src.exists():
              raise SystemExit('latest.txt missing after source probe')
          lines = src.read_text(encoding='utf-8', errors='replace').splitlines()
          out = Path('source_audit/kirk_v4/bigraded_u5')
          out.mkdir(parents=True, exist_ok=True)

          phrases = [
              'bi-graded',
              'bigraded',
              'one-root',
              'two-root',
              'one or two passive exterior roots',
              'zero-, one-, and two-root',
              'passive exterior roots',
              'rooted activity decomposition',
              'marked theorem',
              'retained roots',
              'retained as roots',
              'nonroot vertex',
          ]

          heading = re.compile(
              r'^\s*(Theorem|Lemma|Corollary|Proposition|Definition)\s+([A-Z]?\d+(?:\.\d+)*)\b',
              re.I,
          )
          heading_lines = [
              (i, heading.search(line).group(0).strip())
              for i, line in enumerate(lines)
              if heading.search(line)
          ]

          chunks = []
          counts = {}
          hit_lines = set()
          nearest = []
          for phrase in phrases:
              hits = [i for i, line in enumerate(lines) if phrase.lower() in line.lower()]
              counts[phrase] = len(hits)
              for k, i in enumerate(hits[:80], 1):
                  hit_lines.add(i)
                  lo = max(0, i - 140)
                  hi = min(len(lines), i + 220)
                  chunks.append(
                      f'===== PHRASE {phrase} HIT {k} line {i+1} =====\n' +
                      '\n'.join(f'{j+1}: {lines[j]}' for j in range(lo, hi))
                  )

          for i in sorted(hit_lines):
              prev = [(j, name) for j, name in heading_lines if j <= i]
              nxt = [(j, name) for j, name in heading_lines if j > i]
              nearest.append({
                  'phrase_line': i + 1,
                  'preceding': None if not prev else {'line': prev[-1][0] + 1, 'heading': prev[-1][1]},
                  'following': None if not nxt else {'line': nxt[0][0] + 1, 'heading': nxt[0][1]},
              })

          candidates = []
          candidate_terms = (
              'bi-graded', 'bigraded', 'passive exterior root',
              'one-root', 'two-root', 'rooted activity', 'retained root',
          )
          for i, name in heading_lines:
              window = '\n'.join(lines[i:min(len(lines), i + 180)]).lower()
              if any(term in window for term in candidate_terms):
                  candidates.append({'line': i + 1, 'heading': name})
                  lo = max(0, i - 35)
                  hi = min(len(lines), i + 240)
                  chunks.append(
                      f'===== CANDIDATE {name} line {i+1} =====\n' +
                      '\n'.join(f'{j+1}: {lines[j]}' for j in range(lo, hi))
                  )

          (out / 'COUNTS.json').write_text(json.dumps(counts, indent=2) + '\n')
          (out / 'NEAREST_HEADINGS.json').write_text(json.dumps(nearest, indent=2) + '\n')
          (out / 'CANDIDATES.json').write_text(json.dumps(candidates, indent=2) + '\n')
          (out / 'TARGETED.txt').write_text('\n\n'.join(chunks) + '\n', encoding='utf-8')
          (out / 'QUESTION.md').write_text(
              '# Exact U5 supplier audit\n\n'
              'Which earlier declaration is the “bi-graded marked theorem” cited in the proof of Theorem 5.27(U5)?\n\n'
              'Does it directly prove zero/one/two passive-root rows in the same permanent rooted Banach domain, with constants independent of weak scale, finite volume, microscopic cutoff, exterior data, and preceding weak depth?\n\n'
              'Separate source/dependency identification from independent proof of the infinite-dimensional estimate.\n',
              encoding='utf-8',
          )

          print(json.dumps(counts, indent=2))
          print('candidate declarations:', len(candidates))
          if not hit_lines:
              raise SystemExit('no bi-graded/root phrases found')
          PY
      - name: Preserve provenance and audit
        run: |
          set -euo pipefail
          out=source_audit/kirk_v4/bigraded_u5
          cp kirk_latest_record.json "$out/" || true
          cp kirk_source_probe_report.json "$out/" || true
          sha256sum kirk_latest.pdf > "$out/PDF_SHA256.txt"
          git config user.name 'millennium-braid-source-audit'
          git config user.email 'actions@users.noreply.github.com'
          git add "$out"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audit(ym): preserve bi-graded U5 supplier interfaces'
          git push origin HEAD:verification/ym-kirk-v4-bigraded-u5-audit-20260816
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ym-kirk-v4-bigraded-u5-source-audit
          if-no-files-found: warn
          retention-days: 30
          path: source_audit/kirk_v4/bigraded_u5/
