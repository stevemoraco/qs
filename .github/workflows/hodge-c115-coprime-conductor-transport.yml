name: Hodge C115 coprime conductor transport

on:
  push:
    branches:
      - verification/hodge-c115-coprime-conductor-transport-20260816-gpt56sol
    paths:
      - .github/workflows/hodge-c115-coprime-conductor-transport.yml
      - verification/hodge-c115-coprime-conductor-transport/*.lean
  pull_request:
    paths:
      - .github/workflows/hodge-c115-coprime-conductor-transport.yml
      - verification/hodge-c115-coprime-conductor-transport/*.lean
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact Hodge C115 finite source
        shell: bash
        run: |
          set -euo pipefail
          SRC=verification/hodge-c115-coprime-conductor-transport/CoprimeConductorTransportFinite.lean
          test "$(git hash-object "$SRC")" = "12182c44271f6f78d4379f4e78cd0ae14790c2e7"
          if grep -nE '\b(sorry|admit|sorryAx|axiom|opaque|unsafe|native_decide|Lean\.ofReduceBool)\b' "$SRC"; then exit 1; fi
          SRC="$SRC" python3 - <<'PY'
          import json, os, pathlib, urllib.request
          path=pathlib.Path(os.environ['SRC'])
          payload=json.dumps({
            'content':path.read_text(),
            'environment':'lean-4.30.0',
            'ignore_imports':True,
            'mathlib_options':False,
            'timeout_seconds':900,
          }).encode()
          req=urllib.request.Request('https://axle.axiommath.ai/api/v1/check',data=payload,headers={'Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=960) as response:
            result=json.load(response)
          print(json.dumps(result,indent=2))
          lean=result.get('lean_messages',{})
          tool=result.get('tool_messages',{})
          bad=(not result.get('okay') or bool(result.get('failed_declarations',[])) or bool(lean.get('errors',[])) or bool(lean.get('warnings',[])) or bool(tool.get('errors',[])) or bool(tool.get('warnings',[])) or 'sorryAx' in json.dumps(result))
          if bad:
            raise SystemExit(1)
          PY
