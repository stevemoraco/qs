name: YM Kirk v4 public structural audit

on:
  push:
    branches:
      - verification/ym-kirk-v4-structural-audit-20260821-gpt56pro
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install PDF text tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Download immutable public PDF
        shell: bash
        run: |
          set -euo pipefail
          url='https://zenodo.org/records/21765806/files/Kirk_2026_Yang%E2%80%93Mills%20Existence%2C%20Mass%20Gap%2C%20and%20Nontriviality%20for%20Fixed%20Compact%20Simple%20Gauge%20Groups%20via%20Karcher%20Blocking%20and%20Exact%20Haar%E2%80%93Pivot%20Matching.pdf?download=1'
          curl --fail --location --retry 5 --retry-all-errors "$url" -o /tmp/kirk-v4.pdf
          test "$(head -c 4 /tmp/kirk-v4.pdf)" = '%PDF'
          sha256sum /tmp/kirk-v4.pdf | tee /tmp/kirk-v4.sha256
          pdfinfo /tmp/kirk-v4.pdf | tee /tmp/kirk-v4.pdfinfo

      - name: Build bounded structural report
        run: |
          set -euo pipefail
          python -m py_compile verification/ym-kirk-v4-structural-audit/extract_kirk_v4.py
          python verification/ym-kirk-v4-structural-audit/extract_kirk_v4.py \
            --pdf /tmp/kirk-v4.pdf \
            --out /tmp/kirk-v4-structural-report.md \
            | tee /tmp/kirk-v4-extract.log
          wc -c /tmp/kirk-v4-structural-report.md
          sed -n '1,500p' /tmp/kirk-v4-structural-report.md

      - name: Post capped report to pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          text=Path('/tmp/kirk-v4-structural-report.md').read_text(encoding='utf-8')
          cap=55000
          body=text[:cap]
          if len(text)>cap:
              body += '\n\n_Comment capped; complete bounded report is in the workflow artifact._\n'
          Path('/tmp/comment.json').write_text(json.dumps({'body': body}), encoding='utf-8')
          PY
          gh api "repos/$REPO/issues/$PR_NUMBER/comments" --method POST --input /tmp/comment.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ym-kirk-v4-structural-audit
          path: |
            /tmp/kirk-v4.sha256
            /tmp/kirk-v4.pdfinfo
            /tmp/kirk-v4-extract.log
            /tmp/kirk-v4-structural-report.md
          if-no-files-found: warn
