name: B4 AUTO20 run2 quantitative-edge cores

on:
  push:
    branches:
      - agent/b4-auto20-run2-public-verifier-20260812-1226
    paths:
      - 'B4Auto20Run2/**'
      - 'verification/b4-auto20-run2/**'
      - '.github/workflows/b4-auto20-run2-public-verify.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Reject explicit trust escapes
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(B4Auto20Run2/*.lean)
          if ((${#files[@]} == 0)); then
            echo 'bootstrap: no mirrored Lean sources yet'
            exit 0
          fi
          if grep -En '^[[:space:]]*(sorry|admit|axiom|opaque|unsafe)([^[:alnum:]_]|$)' "${files[@]}"; then
            echo 'Forbidden Lean placeholder or custom trust declaration found.' >&2
            exit 1
          fi
          if grep -En '^[[:space:]]*.*(native_decide|Lean\.ofReduceBool)' "${files[@]}"; then
            echo 'Forbidden computational trust escape found.' >&2
            exit 1
          fi

      - name: Initialize evidence log
        shell: bash
        run: |
          mkdir -p verification/b4-auto20-run2
          : > verification/b4-auto20-run2/lean-output.log
          echo 'B4 AUTO20 run2 verifier start' | tee -a verification/b4-auto20-run2/lean-output.log

      - name: Set up pinned Lean
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: verification/b4-auto20-run2
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'

      - name: Restore dependency workspace
        uses: actions/cache@v4
        with:
          path: verification/b4-auto20-run2/.lake
          key: b4-auto20-run2-${{ runner.os }}-${{ hashFiles('verification/b4-auto20-run2/lean-toolchain', 'verification/b4-auto20-run2/lakefile.toml') }}

      - name: Resolve pinned Mathlib and cache
        shell: bash
        run: |
          set -euo pipefail
          cd verification/b4-auto20-run2
          lean --version | tee -a lean-output.log
          lake --version | tee -a lean-output.log
          lake update 2>&1 | tee -a lean-output.log
          lake exe cache get 2>&1 | tee -a lean-output.log
          git -C .lake/packages/mathlib rev-parse HEAD | tee -a lean-output.log

      - name: Compile mirrored sources with hostile diagnostics
        shell: bash
        run: |
          set -euo pipefail
          cd verification/b4-auto20-run2
          failed=0
          count=0
          for file in ../../B4Auto20Run2/*.lean; do
            count=$((count+1))
            echo "=== compiling $file ===" | tee -a lean-output.log
            set +e
            out="$(lake env lean "$file" 2>&1)"
            code=$?
            set -e
            printf '%s\n' "$out" | tee -a lean-output.log
            if [ "$code" -ne 0 ]; then
              safe="${out//'%'/'%25'}"
              safe="${safe//$'\r'/'%0D'}"
              safe="${safe//$'\n'/'%0A'}"
              echo "::error file=$file::$safe"
              failed=1
            fi
          done
          echo "compiled source count=$count" | tee -a lean-output.log
          if grep -Eq 'declaration uses .sorry.|sorryAx|admit|Lean\.ofReduceBool' lean-output.log; then
            echo 'Forbidden placeholder axiom found in compiler output.' >&2
            failed=1
          fi
          if [ "$failed" -ne 0 ]; then exit 1; fi
          test -s lean-output.log
          echo 'VERIFIED B4 AUTO20 run2 finite/logical quantitative cores.' | tee -a lean-output.log

      - name: Upload compiler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b4-auto20-run2-sixproblem-lean-evidence
          path: verification/b4-auto20-run2/lean-output.log
          if-no-files-found: error
