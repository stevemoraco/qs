name: Verify BSD signed higher-rank certificate

on:
  workflow_dispatch:
  push:
    paths:
      - "verification/bsd_signed_higher_rank/**"
      - ".github/workflows/verify-bsd-signed-higher-rank-certificate.yml"
  pull_request:
    paths:
      - "verification/bsd_signed_higher_rank/**"
      - ".github/workflows/verify-bsd-signed-higher-rank-certificate.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: verification/bsd_signed_higher_rank

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify exact source and trust gate
        shell: bash
        run: |
          set -euo pipefail
          file=BSDSignedHigherRankCertificate.lean
          test "$(git hash-object "$file")" = "9cf6c5bfda4031d68af6073bc9321f35b4c4840a"
          if grep -nE '\b(sorry|admit|sorryAx|unsafe|opaque|native_decide)\b|^axiom |Lean\.ofReduceBool' "$file"; then
            echo "Forbidden token found"
            exit 1
          fi

      - name: Install elan
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get

      - name: Kernel-check exact source
        shell: bash
        run: |
          set -euo pipefail
          lake env lean BSDSignedHigherRankCertificate.lean 2>&1 | tee lean-output.txt
          if grep -q 'sorryAx' lean-output.txt; then
            echo "sorryAx found in axiom report"
            exit 1
          fi

      - name: Reject compiler warnings
        shell: bash
        run: |
          set -euo pipefail
          if grep -iE 'warning:|declaration uses.*sorry' lean-output.txt; then
            echo "Compiler warning found"
            exit 1
          fi

      - name: Upload replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bsd-signed-higher-rank-certificate-replay
          path: |
            verification/bsd_signed_higher_rank/BSDSignedHigherRankCertificate.lean
            verification/bsd_signed_higher_rank/lean-output.txt
          if-no-files-found: warn
