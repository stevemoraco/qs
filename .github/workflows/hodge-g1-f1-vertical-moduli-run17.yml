name: Hodge G1 F1 vertical-moduli finite-core replay

on:
  push:
    branches:
      - verification/hodge-g1-f1-vertical-moduli-20260814-run17
  pull_request:
    paths:
      - 'verification/hodge-g1-f1-vertical-moduli/R3Q1A7G1F1VerticalModuliCore.lean'
      - '.github/workflows/hodge-g1-f1-vertical-moduli-run17.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Reject trust escapes
        shell: bash
        run: |
          set -euo pipefail
          SRC=verification/hodge-g1-f1-vertical-moduli/R3Q1A7G1F1VerticalModuliCore.lean
          if grep -nE '\b(sorry|admit|sorryAx)\b' "$SRC"; then
            echo 'Explicit proof hole found' >&2
            exit 1
          fi
          if grep -nE '^[[:space:]]*(axiom|opaque|unsafe)\b|\bnative_decide\b|Lean\.ofReduceBool' "$SRC"; then
            echo 'Forbidden trust escape found' >&2
            exit 1
          fi
          test "$(grep -c '^#print axioms ' "$SRC")" = 10

      - name: Execute exact source with AXLE Lean 4.30
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification/hodge-g1-f1-vertical-moduli/evidence
          python3 - <<'PY'
          import json, pathlib, urllib.request
          srcp = pathlib.Path('verification/hodge-g1-f1-vertical-moduli/R3Q1A7G1F1VerticalModuliCore.lean')
          out = pathlib.Path('verification/hodge-g1-f1-vertical-moduli/evidence')
          src = srcp.read_text()
          payload = json.dumps({
              'content': src,
              'environment': 'lean-4.30.0',
              'ignore_imports': True,
              'mathlib_options': False,
              'timeout_seconds': 600,
          }).encode()
          req = urllib.request.Request(
              'https://axle.axiommath.ai/api/v1/check',
              data=payload,
              headers={'Content-Type':'application/json'},
              method='POST')
          with urllib.request.urlopen(req, timeout=660) as response:
              result = json.load(response)
          (out/'axle-response.json').write_text(json.dumps(result, indent=2, sort_keys=True))
          print(json.dumps(result, indent=2))
          lean = result.get('lean_messages', {})
          tool = result.get('tool_messages', {})
          bad = (
              not result.get('okay')
              or bool(result.get('failed_declarations', []))
              or bool(lean.get('errors', []))
              or bool(lean.get('warnings', []))
              or bool(tool.get('errors', []))
              or bool(tool.get('warnings', []))
              or 'sorryAx' in json.dumps(result)
              or 'Lean.ofReduceBool' in json.dumps(result)
          )
          if bad:
              raise SystemExit('AXLE/Lean failed, warned, or used forbidden trust')
          PY

      - name: Record exact source identity
        if: always()
        shell: bash
        run: |
          mkdir -p verification/hodge-g1-f1-vertical-moduli/evidence
          sha256sum verification/hodge-g1-f1-vertical-moduli/R3Q1A7G1F1VerticalModuliCore.lean \
            | tee verification/hodge-g1-f1-vertical-moduli/evidence/source-sha256.txt
          git hash-object verification/hodge-g1-f1-vertical-moduli/R3Q1A7G1F1VerticalModuliCore.lean \
            | sed 's/^/blob=/' \
            | tee verification/hodge-g1-f1-vertical-moduli/evidence/source-git-blob.txt
          echo "commit=${GITHUB_SHA}" \
            | tee verification/hodge-g1-f1-vertical-moduli/evidence/commit.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hodge-g1-f1-vertical-moduli-evidence
          path: verification/hodge-g1-f1-vertical-moduli/evidence/
          if-no-files-found: error
