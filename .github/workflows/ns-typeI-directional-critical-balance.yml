name: NS Type-I directional critical-balance replay

on:
  push:
    branches:
      - agent/ns-typeI-directional-critical-balance-20260813-run9
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Reject trust escapes
        shell: bash
        run: |
          set -euo pipefail
          SRC=verification/ns-typeI-directional-critical-balance/NSTypeIDirectionalCriticalBalance.lean
          test -s "$SRC"
          if grep -nE '\b(sorry|admit|sorryAx|axiom|opaque|unsafe|native_decide|Lean\.ofReduceBool)\b' "$SRC"; then
            echo 'Forbidden trust carrier found'
            exit 1
          fi
          test "$(grep -c '^#print axioms ' "$SRC")" = 8
          sha256sum "$SRC" | tee verification/ns-typeI-directional-critical-balance/source.sha256

      - name: Execute AXLE Lean 4.30
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, urllib.request
          root = pathlib.Path('verification/ns-typeI-directional-critical-balance')
          src = (root / 'NSTypeIDirectionalCriticalBalance.lean').read_text()
          payload = json.dumps({
              'content': src,
              'environment': 'lean-4.30.0',
              'ignore_imports': True,
              'mathlib_options': False,
              'timeout_seconds': 900,
          }).encode()
          req = urllib.request.Request(
              'https://axle.axiommath.ai/api/v1/check',
              data=payload,
              headers={'Content-Type': 'application/json'},
              method='POST',
          )
          try:
              with urllib.request.urlopen(req, timeout=960) as response:
                  result = json.load(response)
          except Exception as exc:
              result = {
                  'okay': False,
                  'request_exception': repr(exc),
                  'lean_messages': {'errors': [], 'warnings': []},
                  'tool_messages': {'errors': [], 'warnings': []},
                  'failed_declarations': [],
              }
          (root / 'axle-response.json').write_text(json.dumps(result, indent=2, sort_keys=True))
          print(json.dumps(result, indent=2))
          PY

      - name: Enforce compiler verdict
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path('verification/ns-typeI-directional-critical-balance/axle-response.json')
          r = json.loads(p.read_text())
          errors = r.get('lean_messages', {}).get('errors', [])
          warnings = r.get('lean_messages', {}).get('warnings', [])
          terrors = r.get('tool_messages', {}).get('errors', [])
          twarnings = r.get('tool_messages', {}).get('warnings', [])
          failed = r.get('failed_declarations', [])
          if not r.get('okay') or errors or warnings or terrors or twarnings or failed:
              raise SystemExit('Lean/AXLE failed or warned')
          rendered = json.dumps(r)
          if 'sorryAx' in rendered or 'Lean.ofReduceBool' in rendered:
              raise SystemExit('forbidden postcompile dependency')
          print('VERIFIED WARNING-FREE')
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ns-typeI-directional-critical-balance-evidence
          path: |
            verification/ns-typeI-directional-critical-balance/source.sha256
            verification/ns-typeI-directional-critical-balance/axle-response.json
          if-no-files-found: warn
