name: RH Universal Pole-Neutral Uncertainty Finite Core

on:
  push:
    branches:
      - agent/rh-pole-neutral-uncertainty-public-verify-20260812
    paths:
      - 'verification/rh-pole-neutral-uncertainty/**'
      - '.github/workflows/rh-pole-neutral-uncertainty-verify.yml'
  pull_request:
    branches: [main]
    paths:
      - 'verification/rh-pole-neutral-uncertainty/**'
      - '.github/workflows/rh-pole-neutral-uncertainty-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Reject placeholders and trust escapes
        shell: bash
        run: |
          set -euo pipefail
          file=verification/rh-pole-neutral-uncertainty/RHPoleNeutralUncertaintyFinite.lean
          if grep -En '(^|[^[:alnum:]_])(sorry|admit|sorryAx)([^[:alnum:]_]|$)' "$file"; then
            echo 'Forbidden Lean placeholder found.' >&2
            exit 1
          fi
          if grep -En '^[[:space:]]*(axiom|opaque)[[:space:]]|\bunsafe\b|native_decide|Lean\.ofReduceBool' "$file"; then
            echo 'Forbidden trust escape found.' >&2
            exit 1
          fi

      - name: Install pinned Lean, fetch pinned Mathlib cache, and compile
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.32.1
          export PATH="$HOME/.elan/bin:$PATH"
          cd verification/rh-pole-neutral-uncertainty
          lean --version | tee toolchain.log
          lake update
          lake exe cache get
          lake env lean RHPoleNeutralUncertaintyFinite.lean 2>&1 | tee lean-output.log
          if grep -Eq 'declaration uses .sorry.|sorryAx|admit' lean-output.log; then
            echo 'Forbidden placeholder axiom found in compiler output.' >&2
            exit 1
          fi
          if ! grep -q 'RHPoleNeutralUncertaintyFinite.pole_interpolation_value' lean-output.log; then
            echo 'Expected axiom report missing.' >&2
            exit 1
          fi
          echo 'VERIFIED universal pole-neutral uncertainty finite core.'

      - name: Upload compiler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rh-pole-neutral-uncertainty-lean-evidence
          path: |
            verification/rh-pole-neutral-uncertainty/lean-output.log
            verification/rh-pole-neutral-uncertainty/toolchain.log
            verification/rh-pole-neutral-uncertainty/lake-manifest.json
          if-no-files-found: warn
