name: RH Endpoint Remote-Band Finite Core Lean

on:
  push:
    branches:
      - agent/rh-endpoint-remote-band-public-verifier-20260811
    paths:
      - 'verification/rh-endpoint-remote-band/**'
      - '.github/workflows/rh-endpoint-remote-band-public-verify.yml'
  pull_request:
    branches: [main]
    paths:
      - 'verification/rh-endpoint-remote-band/**'
      - '.github/workflows/rh-endpoint-remote-band-public-verify.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Reject explicit placeholders and native_decide
        shell: bash
        run: |
          set -euo pipefail
          file=verification/rh-endpoint-remote-band/RHEndpointPolynomialRemoteFinite.lean
          if grep -En '(^|[^[:alnum:]_])(sorry|admit|native_decide)([^[:alnum:]_]|$)' "$file"; then
            echo 'Forbidden Lean placeholder or native_decide found.' >&2
            exit 1
          fi

      - name: Install pinned Lean, fetch pinned Mathlib cache, and compile
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.32.1
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version
          lake --version
          cd verification/rh-endpoint-remote-band
          lake update
          lake exe cache get
          lake env lean RHEndpointPolynomialRemoteFinite.lean 2>&1 | tee lean-output.log
          if grep -Eq 'declaration uses .sorry.|sorryAx|admit|_native\.native_decide\.ax_' lean-output.log; then
            echo 'Forbidden placeholder or native_decide trust axiom found in compiler output.' >&2
            exit 1
          fi
          echo 'VERIFIED finite RH endpoint remote-band algebra core.'

      - name: Upload compiler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rh-endpoint-remote-band-finite-core-evidence
          path: verification/rh-endpoint-remote-band/lean-output.log
          if-no-files-found: warn
