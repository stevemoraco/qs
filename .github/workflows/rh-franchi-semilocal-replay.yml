name: RH Franchi semilocal finite audit replay

on:
  push:
    branches:
      - verification/rh-franchi-semilocal-20260813
    paths:
      - 'formal/rh-franchi-semilocal/**'
      - '.github/workflows/rh-franchi-semilocal-replay.yml'
  pull_request:
    branches: [main]
    paths:
      - 'formal/rh-franchi-semilocal/**'
      - '.github/workflows/rh-franchi-semilocal-replay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Verify exact public source blob
        shell: bash
        run: |
          set -euo pipefail
          file='formal/rh-franchi-semilocal/RHFranchiSemilocalAudit.lean'
          expected='708fc3bb0595c92951b18e8f0985001826fd0db7'
          actual="$(git hash-object "$file")"
          printf 'expected Git blob: %s\nactual Git blob:   %s\n' "$expected" "$actual"
          test "$actual" = "$expected"

      - name: Reject proof holes and trust escapes
        shell: bash
        run: |
          set -euo pipefail
          file='formal/rh-franchi-semilocal/RHFranchiSemilocalAudit.lean'
          if grep -nE '\b(sorry|admit|axiom|opaque|unsafe|native_decide)\b|Lean\.ofReduceBool' "$file"; then
            echo 'Rejected: proof hole or custom trust carrier found.'
            exit 1
          fi

      - name: Install pinned official Lean release
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.32.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version \
            | tee formal/rh-franchi-semilocal/toolchain.txt

      - name: Fresh foundation-only kernel replay
        shell: bash
        run: |
          set -euo pipefail
          file='formal/rh-franchi-semilocal/RHFranchiSemilocalAudit.lean'
          output='formal/rh-franchi-semilocal/lean-kernel-output.txt'
          "$HOME/.elan/bin/lean" -DwarningAsError=true "$file" 2>&1 | tee "$output"
          if grep -q 'sorryAx' "$output"; then
            echo 'Rejected: kernel output contains sorryAx.'
            exit 1
          fi
          count="$(grep -c 'does not depend on any axioms' "$output")"
          echo "foundation-only axiom reports: $count"
          test "$count" -eq 9

      - name: Preserve replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rh-franchi-semilocal-replay-${{ github.sha }}
          path: |
            formal/rh-franchi-semilocal/RHFranchiSemilocalAudit.lean
            formal/rh-franchi-semilocal/lean-toolchain
            formal/rh-franchi-semilocal/toolchain.txt
            formal/rh-franchi-semilocal/lean-kernel-output.txt
          if-no-files-found: warn
