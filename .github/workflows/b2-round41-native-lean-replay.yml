name: B2 Round41 Native Lean Replay

on:
  push:
    branches:
      - automation/day0-b2-round41-lean-replay-20260812
    paths:
      - 'research/lean-replay/B2Round41AdversarialCores.lean'
      - 'research/lean-replay/lakefile.lean'
      - 'research/lean-replay/lake-manifest.json'
      - 'research/lean-replay/lean-toolchain'
      - '.github/workflows/b2-round41-native-lean-replay.yml'
  pull_request:
    paths:
      - 'research/lean-replay/B2Round41AdversarialCores.lean'
      - 'research/lean-replay/lakefile.lean'
      - 'research/lean-replay/lake-manifest.json'
      - 'research/lean-replay/lean-toolchain'
      - '.github/workflows/b2-round41-native-lean-replay.yml'
  workflow_dispatch:

jobs:
  native-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Verify immutable source digest and placeholder absence
        shell: bash
        run: |
          set -euo pipefail
          actual="$(sha256sum research/lean-replay/B2Round41AdversarialCores.lean | awk '{print $1}')"
          test "$actual" = "91966bc4726d43082b8baf3ce122609c841c0e2b7693fcfa85ffadbac0708b25"
          if grep -nE '\b(sorry|admit|sorryAx)\b' research/lean-replay/B2Round41AdversarialCores.lean; then
            echo 'forbidden placeholder found' >&2
            exit 1
          fi
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: research/lean-replay
          auto-config: false
          build: true
          test: false
          lint: false
          use-mathlib-cache: true
          use-github-cache: false
          leanchecker: false
      - name: Direct elaboration and foundation-only axiom audit
        shell: bash
        working-directory: research/lean-replay
        run: |
          set -euo pipefail
          lake env lean B2Round41AdversarialCores.lean | tee round41-axioms.txt
          python3 - <<'PY'
          import re
          from pathlib import Path

          text = Path('round41-axioms.txt').read_text()
          theorems = [
              'rh_certificate_interval_nonempty',
              'rh_negative_from_certified_upper',
              'bool_xor_self',
              'accept_collision_accepts_zero',
              'square_layer_identity',
              'monomial_cutoff_sharp_core',
              'nonseparating_test_class_counterexample',
              'positive_auxiliary_zero_target_counterexample',
          ]
          for theorem in theorems:
              if theorem not in text:
                  raise SystemExit(f'missing #print axioms output for {theorem}')
          if 'sorryAx' in text:
              raise SystemExit('sorryAx detected in axiom output')
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          used = set()
          for body in re.findall(r'depends on axioms:\s*\[(.*?)\]', text, flags=re.S):
              used.update(item.strip() for item in body.split(',') if item.strip())
          forbidden = used - allowed
          if forbidden:
              raise SystemExit(f'non-foundational axioms detected: {sorted(forbidden)}')
          print('AXIOM_AUDIT_OK', sorted(used))
          PY
      - name: Module-level kernel environment replay
        shell: bash
        working-directory: research/lean-replay
        run: |
          set -euo pipefail
          lake env leanchecker B2Round41AdversarialCores
      - name: Fresh-environment kernel replay
        shell: bash
        working-directory: research/lean-replay
        run: |
          set -euo pipefail
          lake env leanchecker --fresh B2Round41AdversarialCores
