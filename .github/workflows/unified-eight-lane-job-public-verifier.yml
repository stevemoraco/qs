name: Unified eight-lane source public replay

on:
  push:
    branches:
      - agent/unified-eight-lane-job-public-verifier-20260813
  pull_request:
    branches: [main]
    paths:
      - 'formal/unified-eight-lane/**'
      - '.github/workflows/unified-eight-lane-job-public-verifier.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Recover and authenticate exact submitted source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import pathlib
          import time
          import urllib.error
          import urllib.request

          url = ('https://lean-compile-farm.replit.app/api/jobs/'
                 '0c06ff71-3b3e-41e3-909d-b42cad9dae46')
          expected_sha256 = '10be2b046540ca13b52f0dbb95f2156f40ba83cd7b794e75035be8b65225cfd7'
          expected_blob = '141826f57a902c199a87137bd3b8ca7d85dc332c'
          directory = pathlib.Path('formal/unified-eight-lane')
          last = None
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(url, timeout=120) as response:
                      job = json.load(response)
                  break
              except (TimeoutError, urllib.error.URLError,
                      urllib.error.HTTPError, OSError) as error:
                  last = error
                  time.sleep(min(5 * (attempt + 1), 60))
          else:
              raise SystemExit(f'cannot retrieve canonical job: {last}')

          source = job.get('lean_source')
          if not isinstance(source, str) or not source:
              raise SystemExit('canonical job did not return lean_source')

          raw = source.encode()
          variants = {
              'raw': raw,
              'lf': source.replace('\r\n', '\n').encode(),
              'one-final-lf': (source.replace('\r\n', '\n').rstrip('\n') + '\n').encode(),
              'no-final-lf': source.replace('\r\n', '\n').rstrip('\n').encode(),
          }

          def git_blob(data: bytes) -> str:
              header = f'blob {len(data)}\0'.encode()
              return hashlib.sha1(header + data).hexdigest()

          selected = None
          report = []
          for name, data in variants.items():
              sha256 = hashlib.sha256(data).hexdigest()
              blob = git_blob(data)
              report.append({'variant': name, 'sha256': sha256, 'git_blob': blob,
                             'bytes': len(data)})
              if sha256 == expected_sha256 or blob == expected_blob:
                  selected = data
          print('canonical_job_status=', job.get('status'))
          print('canonical_job_verdict=', job.get('verdict'))
          print(json.dumps(report, indent=2))
          (directory / 'canonical-job.json').write_text(json.dumps(job, indent=2))
          (directory / 'normalization-report.json').write_text(json.dumps(report, indent=2))
          (directory / 'retrieved-source.lean').write_bytes(raw)
          if selected is None:
              raise SystemExit('no retrieved-source normalization matches the canonical branch digest')
          actual_sha256 = hashlib.sha256(selected).hexdigest()
          actual_blob = git_blob(selected)
          print('selected_sha256=', actual_sha256)
          print('selected_git_blob=', actual_blob)
          path = directory / 'UnifiedMillenniumPerelmanInversionAudit.lean'
          path.write_bytes(selected)
          (directory / 'source-sha256.txt').write_text(actual_sha256 + '\n')
          (directory / 'source-git-blob.txt').write_text(actual_blob + '\n')
          PY

      - name: Apply and authenticate surgical repair
        shell: bash
        run: |
          set -euo pipefail
          dir='formal/unified-eight-lane'
          cd "$dir"
          patch -p0 < unified-eight-lane-repair.patch
          actual_sha256="$(sha256sum UnifiedMillenniumPerelmanInversionAudit.lean | cut -d' ' -f1)"
          actual_blob="$(git hash-object UnifiedMillenniumPerelmanInversionAudit.lean)"
          expected_sha256='f5da70375b3393a545a8b2133a3bf501388471f112957fe24a68dd389a7db3cc'
          expected_blob='0aa63ef174a19f99344aef692968058efba8f567'
          printf 'expected repaired SHA-256: %s\nactual repaired SHA-256:   %s\n' \
            "$expected_sha256" "$actual_sha256" | tee repaired-source-sha256.txt
          printf 'expected repaired Git blob: %s\nactual repaired Git blob:   %s\n' \
            "$expected_blob" "$actual_blob" | tee repaired-source-git-blob.txt
          test "$actual_sha256" = "$expected_sha256"
          test "$actual_blob" = "$expected_blob"

      - name: Static trust audit
        shell: bash
        run: |
          set -euo pipefail
          file='formal/unified-eight-lane/UnifiedMillenniumPerelmanInversionAudit.lean'
          if grep -En '(^|[^[:alnum:]_])(sorry|admit|sorryAx)([^[:alnum:]_]|$)' "$file"; then
            echo 'Forbidden proof placeholder found.' >&2
            exit 1
          fi
          if grep -En '^[[:space:]]*(axiom|opaque|unsafe)[[:space:]]' "$file"; then
            echo 'Forbidden trust declaration found.' >&2
            exit 1
          fi
          if grep -En '(native_decide|Lean\.ofReduceBool)' "$file"; then
            echo 'Forbidden computational trust escape found.' >&2
            exit 1
          fi
          theorem_count="$(grep -c '^theorem ' "$file")"
          axiom_count="$(grep -c '^#print axioms ' "$file")"
          echo "theorem_count=$theorem_count"
          echo "axiom_report_count=$axiom_count"
          test "$theorem_count" -ge 30
          test "$axiom_count" -ge 25

      - name: Install pinned Lean and compile exact repaired source
        shell: bash
        run: |
          set -euo pipefail
          dir='formal/unified-eight-lane'
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.31.0
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version | tee "$dir/lean-version.txt"
          lake --version | tee -a "$dir/lean-version.txt"
          cd "$dir"
          lake update
          lake exe cache get
          set +e
          lake env lean UnifiedMillenniumPerelmanInversionAudit.lean \
            > lean-output.log 2>&1
          status=$?
          set -e
          cat lean-output.log
          if [ "$status" -ne 0 ]; then
            echo "Lean compilation failed with status $status" >&2
            exit "$status"
          fi
          if grep -Eq 'declaration uses .sorry.|sorryAx|admit|Lean.ofReduceBool' lean-output.log; then
            echo 'Forbidden dependency found in compiler report.' >&2
            exit 1
          fi
          echo 'VERIFIED unified eight-lane finite audit.'

      - name: Preserve exact replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-eight-lane-public-evidence
          path: |
            formal/unified-eight-lane/UnifiedMillenniumPerelmanInversionAudit.lean
            formal/unified-eight-lane/retrieved-source.lean
            formal/unified-eight-lane/unified-eight-lane-repair.patch
            formal/unified-eight-lane/source-sha256.txt
            formal/unified-eight-lane/source-git-blob.txt
            formal/unified-eight-lane/repaired-source-sha256.txt
            formal/unified-eight-lane/repaired-source-git-blob.txt
            formal/unified-eight-lane/canonical-job.json
            formal/unified-eight-lane/normalization-report.json
            formal/unified-eight-lane/lean-version.txt
            formal/unified-eight-lane/lean-output.log
          if-no-files-found: warn
