name: PNP affine disperser sparsity Lean replay

on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/pnp-affine-disperser-sparsity/**'
      - '.github/workflows/pnp-affine-disperser-sparsity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Reject proof holes and escape hatches
        shell: bash
        run: |
          set -euo pipefail
          file=verification/pnp-affine-disperser-sparsity/AffineDisperserSparsityFirewall.lean
          if grep -nE '\b(sorry|admit|sorryAx)\b' "$file"; then
            echo 'Explicit proof hole found'
            exit 1
          fi
          if grep -nE '\b(axiom|opaque|unsafe|native_decide|Lean\.ofReduceBool)\b' "$file"; then
            echo 'Forbidden escape hatch found'
            exit 1
          fi

      - name: Install Lean
        shell: bash
        run: |
          set -euo pipefail
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve pinned Mathlib and fetch cache
        shell: bash
        working-directory: verification/pnp-affine-disperser-sparsity
        run: |
          set -euo pipefail
          lake update
          lake exe cache get

      - name: Kernel replay and axiom report
        shell: bash
        working-directory: verification/pnp-affine-disperser-sparsity
        run: |
          set -euo pipefail
          lake env lean AffineDisperserSparsityFirewall.lean | tee lean-replay.log
          test "$(grep -c '^warning: declaration uses' lean-replay.log || true)" -eq 0
