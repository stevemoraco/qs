name: YM Kirk v4 immutable public PDF extraction

on:
  push:
    branches:
      - verification/ym-kirk-v4-public-pdf-20260821
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install PDF tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Download and hash exact public PDF
        shell: bash
        run: |
          set -euo pipefail
          url='https://zenodo.org/records/21765806/files/Kirk_2026_Yang%E2%80%93Mills%20Existence%2C%20Mass%20Gap%2C%20and%20Nontriviality%20for%20Fixed%20Compact%20Simple%20Gauge%20Groups%20via%20Karcher%20Blocking%20and%20Exact%20Haar%E2%80%93Pivot%20Matching.pdf?download=1'
          curl --fail --location --retry 5 --retry-all-errors "$url" -o /tmp/kirk-v4.pdf
          test "$(head -c 4 /tmp/kirk-v4.pdf)" = '%PDF'
          sha256sum /tmp/kirk-v4.pdf | tee /tmp/kirk-v4.sha256
          pdfinfo /tmp/kirk-v4.pdf | tee /tmp/kirk-v4.pdfinfo
          pdftotext -layout /tmp/kirk-v4.pdf /tmp/kirk-v4.txt

      - name: Extract load-bearing windows
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('/tmp/kirk-v4.txt').read_text(errors='replace')
          pages=text.split('\f')
          needles=[
            'Theorem 1.1','Theorem 4.5','Proposition 4.6','Theorem 5.27',
            'Theorem 6.43','Lemma 8.2','Theorem 8.11','Corollary 8.12',
            'Theorem 9.2','Theorem 9.3','Theorem 10.4','Theorem 10.5',
            'Theorem 10.6','Theorem 10.7','least-label','source forest',
            'source ball','source radius','C_n','n!','factorial',
            'one-time','time-zero','time slice','time-slice','dense','cyclic',
            'Markov property','Osterwalder','curvature jet','curvature-jet',
            'nontrivial local','spectral mass','reflection-positive recombination',
            'uniform in the cutoff','uniform in the volume','all orders',
            'analytic in the source','analytic source'
          ]
          out=['# Kirk v4 immutable-PDF load-bearing extraction','']
          out += [f'- pages: `{len(pages)}`', f'- lines: `{len(text.splitlines())}`','']
          seen=set()
          for needle in needles:
            count=0
            for pno,page in enumerate(pages,1):
              lines=page.splitlines()
              for i,line in enumerate(lines):
                if needle.lower() not in line.lower():
                  continue
                lo=max(0,i-4); hi=min(len(lines),i+13)
                block='\n'.join(lines[lo:hi]).strip()
                key=re.sub(r'\s+',' ',block)
                if key in seen: continue
                seen.add(key); count+=1
                out += [f'## `{needle}` · page {pno}','```text',block[:5000],'```','']
                if count>=12: break
              if count>=12: break
          Path('/tmp/kirk-v4-report.md').write_text('\n'.join(out))
          print(f'KIRK_V4_PUBLIC_PDF_EXTRACT_PASS pages={len(pages)} windows={len(seen)}')
          PY

      - name: Upload immutable evidence
        uses: actions/upload-artifact@v4
        with:
          name: ym-kirk-v4-public-pdf-evidence
          path: |
            /tmp/kirk-v4.pdf
            /tmp/kirk-v4.txt
            /tmp/kirk-v4.sha256
            /tmp/kirk-v4.pdfinfo
            /tmp/kirk-v4-report.md
          if-no-files-found: error
