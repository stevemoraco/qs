name: B4 Auto13 AXLE Independent Replay

on:
  push:
    branches:
      - agent/b4-auto13-public-verifier-20260812
    paths:
      - '.github/workflows/b4-auto13-axle-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: AXLE Lean 4.30 independent compile
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          import re
          import subprocess
          import urllib.request

          path = pathlib.Path('verification/b4_auto13/B4Auto13Combined.lean')
          text = path.read_text()
          blob = subprocess.check_output(['git', 'hash-object', str(path)], text=True).strip()
          if blob != '095447fc25d6063d85af56aae9d9863d72cc6618':
              raise SystemExit(f'canonical blob mismatch: {blob}')
          if re.search(r'(^|[^A-Za-z0-9_])(sorry|admit|opaque|unsafe)([^A-Za-z0-9_]|$)', text):
              raise SystemExit('forbidden placeholder/trust keyword found')
          if re.search(r'^\s*axiom\b', text, flags=re.MULTILINE):
              raise SystemExit('custom axiom declaration found')

          payload = json.dumps({
              'content': text,
              'environment': 'lean-4.30.0',
              'ignore_imports': True,
              'mathlib_options': False,
              'timeout_seconds': 900,
          }).encode()
          request = urllib.request.Request(
              'https://axle.axiommath.ai/api/v1/check',
              data=payload,
              headers={'Content-Type': 'application/json'},
              method='POST',
          )
          with urllib.request.urlopen(request, timeout=960) as response:
              result = json.load(response)

          out = pathlib.Path('verification/b4_auto13/axle-result.json')
          out.write_text(json.dumps(result, indent=2, sort_keys=True))
          print(out.read_text())
          lean_errors = result.get('lean_messages', {}).get('errors', [])
          tool_errors = result.get('tool_messages', {}).get('errors', [])
          failed = result.get('failed_declarations', [])
          if not result.get('okay') or lean_errors or tool_errors or failed:
              for err in lean_errors:
                  print(f'::error::{err}')
              for err in tool_errors:
                  print(f'::error::{err}')
              for decl in failed:
                  print(f'::error::failed declaration: {decl}')
              raise SystemExit(1)
          print('VERIFIED: AXLE Lean 4.30 compiled B4 auto13 combined finite cores.')
          PY

      - name: Upload AXLE evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b4-auto13-axle-independent-replay
          path: verification/b4_auto13/axle-result.json
          if-no-files-found: warn
