name: Verify NS Yu dyadic Poincare scale cancellation

on:
  push:
    branches:
      - agent/ns-yu-affine-low-moment-rigidity-20260814-run16
    paths:
      - 'verification/ns-yu-affine-low-moment-rigidity/**'
      - '.github/workflows/ns-yu-affine-low-moment-rigidity.yml'
  pull_request:
    paths:
      - 'verification/ns-yu-affine-low-moment-rigidity/**'
      - '.github/workflows/ns-yu-affine-low-moment-rigidity.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trust preflight
        shell: bash
        run: |
          set -euo pipefail
          SRC=verification/ns-yu-affine-low-moment-rigidity/NSYuDyadicPoincareWeightCancellation.lean
          test -s "$SRC"
          if grep -nE '\b(sorry|admit|sorryAx|axiom|opaque|unsafe|native_decide|Lean\.ofReduceBool)\b' "$SRC"; then
            echo 'forbidden trust carrier found' >&2
            exit 1
          fi
          test "$(grep -c '^#print axioms ' "$SRC")" = 3
          sha256sum "$SRC" | tee source.sha256

      - name: Execute AXLE Lean 4.30
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, urllib.request
          src = pathlib.Path('verification/ns-yu-affine-low-moment-rigidity/NSYuDyadicPoincareWeightCancellation.lean').read_text()
          payload = json.dumps({
              'content': src,
              'environment': 'lean-4.30.0',
              'ignore_imports': True,
              'mathlib_options': False,
              'timeout_seconds': 1200,
          }).encode()
          req = urllib.request.Request(
              'https://axle.axiommath.ai/api/v1/check',
              data=payload,
              headers={'Content-Type': 'application/json'},
              method='POST',
          )
          with urllib.request.urlopen(req, timeout=1260) as response:
              result = json.load(response)
          pathlib.Path('axle-response.json').write_text(json.dumps(result, indent=2, sort_keys=True))
          print(json.dumps(result, indent=2))
          PY

      - name: Enforce clean compiler verdict
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path('axle-response.json')
          if not p.exists():
              raise SystemExit('missing AXLE response')
          r = json.loads(p.read_text())
          bad = not r.get('okay')
          for group in ('lean_messages','tool_messages'):
              for kind in ('errors','warnings'):
                  if r.get(group, {}).get(kind, []): bad = True
          if r.get('failed_declarations', []): bad = True
          rendered = json.dumps(r)
          if 'sorryAx' in rendered or 'Lean.ofReduceBool' in rendered: bad = True
          if bad:
              print(json.dumps(r, indent=2))
              raise SystemExit(1)
          print('VERIFIED CLEAN')
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ns-yu-affine-low-moment-rigidity-evidence
          path: |
            verification/ns-yu-affine-low-moment-rigidity/NSYuDyadicPoincareWeightCancellation.lean
            source.sha256
            axle-response.json
