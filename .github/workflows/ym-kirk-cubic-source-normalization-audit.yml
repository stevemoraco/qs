name: YM Kirk v4 cubic local-source normalization audit

on:
  push:
    branches:
      - verification/ym-kirk-v4-cubic-source-normalization-audit-20260817-gpt56pro
    paths:
      - .github/workflows/ym-kirk-cubic-source-normalization-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verification/ym-kirk-v4-cubic-source-normalization-audit-20260817-gpt56pro

      - name: Ensure pdftotext
        run: |
          if ! command -v pdftotext >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi

      - name: Pin immutable Kirk source
        run: python3 tools/probe_kirk_latest_source.py >/tmp/probe.json

      - name: Extract cubic-source normalization contexts
        run: |
          set -euo pipefail
          pdftotext -raw kirk_latest.pdf latest_raw.txt
          pdftotext -layout kirk_latest.pdf latest_layout.txt
          python3 - <<'PY'
          from pathlib import Path
          import json
          import subprocess

          raw = Path('latest_raw.txt').read_text(encoding='utf-8', errors='replace')
          layout = Path('latest_layout.txt').read_text(encoding='utf-8', errors='replace')

          # PDF text extraction inserts hard line/page breaks inside mathematical phrases.
          # Search a whitespace-normalized copy so phrase presence is layout-independent.
          flat = ' '.join(raw.split())
          flat_low = flat.lower()
          layout_flat = ' '.join(layout.split())
          layout_low = layout_flat.lower()

          out = Path('source_audit/kirk_v4/cubic_source_normalization')
          out.mkdir(parents=True, exist_ok=True)

          targets = [
              'primitive cubic symmetric color tensor',
              'primitive cubic',
              'symmetric tensor',
              'first multiplies three curvatures',
              'dimension-six block',
              'engineering dimension six',
              'marked gaussian wick martingale',
              'gaussian wick martingale',
              'homogeneous wick chaos',
              'toward the ultraviolet',
              'normalized source coordinates',
              'source normalization',
              'source-renormalization matrix',
              'renormalized curvature-jet source multiplet',
              'curvature-jet source multiplet',
              'local source word',
              'local source words',
              'cubic source',
              'source amplitude',
              'common analytic source ball',
              'os linear-growth condition',
              'for every fixed engineering cutoff',
              'all fixed marked rows',
              'every fixed finite jet family',
              'every fixed n',
          ]

          chunks = []
          counts = {}
          for target in targets:
              pos = 0
              n = 0
              needle = target.lower()
              while True:
                  i = flat_low.find(needle, pos)
                  if i < 0:
                      break
                  n += 1
                  chunks.append(
                      f'===== NORMALIZED PHRASE {target} HIT {n} AT {i} =====\n'
                      + flat[max(0, i - 9000):min(len(flat), i + 16000)]
                      + '\n'
                  )
                  pos = i + len(needle)
                  if n >= 30:
                      break
              counts[target] = n

          headings = [
              'Lemma 4.15', 'Theorem 4.16', 'Theorem 4.17',
              'Theorem 5.26', 'Theorem 5.27',
              'Lemma 8.1', 'Theorem 8.11', 'Corollary 8.12',
              'Lemma 8.13', 'Theorem 8.16', 'Lemma 8.44',
          ]
          heading_counts = {}
          for heading in headings:
              needle = heading.lower()
              i = flat_low.find(needle)
              heading_counts[heading] = int(i >= 0)
              if i >= 0:
                  chunks.append(
                      f'===== NORMALIZED HEADING {heading} AT {i} =====\n'
                      + flat[max(0, i - 5000):min(len(flat), i + 26000)]
                      + '\n'
                  )

          # Preserve any literal layout hits too, useful for source review.
          layout_chunks = []
          for target in targets + headings:
              needle = target.lower()
              pos = 0
              n = 0
              while True:
                  i = layout_low.find(needle, pos)
                  if i < 0:
                      break
                  n += 1
                  layout_chunks.append(
                      f'===== LAYOUT-NORMALIZED {target} HIT {n} AT {i} =====\n'
                      + layout_flat[max(0, i - 6000):min(len(layout_flat), i + 12000)]
                      + '\n'
                  )
                  pos = i + len(needle)
                  if n >= 10:
                      break

          (out / 'TARGETED.txt').write_text('\n'.join(chunks), encoding='utf-8')
          (out / 'LAYOUT_TARGETED.txt').write_text('\n'.join(layout_chunks), encoding='utf-8')
          (out / 'COUNTS.json').write_text(
              json.dumps({'phrases': counts, 'headings': heading_counts}, indent=2) + '\n',
              encoding='utf-8'
          )
          (out / 'PDF_SHA256.txt').write_text(
              subprocess.check_output(['sha256sum', 'kirk_latest.pdf'], text=True),
              encoding='utf-8'
          )
          (out / 'PROBE.json').write_text(Path('/tmp/probe.json').read_text(), encoding='utf-8')

          summary = [
              '# Kirk v4 cubic local-source normalization source audit',
              '',
              'This file records source-presence counts only. It does not verify the manuscript mathematics.',
              '',
              '## Whitespace-normalized phrase counts',
              '',
          ]
          summary.extend(f'- `{k}`: {v}' for k, v in counts.items())
          summary += ['', '## Heading counts', '']
          summary.extend(f'- `{k}`: {v}' for k, v in heading_counts.items())
          summary += [
              '',
              '## Decision question',
              '',
              'Does the retained dimension-six primitive cubic invariant have a nonzero regulator-independent Gaussian/Wick normalization in the local source topology, or is its source coefficient forced to vanish toward the ultraviolet?',
              '',
              'A positive nonzero Gaussian cubic normalization is incompatible with an ordinary regulator-uniform exponential-source disk; a vanishing normalization requires a separate nontriviality audit.',
              '',
              'The extraction deliberately distinguishes phrase presence from proof: it does not infer the normalization coefficient merely from retention of the cubic invariant.',
              '',
              '**FIVE/SIX-ALARM: OFF.**',
          ]
          (out / 'SUMMARY.md').write_text('\n'.join(summary) + '\n', encoding='utf-8')

          required_phrases = [
              'primitive cubic symmetric color tensor',
              'common analytic source ball',
              'for every fixed engineering cutoff',
          ]
          required_headings = ['Theorem 5.26', 'Theorem 8.16', 'Corollary 8.12']
          missing = [x for x in required_phrases if counts.get(x, 0) == 0]
          missing += [x for x in required_headings if heading_counts.get(x, 0) == 0]
          if missing:
              raise SystemExit('missing required normalized source anchors: ' + ', '.join(missing))
          PY

      - name: Commit immutable extraction
        run: |
          git config user.name 'millennium-braid-source-audit'
          git config user.email 'actions@users.noreply.github.com'
          git add source_audit/kirk_v4/cubic_source_normalization
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audit(ym): preserve cubic source normalization contexts'
          git push origin HEAD:verification/ym-kirk-v4-cubic-source-normalization-audit-20260817-gpt56pro

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kirk-v4-cubic-source-normalization-audit
          retention-days: 30
          if-no-files-found: warn
          path: source_audit/kirk_v4/cubic_source_normalization/
