name: Run14 NS YM Hodge Finite Cores Lean

on:
  push:
    branches:
      - b4/ns-ym-hodge-run14-public-verify-20260811
      - agent/hodge-projector-range-equiv-20260812
    paths:
      - 'verification/run14-crosslane/**'
      - '.github/workflows/run14-crosslane-public-verify.yml'
  pull_request:
    branches: [main]
    paths:
      - 'verification/run14-crosslane/**'
      - '.github/workflows/run14-crosslane-public-verify.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Reject explicit placeholders
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' verification/run14-crosslane --include='*.lean'; then
            echo 'Forbidden Lean placeholder found.' >&2
            exit 1
          fi

      - name: Install pinned Lean, fetch pinned Mathlib cache, and compile
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.32.1
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version
          lake --version
          cd verification/run14-crosslane
          lake update
          lake exe cache get
          : > lean-output.log
          for f in NSVanishingThreshold.lean YMGapBudget.lean HodgeTransfer.lean HodgeProjectorRangeEquiv.lean; do
            lake env lean "$f" 2>&1 | tee -a lean-output.log
          done
          if grep -Eq 'declaration uses .sorry.|sorryAx|admit' lean-output.log; then
            echo 'Forbidden placeholder axiom found in compiler output.' >&2
            exit 1
          fi
          echo 'VERIFIED finite NS/YM/Hodge cores and Hodge projector range equivalence: clean pinned build, zero reported sorry/admit.'

      - name: Upload compiler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run14-ns-ym-hodge-finite-cores-lean-evidence
          path: verification/run14-crosslane/lean-output.log
          if-no-files-found: warn
