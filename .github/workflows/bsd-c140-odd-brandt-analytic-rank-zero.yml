name: BSD C140 odd Brandt analytic rank zero core

on:
  push:
    branches:
      - verification/bsd-c140-odd-brandt-analytic-rank-zero-20260818
    paths:
      - '.github/workflows/bsd-c140-odd-brandt-analytic-rank-zero.yml'
      - 'verification/bsd-c140-odd-brandt-analytic-rank-zero/*.lean'
  pull_request:
    paths:
      - '.github/workflows/bsd-c140-odd-brandt-analytic-rank-zero.yml'
      - 'verification/bsd-c140-odd-brandt-analytic-rank-zero/*.lean'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Query AXLE
        id: axle
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          SRC=verification/bsd-c140-odd-brandt-analytic-rank-zero/GrossRowAnalyticRankZeroCertificate.lean
          if grep -nE '\b(sorry|admit|sorryAx|axiom|opaque|unsafe|native_decide|Lean\.ofReduceBool)\b' "$SRC"; then exit 1; fi
          SRC="$SRC" python3 - <<'PY'
          import json, os, pathlib, urllib.request
          path=pathlib.Path(os.environ['SRC'])
          payload=json.dumps({
            'content':path.read_text(),
            'environment':'lean-4.30.0',
            'ignore_imports':True,
            'mathlib_options':False,
            'timeout_seconds':900,
          }).encode()
          req=urllib.request.Request('https://axle.axiommath.ai/api/v1/check',data=payload,headers={'Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=960) as response:
            result=json.load(response)
          pathlib.Path('axle-c140.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result,indent=2))
          PY
      - name: Upload AXLE diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axle-c140
          path: axle-c140.json
          if-no-files-found: ignore
      - name: Enforce clean compiler verdict
        shell: bash
        run: |
          set -euo pipefail
          test -f axle-c140.json
          python3 - <<'PY'
          import json
          result=json.load(open('axle-c140.json'))
          lean=result.get('lean_messages',{})
          tool=result.get('tool_messages',{})
          bad=(not result.get('okay') or bool(result.get('failed_declarations',[])) or bool(lean.get('errors',[])) or bool(lean.get('warnings',[])) or bool(tool.get('errors',[])) or bool(tool.get('warnings',[])) or 'sorryAx' in json.dumps(result))
          if bad:
            raise SystemExit(1)
          PY
