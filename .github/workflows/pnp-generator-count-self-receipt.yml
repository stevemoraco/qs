name: PNP Generator-Count Self-Banking Receipt

on:
  push:
    branches:
      - pnp/generator-count-capacity-public-verify-20260811
    paths:
      - 'verification/pnp-generator-count/PNPGeneratorCountCapacity.lean'
      - 'verification/pnp-generator-count/lakefile.toml'
      - 'verification/pnp-generator-count/lean-toolchain'
      - '.github/workflows/pnp-generator-count-self-receipt.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-bank:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pnp/generator-count-capacity-public-verify-20260811

      - name: Reject explicit placeholders
        shell: bash
        run: |
          set -euo pipefail
          file=verification/pnp-generator-count/PNPGeneratorCountCapacity.lean
          if grep -En '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' "$file"; then
            echo 'Forbidden Lean placeholder found.' >&2
            exit 1
          fi

      - name: Install pinned Lean and compile exact source
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.32.1
          export PATH="$HOME/.elan/bin:$PATH"
          cd verification/pnp-generator-count
          lake update
          lake exe cache get
          lake env lean PNPGeneratorCountCapacity.lean 2>&1 | tee lean-output.log
          if grep -Eq 'declaration uses .sorry.|sorryAx|admit' lean-output.log; then
            echo 'Forbidden placeholder axiom found in compiler output.' >&2
            exit 1
          fi

      - name: Bank machine-verifiable receipt on the verifier branch
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cd verification/pnp-generator-count
          LEAN_VERSION=$(lean --version | head -n1)
          MATHLIB_REV=$(grep -A8 'name = "mathlib"' lake-manifest.json | grep 'rev' | head -n1 | sed -E 's/.*"rev"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/' || true)
          AXIOMS=$(grep '^.*depends on axioms:' lean-output.log || true)
          cat > LEAN_RECEIPT.md <<EOF
          # PNP generator-count finite core — Lean receipt

          - Workflow run: ${GITHUB_RUN_ID}
          - Job attempt: ${GITHUB_RUN_ATTEMPT}
          - Verified commit: ${GITHUB_SHA}
          - Repository: ${GITHUB_REPOSITORY}
          - Ref: ${GITHUB_REF}
          - Lean: ${LEAN_VERSION}
          - Mathlib resolved revision: ${MATHLIB_REV}
          - Explicit placeholder scan: passed
          - Compiler placeholder scan: passed

          ## Printed theorem axiom report

          \`\`\`
          ${AXIOMS}
          \`\`\`

          ## Boundary

          This receipt verifies only `PNPGeneratorCountCapacity.lean`: the finite coefficient-box image cardinality bound, represented-set consequence, impossibility above capacity, and elementary scalar endpoints. It does not verify stars-and-bars, rank reduction, the external paper, asymptotics, arithmetic complexity, VP/VNP, or P versus NP.
          EOF
          cd ../..
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add verification/pnp-generator-count/LEAN_RECEIPT.md verification/pnp-generator-count/lake-manifest.json verification/pnp-generator-count/lean-output.log
          git commit -m '✅ Bank generator-count Lean receipt [skip ci]' || exit 0
          git push origin HEAD:pnp/generator-count-capacity-public-verify-20260811
