name: Round 214 PNP Collision-Oracle Finite Cores

on:
  push:
    branches: [agent/round214-pnp-collision-oracle-verify-20260812]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: round214-pnp-collision-oracle-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Reject explicit placeholders
        shell: bash
        run: |
          set -euo pipefail
          file=verification/round214-pnp-collision-oracle/PNPCollisionOracleHardnessFinite.lean
          if grep -En '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' "$file"; then
            echo 'Forbidden Lean placeholder found.' >&2
            exit 1
          fi
      - name: Install pinned Lean, fetch pinned Mathlib cache, and compile
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.32.1
          export PATH="$HOME/.elan/bin:$PATH"
          cd verification/round214-pnp-collision-oracle
          lake update
          lake exe cache get
          lake env lean PNPCollisionOracleHardnessFinite.lean 2>&1 | tee lean-output.log
          if grep -Eq 'declaration uses .sorry.|sorryAx|admit' lean-output.log; then
            echo 'Forbidden placeholder axiom found in compiler output.' >&2
            exit 1
          fi
          echo 'VERIFIED finite Round 214 PNP collision-oracle cores.'
      - name: Upload compiler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: round214-pnp-collision-oracle-lean-evidence
          path: verification/round214-pnp-collision-oracle/lean-output.log
          if-no-files-found: warn
