name: YM Kirk v4 finite-template locality audit

on:
  push:
    branches:
      - verification/ym-kirk-v4-finite-template-locality-audit-20260815-gpt56sol
    paths:
      - .github/workflows/ym-kirk-v4-finite-template-locality-audit.yml

permissions:
  contents: write

jobs:
  source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verification/ym-kirk-v4-finite-template-locality-audit-20260815-gpt56sol
      - name: Ensure pdftotext
        run: |
          if ! command -v pdftotext >/dev/null; then sudo apt-get update && sudo apt-get install -y poppler-utils; fi
      - name: Pin v4 and extract finite-template locality contexts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,time,urllib.request,urllib.error
          UA='ym-kirk-v4-finite-template-locality/1.0'
          def get(url):
              last=None
              for i in range(7):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'*/*'})
                      with urllib.request.urlopen(req,timeout=60) as r: return r.read()
                  except (urllib.error.HTTPError,urllib.error.URLError) as e:
                      last=e
                      if isinstance(e,urllib.error.HTTPError) and e.code not in (429,500,502,503,504): raise
                      time.sleep(min(2**i,32))
              raise last
          rec_raw=get('https://zenodo.org/api/records/21765806')
          rec=json.loads(rec_raw)
          pdfs=[f for f in rec.get('files',[]) if str(f.get('key','')).lower().endswith('.pdf')]
          if len(pdfs)!=1: raise RuntimeError(f'expected one PDF, got {len(pdfs)}')
          url=pdfs[0].get('links',{}).get('content') or pdfs[0].get('links',{}).get('self')
          pdf=get(url)
          Path('/tmp/kirk-v4.pdf').write_bytes(pdf)
          out=Path('source_audit/kirk_v4/finite_template_locality'); out.mkdir(parents=True,exist_ok=True)
          (out/'RECORD.json').write_bytes(rec_raw)
          (out/'PDF_SHA256.txt').write_text(hashlib.sha256(pdf).hexdigest()+'\n')
          print('record_id',rec.get('id'))
          print('version',rec.get('metadata',{}).get('version'))
          print('sha256',hashlib.sha256(pdf).hexdigest())
          PY
          pdftotext -layout /tmp/kirk-v4.pdf /tmp/kirk-v4.txt
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('/tmp/kirk-v4.txt').read_text(encoding='utf-8',errors='replace')
          low=text.lower()
          out=Path('source_audit/kirk_v4/finite_template_locality')
          phrases=[
            'finite-template incidences','finite-template incidence','finite template','template incidence',
            'fixed optical template','fixed template','template family','template families','template map','template maps',
            'bounded support','bounded-support','uniformly bounded support','support diameter','diameter at most',
            'fixed support','local support','actual local support','finite range','finite-range','fixed range',
            'finite atlas','finite family','fixed cell','fixed-cell','cell template','block template',
            'Qtail','Qtempl','Qref','DAS2','DAS3','Proposition 6.8','Lemma 6.7','Definition 3.22'
          ]
          summary=[]; chunks=[]
          for phrase in phrases:
              hits=[]; pos=0
              while True:
                  i=low.find(phrase.lower(),pos)
                  if i<0: break
                  hits.append(i); pos=i+max(1,len(phrase))
              summary.append(f'{phrase}: {len(hits)}')
              for j,i in enumerate(hits[:30],1):
                  chunks.append(f'===== {phrase} hit {j} at {i} =====\n'+text[max(0,i-4500):min(len(text),i+9000)])
          # Also collect every occurrence of "template" whose +/-1200-char neighborhood mentions support/local/cell/atlas/incidence.
          targeted=[]
          for m in re.finditer(r'template',low):
              i=m.start(); ctx=low[max(0,i-1200):min(len(low),i+1200)]
              if any(k in ctx for k in ['support','local','cell','atlas','incidence','diameter','range','connector','finite']):
                  targeted.append(i)
          summary.append(f'targeted template+geometry contexts: {len(targeted)}')
          for j,i in enumerate(targeted[:120],1):
              chunks.append(f'===== targeted template geometry {j} at {i} =====\n'+text[max(0,i-3500):min(len(text),i+7000)])
          (out/'SUMMARY.txt').write_text('\n'.join(summary)+'\n',encoding='utf-8')
          (out/'CONTEXTS.txt').write_text('\n\n'.join(chunks),encoding='utf-8')
          print('\n'.join(summary))
          PY
      - name: Commit source audit
        run: |
          git config user.name 'millennium-braid-source-audit'
          git config user.email 'actions@users.noreply.github.com'
          git add source_audit/kirk_v4/finite_template_locality
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audit(ym): pin finite-template locality contexts'
          git push origin HEAD:verification/ym-kirk-v4-finite-template-locality-audit-20260815-gpt56sol
      - uses: actions/upload-artifact@v4
        with:
          name: kirk-v4-finite-template-locality
          if-no-files-found: error
          retention-days: 30
          path: source_audit/kirk_v4/finite_template_locality/
