name: YM Kirk v4 finite-template locality audit

on:
  push:
    branches:
      - verification/ym-kirk-v4-finite-template-locality-audit-20260815-gpt56sol
    paths:
      - .github/workflows/ym-kirk-v4-finite-template-locality-audit.yml

permissions:
  contents: write

jobs:
  source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verification/ym-kirk-v4-finite-template-locality-audit-20260815-gpt56sol
      - name: Ensure pdftotext
        run: |
          if ! command -v pdftotext >/dev/null; then sudo apt-get update && sudo apt-get install -y poppler-utils; fi
      - name: Pin v4 and isolate finite-tail exhaustion contexts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,time,urllib.request,urllib.error,hashlib
          UA='ym-kirk-fin-tail-exhaustion/2.0'
          def get(url):
              last=None
              for i in range(7):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'*/*'})
                      with urllib.request.urlopen(req,timeout=60) as r: return r.read()
                  except (urllib.error.HTTPError,urllib.error.URLError) as e:
                      last=e
                      if isinstance(e,urllib.error.HTTPError) and e.code not in (429,500,502,503,504): raise
                      time.sleep(min(2**i,32))
              raise last
          rec=json.loads(get('https://zenodo.org/api/records/21765806'))
          pdfs=[f for f in rec.get('files',[]) if str(f.get('key','')).lower().endswith('.pdf')]
          if len(pdfs)!=1: raise RuntimeError(f'expected one PDF, got {len(pdfs)}')
          url=pdfs[0].get('links',{}).get('content') or pdfs[0].get('links',{}).get('self')
          pdf=get(url); Path('/tmp/kirk-v4.pdf').write_bytes(pdf)
          print('record_id',rec.get('id')); print('version',rec.get('metadata',{}).get('version')); print('sha256',hashlib.sha256(pdf).hexdigest())
          PY
          pdftotext -layout /tmp/kirk-v4.pdf /tmp/kirk-v4.txt
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('/tmp/kirk-v4.txt').read_text(encoding='utf-8',errors='replace'); low=text.lower()
          out=Path('source_audit/kirk_v4/finite_template_locality/exhaustion'); out.mkdir(parents=True,exist_ok=True)
          targets=[
            ('finite_template_incidences','finite-template incidences'),('finite_template','finite template'),
            ('prop_6_8','Proposition 6.8'),('def_3_22','Definition 3.22'),('lemma_3_24','Lemma 3.24'),
            ('das1','DAS1'),('das2','DAS2'),('das3','DAS3'),('das4','DAS4'),('das5','DAS5'),
            ('fixed_block_template','fixed block template'),('fixed_cell','fixed cell'),
            ('finite_range','finite range'),('finite_range_hyphen','finite-range'),('fixed_finite_range','fixed finite range'),
            ('uniformly_bounded_support','uniformly bounded support'),('actual_support_diameter','actual support diameter'),
            ('tail_families','tail families'),('finite_tail','finite tail'),('optical_tail','optical tail'),
            ('permanent_support_reporting','permanent support reporting'),('fixed_group_templates','For the fixed group G, the Karcher')
          ]
          summary=[]
          for slug,phrase in targets:
              hits=[]; pos=0
              while True:
                  i=low.find(phrase.lower(),pos)
                  if i<0: break
                  hits.append(i); pos=i+max(1,len(phrase))
              summary.append(f'{phrase}: {len(hits)}')
              chunks=[]
              for j,i in enumerate(hits[:30],1):
                  chunks.append(f'===== {phrase} hit {j} at {i} =====\n'+text[max(0,i-7000):min(len(text),i+14000)])
              (out/f'{slug}.txt').write_text('\n\n'.join(chunks),encoding='utf-8')
          a=low.find('definition 3.22'); b=low.find('lemma 3.25',a+1)
          if a>=0 and b>a: (out/'section_3_22_to_3_24.txt').write_text(text[a:b],encoding='utf-8')
          a=low.find('proposition 6.8'); b=low.find('lemma 6.9',a+1)
          if a>=0 and b>a: (out/'prop_6_8_full.txt').write_text(text[a:b],encoding='utf-8')
          (out/'SUMMARY.txt').write_text('\n'.join(summary)+'\n',encoding='utf-8')
          print('\n'.join(summary))
          PY
      - name: Commit focused source audit
        run: |
          git config user.name 'millennium-braid-source-audit'
          git config user.email 'actions@users.noreply.github.com'
          git add source_audit/kirk_v4/finite_template_locality/exhaustion
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audit(ym): isolate finite-tail exhaustion contexts'
          git push origin HEAD:verification/ym-kirk-v4-finite-template-locality-audit-20260815-gpt56sol
      - uses: actions/upload-artifact@v4
        with:
          name: kirk-v4-fin-tail-exhaustion
          if-no-files-found: error
          retention-days: 30
          path: source_audit/kirk_v4/finite_template_locality/exhaustion/
