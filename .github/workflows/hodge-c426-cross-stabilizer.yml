name: Hodge C426 cross-tensor stabilizer

on:
  push:
    branches:
      - verification/hodge-c426-cross-stabilizer-20260821
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Verify exact Lean source
        shell: bash
        run: |
          set -euo pipefail
          SRC=verification/hodge-c426-cross-stabilizer/K3PairCrossTensorStabilizer.lean
          if grep -nE '\b(sorry|admit|sorryAx|unsafe|native_decide|Lean\.ofReduceBool)\b' "$SRC"; then exit 1; fi
          if grep -nE '^[[:space:]]*(axiom|opaque)[[:space:]]' "$SRC"; then exit 1; fi
          SRC="$SRC" python3 - <<'PY'
          import hashlib, json, os, pathlib, urllib.request
          path = pathlib.Path(os.environ['SRC'])
          source = path.read_text()
          print('source_sha256', hashlib.sha256(source.encode()).hexdigest())
          payload = json.dumps({
            'content': source,
            'environment': 'lean-4.30.0',
            'ignore_imports': True,
            'mathlib_options': False,
            'timeout_seconds': 900,
          }).encode()
          req = urllib.request.Request(
            'https://axle.axiommath.ai/api/v1/check',
            data=payload,
            headers={'Content-Type': 'application/json'},
            method='POST')
          with urllib.request.urlopen(req, timeout=960) as response:
            result = json.load(response)
          print(json.dumps(result, indent=2))
          lean = result.get('lean_messages', {})
          tool = result.get('tool_messages', {})
          encoded = json.dumps(result)
          bad = (
            not result.get('okay') or
            bool(result.get('failed_declarations', [])) or
            bool(lean.get('errors', [])) or
            bool(lean.get('warnings', [])) or
            bool(tool.get('errors', [])) or
            bool(tool.get('warnings', [])) or
            'sorryAx' in encoded
          )
          if bad:
            raise SystemExit(1)
          PY
