name: YM transmutation overshoot verifier

on:
  push:
    branches:
      - agent/ym-transmutation-overshoot-public-20260813
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify exact source
        shell: bash
        run: |
          set -euo pipefail
          SRC=verification/ym_transmutation_overshoot/YMScaleWindowCore.lean
          test "$(git hash-object "$SRC")" = 5b9f07230dd3d7fa70eecc62bf7112c10bab841f
          python3 - <<'PY'
          import json, pathlib, re, urllib.request
          source_path = pathlib.Path('verification/ym_transmutation_overshoot/YMScaleWindowCore.lean')
          source = source_path.read_text()
          forbidden = re.compile(r'(^|[^A-Za-z0-9_])(sorry|admit|sorryAx|axiom|opaque|unsafe)([^A-Za-z0-9_]|$)')
          match = forbidden.search(source)
          assert not match, match.group(2) if match else ''
          assert 'native_decide' not in source
          assert 'Lean.ofReduceBool' not in source
          assert source.count('#print axioms') == 4
          payload = json.dumps({
              'content': source,
              'environment': 'lean-4.30.0',
              'ignore_imports': True,
              'mathlib_options': False,
              'timeout_seconds': 900,
          }).encode()
          request = urllib.request.Request(
              'https://axle.axiommath.ai/api/v1/check',
              data=payload,
              headers={'Content-Type':'application/json'},
              method='POST',
          )
          with urllib.request.urlopen(request, timeout=960) as response:
              result = json.load(response)
          print(json.dumps(result, indent=2))
          lean = result.get('lean_messages', {})
          tool = result.get('tool_messages', {})
          assert result.get('okay')
          assert not result.get('failed_declarations', [])
          assert not lean.get('errors', []) and not lean.get('warnings', [])
          assert not tool.get('errors', []) and not tool.get('warnings', [])
          assert 'sorryAx' not in json.dumps(result)
          print('VERIFIED: exact warning-free source compiled under AXLE Lean 4.30')
          PY
