name: NS Finite-Overlap Countermodel Lean

on:
  push:
    branches:
      - verification/ns-finite-overlap-countermodel-20260812
    paths:
      - 'verification/ns-finite-overlap-countermodel/**'
      - '.github/workflows/ns-finite-overlap-countermodel-lean.yml'
  pull_request:
    paths:
      - 'verification/ns-finite-overlap-countermodel/**'
      - '.github/workflows/ns-finite-overlap-countermodel-lean.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Reject explicit placeholders and custom trust declarations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import re
          root = pathlib.Path('verification/ns-finite-overlap-countermodel')
          paths = sorted(root.glob('*.lean'))
          if not paths:
              raise SystemExit('no Lean files found')
          for path in paths:
              text = path.read_text(encoding='utf-8')
              text = re.sub(r'/-.*?-/', '', text, flags=re.S)
              text = re.sub(r'--.*$', '', text, flags=re.M)
              for pattern in [
                  r'^\s*(sorry|admit)\b',
                  r'^\s*axiom\b',
                  r'^\s*opaque\b',
                  r'^\s*unsafe\b',
                  r'\bnative_decide\b',
                  r'Lean\.ofReduceBool',
              ]:
                  match = re.search(pattern, text, flags=re.M)
                  if match:
                      raise SystemExit(
                          f'{path}: forbidden declaration/token: {match.group(0)!r}'
                      )
          print('trust scan passed for:', ', '.join(str(p) for p in paths))
          PY

      - name: Install pinned Lean, fetch pinned Mathlib cache, and compile
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.32.1
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version | tee lean-version.log
          lake --version | tee lake-version.log
          cd verification/ns-finite-overlap-countermodel
          lake update
          lake exe cache get
          : > lean-output.log
          for file in *.lean; do
            echo "===== compiling ${file} =====" | tee -a lean-output.log
            lake env lean "$file" 2>&1 | tee -a lean-output.log
          done
          if grep -Eq 'declaration uses .sorry.|sorryAx|admit|error:' lean-output.log; then
            echo 'Forbidden placeholder axiom or compiler error found.' >&2
            exit 1
          fi
          echo 'VERIFIED finite NS countermodel cores.'

      - name: Upload compiler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ns-finite-overlap-countermodel-evidence
          path: |
            verification/ns-finite-overlap-countermodel/lean-output.log
            lean-version.log
            lake-version.log
          if-no-files-found: warn
