name: Round 210 Hodge Zero-Defect Finite Cores

on:
  push:
    branches:
      - agent/round210-hodge-zero-defect-verify-20260812
    paths:
      - 'verification/round210-hodge-zero-defect/**'
      - '.github/workflows/round210-hodge-zero-defect-verify.yml'
  pull_request:
    branches: [main]
    paths:
      - 'verification/round210-hodge-zero-defect/**'
      - '.github/workflows/round210-hodge-zero-defect-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Reject explicit placeholders
        shell: bash
        run: |
          set -euo pipefail
          for file in verification/round210-hodge-zero-defect/*.lean; do
            if grep -En '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' "$file"; then
              echo "Forbidden Lean placeholder found in $file." >&2
              exit 1
            fi
          done
      - name: Install pinned Lean, fetch pinned Mathlib cache, and compile
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.32.1
          export PATH="$HOME/.elan/bin:$PATH"
          cd verification/round210-hodge-zero-defect
          lake update
          lake exe cache get
          : > lean-output.log
          for file in \
            HodgeZeroDefectFinite.lean \
            HodgeProductCrossTypeFinite.lean \
            HodgeSpinorRankFinite.lean; do
            echo "===== $file =====" | tee -a lean-output.log
            lake env lean "$file" 2>&1 | tee -a lean-output.log
          done
          if grep -Eq 'declaration uses .sorry.|sorryAx|admit' lean-output.log; then
            echo 'Forbidden placeholder axiom found in compiler output.' >&2
            exit 1
          fi
          echo 'VERIFIED finite Round 210 Hodge cores.'
      - name: Upload compiler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: round210-hodge-zero-defect-lean-evidence
          path: verification/round210-hodge-zero-defect/lean-output.log
          if-no-files-found: warn
