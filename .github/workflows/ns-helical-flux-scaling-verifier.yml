name: NS helical flux scaling verifier

on:
  push:
    branches: [agent/ns-helical-flux-scaling-verifier-20260812]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ns-helical-flux-scaling-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exact-source trust preflight and AXLE Lean 4.30 compile
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import pathlib
          import re
          import urllib.error
          import urllib.request

          root = pathlib.Path('verification/ns-flux-scaling')
          path = root / 'NSFluxScalingObstruction.lean'
          result_path = root / 'axle-result.json'
          status_path = root / 'verification-status.json'
          content = path.read_text()
          digest = hashlib.sha256(content.encode()).hexdigest()
          status = {'source_sha256': digest}
          print('source_sha256=' + digest)

          try:
              forbidden = {
                  'sorry/admit': r'(^|[^A-Za-z0-9_])(sorry|admit)([^A-Za-z0-9_]|$)',
                  'custom axiom': r'^\s*axiom\s+',
                  'opaque': r'^\s*opaque\s+',
                  'unsafe': r'(^|\s)unsafe(\s|$)',
              }
              for label, pattern in forbidden.items():
                  if re.search(pattern, content, flags=re.MULTILINE):
                      raise RuntimeError(f'forbidden source construct ({label})')

              payload = json.dumps({
                  'content': content,
                  'environment': 'lean-4.30.0',
                  'ignore_imports': True,
                  'mathlib_options': False,
                  'timeout_seconds': 900,
              }).encode()
              request = urllib.request.Request(
                  'https://axle.axiommath.ai/api/v1/check',
                  data=payload,
                  headers={'Content-Type': 'application/json'},
                  method='POST',
              )
              try:
                  with urllib.request.urlopen(request, timeout=960) as response:
                      result = json.load(response)
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode('utf-8', errors='replace')
                  status['http_error'] = {'code': exc.code, 'body': body}
                  print(body)
                  raise

              result_path.write_text(json.dumps(result, indent=2, sort_keys=True))
              print(json.dumps(result, indent=2))

              lean_errors = result.get('lean_messages', {}).get('errors', [])
              tool_errors = result.get('tool_messages', {}).get('errors', [])
              failed = result.get('failed_declarations', [])
              rendered = json.dumps(result)
              status.update({
                  'okay': result.get('okay'),
                  'lean_errors': lean_errors,
                  'tool_errors': tool_errors,
                  'failed_declarations': failed,
              })
              if not result.get('okay') or lean_errors or tool_errors or failed:
                  raise RuntimeError('Lean/AXLE verification failed')
              for token in ('sorryAx', 'Lean.ofReduceBool'):
                  if token in rendered:
                      raise RuntimeError(f'forbidden postcompile dependency: {token}')

              status['verified'] = True
              print('VERIFIED: exact source compiled under AXLE Lean 4.30 with no failed declarations')
          except Exception as exc:
              status['verified'] = False
              status['exception'] = repr(exc)
              raise
          finally:
              status_path.write_text(json.dumps(status, indent=2, sort_keys=True))
          PY
      - name: Upload exact verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ns-helical-flux-scaling-evidence
          path: |
            verification/ns-flux-scaling/NSFluxScalingObstruction.lean
            verification/ns-flux-scaling/axle-result.json
            verification/ns-flux-scaling/verification-status.json
          if-no-files-found: error
