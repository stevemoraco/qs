name: Hodge square-factor tangent firewall

on:
  push:
    branches:
      - verification/hodge-squarefactor-tangent-firewall-20260813-gpt56
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact finite theorem source
        shell: bash
        run: |
          set -euo pipefail
          SRC=verification/hodge-squarefactor-tangent-firewall/SquareFactorHigherTangentFirewall.lean
          if grep -nE '\b(sorry|admit|sorryAx|axiom|opaque|unsafe|native_decide|Lean\.ofReduceBool)\b' "$SRC"; then exit 1; fi
          python3 - <<'PY'
          import json, pathlib, urllib.request
          source = pathlib.Path('verification/hodge-squarefactor-tangent-firewall/SquareFactorHigherTangentFirewall.lean').read_text()
          payload = json.dumps({
              'content': source,
              'environment': 'lean-4.30.0',
              'ignore_imports': True,
              'mathlib_options': False,
              'timeout_seconds': 900,
          }).encode()
          req = urllib.request.Request(
              'https://axle.axiommath.ai/api/v1/check', data=payload,
              headers={'Content-Type':'application/json'}, method='POST')
          with urllib.request.urlopen(req, timeout=960) as response:
              result = json.load(response)
          print(json.dumps(result, indent=2))
          assert result.get('okay')
          assert not result.get('failed_declarations', [])
          lean = result.get('lean_messages', {})
          tool = result.get('tool_messages', {})
          assert not lean.get('errors', []) and not lean.get('warnings', [])
          assert not tool.get('errors', []) and not tool.get('warnings', [])
          assert 'sorryAx' not in json.dumps(result)
          PY
