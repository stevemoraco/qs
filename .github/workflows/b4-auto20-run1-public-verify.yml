name: B4 AUTO20 run1 six-problem bridge cores

on:
  push:
    branches:
      - agent/b4-auto20-run1-public-verifier-20260812-1115
    paths:
      - 'B4Auto20Run1/**'
      - 'verification/b4-auto20-run1/**'
      - '.github/workflows/b4-auto20-run1-public-verify.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Reject explicit trust escapes
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(B4Auto20Run1/*.lean)
          test ${#files[@]} -eq 6
          if grep -En '^[[:space:]]*(sorry|admit|axiom|opaque|unsafe)([^[:alnum:]_]|$)' "${files[@]}"; then
            echo 'Forbidden Lean placeholder or custom trust declaration found.' >&2
            exit 1
          fi
          if grep -En '^[[:space:]]*.*(native_decide|Lean\.ofReduceBool)' "${files[@]}"; then
            echo 'Forbidden computational trust escape found.' >&2
            exit 1
          fi

      - name: Initialize evidence log
        shell: bash
        run: |
          mkdir -p verification/b4-auto20-run1
          : > verification/b4-auto20-run1/lean-output.log
          echo 'B4 AUTO20 verifier start' | tee -a verification/b4-auto20-run1/lean-output.log

      - name: Set up pinned Lean and Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: verification/b4-auto20-run1
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          use-github-cache: 'true'

      - name: Record toolchain
        shell: bash
        run: |
          set -euo pipefail
          lean --version | tee -a verification/b4-auto20-run1/lean-output.log
          lake --version | tee -a verification/b4-auto20-run1/lean-output.log
          cd verification/b4-auto20-run1
          git -C .lake/packages/mathlib rev-parse HEAD | tee -a lean-output.log

      - name: Compile exact mirrored sources
        shell: bash
        run: |
          set -euo pipefail
          cd verification/b4-auto20-run1
          for file in ../../B4Auto20Run1/*.lean; do
            echo "=== compiling $file ===" | tee -a lean-output.log
            lake env lean "$file" 2>&1 | tee -a lean-output.log
          done
          if grep -Eq 'declaration uses .sorry.|sorryAx|admit|Lean\.ofReduceBool|error:' lean-output.log; then
            echo 'Forbidden placeholder axiom or compiler error found.' >&2
            exit 1
          fi
          test -s lean-output.log
          echo 'VERIFIED B4 AUTO20 finite/logical bridge cores.' | tee -a lean-output.log

      - name: Upload compiler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b4-auto20-run1-sixproblem-lean-evidence
          path: verification/b4-auto20-run1/lean-output.log
          if-no-files-found: error
