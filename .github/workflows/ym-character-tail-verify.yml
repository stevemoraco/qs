name: Yang-Mills Character-Tail Finite Cores

on:
  push:
    branches:
      - agent/ym-character-tail-verify-20260813
    paths:
      - 'verification/ym-character-tail/**'
      - '.github/workflows/ym-character-tail-verify.yml'
  pull_request:
    branches: [main]
    paths:
      - 'verification/ym-character-tail/**'
      - '.github/workflows/ym-character-tail-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Reject explicit placeholders
        shell: bash
        run: |
          set -euo pipefail
          file=verification/ym-character-tail/YMCharacterTailFinite.lean
          if grep -En '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' "$file"; then
            echo 'Forbidden Lean placeholder found.' >&2
            exit 1
          fi
      - name: Install pinned Lean, fetch pinned Mathlib cache, and compile
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.32.1
          export PATH="$HOME/.elan/bin:$PATH"
          cd verification/ym-character-tail
          lake update
          lake exe cache get
          lake env lean YMCharacterTailFinite.lean 2>&1 | tee lean-output.log
          if grep -Eq 'declaration uses .sorry.|sorryAx|admit' lean-output.log; then
            echo 'Forbidden placeholder axiom found in compiler output.' >&2
            exit 1
          fi
          echo 'VERIFIED finite Yang-Mills character-tail cores.'
      - name: Upload compiler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ym-character-tail-lean-evidence
          path: verification/ym-character-tail/lean-output.log
          if-no-files-found: warn
