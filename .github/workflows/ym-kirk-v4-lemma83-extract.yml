name: YM Kirk v4 lemma 8.3 extract

on:
  push:
    branches:
      - verification/ym-kirk-v4-local-root-source-radius-audit-20260822-gpt56sol

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verification/ym-kirk-v4-local-root-source-radius-audit-20260822-gpt56sol
      - name: Ensure pdftotext
        run: |
          if ! command -v pdftotext >/dev/null; then sudo apt-get update && sudo apt-get install -y poppler-utils; fi
      - name: Pin immutable Kirk source
        run: python3 tools/probe_kirk_latest_source.py >/tmp/probe.json
      - name: Extract lemma 8.3
        run: |
          set -euo pipefail
          pdftotext -raw kirk_latest.pdf latest_raw.txt
          python3 - <<'PY'
          from pathlib import Path
          text=Path('latest_raw.txt').read_text(encoding='utf-8',errors='replace')
          marker='Lemma 8.3 ('
          i=text.find(marker)
          if i < 0: raise SystemExit('Lemma 8.3 not found')
          candidates=[text.find(x,i+len(marker)) for x in ('Lemma 8.4 (','Theorem 8.4 (','Corollary 8.4 (')]
          candidates=[x for x in candidates if x>=0]
          j=min(candidates) if candidates else min(len(text),i+16000)
          out=Path('source_audit/kirk_v4/local_root_source_radius/LEMMA_8_3.txt')
          out.write_text(text[max(0,i-2000):j],encoding='utf-8')
          print(text[i:min(j,i+6000)])
          PY
      - name: Commit extraction
        run: |
          git config user.name 'millennium-braid-source-audit'
          git config user.email 'actions@users.noreply.github.com'
          git add source_audit/kirk_v4/local_root_source_radius/LEMMA_8_3.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audit(ym): preserve lemma 8.3 source context'
          git push origin HEAD:verification/ym-kirk-v4-local-root-source-radius-audit-20260822-gpt56sol
