name: YM Kirk v4 compact/BKAR norm compatibility audit

on:
  push:
    branches:
      - verification/ym-kirk-v4-compact-norm-compat-audit-20260816-run3-gpt56sol
    paths:
      - .github/workflows/ym-kirk-v4-compact-norm-compat-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verification/ym-kirk-v4-compact-norm-compat-audit-20260816-run3-gpt56sol
      - name: Ensure pdftotext
        run: |
          if ! command -v pdftotext >/dev/null; then
            sudo apt-get update && sudo apt-get install -y poppler-utils
          fi
      - name: Pin immutable source
        run: python3 tools/probe_kirk_latest_source.py >/tmp/probe.json
      - name: Extract compact/BKAR norm interfaces
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('latest.txt').read_text(encoding='utf-8', errors='replace')
          out = Path('source_audit/kirk_v4/compact_norm_compat')
          out.mkdir(parents=True, exist_ok=True)

          targets = [
            ('theorem_4_4','Theorem 4.4'),
            ('lemma_4_24','Lemma 4.24'),
            ('proposition_4_26','Proposition 4.26'),
            ('lemma_4_27','Lemma 4.27'),
            ('lemma_6_22','Lemma 6.22'),
            ('lemma_6_27','Lemma 6.27'),
            ('theorem_6_39','Theorem 6.39'),
            ('lemma_6_41','Lemma 6.41'),
            ('theorem_6_43','Theorem 6.43'),
          ]
          for slug,target in targets:
            m=re.search(r'(?m)^\s*'+re.escape(target)+r'\b.*$', text)
            if m:
              (out/f'{slug}.txt').write_text(text[max(0,m.start()-10000):min(len(text),m.start()+32000)],encoding='utf-8')

          pats={
            'tau_weight': r'eκτ|κτ|τ\s*\(\s*P\s*\)',
            'diam_weight': r'emH\s*diam|mH\s*diam|diam\s*Y',
            'eta_atom': r'ηatom',
            'eta_H': r'ηH',
            'Ctree': r'Ctree',
            'ordinary_vertices': r'ordinary vertices',
            'support_margin': r'support margin|support-exponent|support exponent',
            'optical_tube': r'optical.*tube|tube.*optical|hybrid.*tube|Cauchy.*optical',
            'weakened_rooted': r'weakened rooted support norm',
          }
          summary=[]
          for name,pat in pats.items():
            ms=list(re.finditer(pat,text,re.I|re.S if name=='optical_tube' else re.I))
            summary.append(f'{name}\tcount={len(ms)}\toffsets={[m.start() for m in ms[:40]]}')
            chunks=[]
            for i,m in enumerate(ms[:20]):
              chunks.append(f'===== {name} {i+1}/{min(len(ms),20)} @ {m.start()} =====\n'+text[max(0,m.start()-5000):min(len(text),m.end()+7000)]+'\n')
            (out/f'{name}.txt').write_text('\n'.join(chunks),encoding='utf-8')
          (out/'COUNTS.txt').write_text('\n'.join(summary)+'\n',encoding='utf-8')

          notes=[]
          notes.append('Question 1: can the joint BKAR output norm be weakened from permanent kappa*tau support to a common physical diameter weight, using diam <= tau?')
          notes.append('Question 2: do compact activities carry the arbitrary optical-field derivative/Cauchy row required by Theorem 4.4, beyond the printed finite passive marks in (99)?')
          notes.append('This workflow extracts source contexts only; it does not infer either closure.')
          (out/'QUESTION.txt').write_text('\n'.join(notes)+'\n',encoding='utf-8')

          for p in ['kirk_latest_record.json','kirk_source_probe_report.json']:
            q=Path(p)
            if q.exists(): (out/p).write_bytes(q.read_bytes())
          print('\n'.join(summary))
          PY
      - name: Commit audit
        run: |
          git config user.name 'millennium-braid-source-audit'
          git config user.email 'actions@users.noreply.github.com'
          git add source_audit/kirk_v4/compact_norm_compat
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audit(ym): expand compact/BKAR compatibility extraction'
          git push origin HEAD:verification/ym-kirk-v4-compact-norm-compat-audit-20260816-run3-gpt56sol
      - uses: actions/upload-artifact@v4
        with:
          name: kirk-v4-compact-norm-compat-audit
          if-no-files-found: error
          retention-days: 30
          path: source_audit/kirk_v4/compact_norm_compat/
