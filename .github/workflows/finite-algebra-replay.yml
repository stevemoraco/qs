name: Finite Algebra Replay

on:
  push:
    branches: [agent/finite-algebra-20260813-gpt56]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile exact source
        shell: bash
        run: |
          set -euo pipefail
          dir="$GITHUB_WORKSPACE/verification/finite-ode"
          file="$dir/FiniteODE.lean"
          git hash-object "$file" | tee "$dir/source-blob.txt"
          sha256sum "$file" | tee "$dir/source-sha256.txt"
          ! grep -En '(^|[^[:alnum:]_])(sorry|admit|sorryAx)([^[:alnum:]_]|$)' "$file"
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.30.0
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version | tee "$dir/lean-version.txt"
          cd formal/millennium_audit
          lake update
          lake exe cache get
          lake env lean ../../verification/finite-ode/FiniteODE.lean 2>&1 | tee "$dir/lean-output.log"
          ! grep -Eq 'declaration uses .sorry.|sorryAx|admit|Lean.ofReduceBool' "$dir/lean-output.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finite-algebra-evidence
          path: verification/finite-ode/
