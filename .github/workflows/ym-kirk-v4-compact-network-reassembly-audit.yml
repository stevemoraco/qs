name: YM Kirk v4 compact network reassembly audit

on:
  push:
    branches:
      - verification/ym-kirk-v4-compact-network-reassembly-audit-20260815-gpt56sol
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verification/ym-kirk-v4-compact-network-reassembly-audit-20260815-gpt56sol
      - name: Ensure pdftotext
        run: |
          if ! command -v pdftotext >/dev/null; then
            sudo apt-get update && sudo apt-get install -y poppler-utils
          fi
      - name: Pin immutable Kirk source
        run: python3 tools/probe_kirk_latest_source.py >/tmp/probe.json
      - name: Extract compact-network contexts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text=Path('latest.txt').read_text(encoding='utf-8',errors='replace')
          low=text.lower(); out=Path('source_audit/kirk_v4/compact_network_reassembly'); out.mkdir(parents=True,exist_ok=True)
          needles=['Lemma 6.30','Lemma 6.31','Lemma 6.32','Definition 6.33','Lemma 6.34','Lemma 6.35','Lemma 6.36','Lemma 6.37','Lemma 6.38','Theorem 6.39','qsp','q_sp','equation (95)','equation (96)','(95)','(96)','(97)','(98)','(99)']
          counts={}
          for needle in needles:
            pos=0;n=0;chunks=[]
            while n<30:
              i=low.find(needle.lower(),pos)
              if i<0: break
              n+=1
              chunks.append(f'=== hit {n} at {i} ===\n'+text[max(0,i-12000):min(len(text),i+45000)])
              pos=i+len(needle)
            counts[needle]=n
            safe=''.join(c if c.isalnum() else '_' for c in needle)[:80]
            if chunks: (out/(safe+'.txt')).write_text('\n\n'.join(chunks),encoding='utf-8')
          (out/'COUNTS.txt').write_text('\n'.join(f'{k}: {v}' for k,v in counts.items())+'\n',encoding='utf-8')
          required=['Lemma 6.30','Lemma 6.34','Lemma 6.38','Theorem 6.39']
          missing=[x for x in required if counts.get(x,0)==0]
          print('\n'.join(f'{k}: {v}' for k,v in counts.items()))
          if missing: raise SystemExit('missing anchors: '+', '.join(missing))
          PY
      - name: Preserve contexts
        run: |
          cp kirk_latest_record.json source_audit/kirk_v4/compact_network_reassembly/
          sha256sum kirk_latest.pdf > source_audit/kirk_v4/compact_network_reassembly/PDF_SHA256.txt
          git config user.name 'millennium-braid-source-audit'
          git config user.email 'actions@users.noreply.github.com'
          git add source_audit/kirk_v4/compact_network_reassembly
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audit(ym): preserve compact network reassembly contexts'
          git push origin HEAD:verification/ym-kirk-v4-compact-network-reassembly-audit-20260815-gpt56sol
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kirk-v4-compact-network-reassembly-audit
          if-no-files-found: warn
          retention-days: 30
          path: source_audit/kirk_v4/compact_network_reassembly/
