name: RH Wu empty-floor-cell public verifier

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify trust boundary
        shell: bash
        run: |
          set -euo pipefail
          dir='verification/rh-wu-empty-floor-cell-public'
          file="$dir/RHWuEmptyFloorCellCounterexample.lean"
          actual_blob="$(git hash-object "$file")"
          expected_blob='bcad73931c47c18f7d25bb90bff907fba918abca'
          test "$actual_blob" = "$expected_blob"
          printf 'canonical_private_blob=%s\n' "$actual_blob"
          sha256sum "$file"
          if grep -En '(^|[^[:alnum:]_])(sorry|admit|sorryAx)([^[:alnum:]_]|$)' "$file"; then exit 1; fi
          if grep -En '^[[:space:]]*(axiom|opaque|unsafe)[[:space:]]' "$file"; then exit 1; fi
          if grep -En '(native_decide|Lean\.ofReduceBool)' "$file"; then exit 1; fi
      - name: Install pinned Lean and compile exact source
        shell: bash
        run: |
          set -euo pipefail
          dir='verification/rh-wu-empty-floor-cell-public'
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.32.1
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version
          lake --version
          cd "$dir"
          lake update
          lake exe cache get
          set +e
          lake env lean RHWuEmptyFloorCellCounterexample.lean > lean-output.log 2>&1
          status=$?
          set -e
          cat lean-output.log
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          if grep -Eq 'declaration uses .sorry.|sorryAx|admit|Lean.ofReduceBool' lean-output.log; then exit 1; fi
          echo 'VERIFIED RH Wu empty-floor-cell counterexample.'
