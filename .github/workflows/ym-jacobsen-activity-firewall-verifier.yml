name: YM Jacobsen activity firewall exact verifier

on:
  push:
    branches:
      - agent/ym-jacobsen-activity-firewall-20260813
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Canonical-source and trust preflight
        shell: bash
        run: |
          set -euo pipefail
          SRC=verification/ym_jacobsen_activity_firewall/YMJacobsenActivityFirewall.lean
          EXPECTED_BLOB=64d56863827097a5a2a1a32a2b1dbca863450733
          test "$(git hash-object "$SRC")" = "$EXPECTED_BLOB"
          python3 - <<'PY'
          import pathlib, re
          source = pathlib.Path(
              'verification/ym_jacobsen_activity_firewall/YMJacobsenActivityFirewall.lean'
          ).read_text()
          forbidden = re.compile(r'(^|[^A-Za-z0-9_])(sorry|admit|sorryAx|axiom|opaque|unsafe)([^A-Za-z0-9_]|$)')
          match = forbidden.search(source)
          if match:
              raise SystemExit(f'forbidden source token: {match.group(2)}')
          for token in ('Lean.ofReduceBool', 'native_decide'):
              if token in source:
                  raise SystemExit(f'forbidden source token: {token}')
          if source.count('#print axioms') != 8:
              raise SystemExit('expected exactly eight staged axiom reports')
          print('source trust preflight: clean')
          PY

      - name: Compile exact source with AXLE Lean 4.30
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/ym_jacobsen_activity_firewall
          python3 - <<'PY'
          import json
          import pathlib
          import urllib.request
          source = pathlib.Path(
              'verification/ym_jacobsen_activity_firewall/YMJacobsenActivityFirewall.lean'
          ).read_text()
          payload = json.dumps({
              'content': source,
              'environment': 'lean-4.30.0',
              'ignore_imports': True,
              'mathlib_options': False,
              'timeout_seconds': 900,
          }).encode()
          request = urllib.request.Request(
              'https://axle.axiommath.ai/api/v1/check',
              data=payload,
              headers={'Content-Type': 'application/json'},
              method='POST',
          )
          with urllib.request.urlopen(request, timeout=960) as response:
              result = json.load(response)
          pathlib.Path(
              'evidence/ym_jacobsen_activity_firewall/axle-response.json'
          ).write_text(json.dumps(result, indent=2, sort_keys=True))
          print(json.dumps(result, indent=2))
          lean_errors = result.get('lean_messages', {}).get('errors', [])
          tool_errors = result.get('tool_messages', {}).get('errors', [])
          failed = result.get('failed_declarations', [])
          warnings = result.get('lean_messages', {}).get('warnings', [])
          if not result.get('okay') or lean_errors or tool_errors or failed or warnings:
              raise SystemExit('Lean/AXLE verification failed or emitted warnings')
          rendered = json.dumps(result)
          for forbidden in ('sorryAx', 'Lean.ofReduceBool'):
              if forbidden in rendered:
                  raise SystemExit(f'postcompile forbidden dependency: {forbidden}')
          print('VERIFIED: exact warning-free source compiled under AXLE Lean 4.30')
          PY

      - name: Record replay metadata
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/ym_jacobsen_activity_firewall
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "ref=${GITHUB_REF}"
            echo "commit=${GITHUB_SHA}"
            echo "runner_os=${RUNNER_OS}"
            echo "source_blob=$(git hash-object verification/ym_jacobsen_activity_firewall/YMJacobsenActivityFirewall.lean)"
            echo "source_sha256=$(sha256sum verification/ym_jacobsen_activity_firewall/YMJacobsenActivityFirewall.lean | awk '{print $1}')"
            echo "environment=lean-4.30.0"
          } > evidence/ym_jacobsen_activity_firewall/replay-metadata.txt

      - name: Upload exact compiler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ym-jacobsen-activity-firewall-public-evidence
          path: evidence/ym_jacobsen_activity_firewall/
          if-no-files-found: error
