name: NS atomic-Type-I finite replay

on:
  push:
    branches:
      - automation/ns-atomic-typei-split-verifier-20260815-run35
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Trust preflight
        shell: bash
        run: |
          set -euo pipefail
          SRC=verification/ns-atomic-typei-split/NSAtomicTypeISplit.lean
          test -s "$SRC"
          if grep -nE '\b(sorry|admit|sorryAx|axiom|opaque|unsafe|native_decide|Lean\.ofReduceBool)\b' "$SRC"; then
            echo 'forbidden trust carrier found' >&2
            exit 1
          fi
          test "$(grep -c '^#print axioms ' "$SRC")" = 4
          mkdir -p verification/ns-atomic-typei-split/evidence
          cp "$SRC" verification/ns-atomic-typei-split/evidence/canonical-source.lean
          sha256sum "$SRC" | tee verification/ns-atomic-typei-split/evidence/source.sha256

      - name: Execute AXLE Lean 4.30
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, urllib.request
          root = pathlib.Path('verification/ns-atomic-typei-split/evidence')
          src = (root / 'canonical-source.lean').read_text()
          payload = json.dumps({
              'content': src,
              'environment': 'lean-4.30.0',
              'ignore_imports': True,
              'mathlib_options': False,
              'timeout_seconds': 1200,
          }).encode()
          req = urllib.request.Request(
              'https://axle.axiommath.ai/api/v1/check',
              data=payload,
              headers={'Content-Type': 'application/json'},
              method='POST',
          )
          try:
              with urllib.request.urlopen(req, timeout=1260) as response:
                  result = json.load(response)
          except Exception as exc:
              result = {
                  'okay': False,
                  'request_exception': repr(exc),
                  'lean_messages': {'errors': [], 'warnings': []},
                  'tool_messages': {'errors': [], 'warnings': []},
                  'failed_declarations': [],
              }
          (root / 'axle-response.json').write_text(json.dumps(result, indent=2, sort_keys=True))
          print(json.dumps(result, indent=2))
          PY

      - name: Enforce clean verdict
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path('verification/ns-atomic-typei-split/evidence/axle-response.json')
          if not p.exists():
              raise SystemExit('missing AXLE response')
          r = json.loads(p.read_text())
          errs = r.get('lean_messages', {}).get('errors', [])
          warns = r.get('lean_messages', {}).get('warnings', [])
          terrs = r.get('tool_messages', {}).get('errors', [])
          twarns = r.get('tool_messages', {}).get('warnings', [])
          failed = r.get('failed_declarations', [])
          if not r.get('okay') or errs or warns or terrs or twarns or failed:
              raise SystemExit('Lean/AXLE failed or warned')
          rendered = json.dumps(r)
          if 'sorryAx' in rendered or 'Lean.ofReduceBool' in rendered:
              raise SystemExit('forbidden postcompile dependency')
          print('VERIFIED WARNING-FREE')
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ns-atomic-typei-split-evidence
          path: verification/ns-atomic-typei-split/evidence/
          if-no-files-found: error
