name: YM Kirk v4 local-root source-radius audit

on:
  push:
    branches:
      - verification/ym-kirk-v4-local-root-source-radius-audit-20260822-gpt56sol
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verification/ym-kirk-v4-local-root-source-radius-audit-20260822-gpt56sol
      - name: Ensure pdftotext
        run: |
          if ! command -v pdftotext >/dev/null; then sudo apt-get update && sudo apt-get install -y poppler-utils; fi
      - name: Pin immutable Kirk source
        run: python3 tools/probe_kirk_latest_source.py >/tmp/probe.json
      - name: Extract local-root source-radius contexts
        run: |
          set -euo pipefail
          pdftotext -raw kirk_latest.pdf latest_raw.txt
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('latest_raw.txt').read_text(encoding='utf-8',errors='replace')
          low=text.lower()
          out=Path('source_audit/kirk_v4/local_root_source_radius'); out.mkdir(parents=True,exist_ok=True)
          targets=[
            'finite triangular source theorem','triangular source-renormalization','triangular finite-jet renormalization',
            'finite triangular counterterm matrix','local source coefficient','renormalized local source',
            'contact subtree','contact jet','source-renormalization seminorm','common analytic source ball',
            'source ball','source neighborhood','source neighbourhood','holomorphic on',
            'analytic on','fixed neighborhood','fixed neighbourhood','source incidence'
          ]
          chunks=[]; counts={}
          for target in targets:
            pos=0; n=0
            while True:
              i=low.find(target,pos)
              if i<0: break
              n+=1
              chunks.append(f'=== {target} hit {n} at {i} ===\n'+text[max(0,i-5000):min(len(text),i+12000)]+'\n')
              pos=i+len(target)
              if n>=100: break
            counts[target]=n
          # Part V theorem inventory plus generous contexts around every theorem/lemma/corollary in section 5.
          headings=[]
          for m in re.finditer(r'(?m)^\s*(Theorem|Lemma|Corollary|Proposition|Definition)\s+(5\.[0-9]+)\b[^\n]*',text):
            headings.append(f'=== {m.group(1)} {m.group(2)} at {m.start()} ===\n'+text[max(0,m.start()-1200):min(len(text),m.start()+10000)]+'\n')
          (out/'TARGETED.txt').write_text('\n'.join(chunks),encoding='utf-8')
          (out/'PART_V_HEADINGS.txt').write_text('\n'.join(headings),encoding='utf-8')
          (out/'COUNTS.txt').write_text('\n'.join(f'{k}: {v}' for k,v in counts.items())+f'\npart_v_headings: {len(headings)}\n',encoding='utf-8')
          print((out/'COUNTS.txt').read_text())
          PY
      - name: Preserve audit contexts
        run: |
          cp kirk_latest_record.json source_audit/kirk_v4/local_root_source_radius/
          sha256sum kirk_latest.pdf > source_audit/kirk_v4/local_root_source_radius/PDF_SHA256.txt
          git config user.name 'millennium-braid-source-audit'
          git config user.email 'actions@users.noreply.github.com'
          git add source_audit/kirk_v4/local_root_source_radius
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audit(ym): preserve local-root source-radius contexts'
          git push origin HEAD:verification/ym-kirk-v4-local-root-source-radius-audit-20260822-gpt56sol
