name: RH frozen-prefix public replay

on:
  push:
    branches:
      - agent/rh-frozen-prefix-duality-public-replay-day0-20260813
    paths:
      - "verification/rh-frozen-prefix-day0/**"
      - ".github/workflows/rh-frozen-prefix-public-replay.yml"
  pull_request:
    paths:
      - "verification/rh-frozen-prefix-day0/**"
      - ".github/workflows/rh-frozen-prefix-public-replay.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Reject proof holes and custom trust escapes
        shell: bash
        run: |
          set -euo pipefail
          root="verification/rh-frozen-prefix-day0"
          ! grep -RInE '\b(sorry|admit)\b' "$root" --include='*.lean'
          ! grep -RInE '^[[:space:]]*(axiom|opaque|unsafe)[[:space:]]' "$root" --include='*.lean'
          ! grep -RInE 'native_decide|Lean\.ofReduceBool|sorryAx' "$root" --include='*.lean'

      - name: Install pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve pinned dependencies
        working-directory: verification/rh-frozen-prefix-day0
        run: lake update

      - name: Fetch Mathlib cache
        working-directory: verification/rh-frozen-prefix-day0
        run: lake exe cache get

      - name: Compile exact finite source and capture axiom report
        working-directory: verification/rh-frozen-prefix-day0
        shell: bash
        run: |
          set -euo pipefail
          lake build RHCriticalChebyshevFrozenPrefixFinite
          lake env lean RHCriticalChebyshevFrozenPrefixFinite.lean 2>&1 | tee lean-output.log
          sha256sum RHCriticalChebyshevFrozenPrefixFinite.lean

      - name: Enforce foundation-only axiom allowlist
        working-directory: verification/rh-frozen-prefix-day0
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import re
          text = pathlib.Path("lean-output.log").read_text()
          if "sorryAx" in text:
              raise SystemExit("sorryAx found")
          allowed = {"Classical.choice", "Classical.em", "Quot.sound", "funext", "propext"}
          used = set()
          for payload in re.findall(r"depends on axioms:\s*\[([^\]]*)\]", text):
              used.update(name.strip() for name in payload.split(",") if name.strip())
          unexpected = used - allowed
          print("Axioms used:", sorted(used))
          if unexpected:
              raise SystemExit(f"Unexpected axioms: {sorted(unexpected)}")
          PY
