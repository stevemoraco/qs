name: NS Exact Tensor Commutator Finite Core

on:
  push:
    branches:
      - research/ns-exact-tensor-commutator-public-verifier-20260812
    paths:
      - 'verification/ns-exact-tensor-commutator/**'
      - '.github/workflows/ns-exact-tensor-commutator-public-verify.yml'
  pull_request:
    branches: [main]
    paths:
      - 'verification/ns-exact-tensor-commutator/**'
      - '.github/workflows/ns-exact-tensor-commutator-public-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Record source hash and reject placeholders
        shell: bash
        run: |
          set -euo pipefail
          file=verification/ns-exact-tensor-commutator/NSExactTensorCommutatorFinite.lean
          sha256sum "$file" | tee verification/ns-exact-tensor-commutator/source-sha256.txt
          if grep -En '(^|[^[:alnum:]_])(sorry|admit|axiom|opaque|unsafe)([^[:alnum:]_]|$)' "$file"; then
            echo 'Forbidden Lean placeholder or custom trust declaration found.' >&2
            exit 1
          fi

      - name: Install pinned Lean, fetch pinned Mathlib, and compile
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.32.1
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version | tee verification/ns-exact-tensor-commutator/lean-version.txt
          lake --version | tee -a verification/ns-exact-tensor-commutator/lean-version.txt
          cd verification/ns-exact-tensor-commutator
          lake update
          lake exe cache get
          lake env lean NSExactTensorCommutatorFinite.lean > lean-output.log 2>&1
          cat lean-output.log
          if grep -Eq 'declaration uses .sorry.|sorryAx|admit|Lean.ofReduceBool' lean-output.log; then
            echo 'Forbidden dependency found in compiler report.' >&2
            exit 1
          fi
          echo 'VERIFIED finite NS frozen-direction commutator algebra.'

      - name: Upload compiler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ns-exact-tensor-commutator-finite-evidence
          path: |
            verification/ns-exact-tensor-commutator/source-sha256.txt
            verification/ns-exact-tensor-commutator/lean-version.txt
            verification/ns-exact-tensor-commutator/lean-output.log
          if-no-files-found: warn
