name: Lean
on:
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
      - name: Update, build, and replay target
        working-directory: formal/millennium_audit
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake build
          lake env lean SixLaneAudit/NSRealTriadExteriorFloor.lean
