name: B2 round54 Lean replay

on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/b2_round54/**'
      - '.github/workflows/b2-round54-lean.yml'
  push:
    branches:
      - b2-round54-replay-20260813

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Trust preflight
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path('verification/b2_round54/B2Round54RHPNP.lean')
          s = p.read_text()
          forbidden = re.compile(r'(^|[^A-Za-z0-9_])(sorry|admit|sorryAx|axiom|opaque|unsafe)([^A-Za-z0-9_]|$)')
          m = forbidden.search(s)
          if m: raise SystemExit(m.group(2))
          if 'native_decide' in s or 'Lean.ofReduceBool' in s: raise SystemExit('shortcut')
          if s.count('#print axioms') != 2: raise SystemExit('expected 2 axiom reports')
          PY
      - name: Install Lean and replay
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.32.1
          export PATH="$HOME/.elan/bin:$PATH"
          cd verification/b2_round54
          lake update
          lake exe cache get
          lake env lean B2Round54RHPNP.lean 2>&1 | tee lean-output.log
          if grep -Eq 'declaration uses .sorry.|sorryAx|admit' lean-output.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b2-round54-lean-evidence
          path: verification/b2_round54/lean-output.log
          if-no-files-found: warn
