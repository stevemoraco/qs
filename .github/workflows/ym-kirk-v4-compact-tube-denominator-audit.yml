name: YM Kirk v4 compact optical tube denominator audit

on:
  push:
    branches:
      - verification/ym-kirk-v4-compact-tube-denominator-audit-20260816-turn3-gpt56sol
    paths:
      - .github/workflows/ym-kirk-v4-compact-tube-denominator-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verification/ym-kirk-v4-compact-tube-denominator-audit-20260816-turn3-gpt56sol
      - name: Ensure pdftotext
        run: |
          if ! command -v pdftotext >/dev/null; then
            sudo apt-get update && sudo apt-get install -y poppler-utils
          fi
      - name: Pin immutable source
        run: python3 tools/probe_kirk_latest_source.py >/tmp/probe.json
      - name: Extract post-compact tube and denominator interfaces
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('latest.txt').read_text(encoding='utf-8',errors='replace')
          out=Path('source_audit/kirk_v4/compact_optical_tube_closure')
          out.mkdir(parents=True,exist_ok=True)
          targets=[
            ('lemma_6_22','Lemma 6.22'),('lemma_6_23','Lemma 6.23'),
            ('lemma_6_24','Lemma 6.24'),('lemma_6_26','Lemma 6.26'),
            ('lemma_6_30','Lemma 6.30'),('lemma_6_38','Lemma 6.38'),
            ('theorem_6_39','Theorem 6.39'),('lemma_6_41','Lemma 6.41'),
            ('theorem_6_43','Theorem 6.43')]
          for slug,target in targets:
            m=re.search(r'(?m)^\s*'+re.escape(target)+r'\b.*$',text)
            if m:
              (out/f'{slug}.txt').write_text(text[max(0,m.start()-5000):min(len(text),m.start()+26000)],encoding='utf-8')
          pats={
            'zero_free':r'zero[- ]free|away from zero|denominator',
            'holomorphic':r'holomorphic|holomorphy|Cauchy',
            'positive_denominator':r'positive denominator|positivity yields|positive lower bound',
            'optical_tube':r'optical.{0,80}tube|tube.{0,80}optical',
            'uniform_absolute':r'uniform(ly)? absolute|absolute convergence|converges absolutely',
            'etaH':r'ηH|eta_H',
          }
          summary=[]
          for name,pat in pats.items():
            ms=list(re.finditer(pat,text,re.I|re.S))
            summary.append(f'{name}\tcount={len(ms)}\toffsets={[m.start() for m in ms[:50]]}')
            chunks=[]
            for i,m in enumerate(ms[:20]):
              chunks.append(f'===== {name} {i+1}/{min(20,len(ms))} @ {m.start()} =====\n'+text[max(0,m.start()-4000):min(len(text),m.end()+6000)]+'\n')
            (out/f'{name}.txt').write_text('\n'.join(chunks),encoding='utf-8')
          (out/'COUNTS.txt').write_text('\n'.join(summary)+'\n',encoding='utf-8')
          (out/'QUESTION.txt').write_text(
            'Can the q=0 compact majorant be rerun uniformly on one smaller optical tube?\n'
            'Does the global multipivot normalization admit a regulator/depth-uniform zero-free smaller tube?\n'
            'Does uniform absolute family convergence on that tube follow from the same strict q_sp<1 recursion?\n'
            'Source extraction only; no mathematical verification.\n',encoding='utf-8')
          for p in ['kirk_latest_record.json','kirk_source_probe_report.json']:
            q=Path(p)
            if q.exists(): (out/p).write_bytes(q.read_bytes())
          print('\n'.join(summary))
          PY
      - name: Commit audit
        run: |
          git config user.name 'millennium-braid-source-audit'
          git config user.email 'actions@users.noreply.github.com'
          git add source_audit/kirk_v4/compact_optical_tube_closure
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audit(ym): extract compact optical tube closure interfaces'
          git push origin HEAD:verification/ym-kirk-v4-compact-tube-denominator-audit-20260816-turn3-gpt56sol
