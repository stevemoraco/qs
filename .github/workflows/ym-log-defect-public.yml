name: YM logarithmic defect public replay

on:
  push:
    branches: [agent/ym-log-defect-public-20260816]
    paths:
      - 'verification/ym-log-defect/LogDefectFirewall.lean'
      - '.github/workflows/ym-log-defect-public.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Source trust scan
        shell: bash
        run: |
          set -euo pipefail
          f=verification/ym-log-defect/LogDefectFirewall.lean
          if grep -En '(^|[^[:alnum:]_])(sorry|admit|sorryAx)([^[:alnum:]_]|$)' "$f"; then exit 1; fi
          if grep -En '^[[:space:]]*(axiom|opaque|unsafe)[[:space:]]' "$f"; then exit 1; fi
          git hash-object "$f"
          sha256sum "$f"

      - name: Install pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.31.0
          export PATH="$HOME/.elan/bin:$PATH"
          mkdir -p /tmp/ym-log-defect
          cd /tmp/ym-log-defect
          cat > lakefile.toml <<'EOF'
          name = "YMLogDefect"
          version = "0.1.0"
          defaultTargets = ["YMLogDefect"]

          [[require]]
          name = "mathlib"
          git = "https://github.com/leanprover-community/mathlib4.git"
          rev = "v4.31.0"

          [[lean_lib]]
          name = "YMLogDefect"
          EOF
          echo 'leanprover/lean4:v4.31.0' > lean-toolchain
          lake update
          lake exe cache get
          lean --version

      - name: Compile exact source and audit axioms
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cp verification/ym-log-defect/LogDefectFirewall.lean /tmp/ym-log-defect/LogDefectFirewall.lean
          cd /tmp/ym-log-defect
          lake env lean LogDefectFirewall.lean 2>&1 | tee lean-output.log
          if grep -Eq 'declaration uses .sorry.|sorryAx|admit|error:' lean-output.log; then exit 1; fi
          python3 - <<'PY'
          import pathlib,re
          text=pathlib.Path('lean-output.log').read_text()
          allowed={'propext','Classical.choice','Quot.sound'}
          reports=re.findall(r"'([^']+)' depends on axioms:\s*\[(.*?)\]",text,re.S)
          reports += [(x,'') for x in re.findall(r"'([^']+)' does not depend on any axioms",text)]
          if len(reports) < 2:
              raise SystemExit(f'expected >=2 axiom reports, found {len(reports)}')
          for th,payload in reports:
              deps={x.strip() for x in payload.split(',') if x.strip()}
              extra=deps-allowed
              if extra: raise SystemExit(f'{th}: nonfoundation {sorted(extra)}')
          print('VERIFIED',len(reports),'axiom reports')
          PY
