name: RH Arithmetic Grid Cauchy Finite Core

on:
  push:
    branches:
      - research/rh-arithmetic-grid-cauchy-public-verifier-20260812
    paths:
      - 'verification/rh-arithmetic-grid-cauchy/**'
      - '.github/workflows/rh-arithmetic-grid-cauchy-public-verify.yml'
  pull_request:
    branches: [main]
    paths:
      - 'verification/rh-arithmetic-grid-cauchy/**'
      - '.github/workflows/rh-arithmetic-grid-cauchy-public-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Record source hashes and reject Lean placeholders
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            verification/rh-arithmetic-grid-cauchy/RHArithmeticGridFinite.lean \
            verification/rh-arithmetic-grid-cauchy/verify_arithmetic_grid_spectrum.py \
            | tee verification/rh-arithmetic-grid-cauchy/source-sha256.txt
          file=verification/rh-arithmetic-grid-cauchy/RHArithmeticGridFinite.lean
          if grep -En '(^|[^[:alnum:]_])(sorry|admit|axiom|opaque|unsafe)([^[:alnum:]_]|$)' "$file"; then
            echo 'Forbidden Lean placeholder or custom trust declaration found.' >&2
            exit 1
          fi

      - name: Replay finite spectral falsifier
        shell: bash
        run: |
          set -euo pipefail
          python3 --version | tee verification/rh-arithmetic-grid-cauchy/python-version.txt
          python3 -m pip install --disable-pip-version-check --no-input 'numpy==2.3.2'
          python3 verification/rh-arithmetic-grid-cauchy/verify_arithmetic_grid_spectrum.py \
            --sizes 8,24,64,128 \
            --ratios 0.05,0.1,0.2,0.5 \
            --eta 0.02 \
            --trials 40 \
            --seed 260812 \
            | tee verification/rh-arithmetic-grid-cauchy/spectral-replay.json
          test "$(grep -c '"'"'verified'"'"': true' verification/rh-arithmetic-grid-cauchy/spectral-replay.json)" -eq 16

      - name: Install pinned Lean, fetch pinned Mathlib, and compile
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.32.1
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version | tee verification/rh-arithmetic-grid-cauchy/lean-version.txt
          lake --version | tee -a verification/rh-arithmetic-grid-cauchy/lean-version.txt
          cd verification/rh-arithmetic-grid-cauchy
          lake update
          lake exe cache get
          lake env lean RHArithmeticGridFinite.lean > lean-output.log 2>&1
          cat lean-output.log
          if grep -Eq 'declaration uses .sorry.|sorryAx|admit|Lean.ofReduceBool' lean-output.log; then
            echo 'Forbidden dependency found in compiler report.' >&2
            exit 1
          fi
          echo 'VERIFIED finite RH arithmetic-grid firewalls and spectral replay.'

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rh-arithmetic-grid-cauchy-finite-evidence
          path: |
            verification/rh-arithmetic-grid-cauchy/source-sha256.txt
            verification/rh-arithmetic-grid-cauchy/python-version.txt
            verification/rh-arithmetic-grid-cauchy/spectral-replay.json
            verification/rh-arithmetic-grid-cauchy/lean-version.txt
            verification/rh-arithmetic-grid-cauchy/lean-output.log
          if-no-files-found: warn
