name: YM Kirk v4 reference kernel structure

on:
  push:
    branches:
      - verification/ym-kirk-v4-reference-path-geometry-20260814-gpt56sol
    paths:
      - .github/workflows/ym-kirk-v4-reference-kernel-structure.yml

permissions:
  contents: write

jobs:
  source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verification/ym-kirk-v4-reference-path-geometry-20260814-gpt56sol
      - name: Ensure pdftotext
        run: |
          if ! command -v pdftotext >/dev/null; then sudo apt-get update && sudo apt-get install -y poppler-utils; fi
      - name: Extract exact reference-kernel contexts
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, json, time
          from pathlib import Path
          UA='ym-reference-kernel-audit/1.0'
          def get(url):
              last=None
              for i in range(7):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'*/*'})
                      with urllib.request.urlopen(req,timeout=60) as r: return r.read()
                  except (urllib.error.HTTPError,urllib.error.URLError) as e:
                      last=e
                      if isinstance(e,urllib.error.HTTPError) and e.code not in (429,500,502,503,504): raise
                      time.sleep(min(2**i,32))
              raise last
          raw=get('https://zenodo.org/api/records/21765806'); rec=json.loads(raw)
          if rec.get('links',{}).get('latest'): rec=json.loads(get(rec['links']['latest']))
          pdfs=[f for f in rec.get('files',[]) if str(f.get('key','')).lower().endswith('.pdf')]
          url=pdfs[0].get('links',{}).get('content') or pdfs[0].get('links',{}).get('self')
          Path('/tmp/kirk.pdf').write_bytes(get(url))
          PY
          pdftotext -layout /tmp/kirk.pdf /tmp/kirk.txt
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('/tmp/kirk.txt').read_text(encoding='utf-8',errors='replace'); low=text.lower()
          out=Path('source_audit/kirk_v4/reference_path_geometry/kernel_structure'); out.mkdir(parents=True,exist_ok=True)
          phrases=['exponential matrix algebra','DAS2','two-jet','two jet','quadratic reference','optical precision','Qtempl','finite-template incidence','matrix kernel','precision kernel','bilocal','two-point','two point','pair support','endpoint pair']
          summary=[]
          for phrase in phrases:
              hits=[]; pos=0
              while True:
                  i=low.find(phrase.lower(),pos)
                  if i<0: break
                  hits.append(i); pos=i+max(1,len(phrase))
              summary.append(f'{phrase}: {len(hits)}')
              for j,i in enumerate(hits[:20],1):
                  (out/f'{re.sub(r"[^a-z0-9]+","_",phrase.lower()).strip("_")}_{j}.txt').write_text(text[max(0,i-5000):min(len(text),i+12000)],encoding='utf-8')
          (out/'SUMMARY.txt').write_text('\n'.join(summary)+'\n',encoding='utf-8')
          print('\n'.join(summary))
          PY
      - name: Commit contexts
        run: |
          git config user.name 'millennium-braid-source-audit'
          git config user.email 'actions@users.noreply.github.com'
          git add source_audit/kirk_v4/reference_path_geometry/kernel_structure
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audit(ym): expose reference kernel structure contexts'
          git push origin HEAD:verification/ym-kirk-v4-reference-path-geometry-20260814-gpt56sol
      - uses: actions/upload-artifact@v4
        with:
          name: kirk-v4-reference-kernel-structure
          if-no-files-found: error
          retention-days: 30
          path: source_audit/kirk_v4/reference_path_geometry/kernel_structure/
