name: NS Six-Color High-High Isolation Finite Core

on:
  push:
    branches: [agent/ns-six-color-highhigh-isolation-verifier-20260813]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ns-six-color-highhigh-isolation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Reject explicit placeholders and custom result axioms
        shell: bash
        run: |
          set -euo pipefail
          file=verification/ns-six-color-highhigh-isolation/SixColorHighHighIsolationFinite.lean
          if grep -En '(^|[^[:alnum:]_])(sorry|admit|axiom|opaque|unsafe|native_decide)([^[:alnum:]_]|$)|Lean\.ofReduceBool' "$file"; then
            echo 'Forbidden proof placeholder or trust shortcut found.' >&2
            exit 1
          fi
      - name: Install pinned Lean, fetch pinned Mathlib cache, and compile
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.32.1
          export PATH="$HOME/.elan/bin:$PATH"
          cd verification/ns-six-color-highhigh-isolation
          lake update
          lake exe cache get
          lake env lean SixColorHighHighIsolationFinite.lean 2>&1 | tee lean-output.log
          if grep -Eq 'declaration uses .sorry.|sorryAx|admit|Lean\.ofReduceBool' lean-output.log; then
            echo 'Forbidden placeholder axiom found in compiler output.' >&2
            exit 1
          fi
          echo 'VERIFIED finite six-color high-high isolation core.'
      - name: Upload compiler evidence
        uses: actions/upload-artifact@v4
        with:
          name: ns-six-color-highhigh-isolation-lean-evidence
          path: verification/ns-six-color-highhigh-isolation/lean-output.log
