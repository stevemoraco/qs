name: NS stationarity firewall replay

on:
  push:
    branches:
      - agent/ns-stationarity-firewall-replay-20260813
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject proof holes / trust escapes
        run: |
          set -euo pipefail
          if grep -nE '\b(sorry|admit|sorryAx|axiom|unsafe|native_decide)\b' verification/NSStationarityFirewall.lean; then exit 1; fi
      - name: Install Lean + Mathlib
        uses: leanprover/lean-action@v1
        with:
          use-github-cache: true
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
      - name: Kernel replay
        run: |
          set -euo pipefail
          lake env lean verification/NSStationarityFirewall.lean | tee ns-stationarity.log
          if grep -Eq 'sorryAx|declaration uses .sorry.' ns-stationarity.log; then exit 1; fi
