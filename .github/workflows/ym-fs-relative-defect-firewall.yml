name: YM Faizal-Shabir hard-audit firewalls

on:
  push:
    branches:
      - verification/ym-fs-relative-defect-firewall-20260817
    paths:
      - verification/ym-fs-relative-defect-firewall/*.lean
      - .github/workflows/ym-fs-relative-defect-firewall.yml
  pull_request:
    paths:
      - verification/ym-fs-relative-defect-firewall/*.lean
      - .github/workflows/ym-fs-relative-defect-firewall.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verification/ym-fs-relative-defect-firewall-20260817
      - name: Verify flattened Lean theorem sources
        shell: bash
        run: |
          set -euo pipefail
          OUT=verification/ym-fs-relative-defect-firewall/axle-receipts
          mkdir -p "$OUT"
          if grep -nE '\b(sorry|admit|sorryAx|axiom|opaque|unsafe|native_decide|Lean\.ofReduceBool)\b' verification/ym-fs-relative-defect-firewall/*.lean; then exit 1; fi
          python3 - <<'PY'
          import hashlib, json, pathlib, urllib.request

          srcdir = pathlib.Path('verification/ym-fs-relative-defect-firewall')
          outdir = srcdir / 'axle-receipts'
          failures = []
          summaries = []
          for path in sorted(srcdir.glob('*.lean')):
              source = path.read_text()
              payload = json.dumps({
                  'content': source,
                  'environment': 'lean-4.30.0',
                  'ignore_imports': True,
                  'mathlib_options': False,
                  'timeout_seconds': 900,
              }).encode()
              req = urllib.request.Request(
                  'https://axle.axiommath.ai/api/v1/check',
                  data=payload,
                  headers={'Content-Type': 'application/json'},
                  method='POST',
              )
              with urllib.request.urlopen(req, timeout=960) as response:
                  result = json.load(response)
              receipt = {
                  'source_path': str(path),
                  'source_sha256': hashlib.sha256(source.encode()).hexdigest(),
                  'axle_environment': 'lean-4.30.0',
                  'axle_result': result,
              }
              (outdir / (path.stem + '.json')).write_text(json.dumps(receipt, indent=2))
              lean = result.get('lean_messages', {})
              tool = result.get('tool_messages', {})
              bad = (
                  not result.get('okay')
                  or bool(result.get('failed_declarations', []))
                  or bool(lean.get('errors', []))
                  or bool(lean.get('warnings', []))
                  or bool(tool.get('errors', []))
                  or bool(tool.get('warnings', []))
                  or 'sorryAx' in json.dumps(result)
              )
              summaries.append({'source': str(path), 'bad': bad})
              if bad:
                  failures.append(str(path))
          (outdir / 'VERDICT.json').write_text(json.dumps({'summaries': summaries, 'failures': failures}, indent=2))
          PY
      - name: Preserve AXLE diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ym-hard-audit-verifier'
          git config user.email 'actions@users.noreply.github.com'
          git add verification/ym-fs-relative-defect-firewall/axle-receipts || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'verify(ym): preserve hard-audit AXLE receipts'
          git push origin HEAD:verification/ym-fs-relative-defect-firewall-20260817
      - name: Enforce clean verdict
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path('verification/ym-fs-relative-defect-firewall/axle-receipts/VERDICT.json')
          data = json.loads(p.read_text())
          if data.get('failures'):
              raise SystemExit('failed sources: ' + ', '.join(data['failures']))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ym-fs-hard-audit-axle-receipts
          if-no-files-found: warn
          retention-days: 30
          path: verification/ym-fs-relative-defect-firewall/axle-receipts/
