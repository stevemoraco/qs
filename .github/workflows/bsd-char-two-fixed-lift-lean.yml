name: BSD Characteristic-Two Fixed-Lift Lean

on:
  push:
    branches:
      - agent/bsd-char-two-fixed-lift-lean-20260813
  pull_request:
    paths:
      - verification/bsd-char-two-fixed-lift/**
      - .github/workflows/bsd-char-two-fixed-lift-lean.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Reject placeholders and custom trust escapes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path('verification/bsd-char-two-fixed-lift/BSDCharTwoFixedLift.lean')
          text = p.read_text()
          text = re.sub(r'/-.*?-/', '', text, flags=re.S)
          text = re.sub(r'--.*$', '', text, flags=re.M)
          patterns = [
              r'^\s*(sorry|admit)\b',
              r'^\s*axiom\b',
              r'^\s*opaque\b',
              r'^\s*unsafe\b',
              r'\bnative_decide\b',
          ]
          for pattern in patterns:
              m = re.search(pattern, text, flags=re.M)
              if m:
                  raise SystemExit(f'forbidden declaration: {m.group(0)!r}')
          PY

      - name: Install pinned Lean and compile
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.32.1
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version
          lake --version
          cd verification/bsd-char-two-fixed-lift
          lake update
          lake exe cache get
          lake env lean BSDCharTwoFixedLift.lean 2>&1 | tee lean-output.log
          if grep -Eq 'declaration uses .sorry.|sorryAx|admit|Lean.ofReduceBool' lean-output.log; then
            echo 'Forbidden trust escape found in compiler output.' >&2
            exit 1
          fi
          echo 'VERIFIED finite characteristic-two fixed-lift firewall.'

      - name: Upload compiler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bsd-char-two-fixed-lift-lean-evidence
          path: verification/bsd-char-two-fixed-lift/lean-output.log
          if-no-files-found: warn
