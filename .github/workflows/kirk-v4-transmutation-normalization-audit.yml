name: Kirk v4 transmutation normalization audit

on:
  pull_request:
    paths:
      - .github/workflows/kirk-v4-transmutation-normalization-audit.yml
      - tools/probe_kirk_latest_source.py

permissions:
  contents: read

jobs:
  transmutation-normalization:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Ensure pdftotext
        run: |
          if ! command -v pdftotext >/dev/null; then
            sudo apt-get update && sudo apt-get install -y poppler-utils
          fi
      - name: Pin and extract immutable v4 source
        run: python3 tools/probe_kirk_latest_source.py >/tmp/probe.json
      - name: Audit transmutation normalization terms
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('latest.txt').read_text(encoding='utf-8', errors='replace')
          terms = [
            r'two[- ]loop', r'β\s*1', r'\bb1\b', r'b_1', r'beta function',
            r'Callan[- ]Symanzik', r'MSbar', r'\\overline\{MS\}', r'scheme',
            r'Lambda.?YM', r'Λ.?YM', r'renormalization[- ]group invariant',
            r'RG[- ]invariant', r'canonical scale', r'dimensional transmutation',
            r'asymptotic scaling', r'log\s*log', r'O\s*\(\s*log',
            r'matching length', r'first[- ]crossing', r'u\(2L\)',
          ]
          out=[]
          for pat in terms:
            rx=re.compile(pat,re.I)
            hits=list(rx.finditer(text))
            out.append(f'### PATTERN {pat} COUNT {len(hits)}')
            for n,m in enumerate(hits[:20],1):
              s=' '.join(text[max(0,m.start()-1800):min(len(text),m.end()+4200)].split())
              out.append(f'--- hit {n} ---\n{s}')
          # Also report every nearby line containing the one-loop coefficient and the exact shooting formula.
          for literal in ['11 CA', '24π', 'b⋆', 'Equation (41)', '(41)', '1/u0', 'log 2']:
            low=text.lower(); target=literal.lower(); start=0; count=0
            out.append(f'### LITERAL {literal}')
            while count < 20:
              i=low.find(target,start)
              if i<0: break
              s=' '.join(text[max(0,i-1600):min(len(text),i+3800)].split())
              out.append(f'--- hit {count+1} ---\n{s}')
              start=i+len(target); count+=1
          report='\n\n'.join(out)
          Path('kirk_v4_transmutation_normalization_audit.txt').write_text(report,encoding='utf-8')
          print(report)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kirk-v4-transmutation-normalization-audit
          if-no-files-found: error
          retention-days: 30
          path: |
            kirk_latest_record.json
            kirk_source_probe_report.json
            kirk_v4_transmutation_normalization_audit.txt
