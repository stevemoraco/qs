name: Verify BSD E34 p7 PARI

on:
  pull_request:
    paths:
      - 'verification/bsd-e34-p7-pari/**'
      - '.github/workflows/verify-bsd-e34-p7-pari.yml'
  workflow_dispatch:

jobs:
  f1:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - name: Environment
        run: |
          uname -a
          free -h
          df -h
      - name: Install PARI/GP
        run: |
          sudo apt-get update
          sudo apt-get install -y pari-gp
          gp -f -q <<<'print(version());'
      - name: Certify F1
        run: |
          set -o pipefail
          gp -f -q < verification/bsd-e34-p7-pari/e34_p7_f1.gp | tee verification/bsd-e34-p7-pari/F1_OUTPUT.txt
      - name: Upload F1 receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bsd-e34-p7-f1-receipt
          path: verification/bsd-e34-p7-pari/F1_OUTPUT.txt
          if-no-files-found: warn

  l:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - name: Environment
        run: |
          uname -a
          free -h
          df -h
      - name: Install PARI/GP
        run: |
          sudo apt-get update
          sudo apt-get install -y pari-gp
          gp -f -q <<<'print(version());'
      - name: Certify L
        run: |
          set -o pipefail
          gp -f -q < verification/bsd-e34-p7-pari/e34_p7_l.gp | tee verification/bsd-e34-p7-pari/L_OUTPUT.txt
      - name: Upload L receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bsd-e34-p7-l-receipt
          path: verification/bsd-e34-p7-pari/L_OUTPUT.txt
          if-no-files-found: warn
