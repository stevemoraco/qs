name: YM RG quartic perturbation firewall

on:
  push:
    branches:
      - verification/ym-rg-quartic-perturbation-20260814-gpt56
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Assemble exact mirrored theorem sources
        shell: bash
        run: |
          set -euo pipefail
          cp verification/ym-rg-quartic-perturbation/RGCubicLocalResidual.lean /tmp/RGCubicLocalResidual.lean
          cp verification/ym-rg-quartic-perturbation/RGQuarticPerturbation.lean /tmp/RGQuarticPerturbation.lean
          grep -v '^import Millennium.YangMills.RGCubicLocalResidual$' /tmp/RGQuarticPerturbation.lean > /tmp/RGQuarticPerturbation.body
          cat /tmp/RGCubicLocalResidual.lean /tmp/RGQuarticPerturbation.body > /tmp/Combined.lean
          for SRC in /tmp/RGCubicLocalResidual.lean /tmp/RGQuarticPerturbation.lean /tmp/Combined.lean; do
            if grep -nE '\b(sorry|admit|sorryAx|axiom|opaque|unsafe|native_decide|Lean\.ofReduceBool)\b' "$SRC"; then exit 1; fi
          done
          sha256sum /tmp/RGCubicLocalResidual.lean /tmp/RGQuarticPerturbation.lean /tmp/Combined.lean
      - name: AXLE Lean 4.30 replay
        shell: bash
        run: |
          set -euo pipefail
          SRC=/tmp/Combined.lean python3 - <<'PY'
          import json, os, pathlib, urllib.request
          path = pathlib.Path(os.environ['SRC'])
          source = path.read_text()
          payload = json.dumps({
              'content': source,
              'environment': 'lean-4.30.0',
              'ignore_imports': True,
              'mathlib_options': False,
              'timeout_seconds': 900,
          }).encode()
          req = urllib.request.Request(
              'https://axle.axiommath.ai/api/v1/check', data=payload,
              headers={'Content-Type':'application/json'}, method='POST')
          with urllib.request.urlopen(req, timeout=960) as response:
              result = json.load(response)
          print(json.dumps(result, indent=2))
          assert result.get('okay')
          assert not result.get('failed_declarations', [])
          lean = result.get('lean_messages', {})
          tool = result.get('tool_messages', {})
          assert not lean.get('errors', []) and not lean.get('warnings', [])
          assert not tool.get('errors', []) and not tool.get('warnings', [])
          assert 'sorryAx' not in json.dumps(result)
          PY
