name: B4 Run31 hostile-audit Lean replay

on:
  push:
    branches: [agent/b4-run31-hostile-audit-replay-20260813]
    paths:
      - 'verification/b4-run31-hostile-audit-replay/**'
      - '.github/workflows/b4-run31-hostile-audit-replay.yml'
  pull_request:
    branches: [main]
    paths:
      - 'verification/b4-run31-hostile-audit-replay/**'
      - '.github/workflows/b4-run31-hostile-audit-replay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Materialize and audit the exact seven sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, re, shutil

          root = Path('verification/b4-run31-hostile-audit-replay')
          out = root / 'materialized'
          evidence = root / 'evidence'
          out.mkdir(parents=True, exist_ok=True)
          evidence.mkdir(parents=True, exist_ok=True)

          direct = [
              'BSDAgyemangCoefficientSpecialization.lean',
              'HodgeLocalAtiyahFerrand.lean',
              'PNPVegaForcedCutFalsifier.lean',
              'RHWuFloorFiberFalsifier.lean',
              'YMLiuHarmonicTail.lean',
          ]
          for name in direct:
              shutil.copyfile(root / name, out / name)

          (out / 'NSSourceAmplitudeNoUniformBound.lean').write_bytes(
              base64.b64decode((root / 'NSSourceAmplitudeNoUniformBound.lean.b64').read_text().strip())
          )
          (out / 'RHWuSubsequenceFalsifier.lean').write_bytes(
              bytes.fromhex((root / 'source6.hex').read_text().strip())
          )

          expected = {
              'BSDAgyemangCoefficientSpecialization.lean': 'e90b69d17de9b16f447c89bf469997d6e3182c5f098e2af4141104de9fde412e',
              'HodgeLocalAtiyahFerrand.lean': '6a16f25593ae8eab9421d3b99cf9e45406e1f647afee079fa48f31798d7dc594',
              'NSSourceAmplitudeNoUniformBound.lean': '531bd5503048549da7e7f93451251a1d9884f1367433bd8e00fd67ca196bf275',
              'PNPVegaForcedCutFalsifier.lean': '4109421bf3b3e4fa81b60c4fd06a964e4cbbc80ed9250fd414d119776259fdae',
              'RHWuFloorFiberFalsifier.lean': 'a71ca3db5d5121207a84a947fc11a0b5c17d012a9626c2f971550f6086d39131',
              'RHWuSubsequenceFalsifier.lean': 'f12621b3532ba257430cae713bca6c1817c08edf3c4adba659bcd6ba58b98704',
              'YMLiuHarmonicTail.lean': '5de6d138ae046fb7bc0e1229faaecd9c835efdada2af4e120f4e144c2ac5c082',
          }
          forbidden = re.compile(
              r'(?<![A-Za-z0-9_])(sorry|admit|sorryAx|axiom|opaque|unsafe|native_decide)(?![A-Za-z0-9_])|Lean\.ofReduceBool'
          )
          theorem_total = 0
          axiom_print_total = 0
          manifest = []
          for name, digest in expected.items():
              path = out / name
              raw = path.read_bytes()
              got = hashlib.sha256(raw).hexdigest()
              assert got == digest, (name, got, digest)
              text = raw.decode('utf-8')
              bad = forbidden.search(text)
              assert bad is None, (name, bad.group(0) if bad else None)
              theorems = len(re.findall(r'(?m)^theorem\s+', text))
              prints = text.count('#print axioms')
              theorem_total += theorems
              axiom_print_total += prints
              manifest.append({'name': name, 'sha256': got, 'theorems': theorems, 'axiom_prints': prints})
          assert theorem_total == 26, theorem_total
          assert axiom_print_total == 26, axiom_print_total
          (evidence / 'source-manifest.json').write_text(json.dumps(manifest, indent=2, sort_keys=True))
          print(json.dumps({'sources': 7, 'theorems': theorem_total, 'axiom_prints': axiom_print_total}, indent=2))
          PY

      - name: Fresh AXLE Lean kernel replay
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, urllib.request

          root = Path('verification/b4-run31-hostile-audit-replay')
          sources = root / 'materialized'
          evidence = root / 'evidence'
          summary = []
          for source in sorted(sources.glob('*.lean')):
              payload = json.dumps({
                  'content': source.read_text(),
                  'environment': 'lean-4.30.0',
                  'ignore_imports': True,
                  'mathlib_options': False,
                  'timeout_seconds': 900,
              }).encode()
              request = urllib.request.Request(
                  'https://axle.axiommath.ai/api/v1/check',
                  data=payload,
                  headers={'Content-Type': 'application/json'},
                  method='POST',
              )
              with urllib.request.urlopen(request, timeout=960) as response:
                  result = json.load(response)
              (evidence / f'{source.stem}.axle.json').write_text(
                  json.dumps(result, indent=2, sort_keys=True)
              )
              assert result.get('okay') is True, (source.name, result)
              assert result.get('failed_declarations', []) == [], source.name
              lean = result.get('lean_messages', {})
              tool = result.get('tool_messages', {})
              assert lean.get('errors', []) == [], (source.name, lean.get('errors'))
              assert lean.get('warnings', []) == [], (source.name, lean.get('warnings'))
              assert tool.get('errors', []) == [], (source.name, tool.get('errors'))
              assert tool.get('warnings', []) == [], (source.name, tool.get('warnings'))
              encoded = json.dumps(result)
              assert 'sorryAx' not in encoded
              assert 'Lean.ofReduceBool' not in encoded
              summary.append({'source': source.name, 'okay': True})
              print(f'VERIFIED {source.name}')
          assert len(summary) == 7
          (evidence / 'replay-summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Preserve replay metadata
        if: always()
        shell: bash
        run: |
          mkdir -p verification/b4-run31-hostile-audit-replay/evidence
          printf 'github_sha=%s\nrun_id=%s\nrun_attempt=%s\nrunner=%s\nenvironment=lean-4.30.0\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$RUNNER_NAME" \
            > verification/b4-run31-hostile-audit-replay/evidence/replay-metadata.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b4-run31-hostile-audit-lean-evidence
          path: verification/b4-run31-hostile-audit-replay/evidence/
          if-no-files-found: error
