name: BSD C282 Selmer-corank public replay

on:
  workflow_dispatch:
  push:
    branches:
      - agent/bsd-c282-selmer-corank-public-replay-20260820
    paths:
      - "verification/bsd-c282-selmer-corank/SelmerCorankTwoFirewall.lean"
      - ".github/workflows/bsd-c282-selmer-corank-public.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Source trust scan
        shell: bash
        run: |
          set -euo pipefail
          f=verification/bsd-c282-selmer-corank/SelmerCorankTwoFirewall.lean
          if grep -En '(^|[^[:alnum:]_])(sorry|admit|sorryAx)([^[:alnum:]_]|$)' "$f"; then exit 1; fi
          if grep -En '^[[:space:]]*(axiom|opaque|unsafe)[[:space:]]' "$f"; then exit 1; fi
          git hash-object "$f"
          sha256sum "$f"

      - name: Install pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.31.0
          export PATH="$HOME/.elan/bin:$PATH"
          mkdir -p /tmp/bsd-c282
          cd /tmp/bsd-c282
          cat > lakefile.toml <<'EOF'
          name = "BSDC282"
          version = "0.1.0"
          defaultTargets = ["BSDC282"]

          [[require]]
          name = "mathlib"
          git = "https://github.com/leanprover-community/mathlib4.git"
          rev = "v4.31.0"

          [[lean_lib]]
          name = "BSDC282"
          EOF
          echo 'leanprover/lean4:v4.31.0' > lean-toolchain
          lake update
          lake exe cache get
          lean --version

      - name: Compile exact source and audit axioms
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cp verification/bsd-c282-selmer-corank/SelmerCorankTwoFirewall.lean /tmp/bsd-c282/SelmerCorankTwoFirewall.lean
          cd /tmp/bsd-c282
          lake env lean SelmerCorankTwoFirewall.lean 2>&1 | tee lean-output.log
          if grep -Eq 'declaration uses .sorry.|sorryAx|admit|error:' lean-output.log; then exit 1; fi
          python3 - <<'PY'
          import re, pathlib
          text=pathlib.Path('lean-output.log').read_text()
          allowed={'propext','Classical.choice','Quot.sound'}
          reports=re.findall(r"'([^']+)' depends on axioms:\s*\[(.*?)\]",text,re.S)
          reports += [(x,'') for x in re.findall(r"'([^']+)' does not depend on any axioms",text)]
          if len(reports) < 3:
              raise SystemExit(f'expected >=3 axiom reports, found {len(reports)}')
          for th,payload in reports:
              deps={x.strip() for x in payload.split(',') if x.strip()}
              extra=deps-allowed
              if extra: raise SystemExit(f'{th}: nonfoundation {sorted(extra)}')
          print('VERIFIED',len(reports),'axiom reports')
          PY
