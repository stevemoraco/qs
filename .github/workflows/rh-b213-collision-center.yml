name: RH B213 collision-centre finite verification

on:
  push:
    branches:
      - verification/rh-b213-collision-center-complete-20260816-gpt56sol
    paths:
      - '.github/workflows/rh-b213-collision-center.yml'
      - 'verification/rh-b213-collision-center/*.lean'
  pull_request:
    paths:
      - '.github/workflows/rh-b213-collision-center.yml'
      - 'verification/rh-b213-collision-center/*.lean'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify flattened Lean theorem source
        shell: bash
        run: |
          set -euo pipefail
          SRC=verification/rh-b213-collision-center/RHB213CollisionCenterFinite.lean
          if grep -nE '\b(sorry|admit|sorryAx|axiom|opaque|unsafe|native_decide|Lean\.ofReduceBool)\b' "$SRC"; then exit 1; fi
          SRC="$SRC" python3 - <<'PY'
          import json, os, pathlib, urllib.request
          path=pathlib.Path(os.environ['SRC'])
          payload=json.dumps({
            'content':path.read_text(),
            'environment':'lean-4.30.0',
            'ignore_imports':True,
            'mathlib_options':False,
            'timeout_seconds':900,
          }).encode()
          req=urllib.request.Request(
            'https://axle.axiommath.ai/api/v1/check',
            data=payload,
            headers={'Content-Type':'application/json'},
            method='POST')
          with urllib.request.urlopen(req,timeout=960) as response:
            result=json.load(response)
          print(json.dumps(result,indent=2))
          lean=result.get('lean_messages',{})
          tool=result.get('tool_messages',{})
          bad=(not result.get('okay')
               or bool(result.get('failed_declarations',[]))
               or bool(lean.get('errors',[]))
               or bool(lean.get('warnings',[]))
               or bool(tool.get('errors',[]))
               or bool(tool.get('warnings',[]))
               or 'sorryAx' in json.dumps(result))
          if bad:
            raise SystemExit(1)
          PY
