name: Verify OpenAI Navier-Stokes endpoint

on:
  push:
    branches: [verify-openai-navier-stokes-20260908]
  workflow_dispatch:

jobs:
  endpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Clone exact release
        run: |
          git clone --filter=blob:none https://github.com/openai/NavierStokesAndEuler.git proof
          cd proof
          git checkout 8937a8f4cbc7abaab5e9e97d1cc7f5d2319d9538
          test "$(git rev-parse HEAD)" = "8937a8f4cbc7abaab5e9e97d1cc7f5d2319d9538"

      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Custom axiom declaration scan
        run: |
          cd proof
          if grep -RInE '^[[:space:]]*axiom[[:space:]]' NavierStokes ComparatorChallenges --include='*.lean'; then
            echo 'custom axiom declaration found' >&2
            exit 1
          fi

      - name: Fetch cache
        run: |
          cd proof
          lake exe cache get

      - name: Build exact endpoint module and dependencies
        run: |
          cd proof
          set -o pipefail
          lake build NavierStokes.ComparatorSolution | tee ../endpoint_build.txt

      - name: Audit endpoint axioms
        run: |
          cd proof
          printf '%s\n' \
            'import NavierStokes.ComparatorSolution' \
            '#print axioms NavierStokes.Comparator.navier_stokes_breakdown_R3' \
            '#print axioms NavierStokes.Comparator.navier_stokes_breakdown_periodic' > EndpointAudit.lean
          set -o pipefail
          lake env lean EndpointAudit.lean | tee ../endpoint_axioms.txt
          if grep -E 'sorryAx|native_decide|Lean\.ofReduceBool' ../endpoint_axioms.txt; then
            echo 'forbidden endpoint axiom found' >&2
            exit 1
          fi
          echo ENDPOINT_AXIOM_TEXT_AUDIT_PASS

      - name: Comparator endpoint replay
        run: |
          cd proof
          set -o pipefail
          lake exe comparator ComparatorChallenges/NavierStokes.json | tee ../comparator.txt

      - name: Receipt
        run: |
          cd proof
          MATHLIB_REV=$(jq -r '.packages[] | select(.name=="mathlib") | .rev' lake-manifest.json)
          COMPARATOR_REV=$(jq -r '.packages[] | select(.name=="Comparator") | .rev' lake-manifest.json)
          printf 'verified_commit=%s\nlean_toolchain=%s\nmathlib_rev=%s\ncomparator_rev=%s\n' \
            "$(git rev-parse HEAD)" "$(cat lean-toolchain)" "$MATHLIB_REV" "$COMPARATOR_REV" \
            | tee ../receipt.txt

      - uses: actions/upload-artifact@v4
        with:
          name: openai-navier-stokes-endpoint-receipt
          path: |
            endpoint_build.txt
            endpoint_axioms.txt
            comparator.txt
            receipt.txt
