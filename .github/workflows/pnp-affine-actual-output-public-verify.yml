name: PNP Affine Actual Output Public Verifier

on:
  push:
    branches:
      - agent/pnp-affine-actual-output-public-verifier-20260812
    paths:
      - 'verification/pnp-affine-actual-output-public/**'
      - '.github/workflows/pnp-affine-actual-output-public-verify.yml'
  pull_request:
    branches: [main]
    paths:
      - 'verification/pnp-affine-actual-output-public/**'
      - '.github/workflows/pnp-affine-actual-output-public-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Verify exact private-source blob and reject trust escapes
        shell: bash
        run: |
          set -euo pipefail
          dir='verification/pnp-affine-actual-output-public'
          file="$dir/PNPAffineActualOutputFinite.lean"
          actual_blob="$(git hash-object "$file")"
          expected_blob='87b600768f3b58e41db80a01936bc64de34a06be'
          test "$actual_blob" = "$expected_blob"
          printf 'private_source_blob=%s\n' "$actual_blob" | tee "$dir/source-blob.txt"
          sha256sum "$file" | tee "$dir/source-sha256.txt"
          if grep -En '(^|[^[:alnum:]_])(sorry|admit|sorryAx)([^[:alnum:]_]|$)' "$file"; then
            echo 'Forbidden proof placeholder found.' >&2
            exit 1
          fi
          if grep -En '^[[:space:]]*(axiom|opaque|unsafe)[[:space:]]' "$file"; then
            echo 'Forbidden custom trust declaration found.' >&2
            exit 1
          fi

      - name: Install pinned Lean, fetch pinned Mathlib, and compile
        shell: bash
        run: |
          set -euo pipefail
          dir='verification/pnp-affine-actual-output-public'
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.32.1
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version | tee "$dir/lean-version.txt"
          lake --version | tee -a "$dir/lean-version.txt"
          cd "$dir"
          lake update
          lake exe cache get
          lake env lean PNPAffineActualOutputFinite.lean > lean-output.log 2>&1
          cat lean-output.log
          if grep -Eq 'declaration uses .sorry.|sorryAx|admit|Lean.ofReduceBool' lean-output.log; then
            echo 'Forbidden dependency found in compiler report.' >&2
            exit 1
          fi
          echo 'VERIFIED exact PNP affine actual-output finite core.'

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pnp-affine-actual-output-public-evidence
          path: |
            verification/pnp-affine-actual-output-public/source-blob.txt
            verification/pnp-affine-actual-output-public/source-sha256.txt
            verification/pnp-affine-actual-output-public/lean-version.txt
            verification/pnp-affine-actual-output-public/lean-output.log
          if-no-files-found: warn
