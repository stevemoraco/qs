name: Kirk Yang-Mills v4 exact-source audit

on:
  push:
    branches:
      - agent/kirk-v4-source-audit-20260814-gpt56pro
    paths:
      - '.github/workflows/kirk-v4-source-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire-and-extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Acquire exact Zenodo record and source PDF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 - <<'PY'
          import json
          import pathlib
          import time
          import urllib.error
          import urllib.request

          record_id = '21765806'
          api = f'https://zenodo.org/api/records/{record_id}'
          headers = {
              'User-Agent': 'stevemoraco-qs-mathematical-source-audit/1.0',
              'Accept': 'application/json',
          }

          def get(url, accept=None):
              local = dict(headers)
              if accept is not None:
                  local['Accept'] = accept
              last = None
              for attempt in range(8):
                  request = urllib.request.Request(url, headers=local)
                  try:
                      with urllib.request.urlopen(request, timeout=90) as response:
                          return response.read()
                  except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError) as exc:
                      last = exc
                      time.sleep(min(2 ** attempt, 30))
              raise RuntimeError(f'failed to fetch {url}: {last}')

          raw = get(api)
          pathlib.Path('evidence/record.json').write_bytes(raw)
          record = json.loads(raw)
          files = record.get('files', [])
          if len(files) != 1:
              raise RuntimeError(f'expected one source file, found {len(files)}')
          item = files[0]
          filename = item['key']
          content_url = item['links']['content']
          payload = get(content_url, 'application/pdf')
          if not payload.startswith(b'%PDF-'):
              raise RuntimeError('downloaded payload is not a PDF')
          out = pathlib.Path('evidence') / filename
          out.write_bytes(payload)
          pathlib.Path('evidence/source-name.txt').write_text(filename + '\n')
          print(f'downloaded {filename}: {len(payload)} bytes')
          PY

      - name: Extract text and exact source metadata
        shell: bash
        run: |
          set -euo pipefail
          PDF="$(find evidence -maxdepth 1 -type f -name '*.pdf' -print -quit)"
          test -n "$PDF"
          sha256sum "$PDF" | tee evidence/source.sha256
          md5sum "$PDF" | tee evidence/source.md5
          pdfinfo "$PDF" | tee evidence/pdfinfo.txt
          pdftotext -layout "$PDF" evidence/kirk-v4.txt
          test -s evidence/kirk-v4.txt
          wc -l -w -c evidence/kirk-v4.txt | tee evidence/text-size.txt
          grep -nE '^(Theorem|Lemma|Proposition|Corollary|Assumption|Hypothesis|Definition)[[:space:]]+[0-9]' \
            evidence/kirk-v4.txt > evidence/numbered-results.txt || true
          grep -nE 'Theorem 5\.5|Theorem 5\.27|O\(u\^4\)|third[- ]jet|finite[- ]volume|wrapp|periodic|Haar|mass gap|Osterwalder' \
            evidence/kirk-v4.txt > evidence/targeted-index.txt || true
          head -200 evidence/targeted-index.txt | tee evidence/targeted-index-head.txt

      - name: Preserve exact source audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: kirk-yang-mills-v4-exact-source
          path: evidence/
          if-no-files-found: error
          retention-days: 90
