name: Unified Millennium bank public replay

on:
  push:
    branches:
      - agent/unified-millennium-bank-public-20260813
    paths:
      - 'formal/unified-millennium-bank/**'
      - '.github/workflows/unified-millennium-bank-public.yml'
  pull_request:
    branches: [main]
    paths:
      - 'formal/unified-millennium-bank/**'
      - '.github/workflows/unified-millennium-bank-public.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Verify byte-identical canonical source
        shell: bash
        run: |
          set -euo pipefail
          dir='formal/unified-millennium-bank'
          file="$dir/UnifiedMillenniumBank.lean"
          expected='a7d09b000b9aca002a7aa05cc348a3d4d28f3a9b'
          actual="$(git hash-object "$file")"
          printf 'expected Git blob: %s\nactual Git blob:   %s\n' "$expected" "$actual" \
            | tee "$dir/source-blob.txt"
          test "$actual" = "$expected"
          sha256sum "$file" | tee "$dir/source-sha256.txt"

      - name: Reject proof holes and trust escapes
        shell: bash
        run: |
          set -euo pipefail
          file='formal/unified-millennium-bank/UnifiedMillenniumBank.lean'
          if grep -En '(^|[^[:alnum:]_])(sorry|admit|sorryAx)([^[:alnum:]_]|$)' "$file"; then
            echo 'Forbidden proof placeholder found.' >&2
            exit 1
          fi
          if grep -En '^[[:space:]]*(axiom|opaque|unsafe)[[:space:]]' "$file"; then
            echo 'Forbidden trust declaration found.' >&2
            exit 1
          fi
          if grep -En '(native_decide|Lean\.ofReduceBool)' "$file"; then
            echo 'Forbidden computational trust escape found.' >&2
            exit 1
          fi

      - name: Install pinned Lean and compile exact source
        shell: bash
        run: |
          set -euo pipefail
          dir='formal/unified-millennium-bank'
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.32.1
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version | tee "$dir/lean-version.txt"
          lake --version | tee -a "$dir/lean-version.txt"
          cd "$dir"
          lake update
          lake exe cache get
          set +e
          lake env lean UnifiedMillenniumBank.lean > lean-output.log 2>&1
          status=$?
          set -e
          cat lean-output.log
          if [ "$status" -ne 0 ]; then
            echo "Lean compilation failed with status $status" >&2
            exit "$status"
          fi
          if grep -Eq 'declaration uses .sorry.|sorryAx|admit|Lean.ofReduceBool' lean-output.log; then
            echo 'Forbidden dependency found in compiler report.' >&2
            exit 1
          fi
          echo 'VERIFIED unified Millennium finite bank.'

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-millennium-bank-public-evidence
          path: |
            formal/unified-millennium-bank/source-blob.txt
            formal/unified-millennium-bank/source-sha256.txt
            formal/unified-millennium-bank/lean-version.txt
            formal/unified-millennium-bank/lean-output.log
          if-no-files-found: warn
