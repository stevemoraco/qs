name: YM Pinned Schur Public Verifier

on:
  push:
    branches:
      - agent/ym-pinned-schur-public-verifier-20260812
    paths:
      - 'verification/ym-pinned-schur/**'
      - '.github/workflows/ym-pinned-schur-public-verify.yml'
  pull_request:
    branches: [main]
    paths:
      - 'verification/ym-pinned-schur/**'
      - '.github/workflows/ym-pinned-schur-public-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean-firewall:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Reject placeholders and verify canonical source blob
        shell: bash
        run: |
          set -euo pipefail
          file=verification/ym-pinned-schur/YMPinnedSchurNullMode.lean
          if grep -En '(^|[^[:alnum:]_])(sorry|admit|axiom|opaque|unsafe)([^[:alnum:]_]|$)' "$file"; then
            echo 'Forbidden Lean placeholder or custom trust declaration found.' >&2
            exit 1
          fi
          git hash-object "$file" | tee verification/ym-pinned-schur/lean-git-blob-sha.txt
          test "$(cat verification/ym-pinned-schur/lean-git-blob-sha.txt)" = '6ad7c6c809ba1639185ec18d6ec1effd79742d85'

      - name: Install pinned Lean, fetch pinned Mathlib cache, and compile
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.31.0
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version | tee verification/ym-pinned-schur/lean-version.txt
          lake --version | tee verification/ym-pinned-schur/lake-version.txt
          cd verification/ym-pinned-schur
          lake update
          git -C .lake/packages/mathlib rev-parse HEAD | tee mathlib-commit.txt
          lake exe cache get
          lake env lean YMPinnedSchurNullMode.lean 2>&1 | tee lean-output.log
          if grep -Eq 'declaration uses .sorry.|sorryAx|admit|Lean.ofReduceBool' lean-output.log; then
            echo 'Forbidden placeholder or unaccepted computational axiom found.' >&2
            exit 1
          fi
          echo 'VERIFIED YM pinned-Schur finite cores: clean pinned build.'

      - name: Upload compiler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ym-pinned-schur-lean-evidence
          path: |
            verification/ym-pinned-schur/lean-output.log
            verification/ym-pinned-schur/lean-git-blob-sha.txt
            verification/ym-pinned-schur/lean-version.txt
            verification/ym-pinned-schur/lake-version.txt
            verification/ym-pinned-schur/mathlib-commit.txt
          if-no-files-found: warn
