name: Verify RH odd-selector finite core

on:
  workflow_dispatch:
  push:
    branches:
      - "verification/rh-odd-selector-finite-20260821"
    paths:
      - "verification/rh_odd_selector/**"
      - ".github/workflows/verify-rh-odd-selector-finite.yml"
  pull_request:
    paths:
      - "verification/rh_odd_selector/**"
      - ".github/workflows/verify-rh-odd-selector-finite.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: verification/rh_odd_selector

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify exact source and trust gate
        shell: bash
        run: |
          set -euo pipefail
          file=RHOddSectorSelectorFinite.lean
          test "$(git hash-object "$file")" = "953257eb8dca577b4bc0f40f90dc30035998c10f"
          if grep -nE '\b(sorry|admit|sorryAx|unsafe|opaque|native_decide)\b|^axiom |Lean\.ofReduceBool' "$file"; then
            echo "Forbidden token found"
            exit 1
          fi

      - name: Install elan
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get

      - name: Kernel-check exact source
        shell: bash
        run: |
          set -euo pipefail
          lake env lean RHOddSectorSelectorFinite.lean 2>&1 | tee lean-output.txt
          if grep -q 'sorryAx' lean-output.txt; then
            echo "sorryAx found in axiom report"
            exit 1
          fi

      - name: Reject compiler warnings
        shell: bash
        run: |
          set -euo pipefail
          if grep -q '^warning:' lean-output.txt; then
            cat lean-output.txt
            exit 1
          fi

      - name: Upload replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rh-odd-selector-finite-replay
          path: |
            verification/rh_odd_selector/RHOddSectorSelectorFinite.lean
            verification/rh_odd_selector/lean-output.txt
          if-no-files-found: warn
