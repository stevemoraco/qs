name: YM Kirk v4 common source-ball audit

on:
  push:
    branches:
      - verification/ym-kirk-v4-common-source-ball-audit-20260816-run3-gpt56sol
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Ensure pdftotext
        run: |
          if ! command -v pdftotext >/dev/null; then
            sudo apt-get update && sudo apt-get install -y poppler-utils
          fi
      - name: Pin immutable Kirk source
        run: python3 tools/probe_kirk_latest_source.py >/tmp/probe.json
      - name: Extract common source-ball contexts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text=Path('latest.txt').read_text(encoding='utf-8',errors='replace')
          out=Path('source_audit/kirk_v4/common_source_ball'); out.mkdir(parents=True,exist_ok=True)
          targets=[
            '4.6    One-step rooted envelope','Theorem 4.29','Lemma 8.1','Lemma 8.3',
            'Theorem 8.9','Lemma 8.10','Theorem 8.11','Corollary 8.12','Lemma 8.13','Theorem 8.15',
            'common analytic source ball','analytic source ball','source incidence','passive-source order',
            'passive source order','sigma_s','σs','source radius','Cauchy estimate','finite source functional',
            'fixed neighborhood of the origin','local source incidence','triangular source-renormalization',
            'finite triangular source','source normalization','source seminorm'
          ]
          counts={}; ledger=[]; low=text.lower()
          for target in targets:
            pos=0; n=0
            for hit in range(40):
              i=low.find(target.lower(),pos)
              if i<0: break
              n+=1
              ledger.append(f'=== {target} hit {n} at {i} ===\n'+text[max(0,i-4200):min(len(text),i+15000)]+'\n')
              pos=i+len(target)
            counts[target]=n
          required=['Theorem 4.29','Lemma 8.3','Theorem 8.11','Corollary 8.12','Lemma 8.13']
          missing=[x for x in required if counts[x]==0]
          (out/'LEDGER.txt').write_text('\n'.join(ledger),encoding='utf-8')
          (out/'COUNTS.txt').write_text('\n'.join(f'{k}: {v}' for k,v in counts.items())+'\n',encoding='utf-8')
          print('\n'.join(f'{k}: {v}' for k,v in counts.items()))
          if missing: raise SystemExit('missing anchors: '+', '.join(missing))
          PY
      - name: Preserve immutable audit contexts
        run: |
          cp kirk_latest_record.json source_audit/kirk_v4/common_source_ball/
          sha256sum kirk_latest.pdf > source_audit/kirk_v4/common_source_ball/PDF_SHA256.txt
          git config user.name 'millennium-braid-source-audit'
          git config user.email 'actions@users.noreply.github.com'
          git add source_audit/kirk_v4/common_source_ball
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audit(ym): preserve Kirk v4 common source-ball contexts'
          git push origin HEAD:verification/ym-kirk-v4-common-source-ball-audit-20260816-run3-gpt56sol
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kirk-v4-common-source-ball-audit
          if-no-files-found: warn
          retention-days: 30
          path: source_audit/kirk_v4/common_source_ball/