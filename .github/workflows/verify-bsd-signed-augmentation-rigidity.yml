name: Verify BSD signed augmentation rigidity

on:
  workflow_dispatch:
  push:
    paths:
      - "verification/bsd_signed_augmentation/**"
      - ".github/workflows/verify-bsd-signed-augmentation-rigidity.yml"
  pull_request:
    paths:
      - "verification/bsd_signed_augmentation/**"
      - ".github/workflows/verify-bsd-signed-augmentation-rigidity.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: verification/bsd_signed_augmentation

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify exact sources and trust gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object BSDSignedAugmentationRigidity.lean)" = "c4924d54355991057c3d3d8d20e7678e61c265b1"
          test "$(git hash-object BSDPointFreeSignedDerivative.lean)" = "f5578954e848bcdd14f6b956e649edd5ee437d28"
          for file in BSDSignedAugmentationRigidity.lean BSDPointFreeSignedDerivative.lean; do
            if grep -nE '\b(sorry|admit|sorryAx|unsafe|opaque|native_decide)\b|^axiom |Lean\.ofReduceBool' "$file"; then
              echo "Forbidden token found in $file"
              exit 1
            fi
          done

      - name: Install elan
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get

      - name: Kernel-check exact sources
        shell: bash
        run: |
          set -euo pipefail
          lake env lean BSDSignedAugmentationRigidity.lean 2>&1 | tee lean-output.txt
          lake env lean BSDPointFreeSignedDerivative.lean 2>&1 | tee -a lean-output.txt
          if grep -q 'sorryAx' lean-output.txt; then
            echo "sorryAx found in axiom report"
            exit 1
          fi

      - name: Reject compiler warnings
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'warning:' lean-output.txt; then
            echo "Lean warning found"
            exit 1
          fi

      - name: Upload replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bsd-signed-point-free-rank-one-replay
          path: |
            verification/bsd_signed_augmentation/BSDSignedAugmentationRigidity.lean
            verification/bsd_signed_augmentation/BSDPointFreeSignedDerivative.lean
            verification/bsd_signed_augmentation/lean-output.txt
          if-no-files-found: warn
