name: PNP low-ball source smoke
on:
  pull_request:
    branches: [main]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: verification/pnp-low-ball-syndrome
          auto-config: false
      - run: lake env lean PNPLowBallSyndromeSeparator.lean
        working-directory: verification/pnp-low-ball-syndrome
