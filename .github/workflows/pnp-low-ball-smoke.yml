name: PNP low-ball finite kernel replay
on:
  pull_request:
    branches: [main]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: verification/pnp-low-ball-syndrome
      - name: Replay syndrome separator
        run: lake env lean PNPLowBallSyndromeSeparator.lean
        working-directory: verification/pnp-low-ball-syndrome
      - name: Replay averaging contrapositive
        run: lake env lean PNPLowBallAveragingContrapositive.lean
        working-directory: verification/pnp-low-ball-syndrome
