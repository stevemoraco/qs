name: BSD transverse-order public replay

on:
  workflow_dispatch:
  push:
    paths:
      - "verification/bsd-transverse-order/TransverseOrderFirewall.lean"
      - ".github/workflows/bsd-transverse-order-public.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Source trust scan
        shell: bash
        run: |
          set -euo pipefail
          f=verification/bsd-transverse-order/TransverseOrderFirewall.lean
          if grep -En '(^|[^[:alnum:]_])(sorry|admit|sorryAx)([^[:alnum:]_]|$)' "$f"; then exit 1; fi
          if grep -En '^[[:space:]]*(axiom|opaque|unsafe)[[:space:]]' "$f"; then exit 1; fi
          git hash-object "$f"
          sha256sum "$f"

      - name: Install pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.31.0
          export PATH="$HOME/.elan/bin:$PATH"
          mkdir -p /tmp/bsd-transverse
          cd /tmp/bsd-transverse
          cat > lakefile.toml <<'EOF'
          name = "BSDTransverse"
          version = "0.1.0"
          defaultTargets = ["BSDTransverse"]

          [[require]]
          name = "mathlib"
          git = "https://github.com/leanprover-community/mathlib4.git"
          rev = "v4.31.0"

          [[lean_lib]]
          name = "BSDTransverse"
          EOF
          echo 'leanprover/lean4:v4.31.0' > lean-toolchain
          lake update
          lake exe cache get
          lean --version

      - name: Compile exact mirrored source and audit axioms
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cp verification/bsd-transverse-order/TransverseOrderFirewall.lean /tmp/bsd-transverse/TransverseOrderFirewall.lean
          cd /tmp/bsd-transverse
          lake env lean TransverseOrderFirewall.lean 2>&1 | tee lean-output.log
          if grep -Eq 'declaration uses .sorry.|sorryAx|admit|error:' lean-output.log; then exit 1; fi
          python3 - <<'PY'
          import re, pathlib
          text=pathlib.Path('lean-output.log').read_text()
          allowed={'propext','Classical.choice','Quot.sound'}
          reports=re.findall(r"'([^']+)' depends on axioms:\s*\[(.*?)\]",text,re.S)
          reports += [(x,'') for x in re.findall(r"'([^']+)' does not depend on any axioms",text)]
          if len(reports) < 4:
              raise SystemExit(f'expected >=4 axiom reports, found {len(reports)}')
          for th,payload in reports:
              deps={x.strip() for x in payload.split(',') if x.strip()}
              extra=deps-allowed
              if extra: raise SystemExit(f'{th}: nonfoundation {sorted(extra)}')
          print('VERIFIED',len(reports),'axiom reports')
          PY
