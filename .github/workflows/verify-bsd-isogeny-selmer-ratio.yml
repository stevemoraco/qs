name: Verify BSD isogeny Selmer-ratio ledger

on:
  workflow_dispatch:
  push:
    paths:
      - "verification/bsd_isogeny_selmer_ratio/**"
      - ".github/workflows/verify-bsd-isogeny-selmer-ratio.yml"
  pull_request:
    paths:
      - "verification/bsd_isogeny_selmer_ratio/**"
      - ".github/workflows/verify-bsd-isogeny-selmer-ratio.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: verification/bsd_isogeny_selmer_ratio

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify exact source and trust gate
        shell: bash
        run: |
          set -euo pipefail
          file=BSDIsogenySelmerRatioLedger.lean
          test "$(git hash-object "$file")" = "0402503438160abc350c496e2afc17d20bf8921e"
          if grep -nE '\b(sorry|admit|sorryAx|unsafe|opaque|native_decide)\b|^axiom |Lean\.ofReduceBool' "$file"; then
            echo "Forbidden token found"
            exit 1
          fi

      - name: Install elan
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get

      - name: Kernel-check exact source
        shell: bash
        run: |
          set -euo pipefail
          lake env lean BSDIsogenySelmerRatioLedger.lean 2>&1 | tee lean-output.txt
          if grep -q 'sorryAx' lean-output.txt; then
            echo "sorryAx found in axiom report"
            exit 1
          fi

      - name: Reject compiler warnings
        shell: bash
        run: |
          set -euo pipefail
          if grep -n '^warning:' lean-output.txt; then
            echo "Lean compiler warning found"
            exit 1
          fi

      - name: Upload replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bsd-isogeny-selmer-ratio-replay
          path: |
            verification/bsd_isogeny_selmer_ratio/BSDIsogenySelmerRatioLedger.lean
            verification/bsd_isogeny_selmer_ratio/lean-output.txt
          if-no-files-found: warn
