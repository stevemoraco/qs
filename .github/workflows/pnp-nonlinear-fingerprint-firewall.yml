name: PNP nonlinear fingerprint firewall replay

on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/pnp-nonlinear-fingerprint-firewall/**'
      - '.github/workflows/pnp-nonlinear-fingerprint-firewall.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Reject proof holes and trust escapes
        shell: bash
        run: |
          set -euo pipefail
          file=verification/pnp-nonlinear-fingerprint-firewall/PNPNonlinearFingerprintFirewall.lean
          if grep -nE '\b(sorry|admit|sorryAx)\b' "$file"; then
            echo 'Explicit proof hole found'
            exit 1
          fi
          if grep -nE '\b(axiom|opaque|unsafe|native_decide|Lean\.ofReduceBool)\b' "$file"; then
            echo 'Forbidden trust escape found'
            exit 1
          fi

      - name: Install Lean
        shell: bash
        run: |
          set -euo pipefail
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve pinned Mathlib and fetch cache
        shell: bash
        working-directory: verification/pnp-nonlinear-fingerprint-firewall
        run: |
          set -euo pipefail
          lake update
          lake exe cache get

      - name: Kernel replay and axiom report
        shell: bash
        working-directory: verification/pnp-nonlinear-fingerprint-firewall
        run: |
          set -o pipefail
          lake env lean PNPNonlinearFingerprintFirewall.lean 2>&1 | tee lean-replay.log
          test "$(grep -c '^warning: declaration uses' lean-replay.log || true)" -eq 0

      - name: Preserve replay log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pnp-nonlinear-fingerprint-firewall-log
          path: verification/pnp-nonlinear-fingerprint-firewall/lean-replay.log
          if-no-files-found: warn
