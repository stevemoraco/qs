name: YM flag gauge-invariance verifier

on:
  push:
    branches:
      - verification/ym-flag-gauge-invariance-20260813
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Decode and verify exact source
        shell: bash
        run: |
          set -euo pipefail
          DIR=verification/ym-flag-gauge-invariance
          base64 -d "$DIR/YMFlagGaugeInvarianceFirewall.lean.b64" > "$DIR/YMFlagGaugeInvarianceFirewall.lean"
          test "$(sha256sum "$DIR/YMFlagGaugeInvarianceFirewall.lean" | cut -d' ' -f1)" = 3c1b256705530768beba9598386138b55c8bc38762e01e13fe93b5df25842909
          python3 - <<'PY'
          import json, pathlib, re, urllib.request
          p = pathlib.Path('verification/ym-flag-gauge-invariance/YMFlagGaugeInvarianceFirewall.lean')
          source = p.read_text()
          forbidden = re.compile(r'(^|[^A-Za-z0-9_])(sorry|admit|sorryAx|axiom|opaque|unsafe)([^A-Za-z0-9_]|$)')
          m = forbidden.search(source)
          assert not m, m.group(2) if m else ''
          assert 'native_decide' not in source
          assert 'Lean.ofReduceBool' not in source
          assert source.count('#print axioms') == 5
          payload = json.dumps({
              'content': source,
              'environment': 'lean-4.30.0',
              'ignore_imports': True,
              'mathlib_options': False,
              'timeout_seconds': 900,
          }).encode()
          req = urllib.request.Request(
              'https://axle.axiommath.ai/api/v1/check',
              data=payload,
              headers={'Content-Type':'application/json'},
              method='POST')
          with urllib.request.urlopen(req, timeout=960) as response:
              result = json.load(response)
          print(json.dumps(result, indent=2))
          lean = result.get('lean_messages', {})
          tool = result.get('tool_messages', {})
          assert result.get('okay')
          assert not result.get('failed_declarations', [])
          assert not lean.get('errors', []) and not lean.get('warnings', [])
          assert not tool.get('errors', []) and not tool.get('warnings', [])
          assert 'sorryAx' not in json.dumps(result)
          print('VERIFIED: exact YM flag gauge-invariance firewall compiled under AXLE Lean 4.30')
          PY
