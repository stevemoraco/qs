name: B2 Round41 Lean Replay

on:
  push:
    branches:
      - automation/day0-b2-round41-lean-replay-20260812
    paths:
      - 'research/lean-replay/B2Round41AdversarialCores.lean'
      - '.github/workflows/b2-round41-lean-replay.yml'
  pull_request:
    paths:
      - 'research/lean-replay/B2Round41AdversarialCores.lean'
      - '.github/workflows/b2-round41-lean-replay.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Submit immutable source to Lean compile farm
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import pathlib
          import time
          import urllib.error
          import urllib.request

          API = 'https://lean-compile-farm.replit.app/api'
          source_path = pathlib.Path('research/lean-replay/B2Round41AdversarialCores.lean')
          source = source_path.read_text()
          digest = hashlib.sha256(source.encode()).hexdigest()
          print('source_sha256', digest, flush=True)
          if digest != '91966bc4726d43082b8baf3ce122609c841c0e2b7693fcfa85ffadbac0708b25':
              raise SystemExit('source digest mismatch')

          def read_json(request_or_url, *, attempts=12, timeout=120):
              last_error = None
              for attempt in range(1, attempts + 1):
                  try:
                      with urllib.request.urlopen(request_or_url, timeout=timeout) as response:
                          return json.load(response)
                  except (
                      TimeoutError,
                      urllib.error.URLError,
                      urllib.error.HTTPError,
                      OSError,
                  ) as error:
                      last_error = error
                      delay = min(5 * attempt, 60)
                      print(
                          f'network attempt {attempt}/{attempts} failed: '
                          f'{type(error).__name__}: {error}; sleeping {delay}s',
                          flush=True,
                      )
                      time.sleep(delay)
              raise RuntimeError(f'compile-farm retry budget exhausted: {last_error}')

          request = urllib.request.Request(
              f'{API}/compile',
              data=json.dumps({
                  'name': 'b2-round41-adversarial-cores-public-replay',
                  'lean_source': source,
              }).encode(),
              headers={'Content-Type': 'application/json'},
              method='POST',
          )
          job = read_json(request)
          job_id = job['id']
          print('job', job_id, flush=True)

          for poll in range(180):
              time.sleep(20)
              try:
                  job = read_json(f'{API}/jobs/{job_id}', attempts=4, timeout=120)
              except RuntimeError as error:
                  print(f'poll {poll}: transient failure: {error}', flush=True)
                  continue
              print(f"poll {poll}: {job.get('status')} {job.get('verdict')}", flush=True)
              if job.get('status') in ('done', 'failed'):
                  print(json.dumps(job, indent=2), flush=True)
                  if job.get('verdict') != 'VERIFIED' or job.get('sorry_count') != 0:
                      raise SystemExit(1)
                  raise SystemExit(0)
          raise SystemExit('compile farm did not return a verdict before timeout')
          PY
