name: YM Kirk v4 Gaussian trace-support closure audit

on:
  push:
    branches:
      - verification/ym-kirk-v4-gaussian-trace-support-closure-20260815-run3-gpt56sol
    paths:
      - .github/workflows/ym-kirk-v4-gaussian-trace-support-closure-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verification/ym-kirk-v4-gaussian-trace-support-closure-20260815-run3-gpt56sol
      - name: Ensure pdftotext
        run: |
          if ! command -v pdftotext >/dev/null; then sudo apt-get update && sudo apt-get install -y poppler-utils; fi
      - name: Pin immutable Kirk v4 PDF directly
        run: |
          set -euo pipefail
          url='https://zenodo.org/api/records/21765806/files/Kirk_2026_Yang%E2%80%93Mills%20Existence,%20Mass%20Gap,%20and%20Nontriviality%20for%20Fixed%20Compact%20Simple%20Gauge%20Groups%20via%20Karcher%20Blocking%20and%20Exact%20Haar%E2%80%93Pivot%20Matching.pdf/content'
          curl -fL --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 180 "$url" -o kirk_latest.pdf
          got="$(sha256sum kirk_latest.pdf | awk '{print $1}')"
          test "$got" = 'c78a3ce6d273ce7e2d32ecd2cf796a81d1f16160aadc3231752c9dbf65a6befa'
          pdftotext -layout kirk_latest.pdf latest.txt
      - name: Extract closure contexts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          lines=Path('latest.txt').read_text(encoding='utf-8',errors='replace').splitlines()
          out=Path('source_audit/kirk_v4/gaussian_trace_support_closure'); out.mkdir(parents=True,exist_ok=True)
          targets=['Lemma 3.17','Definition 3.23','Lemma 3.24','Lemma 3.26','Lemma 3.27','Theorem 3.28','Lemma 3.30','Theorem 3.31']
          phrases=[
            'integration core','fixed integration core','exterior ring','no active link',
            'finite-dimensional core','H_X','dim H','core size','size of the core',
            'strict core support reserve','core support reserve','support reserve',
            'c_P a_b < a_c < a','a_c |X|','exp(a_c |X|)',
            'absorbs fixed per-core losses','absorbs size factors','size factors',
            'Q_opt^{-1}','Q_opt^{-1/2}','kappa_G','trace class','Schatten','rank'
          ]
          chunks=[]; counts={}
          def add_context(label,i,pre=14,post=35):
            lo=max(0,i-pre); hi=min(len(lines),i+post)
            chunks.append(f'===== {label} line {i+1} =====\n'+'\n'.join(f'{j+1}: {lines[j]}' for j in range(lo,hi)))
          for name in targets:
            kind,num=name.rsplit(' ',1)
            pat=re.compile(r'^\s*'+re.escape(kind)+r'\s+'+re.escape(num)+r'\b',re.I)
            hits=[i for i,l in enumerate(lines) if pat.search(l)]
            counts[name]=len(hits)
            for i in hits[:2]: add_context(name,i,18,90)
          for phrase in phrases:
            hits=[i for i,l in enumerate(lines) if phrase.lower() in l.lower()]
            counts['PHRASE '+phrase]=len(hits)
            for i in hits[:12]: add_context('PHRASE '+phrase,i,10,22)
          (out/'CLOSURE_CONTEXTS.txt').write_text('\n\n'.join(chunks)+'\n',encoding='utf-8')
          (out/'COUNTS.txt').write_text('\n'.join(f'{k}: {v}' for k,v in counts.items())+'\n',encoding='utf-8')
          required=['Lemma 3.17','Lemma 3.26','Lemma 3.27','Lemma 3.30','Theorem 3.31']
          missing=[k for k in required if counts.get(k,0)==0]
          if missing: raise SystemExit('missing required anchors: '+', '.join(missing))
          PY
      - name: Preserve contexts
        run: |
          sha256sum kirk_latest.pdf > source_audit/kirk_v4/gaussian_trace_support_closure/PDF_SHA256.txt
          printf '%s\n' 'record=21765806' 'version=4.0' 'doi=10.5281/zenodo.21765806' > source_audit/kirk_v4/gaussian_trace_support_closure/SOURCE.txt
          git config user.name 'millennium-braid-source-audit'
          git config user.email 'actions@users.noreply.github.com'
          git add source_audit/kirk_v4/gaussian_trace_support_closure
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audit(ym): preserve Gaussian trace-support closure contexts'
          git push origin HEAD:verification/ym-kirk-v4-gaussian-trace-support-closure-20260815-run3-gpt56sol
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kirk-v4-gaussian-trace-support-closure
          retention-days: 30
          if-no-files-found: warn
          path: source_audit/kirk_v4/gaussian_trace_support_closure/
