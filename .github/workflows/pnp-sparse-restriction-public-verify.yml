name: PNP Sparse Restriction Finite Core Lean

on:
  push:
    branches:
      - agent/pnp-sparse-restriction-public-verifier-20260811
    paths:
      - 'verification/pnp-sparse-restriction/**'
      - '.github/workflows/pnp-sparse-restriction-public-verify.yml'
  pull_request:
    branches: [main]
    paths:
      - 'verification/pnp-sparse-restriction/**'
      - '.github/workflows/pnp-sparse-restriction-public-verify.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Reject explicit placeholders
        shell: bash
        run: |
          set -euo pipefail
          file=verification/pnp-sparse-restriction/PNPSparseRestrictionBranchingFinite.lean
          if grep -En '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' "$file"; then
            echo 'Forbidden Lean placeholder found.' >&2
            exit 1
          fi

      - name: Install pinned Lean, fetch pinned Mathlib cache, and compile
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.32.1
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version
          lake --version
          cd verification/pnp-sparse-restriction
          lake update
          lake exe cache get
          lake env lean PNPSparseRestrictionBranchingFinite.lean 2>&1 | tee lean-output.log
          if grep -Eq 'declaration uses .sorry.|sorryAx|admit' lean-output.log; then
            echo 'Forbidden placeholder axiom found in compiler output.' >&2
            exit 1
          fi
          echo 'VERIFIED finite PNP sparse-restriction/counting core.'

      - name: Verify explicit seven-gate marker gadget
        shell: bash
        run: |
          set -euo pipefail
          python3 verification/pnp-sparse-restriction/pnp_h4_exact_gate_audit.py \
            | tee verification/pnp-sparse-restriction/h4-seven-gate-output.log

      - name: Exhaustively exclude full-basis circuits of at most six gates
        shell: bash
        run: |
          set -euo pipefail
          g++ -O3 -std=c++20 -Wall -Wextra -pedantic \
            verification/pnp-sparse-restriction/pnp_h4_full_basis_bfs.cpp \
            -o /tmp/pnp_h4_full_basis_bfs
          /tmp/pnp_h4_full_basis_bfs 6 2>&1 \
            | tee verification/pnp-sparse-restriction/h4-bfs-output.log
          grep -Fx 'NOTFOUND up to 6' \
            verification/pnp-sparse-restriction/h4-bfs-output.log

      - name: Upload compiler and finite-audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pnp-sparse-restriction-finite-core-evidence
          path: |
            verification/pnp-sparse-restriction/lean-output.log
            verification/pnp-sparse-restriction/h4-seven-gate-output.log
            verification/pnp-sparse-restriction/h4-bfs-output.log
          if-no-files-found: warn
