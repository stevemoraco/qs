name: NS instantaneous-blowup Clay category verifier

on:
  push:
    branches:
      - agent/ns-instantaneous-clay-category-verifier-20260813
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ns-instantaneous-category-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout exact verifier source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Canonical-source and trust preflight
        shell: bash
        run: |
          set -euo pipefail
          SRC=verification/ns_instantaneous_clay_category/NSInstantaneousClayCategoryFirewall.lean
          EXPECTED_BLOB=a7d38e7820282a8cc1a93bf43f72b2d189804ae8
          ACTUAL_BLOB=$(git hash-object "$SRC")
          test "$ACTUAL_BLOB" = "$EXPECTED_BLOB"
          python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path('verification/ns_instantaneous_clay_category/NSInstantaneousClayCategoryFirewall.lean')
          text = p.read_text()
          forbidden = re.compile(r'(^|[^A-Za-z0-9_])(sorry|admit|sorryAx|axiom|opaque|unsafe)([^A-Za-z0-9_]|$)')
          match = forbidden.search(text)
          if match:
              raise SystemExit(f'forbidden source token: {match.group(2)}')
          for token in ('Lean.ofReduceBool', 'native_decide'):
              if token in text:
                  raise SystemExit(f'forbidden source token: {token}')
          if text.count('#print axioms') != 3:
              raise SystemExit('expected exactly three staged #print axioms commands')
          print('source trust preflight: clean')
          PY

      - name: Compile exact source with AXLE Lean 4.30
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/ns_instantaneous_clay_category
          python3 - <<'PY'
          import json
          import pathlib
          import urllib.request

          source = pathlib.Path(
              'verification/ns_instantaneous_clay_category/NSInstantaneousClayCategoryFirewall.lean'
          ).read_text()
          payload = json.dumps({
              'content': source,
              'environment': 'lean-4.30.0',
              'ignore_imports': True,
              'mathlib_options': False,
              'timeout_seconds': 900,
          }).encode()
          request = urllib.request.Request(
              'https://axle.axiommath.ai/api/v1/check',
              data=payload,
              headers={'Content-Type': 'application/json'},
              method='POST',
          )
          with urllib.request.urlopen(request, timeout=960) as response:
              result = json.load(response)

          out = pathlib.Path('evidence/ns_instantaneous_clay_category/axle-response.json')
          out.write_text(json.dumps(result, indent=2, sort_keys=True))
          print(json.dumps(result, indent=2))

          lean_errors = result.get('lean_messages', {}).get('errors', [])
          warnings = result.get('lean_messages', {}).get('warnings', [])
          tool_errors = result.get('tool_messages', {}).get('errors', [])
          tool_warnings = result.get('tool_messages', {}).get('warnings', [])
          failed = result.get('failed_declarations', [])
          if not result.get('okay') or lean_errors or warnings or tool_errors or tool_warnings or failed:
              raise SystemExit('Lean/AXLE verification failed or emitted warnings')
          rendered = json.dumps(result)
          for forbidden in ('sorryAx', 'Lean.ofReduceBool'):
              if forbidden in rendered:
                  raise SystemExit(f'postcompile forbidden dependency: {forbidden}')
          print('VERIFIED: exact warning-free source compiled under AXLE Lean 4.30')
          PY

      - name: Record replay metadata
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "ref=${GITHUB_REF}"
            echo "commit=${GITHUB_SHA}"
            echo "runner_name=${RUNNER_NAME}"
            echo "runner_os=${RUNNER_OS}"
            echo "source_blob=$(git hash-object verification/ns_instantaneous_clay_category/NSInstantaneousClayCategoryFirewall.lean)"
            echo "source_sha256=$(sha256sum verification/ns_instantaneous_clay_category/NSInstantaneousClayCategoryFirewall.lean | awk '{print $1}')"
            echo "environment=lean-4.30.0"
          } > evidence/ns_instantaneous_clay_category/replay-metadata.txt

      - name: Upload exact compiler evidence
        uses: actions/upload-artifact@v4
        with:
          name: ns-instantaneous-clay-category-evidence
          path: evidence/ns_instantaneous_clay_category/
          if-no-files-found: error
