name: Round 219 RH Abel Edge Finite Core

on:
  push:
    branches:
      - agent/round219-rh-abel-edge-verify-20260812
    paths:
      - 'verification/round219-rh-abel-edge/**'
      - '.github/workflows/round219-rh-abel-edge-verify.yml'
  pull_request:
    branches: [main]
    paths:
      - 'verification/round219-rh-abel-edge/**'
      - '.github/workflows/round219-rh-abel-edge-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Reject explicit placeholders
        shell: bash
        run: |
          set -euo pipefail
          file=verification/round219-rh-abel-edge/Round219RHAbelEdgeFinite.lean
          if grep -En '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' "$file"; then
            echo 'Forbidden Lean placeholder found.' >&2
            exit 1
          fi

      - name: Install pinned Lean, fetch pinned Mathlib cache, and compile
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.32.1
          export PATH="$HOME/.elan/bin:$PATH"
          cd verification/round219-rh-abel-edge
          lean --version | tee lean-version.txt
          lake update
          lake exe cache get
          lake env lean Round219RHAbelEdgeFinite.lean 2>&1 | tee lean-output.log
          if grep -Eq 'declaration uses .sorry.|sorryAx|admit' lean-output.log; then
            echo 'Forbidden placeholder axiom found in compiler output.' >&2
            exit 1
          fi
          echo 'VERIFIED finite Round 219 RH Abel-edge algebra.'

      - name: Upload compiler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: round219-rh-abel-edge-lean-evidence
          path: |
            verification/round219-rh-abel-edge/lean-output.log
            verification/round219-rh-abel-edge/lean-version.txt
          if-no-files-found: warn
