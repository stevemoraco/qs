name: B2 Round 43 RH Subpolynomial Positive Weight

on:
  push:
    branches:
      - automation/b2-round43-rh-subpolynomial-positive-weight-20260813
  pull_request:
    paths:
      - 'verification/b2-round43/**'
      - '.github/workflows/b2-round43-rh-subpolynomial-positive-weight.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b2-round43-rh-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Reject placeholders and custom proof carriers
        shell: bash
        run: |
          set -euo pipefail
          files=(
            verification/b2-round43/RHSubpolynomialPositiveWeightFinite.lean
            verification/b2-round43/RHPositiveBregmanFinite.lean
          )
          for file in "${files[@]}"; do
            if grep -En '(^|[^[:alnum:]_])(sorry|admit|axiom|opaque|unsafe|native_decide)([^[:alnum:]_]|$)|Lean\.ofReduceBool' "$file"; then
              echo "Forbidden proof placeholder or custom proof carrier found in $file" >&2
              exit 1
            fi
          done

      - name: Install pinned Lean, fetch pinned Mathlib cache, and compile
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.32.1
          export PATH="$HOME/.elan/bin:$PATH"
          cd verification/b2-round43
          lake update
          lake exe cache get
          : > lean-output.log
          for file in RHSubpolynomialPositiveWeightFinite.lean RHPositiveBregmanFinite.lean; do
            echo "===== $file =====" | tee -a lean-output.log
            lake env lean "$file" 2>&1 | tee -a lean-output.log
          done
          if grep -Eq 'declaration uses .sorry.|sorryAx|admit' lean-output.log; then
            echo 'Forbidden placeholder axiom found in compiler output.' >&2
            exit 1
          fi
          echo 'VERIFIED finite round-43 RH weight and Bregman spines.'

      - name: Upload compiler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b2-round43-rh-weight-lean-evidence
          path: verification/b2-round43/lean-output.log
          if-no-files-found: warn
