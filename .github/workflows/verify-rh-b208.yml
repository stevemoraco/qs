name: Verify RH B208 one-prefix core
on:
  push:
    branches: [verification/rh-b208-one-prefix-zhao-collapse-20260816-gpt56sol]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reject holes and unsafe carriers
        shell: bash
        run: |
          set -euo pipefail
          FILE=verification/rh-b208/RHB208OnePrefixCollapseFinite.lean
          ! grep -En '\b(sorry|admit|sorryAx|axiom|opaque|unsafe|native_decide|Lean\.ofReduceBool)\b' "$FILE"
      - name: Submit exact source to AXLE Lean 4.30
        shell: bash
        run: |
          set -euo pipefail
          FILE=verification/rh-b208/RHB208OnePrefixCollapseFinite.lean
          SRC=$(jq -Rs . < "$FILE")
          R=$(curl --fail-with-body -sS -X POST https://lean-compile-farm.replit.app/api/compile \
            -H 'Content-Type: application/json' \
            --data "{\"name\":\"rh-b208-public-${GITHUB_SHA}\",\"lean_source\":${SRC}}")
          ID=$(jq -er '.id' <<< "$R")
          for i in $(seq 1 100); do
            sleep 15
            J=$(curl --fail-with-body -sS https://lean-compile-farm.replit.app/api/jobs/$ID)
            S=$(jq -r '.status' <<< "$J")
            if [ "$S" = done ]; then
              jq . <<< "$J"
              test "$(jq -r '.verdict' <<< "$J")" = VERIFIED
              test "$(jq -r '.sorry_count' <<< "$J")" = 0
              exit 0
            elif [ "$S" = failed ]; then
              jq . <<< "$J"
              exit 1
            fi
          done
          exit 1
