name: Unified Millennium braid semantic Lean replay

on:
  push:
    branches: [agent/unified-braid-semantic-replay-20260813, main]
    paths:
      - 'verification/unified-millennium-braid/**'
      - '.github/workflows/unified-millennium-braid.yml'
  pull_request:
    paths:
      - 'verification/unified-millennium-braid/**'
      - '.github/workflows/unified-millennium-braid.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Lock source and reject trust escapes
        shell: bash
        run: |
          set -euo pipefail
          SRC=verification/unified-millennium-braid/UnifiedSevenFireCorpus.lean
          EXPECTED=6169ae7e14f32b7e8e1c5246a7d8d13497a241b834171f97d0db5b0a00cbb14d
          test "$(sha256sum "$SRC" | awk '{print $1}')" = "$EXPECTED"
          if grep -nE '^[[:space:]]*(sorry|admit|axiom|constant|opaque|unsafe|native_decide)\b|\b(sorryAx|Lean\.ofReduceBool|implemented_by|extern)\b' "$SRC"; then
            echo 'Forbidden trust carrier'
            exit 1
          fi
          mkdir -p verification/unified-millennium-braid/evidence
          sha256sum "$SRC" >             verification/unified-millennium-braid/evidence/source.sha256

      - name: Install Lean
        shell: bash
        run: |
          set -euo pipefail
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve pinned Mathlib and fetch cache
        shell: bash
        working-directory: verification/unified-millennium-braid
        run: |
          set -euo pipefail
          lake update
          lake exe cache get

      - name: Kernel replay and axiom audit
        shell: bash
        working-directory: verification/unified-millennium-braid
        run: |
          set -euo pipefail
          lake env lean UnifiedSevenFireCorpus.lean 2>&1 | tee evidence/lean-replay.log
          lake env lean --version | tee evidence/lean-version.txt
          git -C .lake/packages/mathlib rev-parse HEAD | tee evidence/mathlib-commit.txt
          python3 - <<'PY'
          import pathlib
          import re

          log = pathlib.Path("evidence/lean-replay.log").read_text()
          expected = [
              "fires_length",
              "seven_frontiers_iff_targets",
              "nonempty_prizeRoute_iff",
              "nonempty_sharedCertificate_iff_allSeven",
              "no_common_local_witness",
              "no_global_prefix_witness",
              "exclusivity_does_not_prove_target",
              "survivor_from_exhaustiveness",
              "unique_survivor_from_exhaustiveness",
              "one_lane_does_not_close_bundle",
              "unified_millennium_braid_executable",
          ]
          for name in expected:
              needle = f"'Millennium.UnifiedSevenFire.{name}'"
              if log.count(needle) != 1:
                  raise SystemExit(f"missing or duplicate axiom report: {name}")
          reports = re.findall(
              r"'Millennium\.UnifiedSevenFire\.[^']+' "
              r"(?:does not depend on any axioms|depends on axioms:\s*\[[^\]]*\])",
              log,
              flags=re.S,
          )
          if len(reports) != len(expected):
              raise SystemExit(f"expected 11 complete axiom reports, got {len(reports)}")
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          for report in reports:
              match = re.search(r"depends on axioms:\s*\[([^\]]*)\]", report, re.S)
              if match:
                  used = {part.strip() for part in match.group(1).split(",") if part.strip()}
                  if not used <= allowed:
                      raise SystemExit(f"non-foundational axiom report: {used - allowed}")
          forbidden = ("sorryAx", "Lean.ofReduceBool", "declaration uses 'sorry'")
          if any(token in log for token in forbidden):
              raise SystemExit("forbidden postcompile dependency")
          print("AXIOM AUDIT PASS: 11 reports; standard foundations only")
          PY

      - name: Preserve exact replay
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-millennium-braid-evidence
          path: |
            verification/unified-millennium-braid/evidence/
            verification/unified-millennium-braid/lake-manifest.json
            verification/unified-millennium-braid/lakefile.toml
            verification/unified-millennium-braid/lean-toolchain
          if-no-files-found: error
