name: Clay C482-C487 unified finite Lean replay

on:
  push:
    branches:
      - agent/clay-c482-c487-unified-public-replay-20260821
    paths:
      - 'verification/clay-c482-c487/**'
      - '.github/workflows/clay-c482-c487-unified.yml'
  pull_request:
    paths:
      - 'verification/clay-c482-c487/**'
      - '.github/workflows/clay-c482-c487-unified.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Reject proof holes and conclusion-carrying escape hatches
        shell: bash
        run: |
          set -euo pipefail
          for file in verification/clay-c482-c487/*.lean; do
            if grep -nE '\b(sorry|admit|sorryAx)\b' "$file"; then
              echo "Explicit proof hole found in $file"
              exit 1
            fi
            if grep -nE '\b(axiom|opaque|unsafe|native_decide|Lean\.ofReduceBool)\b' "$file"; then
              echo "Forbidden escape hatch found in $file"
              exit 1
            fi
          done

      - name: Install pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.32.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve pinned Mathlib and fetch cache
        shell: bash
        working-directory: verification/clay-c482-c487
        run: |
          set -euo pipefail
          lake update
          lake exe cache get

      - name: Kernel replay and axiom report
        shell: bash
        working-directory: verification/clay-c482-c487
        run: |
          set -euo pipefail
          : > lean-output.log
          for file in \
            NSC482EndpointTowerFinite.lean \
            YMC483CompressionResidualFinite.lean \
            PNPC484PaddingExponentFinite.lean \
            HodgeC485MarkedSelfSquareFinite.lean \
            RHC486PositiveCompanionFinite.lean \
            BSDC487PairingBlindnessFinite.lean; do
            lake env lean "$file" 2>&1 | tee -a lean-output.log
          done
          if grep -Eq 'declaration uses .sorry.|sorryAx|admit' lean-output.log; then
            echo 'Placeholder dependency found'
            exit 1
          fi

      - name: Upload compiler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clay-c482-c487-lean-evidence
          path: verification/clay-c482-c487/lean-output.log
          if-no-files-found: warn
