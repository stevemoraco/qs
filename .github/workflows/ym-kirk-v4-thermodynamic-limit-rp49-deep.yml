name: YM Kirk v4 thermodynamic-limit and RP49 deep audit

on:
  push:
    branches:
      - verification/ym-kirk-v4-cubic-drift-and-rp49-audit-20260815-gpt56sol
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verification/ym-kirk-v4-cubic-drift-and-rp49-audit-20260815-gpt56sol
      - name: Ensure pdftotext
        run: |
          if ! command -v pdftotext >/dev/null; then
            sudo apt-get update && sudo apt-get install -y poppler-utils
          fi
      - name: Pin immutable Kirk v4 source
        run: python3 tools/probe_kirk_latest_source.py >/tmp/probe.json
      - name: Extract thermodynamic-map construction and convergence language
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('latest.txt').read_text(encoding='utf-8',errors='replace')
          out=Path('source_audit/kirk_v4/thermodynamic_limit_rp49_deep'); out.mkdir(parents=True,exist_ok=True)
          low=text.lower()
          terms=[
            'Lemma 5.1','Lemma 5.2','Lemma 5.3','Lemma 5.4','Lemma 5.5','Theorem 5.6',
            'rooted-thermodynamic','thermodynamic map','thermodynamic limit','thermodynamic passage',
            'finite-volume map','finite volume map','converges to','converge to','locally uniform',
            'uniform on compact','pointwise convergence','cofinal volume','M → ∞','M -> infinity',
            'same local functional','full normalized physical weak measure'
          ]
          counts={}; led=[]; seen=[]
          for term in terms:
            pos=0;n=0
            while True:
              i=low.find(term.lower(),pos)
              if i<0: break
              n+=1
              if not any(abs(i-j)<1200 for j in seen):
                seen.append(i)
                led.append(f'=== {term} hit {n} at {i} ===\n'+text[max(0,i-6000):min(len(text),i+17000)]+'\n')
              pos=i+len(term)
            counts[term]=n
          (out/'THERMO_COUNTS.txt').write_text('\n'.join(f'{k}: {v}' for k,v in counts.items())+'\n',encoding='utf-8')
          (out/'THERMO_LEDGER.txt').write_text('\n'.join(led),encoding='utf-8')
          exact=['Lemma 5.1','Lemma 5.2','Lemma 5.3','Lemma 5.4','Lemma 5.5','Theorem 5.6']
          summary=[]
          for target in exact:
            m=re.search(r'(?m)^\s*'+re.escape(target)+r'\b.*$',text)
            if not m:
              summary.append(target+': NOT FOUND'); continue
            tail=text[m.end():]
            nxt=re.search(r'(?m)^\s*(?:Lemma|Theorem|Proposition|Corollary|Definition)\s+\d+\.\d+\b',tail)
            end=m.end()+(nxt.start() if nxt else 17000)
            end=max(end,m.start()+6000); end=min(end,len(text))
            slug=target.lower().replace(' ','_').replace('.','_')
            (out/(slug+'.txt')).write_text(text[m.start():end],encoding='utf-8')
            summary.append(f'{target}: offset {m.start()}, chars {end-m.start()}')
          (out/'THERMO_EXACT_SUMMARY.txt').write_text('\n'.join(summary)+'\n',encoding='utf-8')
          print('\n'.join(f'{k}: {v}' for k,v in counts.items()))
          print('\n'.join(summary))
          PY
      - name: Deep scan 49-path formulas and schedule data
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('latest.txt').read_text(encoding='utf-8',errors='replace')
          out=Path('source_audit/kirk_v4/thermodynamic_limit_rp49_deep')
          lines=text.splitlines()
          terms=['49','7/8','1/384','P49','signed-corner','signed corner','staple','path-extent','path extent',
                 'positive schedule','aligned-reflection','aligned reflection','reflection boundary']
          counts={}; led=[]; seen=[]; low=text.lower()
          for term in terms:
            pos=0;n=0
            while True:
              i=low.find(term.lower(),pos)
              if i<0: break
              n+=1
              if term != '49' and not any(abs(i-j)<1000 for j in seen):
                seen.append(i)
                led.append(f'=== {term} hit {n} at {i} ===\n'+text[max(0,i-4500):min(len(text),i+12000)]+'\n')
              pos=i+len(term)
            counts[term]=n
          # Lines containing numbers/coordinate notation near path vocabulary.
          candidates=[]
          for no,line in enumerate(lines,1):
            l=line.lower()
            if ('path' in l or 'staple' in l or 'p49' in l or 'reflection' in l) and any(tok in line for tok in ['e_', 'eµ','eν','mu','nu','µ','ν','+','−','-','49','7/8','1/384']):
              candidates.append(f'{no}: {line}')
          (out/'RP49_DEEP_COUNTS.txt').write_text('\n'.join(f'{k}: {v}' for k,v in counts.items())+'\n',encoding='utf-8')
          (out/'RP49_DEEP_LEDGER.txt').write_text('\n'.join(led),encoding='utf-8')
          (out/'RP49_FORMULA_CANDIDATES.txt').write_text('\n'.join(candidates)+'\n',encoding='utf-8')
          print('\n'.join(f'{k}: {v}' for k,v in counts.items()))
          print('formula candidates',len(candidates))
          PY
      - name: Preserve deep audit
        run: |
          cp kirk_latest_record.json source_audit/kirk_v4/thermodynamic_limit_rp49_deep/
          sha256sum kirk_latest.pdf > source_audit/kirk_v4/thermodynamic_limit_rp49_deep/PDF_SHA256.txt
          git config user.name 'millennium-braid-source-audit'
          git config user.email 'actions@users.noreply.github.com'
          git add source_audit/kirk_v4/thermodynamic_limit_rp49_deep
          if ! git diff --cached --quiet; then
            git commit -m 'audit(ym): preserve thermodynamic-limit and RP49 deep contexts'
            git push origin HEAD:verification/ym-kirk-v4-cubic-drift-and-rp49-audit-20260815-gpt56sol
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kirk-v4-thermodynamic-limit-rp49-deep
          if-no-files-found: error
          retention-days: 30
          path: source_audit/kirk_v4/thermodynamic_limit_rp49_deep/
