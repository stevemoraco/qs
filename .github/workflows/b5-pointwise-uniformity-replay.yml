name: B5 Pointwise Uniformity Replay

on:
  push:
    branches:
      - agent/b5-synthesis-pointwise-uniformity-obstruction-20260813
  pull_request:
    paths:
      - 'formal/millennium_audit/SixLaneAudit/PointwiseUniformityObstruction.lean'
      - 'formal/millennium_audit/SixLaneAudit/BoundedCutoffCriterion.lean'
      - 'formal/millennium_audit/lean-toolchain'
      - 'formal/millennium_audit/lakefile.lean'
  workflow_dispatch:

jobs:
  lean-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Replay B5 pointwise uniformity sources
        run: |
          cd formal/millennium_audit
          lake update
          lake env lean SixLaneAudit/PointwiseUniformityObstruction.lean
          lake env lean SixLaneAudit/BoundedCutoffCriterion.lean
