name: RH Growing-Difference Budget Lean

on:
  push:
    branches:
      - agent/rh-growing-difference-budget-public-verify-20260811
    paths:
      - 'verification/rh-growing-difference-budget/**'
      - '.github/workflows/rh-growing-difference-budget-public-verify.yml'
  pull_request:
    branches: [main]
    paths:
      - 'verification/rh-growing-difference-budget/**'
      - '.github/workflows/rh-growing-difference-budget-public-verify.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Reject explicit placeholders and custom axioms
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path('verification/rh-growing-difference-budget/RHGrowingDifferenceBudgetFinite.lean')
          text = p.read_text()
          text = re.sub(r'/-.*?-/', '', text, flags=re.S)
          text = re.sub(r'--.*$', '', text, flags=re.M)
          for pattern in [r'^\s*(sorry|admit)\b', r'^\s*axiom\b']:
              m = re.search(pattern, text, flags=re.M)
              if m:
                  raise SystemExit(f'forbidden declaration: {m.group(0)!r}')
          PY

      - name: Install pinned Lean, fetch pinned Mathlib cache, and compile
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.32.1
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version
          lake --version
          cd verification/rh-growing-difference-budget
          lake update
          lake exe cache get
          lake env lean RHGrowingDifferenceBudgetFinite.lean \
            2>&1 | tee lean-output.log
          if grep -Eq 'declaration uses .sorry.|sorryAx|admit' lean-output.log; then
            echo 'Forbidden placeholder axiom found in compiler output.' >&2
            exit 1
          fi
          echo 'VERIFIED finite RH growing-difference budget core.'

      - name: Upload compiler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rh-growing-difference-budget-lean-evidence
          path: verification/rh-growing-difference-budget/lean-output.log
          if-no-files-found: warn
