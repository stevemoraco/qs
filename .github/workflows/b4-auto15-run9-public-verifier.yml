name: B4 AUTO15 run9 public verifier

on:
  push:
    branches:
      - agent/b4-auto15-run9-public-verifier-20260812-0615
    paths:
      - 'verification/b4-auto15-run9/**'
      - '.github/workflows/b4-auto15-run9-public-verifier.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Trust preflight
        shell: bash
        run: |
          set -euo pipefail
          f=verification/b4-auto15-run9/B4Auto15Run9Combined.lean
          if grep -nE '(^|[^A-Za-z0-9_])(sorry|admit|sorryAx|axiom|opaque|unsafe)([^A-Za-z0-9_]|$)' "$f"; then
            echo 'forbidden proof escape found'
            exit 1
          fi
          git hash-object "$f"
          sha256sum "$f"

      - name: AXLE Lean 4.30 compile
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          import urllib.request
          src = pathlib.Path('verification/b4-auto15-run9/B4Auto15Run9Combined.lean').read_text()
          payload = json.dumps({
              'content': src,
              'environment': 'lean-4.30.0',
              'ignore_imports': True,
              'mathlib_options': False,
              'timeout_seconds': 900,
          }).encode()
          req = urllib.request.Request(
              'https://axle.axiommath.ai/api/v1/check',
              data=payload,
              headers={'Content-Type':'application/json'},
              method='POST')
          with urllib.request.urlopen(req, timeout=960) as response:
              result = json.load(response)
          pathlib.Path('verification/b4-auto15-run9/AXLE_RESULT.json').write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          print(json.dumps(result, indent=2))
          if (not result.get('okay')
              or result.get('lean_messages', {}).get('errors', [])
              or result.get('tool_messages', {}).get('errors', [])
              or result.get('failed_declarations', [])):
              raise SystemExit(1)
          print('VERIFIED B4 AUTO15 run9 canonical source')
          PY

      - name: Postcompile trust gate
        shell: bash
        run: |
          set -euo pipefail
          f=verification/b4-auto15-run9/B4Auto15Run9Combined.lean
          if grep -nE '(^|[^A-Za-z0-9_])(sorryAx|admit|Lean\.ofReduceBool)([^A-Za-z0-9_]|$)' "$f"; then
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: b4-auto15-run9-public-verifier-evidence
          path: verification/b4-auto15-run9
          retention-days: 90
