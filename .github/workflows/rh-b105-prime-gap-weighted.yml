name: Verify RH B105 prime-gap weighted finite core

on:
  push:
    branches:
      - verification/rh-b105-prime-gap-weighted-20260814-gpt56sol
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Trust preflight
        shell: bash
        run: |
          set -euo pipefail
          FILE=verification/rh-b105/RHB105PrimeGapWeightedFinite.lean
          if grep -En '\b(sorry|admit|sorryAx|axiom|opaque|unsafe|native_decide|Lean\.ofReduceBool)\b' "$FILE"; then
            exit 1
          fi
      - name: Submit exact source
        id: submit
        shell: bash
        run: |
          set -euo pipefail
          FILE=verification/rh-b105/RHB105PrimeGapWeightedFinite.lean
          SOURCE_JSON=$(jq -Rs . < "$FILE")
          RESPONSE=$(curl --fail-with-body --retry 5 --retry-all-errors --retry-delay 3 -sS \
            -X POST 'https://lean-compile-farm.replit.app/api/compile' \
            -H 'Content-Type: application/json' \
            --data "{\"name\":\"rh-b105-${GITHUB_SHA}\",\"lean_source\":${SOURCE_JSON}}")
          JOB_ID=$(jq -er '.id' <<< "$RESPONSE")
          echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"
      - name: Require clean verified result
        shell: bash
        env:
          JOB_ID: ${{ steps.submit.outputs.job_id }}
        run: |
          set -euo pipefail
          ENDPOINT="https://lean-compile-farm.replit.app/api/jobs/${JOB_ID}"
          for attempt in $(seq 1 100); do
            JOB=$(curl --fail-with-body --retry 3 --retry-all-errors --retry-delay 2 -sS "$ENDPOINT")
            STATUS=$(jq -er '.status' <<< "$JOB")
            case "$STATUS" in
              done)
                echo "$JOB" > b105-axle-result.json
                jq '{status,verdict,sorry_count,error,axioms,verified_count,warnings}' <<< "$JOB"
                test "$(jq -r '.verdict' <<< "$JOB")" = VERIFIED
                test "$(jq -r '.sorry_count' <<< "$JOB")" = 0
                test "$(jq -r '.error' <<< "$JOB")" = null
                test "$(jq -r '.verified_count' <<< "$JOB")" -ge 12
                exit 0 ;;
              failed) jq . <<< "$JOB"; exit 1 ;;
              pending|compiling) sleep 15 ;;
              *) jq . <<< "$JOB"; exit 1 ;;
            esac
          done
          exit 1
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rh-b105-axle-evidence
          path: b105-axle-result.json
          if-no-files-found: ignore
