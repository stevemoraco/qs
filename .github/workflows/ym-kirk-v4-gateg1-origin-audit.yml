name: YM Kirk v4 Gate-G1 origin audit

on:
  push:
    branches:
      - verification/ym-kirk-v4-gateg1-origin-audit-20260816
    paths:
      - .github/workflows/ym-kirk-v4-gateg1-origin-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verification/ym-kirk-v4-gateg1-origin-audit-20260816
      - name: Ensure PDF text tools
        run: |
          if ! command -v pdftotext >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi
      - name: Pin immutable Kirk v4 source
        run: python3 tools/probe_kirk_latest_source.py >/tmp/probe.json
      - name: Trace Gate-G1 and invariant-graph suppliers
        run: |
          set -euo pipefail
          out=source_audit/kirk_v4/gateg1_origin
          rm -rf "$out"
          mkdir -p "$out"
          python3 - "$out" <<'PY'
          import re, sys
          from pathlib import Path

          out=Path(sys.argv[1])
          lines=Path('latest.txt').read_text(encoding='utf-8',errors='replace').splitlines()
          heading=re.compile(r'^\s*(Theorem|Lemma|Corollary|Proposition|Definition)\s+([A-Z]?\d+(?:\.\d+)*)\b',re.I)
          headings=[(i,heading.search(line).group(0).strip()) for i,line in enumerate(lines) if heading.search(line)]
          phrases=[
            'Gate–G1','Gate-G1','Gate G1','G1 invariant graph',
            'invariant graph','analytic graph','graph transform','forward-invariant cone',
            'R⋆','Rstar','R_*','support-summed interaction bound','∥Vj ∥a','∥Vj∥a',
            'Ku3','K u3','Ku^3','uω','u^ω','centered cone'
          ]
          counts={}
          chunks=[]
          nearest=[]
          hitset=set()
          for phrase in phrases:
            hits=[i for i,line in enumerate(lines) if phrase.lower() in line.lower()]
            counts[phrase]=len(hits)
            for k,i in enumerate(hits[:80],1):
              hitset.add(i)
              lo=max(0,i-110); hi=min(len(lines),i+190)
              chunks.append(f'===== {phrase} HIT {k} line {i+1} =====\n' +
                            '\n'.join(f'{j+1}: {lines[j]}' for j in range(lo,hi)))
          for i in sorted(hitset):
            prev=[(j,n) for j,n in headings if j<=i]
            nearest.append((i+1, prev[-1] if prev else None))

          # Candidate declarations whose next 150 lines mention the target currencies.
          candidates=[]
          keys=('invariant graph','graph transform','forward-invariant cone','r⋆','support-summed','centered cone')
          for i,name in headings:
            window='\n'.join(lines[i:min(len(lines),i+160)]).lower()
            if any(k in window for k in keys):
              candidates.append((i+1,name))
              lo=max(0,i-30); hi=min(len(lines),i+230)
              chunks.append(f'===== CANDIDATE {name} line {i+1} =====\n' +
                            '\n'.join(f'{j+1}: {lines[j]}' for j in range(lo,hi)))

          (out/'COUNTS.txt').write_text('\n'.join(f'{k}: {v}' for k,v in counts.items())+'\n',encoding='utf-8')
          (out/'NEAREST_HEADINGS.txt').write_text('\n'.join(
            f'phrase line {line}: ' + ('none' if p is None else f'line {p[0]+1}: {p[1]}')
            for line,p in nearest)+'\n',encoding='utf-8')
          (out/'CANDIDATES.txt').write_text('\n'.join(f'line {i}: {n}' for i,n in candidates)+'\n',encoding='utf-8')
          (out/'TARGETED.txt').write_text('\n\n'.join(chunks)+'\n',encoding='utf-8')
          (out/'QUESTION.txt').write_text(
            'What exact theorem supplies Lemma 8.3 proof currency ||V_j||_a <= C u_j?\n'
            'Is Gate-G1 a defined theorem/hypothesis, or shorthand for Theorem 5.27 U1/U3 plus the extracted coupling coordinate?\n'
            'Does the supplier have the same support exponent/norm and volume-cutoff-depth uniformity?\n',encoding='utf-8')
          print('\n'.join(f'{k}: {v}' for k,v in counts.items()))
          print('candidates',len(candidates))
          PY
          cp kirk_latest_record.json "$out/" || true
          cp kirk_source_probe_report.json "$out/" || true
          sha256sum kirk_latest.pdf > "$out/PDF_SHA256.txt"
      - name: Preserve audit
        run: |
          set -euo pipefail
          git config user.name 'millennium-braid-source-audit'
          git config user.email 'actions@users.noreply.github.com'
          git add source_audit/kirk_v4/gateg1_origin
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audit(ym): preserve Gate-G1 origin interfaces'
          git push origin HEAD:verification/ym-kirk-v4-gateg1-origin-audit-20260816
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ym-kirk-v4-gateg1-origin-audit
          if-no-files-found: warn
          retention-days: 30
          path: source_audit/kirk_v4/gateg1_origin/
