name: YM marginal coefficient matching finite core Lean

on:
  push:
    branches:
      - agent/ym-marginal-matching-public-verifier-20260812
    paths:
      - 'verification/ym-marginal-matching/**'
      - '.github/workflows/ym-marginal-matching-public-verify.yml'
  pull_request:
    branches: [main]
    paths:
      - 'verification/ym-marginal-matching/**'
      - '.github/workflows/ym-marginal-matching-public-verify.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Reject explicit placeholders and result carriers
        shell: bash
        run: |
          set -euo pipefail
          file=verification/ym-marginal-matching/YMMarginalCoefficientMatching.lean
          if grep -En '(^|[^[:alnum:]_])(sorry|admit|axiom|opaque|unsafe)([^[:alnum:]_]|$)' "$file"; then
            echo 'Forbidden Lean placeholder or result carrier found.' >&2
            exit 1
          fi

      - name: Install pinned Lean, fetch pinned Mathlib cache, and compile
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.32.1
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version
          lake --version
          cd verification/ym-marginal-matching
          lake update
          lake exe cache get
          lake env lean YMMarginalCoefficientMatching.lean 2>&1 | tee lean-output.log
          if grep -Eq 'declaration uses .sorry.|sorryAx|admit' lean-output.log; then
            echo 'Forbidden placeholder axiom found in compiler output.' >&2
            exit 1
          fi
          test -s lean-output.log
          echo 'VERIFIED finite YM marginal coefficient matching core.'

      - name: Upload compiler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ym-marginal-matching-finite-core-lean-evidence
          path: verification/ym-marginal-matching/lean-output.log
          if-no-files-found: error
