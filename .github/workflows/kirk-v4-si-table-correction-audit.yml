name: Kirk v4 SI table correction audit

on:
  pull_request:
    paths:
      - .github/workflows/kirk-v4-si-table-correction-audit.yml
      - tools/probe_kirk_latest_source.py

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Ensure pdftotext
        run: |
          if ! command -v pdftotext >/dev/null; then
            sudo apt-get update && sudo apt-get install -y poppler-utils
          fi
      - name: Pin and extract immutable v4 source
        run: python3 tools/probe_kirk_latest_source.py >/tmp/probe.json
      - name: Extract corrected dependency and physical-gap contexts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('latest.txt').read_text(encoding='utf-8', errors='replace')
          targets = [
            '1.4 External inputs and exact proof boundary',
            'Table 1: External standard inputs and exact proof boundary',
            'SI–6 Lüscher–Weisz', 'SI–6B Finite lattice BPHZ',
            'SI–7 Reisz lattice power', 'SI–7M Massless lattice',
            'Theorem 6.43', 'Theorem 6.44',
            'Lemma 8.2 (Depth-uniform physical rate floor)',
            'Theorem 8.9', 'Corollary 8.12', 'Lemma 8.13',
            'Theorem 8.45', 'Theorem 8.46',
            'Theorem 9.1', 'Lemma 9.2',
            'Theorem 10.2', 'Theorem 10.4', 'Theorem 10.5',
            'Lemma 10.6', 'Corollary 10.7'
          ]
          low = text.lower()
          out = []
          found = {}
          for target in targets:
            hits = []
            start = 0
            for _ in range(16):
              i = low.find(target.lower(), start)
              if i < 0:
                break
              hits.append(i)
              out.append(
                f'=== {target} hit {len(hits)} ===\n' +
                ' '.join(text[max(0, i-2200):min(len(text), i+6200)].split()) + '\n'
              )
              start = i + len(target)
            found[target] = len(hits)
          required = [
            '1.4 External inputs and exact proof boundary',
            'SI–6 Lüscher–Weisz', 'SI–6B Finite lattice BPHZ',
            'SI–7 Reisz lattice power', 'SI–7M Massless lattice',
            'Theorem 6.43', 'Lemma 8.2 (Depth-uniform physical rate floor)',
            'Corollary 8.12', 'Theorem 10.5', 'Corollary 10.7'
          ]
          missing = [x for x in required if found.get(x, 0) == 0]
          Path('kirk_v4_si_table_correction_contexts.txt').write_text('\n'.join(out), encoding='utf-8')
          Path('kirk_v4_si_table_correction_counts.txt').write_text(
            '\n'.join(f'{k}: {v}' for k, v in found.items()) + '\n', encoding='utf-8')
          print('\n'.join(f'{k}: {v}' for k, v in found.items()))
          if missing:
            raise SystemExit('missing required substantive anchors: ' + ', '.join(missing))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kirk-v4-si-table-correction
          if-no-files-found: error
          retention-days: 30
          path: |
            kirk_latest_record.json
            kirk_source_probe_report.json
            kirk_v4_si_table_correction_contexts.txt
            kirk_v4_si_table_correction_counts.txt
