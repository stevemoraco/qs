name: NS polarization rotation finite core

on:
  push:
    branches:
      - research/ns-polarization-rotation-public-verifier-20260813
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: verification/ns-polarization-rotation
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Resolve Mathlib and replay finite declarations
        shell: bash
        run: |
          set -euo pipefail
          root=verification/ns-polarization-rotation
          file="$root/NSPolarizationRotationFinite.lean"
          sha256sum "$file" | tee "$root/source-sha256.txt"
          if grep -En '(^|[^[:alnum:]_])(sorry|admit|axiom|opaque|unsafe)([^[:alnum:]_]|$)' "$file"; then
            exit 1
          fi
          cd "$root"
          lake update
          lake exe cache get
          lake env lean NSPolarizationRotationFinite.lean 2>&1 | tee lean-output.log
          if grep -Eq 'sorryAx|admit|Lean.ofReduceBool' lean-output.log; then
            exit 1
          fi
