name: NS Disconnected High-Set Finite Lean

on:
  push:
    branches:
      - agent/ns-disconnected-high-set-firewall-20260812
  pull_request:
    paths:
      - verification/ns-disconnected-high-set/**
      - .github/workflows/ns-disconnected-high-set-lean.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Reject placeholders and custom trust escapes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path('verification/ns-disconnected-high-set/NSDisconnectedHighSetFirewall.lean')
          source = p.read_text()
          source = re.sub(r'/-.*?-/', '', source, flags=re.S)
          source = re.sub(r'--.*$', '', source, flags=re.M)
          patterns = [
              r'^\s*(sorry|admit)\b',
              r'^\s*axiom\b',
              r'^\s*opaque\b',
              r'^\s*unsafe\b',
              r'\bnative_decide\b',
          ]
          for pattern in patterns:
              m = re.search(pattern, source, flags=re.M)
              if m:
                  raise SystemExit(f'forbidden declaration: {m.group(0)!r}')
          PY

      - name: Install pinned Lean and compile
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.32.1
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version
          lake --version
          cd verification/ns-disconnected-high-set
          lake update
          lake exe cache get
          lake env lean NSDisconnectedHighSetFirewall.lean \
            2>&1 | tee lean-output.log
          if grep -Eq 'declaration uses .sorry.|sorryAx|admit|Lean.ofReduceBool' lean-output.log; then
            echo 'Forbidden trust escape found in compiler output.' >&2
            exit 1
          fi
          echo 'VERIFIED finite NS disconnected-high-set scalar core.'

      - name: Upload compiler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ns-disconnected-high-set-lean-evidence
          path: verification/ns-disconnected-high-set/lean-output.log
          if-no-files-found: warn
