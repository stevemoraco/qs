name: Verify repaired NS AO algebra
on:
  push:
    branches: [agent/ns-ao-ground-state-current-verifier-20260813]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exact source digest
        run: |
          set -euo pipefail
          SRC=formal/millennium_audit/SixLaneAudit/NSAoGroundStateCurrent.lean
          test "$(sha256sum "$SRC" | cut -d' ' -f1)" = "f869b812c429551255ebd7f020762f10015ca6e497f8091c30a3abf30d02c42e"
          test "$(grep -c '#print axioms' "$SRC")" = 5
      - name: Lean replay
        run: |
          set -euo pipefail
          mkdir -p verification/ns-ao-ground-state-current-v2/evidence
          python3 - <<'PY'
          import json, pathlib, urllib.request
          source = pathlib.Path('formal/millennium_audit/SixLaneAudit/NSAoGroundStateCurrent.lean').read_text()
          body = json.dumps({'content': source, 'environment': 'lean-4.30.0', 'ignore_imports': True, 'mathlib_options': False, 'timeout_seconds': 900}).encode()
          request = urllib.request.Request('https://axle.axiommath.ai/api/v1/check', data=body, headers={'Content-Type':'application/json'}, method='POST')
          with urllib.request.urlopen(request, timeout=960) as response:
              result = json.load(response)
          pathlib.Path('verification/ns-ao-ground-state-current-v2/evidence/axle-response.json').write_text(json.dumps(result, indent=2, sort_keys=True))
          assert result.get('okay') is True
          assert result.get('failed_declarations', []) == []
          assert result.get('lean_messages', {}).get('errors', []) == []
          assert result.get('lean_messages', {}).get('warnings', []) == []
          assert result.get('tool_messages', {}).get('errors', []) == []
          assert result.get('tool_messages', {}).get('warnings', []) == []
          rendered = json.dumps(result)
          assert 'sorryAx' not in rendered
          assert 'Lean.ofReduceBool' not in rendered
          print(json.dumps(result, indent=2))
          PY
      - name: Replay metadata
        if: always()
        run: |
          mkdir -p verification/ns-ao-ground-state-current-v2/evidence
          printf 'commit=%s\nsource_sha256=%s\nenvironment=lean-4.30.0\n' "$GITHUB_SHA" "$(sha256sum formal/millennium_audit/SixLaneAudit/NSAoGroundStateCurrent.lean | cut -d' ' -f1)" > verification/ns-ao-ground-state-current-v2/evidence/replay-metadata.txt
      - name: Upload replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ns-ao-ground-state-current-v2-evidence
          path: verification/ns-ao-ground-state-current-v2/evidence/
          if-no-files-found: error
