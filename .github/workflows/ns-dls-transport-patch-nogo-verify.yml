name: NS DLS transport patch no-go verifier

on:
  push:
    branches:
      - agent/ns-dls-transport-patch-nogo-verifier-20260813
    paths:
      - 'verification/ns-dls-transport-patch-nogo/**'
      - '.github/workflows/ns-dls-transport-patch-nogo-verify.yml'
  pull_request:
    paths:
      - 'verification/ns-dls-transport-patch-nogo/**'
      - '.github/workflows/ns-dls-transport-patch-nogo-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Verify trust boundary and exact source blob
        shell: bash
        run: |
          set -euo pipefail
          dir='verification/ns-dls-transport-patch-nogo'
          file="$dir/NSDLSTransportPatchNoGo.lean"
          actual_blob="$(git hash-object "$file")"
          expected_blob='3054589f7643ecca91328a45ed228a268a71366b'
          test "$actual_blob" = "$expected_blob"
          printf 'canonical_rh_lean_blob=%s\n' "$actual_blob" | tee "$dir/source-blob.txt"
          sha256sum "$file" | tee "$dir/source-sha256.txt"
          if grep -En '(^|[^[:alnum:]_])(sorry|admit|sorryAx)([^[:alnum:]_]|$)' "$file"; then
            echo 'Forbidden proof placeholder found.' >&2
            exit 1
          fi
          if grep -En '^[[:space:]]*(axiom|opaque|unsafe)[[:space:]]' "$file"; then
            echo 'Forbidden trust declaration found.' >&2
            exit 1
          fi
          if grep -En '(native_decide|Lean\.ofReduceBool)' "$file"; then
            echo 'Forbidden computational trust escape found.' >&2
            exit 1
          fi

      - name: Install pinned Lean and compile exact source
        shell: bash
        run: |
          set -euo pipefail
          dir='verification/ns-dls-transport-patch-nogo'
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.32.1
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version | tee "$dir/lean-version.txt"
          lake --version | tee -a "$dir/lean-version.txt"
          cd "$dir"
          lake update
          lake exe cache get
          set +e
          lake env lean NSDLSTransportPatchNoGo.lean > lean-output.log 2>&1
          status=$?
          set -e
          cat lean-output.log
          if [ "$status" -ne 0 ]; then
            echo "Lean compilation failed with status $status" >&2
            exit "$status"
          fi
          if grep -Eq 'declaration uses .sorry.|sorryAx|admit|Lean.ofReduceBool' lean-output.log; then
            echo 'Forbidden dependency found in compiler report.' >&2
            exit 1
          fi
          echo 'VERIFIED NS DLS transport patch no-go finite core.'

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ns-dls-transport-patch-nogo-evidence
          path: |
            verification/ns-dls-transport-patch-nogo/source-blob.txt
            verification/ns-dls-transport-patch-nogo/source-sha256.txt
            verification/ns-dls-transport-patch-nogo/lean-version.txt
            verification/ns-dls-transport-patch-nogo/lean-output.log
