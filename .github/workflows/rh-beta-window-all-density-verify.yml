name: RH Beta Window All Density Finite Core

on:
  push:
    branches:
      - research/rh-beta-window-all-density-public-verifier-20260812
    paths:
      - 'verification/rh-beta-window-all-density/**'
      - '.github/workflows/rh-beta-window-all-density-verify.yml'
  pull_request:
    branches: [main]
    paths:
      - 'verification/rh-beta-window-all-density/**'
      - '.github/workflows/rh-beta-window-all-density-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Record source hashes and reject placeholders
        shell: bash
        run: |
          set -euo pipefail
          root=verification/rh-beta-window-all-density
          sha256sum "$root/RHBetaWindowAllDensityFinite.lean" \
                    "$root/verify_beta_window_all_density.py" \
            | tee "$root/source-sha256.txt"
          if grep -En '(^|[^[:alnum:]_])(sorry|admit|axiom|opaque|unsafe)([^[:alnum:]_]|$)' \
              "$root/RHBetaWindowAllDensityFinite.lean"; then
            echo 'Forbidden Lean placeholder or custom trust declaration found.' >&2
            exit 1
          fi

      - name: Replay deterministic beta-window falsifier
        shell: bash
        run: |
          set -euo pipefail
          root=verification/rh-beta-window-all-density
          python3 --version | tee "$root/python-version.txt"
          python3 -m pip install --disable-pip-version-check --no-input \
            'numpy==2.3.2' 'mpmath==1.3.0'
          python3 "$root/verify_beta_window_all_density.py" \
            --seed 260812 \
            --tolerance 1e-9 \
            --precision 70 \
            --output "$root/finite-certificate.json"
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('verification/rh-beta-window-all-density/finite-certificate.json')
          data = json.loads(path.read_text())
          assert data['parameter_case_count'] == 128
          assert data['all_root_constants_below_30'] is True
          assert data['all_rho_budgets_below_quarter'] is True
          assert data['all_beta_gram_cases_verified'] is True
          print('parameter_cases=', data['parameter_case_count'])
          print('gram_cases=', data['gram_case_count'])
          print('maximum_root_constant=', data['maximum_root_constant'])
          print('maximum_rho=', data['maximum_rho'])
          print('minimum_beta_gram_margin=', data['minimum_beta_gram_margin'])
          PY

      - name: Install pinned Lean, fetch pinned Mathlib, and compile
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.32.1
          export PATH="$HOME/.elan/bin:$PATH"
          root=verification/rh-beta-window-all-density
          lean --version | tee "$root/lean-version.txt"
          lake --version | tee -a "$root/lean-version.txt"
          cd "$root"
          lake update
          lake exe cache get
          set +e
          lake env lean RHBetaWindowAllDensityFinite.lean 2>&1 | tee lean-output.log
          status=${PIPESTATUS[0]}
          set -e
          if grep -Eq 'declaration uses .sorry.|sorryAx|admit|Lean.ofReduceBool' lean-output.log; then
            echo 'Forbidden dependency found in compiler report.' >&2
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          echo 'VERIFIED finite RH beta-window scalar and type firewalls.'

      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rh-beta-window-all-density-finite-evidence
          path: |
            verification/rh-beta-window-all-density/source-sha256.txt
            verification/rh-beta-window-all-density/python-version.txt
            verification/rh-beta-window-all-density/finite-certificate.json
            verification/rh-beta-window-all-density/lean-version.txt
            verification/rh-beta-window-all-density/lean-output.log
          if-no-files-found: warn
