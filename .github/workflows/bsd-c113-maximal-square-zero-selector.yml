name: BSD C113 maximal square-zero selector

on:
  push:
    branches:
      - verification/bsd-c113-maximal-square-zero-selector-20260816
    paths:
      - '.github/workflows/bsd-c113-maximal-square-zero-selector.yml'
      - 'verification/bsd-c113-maximal-square-zero-selector/*.lean'
  pull_request:
    paths:
      - '.github/workflows/bsd-c113-maximal-square-zero-selector.yml'
      - 'verification/bsd-c113-maximal-square-zero-selector/*.lean'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Trust preflight
        shell: bash
        run: |
          set -euo pipefail
          SRC=verification/bsd-c113-maximal-square-zero-selector/MaximalSquareZeroSelector.lean
          if grep -nE '\b(sorry|admit|sorryAx|axiom|opaque|unsafe|native_decide|Lean\.ofReduceBool)\b' "$SRC"; then exit 1; fi
      - name: Run AXLE and capture result
        shell: bash
        run: |
          set -euo pipefail
          SRC=verification/bsd-c113-maximal-square-zero-selector/MaximalSquareZeroSelector.lean
          SRC="$SRC" python3 - <<'PY'
          import json, os, pathlib, urllib.request
          path=pathlib.Path(os.environ['SRC'])
          payload=json.dumps({
            'content':path.read_text(),
            'environment':'lean-4.30.0',
            'ignore_imports':True,
            'mathlib_options':False,
            'timeout_seconds':900,
          }).encode()
          req=urllib.request.Request('https://axle.axiommath.ai/api/v1/check',data=payload,headers={'Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=960) as response:
            result=json.load(response)
          pathlib.Path('axle-result.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result,indent=2))
          PY
      - name: Upload AXLE result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bsd-c113-axle-result
          path: axle-result.json
      - name: Enforce clean compiler verdict
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib
          result=json.loads(pathlib.Path('axle-result.json').read_text())
          lean=result.get('lean_messages',{})
          tool=result.get('tool_messages',{})
          bad=(not result.get('okay') or bool(result.get('failed_declarations',[])) or bool(lean.get('errors',[])) or bool(lean.get('warnings',[])) or bool(tool.get('errors',[])) or bool(tool.get('warnings',[])) or 'sorryAx' in json.dumps(result))
          if bad:
            raise SystemExit(1)
          PY
