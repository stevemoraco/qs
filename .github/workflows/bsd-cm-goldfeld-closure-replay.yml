name: BSD CM Goldfeld closure independent Lean replay

on:
  push:
    branches:
      - agent/bsd-cm-goldfeld-closure-replay-20260814
    paths:
      - 'verification/bsd-cm-goldfeld-closure/**'
      - '.github/workflows/bsd-cm-goldfeld-closure-replay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Reject explicit proof holes and conclusion-carrying escape hatches
        shell: bash
        run: |
          set -euo pipefail
          file=verification/bsd-cm-goldfeld-closure/CMGoldfeldClosureCore.lean
          if grep -nE '\b(sorry|admit|sorryAx)\b' "$file"; then
            echo 'Explicit proof hole found'
            exit 1
          fi
          if grep -nE '\b(axiom|opaque|unsafe|native_decide|Lean\.ofReduceBool)\b' "$file"; then
            echo 'Forbidden escape hatch found'
            exit 1
          fi

      - name: Install pinned Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.31.0

      - name: Resolve pinned Mathlib and fetch cache
        shell: bash
        working-directory: verification/bsd-cm-goldfeld-closure
        run: |
          set -euo pipefail
          lake update
          lake exe cache get

      - name: Kernel replay and axiom report
        shell: bash
        working-directory: verification/bsd-cm-goldfeld-closure
        run: |
          set -euo pipefail
          lean --version
          lake env lean CMGoldfeldClosureCore.lean | tee lean-replay.log
          test "$(grep -c '^warning: declaration uses' lean-replay.log || true)" -eq 0
          ! grep -q 'sorryAx' lean-replay.log
