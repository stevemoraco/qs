name: Verify PNP pedigree axiom audit

on:
  workflow_dispatch:
  push:
    paths:
      - "verification/pnp_pedigree_axiom_audit/**"
      - ".github/workflows/verify-pnp-pedigree-axiom-audit.yml"
  pull_request:
    paths:
      - "verification/pnp_pedigree_axiom_audit/**"
      - ".github/workflows/verify-pnp-pedigree-axiom-audit.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: verification/pnp_pedigree_axiom_audit

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify exact source and trust gate
        shell: bash
        run: |
          set -euo pipefail
          file=PedigreeAxiomAudit.lean
          test "$(git hash-object "$file")" = "e59448ee0bd82d0a0aca82b92155c973180fc93b"
          if grep -nE '\b(sorry|admit|sorryAx|unsafe|opaque|native_decide)\b|^axiom |Lean\.ofReduceBool' "$file"; then
            echo "Forbidden token found"
            exit 1
          fi

      - name: Install elan
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get

      - name: Kernel-check exact source
        shell: bash
        run: |
          set -euo pipefail
          lake env lean PedigreeAxiomAudit.lean 2>&1 | tee lean-output.txt
          if grep -q 'sorryAx' lean-output.txt; then
            echo "sorryAx found in axiom report"
            exit 1
          fi

      - name: Reject compiler warnings
        shell: bash
        run: |
          set -euo pipefail
          if grep -qi 'warning:' lean-output.txt; then
            cat lean-output.txt
            exit 1
          fi

      - name: Upload replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pnp-pedigree-axiom-audit-replay
          path: |
            verification/pnp_pedigree_axiom_audit/PedigreeAxiomAudit.lean
            verification/pnp_pedigree_axiom_audit/lean-output.txt
          if-no-files-found: warn
