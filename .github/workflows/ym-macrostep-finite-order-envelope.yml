name: YM macrostep finite-order envelope

on:
  push:
    branches:
      - verification/ym-macrostep-finite-order-envelope-20260814-gpt56
    paths:
      - .github/workflows/ym-macrostep-finite-order-envelope.yml
      - verification/ym-macrostep-finite-order-envelope/MacrostepFiniteOrderEnvelope.lean

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify flattened Lean theorem source
        shell: bash
        run: |
          set -euo pipefail
          SRC=verification/ym-macrostep-finite-order-envelope/MacrostepFiniteOrderEnvelope.lean
          if grep -nE '\b(sorry|admit|sorryAx|axiom|opaque|unsafe|native_decide|Lean\.ofReduceBool)\b' "$SRC"; then exit 1; fi
          SRC="$SRC" python3 - <<'PY'
          import json, os, pathlib, urllib.request
          path = pathlib.Path(os.environ['SRC'])
          payload = json.dumps({
              'content': path.read_text(),
              'environment': 'lean-4.30.0',
              'ignore_imports': True,
              'mathlib_options': False,
              'timeout_seconds': 900,
          }).encode()
          req = urllib.request.Request(
              'https://axle.axiommath.ai/api/v1/check', data=payload,
              headers={'Content-Type':'application/json'}, method='POST')
          with urllib.request.urlopen(req, timeout=960) as response:
              result = json.load(response)
          print(json.dumps(result, indent=2))
          lean = result.get('lean_messages', {})
          tool = result.get('tool_messages', {})
          bad = (
              not result.get('okay')
              or bool(result.get('failed_declarations', []))
              or bool(lean.get('errors', []))
              or bool(lean.get('warnings', []))
              or bool(tool.get('errors', []))
              or bool(tool.get('warnings', []))
              or 'sorryAx' in json.dumps(result)
          )
          if bad:
              compact = json.dumps(result, separators=(',', ':'))
              print('::error::AXLE_RESULT=' + compact[:6000])
              raise SystemExit(1)
          PY
