name: B5 BSD Smith-family hostile AXLE replay

on:
  push:
    branches: [agent/b5-bsd-smith-family-public-verifier-20260812]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b5-bsd-smith-family-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            verification/b5-bsd-smith-family/B5BSDSmithFamily.lean
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Source trust gate
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path('verification/b5-bsd-smith-family/B5BSDSmithFamily.lean')
          text = p.read_text()
          forbidden = [r'(^|[^A-Za-z0-9_])sorry([^A-Za-z0-9_]|$)',r'(^|[^A-Za-z0-9_])admit([^A-Za-z0-9_]|$)',r'(^|[^A-Za-z0-9_])axiom([^A-Za-z0-9_]|$)',r'(^|[^A-Za-z0-9_])opaque([^A-Za-z0-9_]|$)',r'(^|[^A-Za-z0-9_])unsafe([^A-Za-z0-9_]|$)']
          for pat in forbidden:
              if re.search(pat, text): raise SystemExit(f'forbidden source construct matches {pat}')
          if len(re.findall(r'(?m)^theorem\s+', text)) != 2 or len(re.findall(r'(?m)^#print axioms\s+', text)) != 2:
              raise SystemExit('expected exactly 2 theorems and 2 axiom prints')
          print('PRECHECK OK')
          PY

      - name: Verify exact source with AXLE Lean 4.30
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, urllib.request
          p = pathlib.Path('verification/b5-bsd-smith-family/B5BSDSmithFamily.lean')
          content = p.read_text(); print('source_sha256=' + hashlib.sha256(content.encode()).hexdigest())
          payload=json.dumps({'content':content,'environment':'lean-4.30.0','ignore_imports':True,'mathlib_options':False,'timeout_seconds':900}).encode()
          req=urllib.request.Request('https://axle.axiommath.ai/api/v1/check',data=payload,headers={'Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=960) as r: result=json.load(r)
          pathlib.Path('verification/b5-bsd-smith-family/axle-result.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print(json.dumps(result,indent=2))
          rendered=json.dumps(result)
          if 'sorryAx' in rendered or 'Lean.ofReduceBool' in rendered: raise SystemExit('forbidden postcompile axiom/escape')
          if not result.get('okay') or result.get('failed_declarations') or result.get('lean_messages',{}).get('errors') or result.get('tool_messages',{}).get('errors'): raise SystemExit(1)
          print('VERIFIED: BSD Smith-family adjacent jump compiled')
          PY

      - name: Upload exact verifier evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b5-bsd-smith-family-axle-evidence
          path: |
            verification/b5-bsd-smith-family/B5BSDSmithFamily.lean
            verification/b5-bsd-smith-family/axle-result.json
          if-no-files-found: warn
