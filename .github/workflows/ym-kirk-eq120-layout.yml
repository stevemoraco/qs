name: YM Kirk v4 equation-120 layout audit

on:
  push:
    branches:
      - verification/ym-kirk-v4-local-source-ball-body-20260816-run3
    paths:
      - .github/workflows/ym-kirk-eq120-layout.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verification/ym-kirk-v4-local-source-ball-body-20260816-run3
      - name: Ensure pdftotext
        run: |
          if ! command -v pdftotext >/dev/null; then sudo apt-get update && sudo apt-get install -y poppler-utils; fi
      - name: Pin immutable Kirk source
        run: python3 tools/probe_kirk_latest_source.py >/tmp/probe.json
      - name: Preserve layout around equation 120
        run: |
          set -euo pipefail
          pdftotext -layout kirk_latest.pdf latest_layout.txt
          python3 - <<'PY'
          from pathlib import Path
          text=Path('latest_layout.txt').read_text(encoding='utf-8',errors='replace')
          out=Path('source_audit/kirk_v4/local_source_ball_body'); out.mkdir(parents=True,exist_ok=True)
          needles=['(120)','Theorem 8.11','Corollary 8.12']
          chunks=[]
          for needle in needles:
              pos=0; n=0
              while True:
                  i=text.find(needle,pos)
                  if i<0: break
                  n+=1
                  chunks.append(f'=== {needle} hit {n} at {i} ===\n'+text[max(0,i-7000):min(len(text),i+9000)]+'\n')
                  pos=i+len(needle)
          (out/'EQ120_LAYOUT.txt').write_text('\n'.join(chunks),encoding='utf-8')
          if '(120)' not in text: raise SystemExit('equation 120 not found')
          PY
      - name: Commit layout audit
        run: |
          git config user.name 'millennium-braid-source-audit'
          git config user.email 'actions@users.noreply.github.com'
          git add source_audit/kirk_v4/local_source_ball_body/EQ120_LAYOUT.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audit(ym): preserve exact layout around equation 120'
          git push origin HEAD:verification/ym-kirk-v4-local-source-ball-body-20260816-run3
