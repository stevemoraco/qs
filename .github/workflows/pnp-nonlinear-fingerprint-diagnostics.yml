name: PNP nonlinear fingerprint diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/pnp-nonlinear-fingerprint-firewall/**'
      - '.github/workflows/pnp-nonlinear-fingerprint-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve Mathlib
        working-directory: verification/pnp-nonlinear-fingerprint-firewall
        run: |
          lake update
          lake exe cache get
      - name: Compile without stopping
        id: lean
        working-directory: verification/pnp-nonlinear-fingerprint-firewall
        run: |
          set +e
          lake env lean PNPNonlinearFingerprintFirewall.lean > lean-diagnostic.log 2>&1
          status=$?
          cat lean-diagnostic.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit diagnostic when compilation fails
        if: steps.lean.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          src=verification/pnp-nonlinear-fingerprint-firewall/lean-diagnostic.log
          content=$(base64 -w 0 "$src")
          path=verification/pnp-nonlinear-fingerprint-firewall/last-failed-replay.log
          current=$(gh api "repos/$REPO/contents/$path?ref=$HEAD_REF" --jq .sha 2>/dev/null || true)
          if [ -n "$current" ]; then
            gh api --method PUT "repos/$REPO/contents/$path" \
              -f message='Record nonlinear fingerprint Lean diagnostics' \
              -f content="$content" -f branch="$HEAD_REF" -f sha="$current" >/dev/null
          else
            gh api --method PUT "repos/$REPO/contents/$path" \
              -f message='Record nonlinear fingerprint Lean diagnostics' \
              -f content="$content" -f branch="$HEAD_REF" >/dev/null
          fi
      - name: Enforce success
        run: test "${{ steps.lean.outputs.status }}" = 0
