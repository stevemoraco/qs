name: YM FS tail visibility physical units

on:
  push:
    branches:
      - verification/ym-fs-tail-visibility-physical-units-20260817
    paths:
      - verification/ym-fs-tail-visibility-physical-units/*.lean
      - .github/workflows/ym-fs-tail-visibility-physical-units.yml
  pull_request:
    paths:
      - verification/ym-fs-tail-visibility-physical-units/*.lean
      - .github/workflows/ym-fs-tail-visibility-physical-units.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verification/ym-fs-tail-visibility-physical-units-20260817
      - name: Verify flattened Lean theorem source
        shell: bash
        run: |
          set -euo pipefail
          SRC=verification/ym-fs-tail-visibility-physical-units/FaizalShabirTailVisibilityPhysicalUnits.lean
          RECEIPT=verification/ym-fs-tail-visibility-physical-units/AXLE_RECEIPT.json
          if grep -nE '\b(sorry|admit|sorryAx|axiom|opaque|unsafe|native_decide|Lean\.ofReduceBool)\b' "$SRC"; then exit 1; fi
          SRC="$SRC" RECEIPT="$RECEIPT" python3 - <<'PY'
          import hashlib, json, os, pathlib, urllib.request
          path = pathlib.Path(os.environ['SRC'])
          receipt_path = pathlib.Path(os.environ['RECEIPT'])
          source = path.read_text()
          payload = json.dumps({
            'content': source,
            'environment': 'lean-4.30.0',
            'ignore_imports': True,
            'mathlib_options': False,
            'timeout_seconds': 900,
          }).encode()
          req = urllib.request.Request(
            'https://axle.axiommath.ai/api/v1/check',
            data=payload,
            headers={'Content-Type': 'application/json'},
            method='POST',
          )
          with urllib.request.urlopen(req, timeout=960) as response:
            result = json.load(response)
          receipt = {
            'source_path': str(path),
            'source_sha256': hashlib.sha256(source.encode()).hexdigest(),
            'axle_environment': 'lean-4.30.0',
            'axle_result': result,
          }
          receipt_path.write_text(json.dumps(receipt, indent=2))
          pathlib.Path('/tmp/ym-fs-tail-visibility-axle-receipt.json').write_text(
            json.dumps(receipt, indent=2)
          )
          print(json.dumps(receipt, indent=2))
          PY
          git config user.name 'ym-fs-verifier'
          git config user.email 'actions@users.noreply.github.com'
          git add "$RECEIPT"
          if ! git diff --cached --quiet; then
            git commit -m 'verify(ym): preserve tail visibility AXLE receipt'
            git push origin HEAD:verification/ym-fs-tail-visibility-physical-units-20260817
          fi
      - name: Enforce clean verdict
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path('verification/ym-fs-tail-visibility-physical-units/AXLE_RECEIPT.json')
          receipt = json.loads(p.read_text())
          result = receipt['axle_result']
          lean = result.get('lean_messages', {})
          tool = result.get('tool_messages', {})
          bad = (
            not result.get('okay')
            or bool(result.get('failed_declarations', []))
            or bool(lean.get('errors', []))
            or bool(lean.get('warnings', []))
            or bool(tool.get('errors', []))
            or bool(tool.get('warnings', []))
            or 'sorryAx' in json.dumps(result)
          )
          if bad:
            raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ym-fs-tail-visibility-physical-units-axle-receipt
          if-no-files-found: warn
          retention-days: 30
          path: /tmp/ym-fs-tail-visibility-axle-receipt.json
