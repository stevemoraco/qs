name: NS critical-norm compactness firewall

on:
  push:
    branches:
      - automation/ns-critical-norm-compactness-replay-20260813-run7
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Reject trust escapes
        shell: bash
        run: |
          set -euo pipefail
          SRC=verification/ns-critical-norm-compactness/NSCriticalNormCompactnessFirewall.lean
          if grep -nE '\b(sorry|admit|sorryAx|axiom|opaque|unsafe|native_decide|Lean\.ofReduceBool)\b' "$SRC"; then
            exit 1
          fi
          test "$(grep -c '^#print axioms ' "$SRC")" = 3
      - name: Submit exact source to Lean compile farm
        id: submit
        shell: bash
        run: |
          set -euo pipefail
          SRC=verification/ns-critical-norm-compactness/NSCriticalNormCompactnessFirewall.lean
          SOURCE_JSON=$(jq -Rs . < "$SRC")
          RESPONSE=$(curl --fail-with-body --retry 5 --retry-all-errors --retry-delay 3 -sS \
            -X POST 'https://lean-compile-farm.replit.app/api/compile' \
            -H 'Content-Type: application/json' \
            --data "{\"name\":\"ns-critical-norm-${GITHUB_SHA}\",\"lean_source\":${SOURCE_JSON}}")
          printf '%s\n' "$RESPONSE" | tee verification/ns-critical-norm-compactness/submit-response.json
          JOB_ID=$(jq -er '.id' <<< "$RESPONSE")
          echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"
      - name: Require VERIFIED with zero sorry
        shell: bash
        env:
          JOB_ID: ${{ steps.submit.outputs.job_id }}
        run: |
          set -euo pipefail
          ENDPOINT="https://lean-compile-farm.replit.app/api/jobs/${JOB_ID}"
          for attempt in $(seq 1 80); do
            JOB=$(curl --fail-with-body --retry 3 --retry-all-errors --retry-delay 2 -sS "$ENDPOINT")
            printf '%s\n' "$JOB" > verification/ns-critical-norm-compactness/final-response.json
            STATUS=$(jq -er '.status' <<< "$JOB")
            case "$STATUS" in
              done)
                jq '{status,verdict,sorry_count,error,axioms,verified_count}' <<< "$JOB"
                test "$(jq -r '.verdict' <<< "$JOB")" = VERIFIED
                test "$(jq -r '.sorry_count' <<< "$JOB")" = 0
                test "$(jq -r '.verified_count' <<< "$JOB")" -ge 3
                test "$(jq -r '.error' <<< "$JOB")" = null
                exit 0
                ;;
              failed) jq . <<< "$JOB"; exit 1 ;;
              pending|compiling) sleep 15 ;;
              *) jq . <<< "$JOB"; exit 1 ;;
            esac
          done
          exit 1
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ns-critical-norm-compactness-evidence
          path: verification/ns-critical-norm-compactness/
