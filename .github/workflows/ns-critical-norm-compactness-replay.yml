name: NS critical-norm compactness firewall

on:
  push:
    branches:
      - automation/ns-critical-norm-compactness-replay-20260813-run7
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Reject trust escapes
        shell: bash
        run: |
          set -euo pipefail
          SRC=verification/ns-critical-norm-compactness/NSCriticalNormCompactnessFirewall.lean
          if grep -nE '\b(sorry|admit|sorryAx|axiom|opaque|unsafe|native_decide|Lean\.ofReduceBool)\b' "$SRC"; then
            exit 1
          fi
          test "$(grep -c '^#print axioms ' "$SRC")" = 3
      - name: Execute AXLE Lean 4.30
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, urllib.request
          p = pathlib.Path('verification/ns-critical-norm-compactness/NSCriticalNormCompactnessFirewall.lean')
          payload = json.dumps({
              'content': p.read_text(),
              'environment': 'lean-4.30.0',
              'ignore_imports': True,
              'mathlib_options': False,
              'timeout_seconds': 600,
          }).encode()
          req = urllib.request.Request(
              'https://axle.axiommath.ai/api/v1/check', data=payload,
              headers={'Content-Type':'application/json'}, method='POST')
          with urllib.request.urlopen(req, timeout=660) as response:
              result = json.load(response)
          pathlib.Path('verification/ns-critical-norm-compactness/axle-response.json').write_text(
              json.dumps(result, indent=2, sort_keys=True))
          print(json.dumps(result, indent=2))
          errors = result.get('lean_messages', {}).get('errors', [])
          warnings = result.get('lean_messages', {}).get('warnings', [])
          failed = result.get('failed_declarations', [])
          if not result.get('okay') or errors or warnings or failed:
              raise SystemExit(1)
          if 'sorryAx' in json.dumps(result):
              raise SystemExit(1)
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ns-critical-norm-compactness-evidence
          path: verification/ns-critical-norm-compactness/
