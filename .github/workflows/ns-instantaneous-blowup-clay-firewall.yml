name: NS Instantaneous-Blowup Clay Firewall

on:
  push:
    branches:
      - agent/ns-instantaneous-blowup-clay-firewall-20260813
  pull_request:
    paths:
      - 'verification/ns-instantaneous-blowup-clay-firewall/**'
      - 'research/navier_stokes/NS_NEWEST_BLOWUP_CLAY_FIREWALL_2026-08-13.md'
      - '.github/workflows/ns-instantaneous-blowup-clay-firewall.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Reject trust escapes
        shell: bash
        run: |
          set -euo pipefail
          dir='verification/ns-instantaneous-blowup-clay-firewall'
          file="$dir/NSTimeReversalFinite.lean"
          git hash-object "$file" | tee "$dir/source-blob.txt"
          sha256sum "$file" | tee "$dir/source-sha256.txt"
          if grep -En '(^|[^[:alnum:]_])(sorry|admit|sorryAx)([^[:alnum:]_]|$)' "$file"; then
            echo 'Forbidden proof placeholder found.' >&2
            exit 1
          fi
          if grep -En '^[[:space:]]*(axiom|opaque|unsafe)[[:space:]]' "$file"; then
            echo 'Forbidden custom trust declaration found.' >&2
            exit 1
          fi
          if grep -En '(native_decide|Lean\.ofReduceBool)' "$file"; then
            echo 'Forbidden computational trust escape found.' >&2
            exit 1
          fi
      - name: Install pinned Lean and compile
        shell: bash
        run: |
          set -euo pipefail
          dir='verification/ns-instantaneous-blowup-clay-firewall'
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.32.1
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version | tee "$dir/lean-version.txt"
          lake --version | tee -a "$dir/lean-version.txt"
          cd "$dir"
          lake update
          lake exe cache get
          set +e
          lake env lean NSTimeReversalFinite.lean > lean-output.log 2>&1
          lean_status=$?
          set -e
          cat lean-output.log
          if [ "$lean_status" -ne 0 ]; then
            exit "$lean_status"
          fi
          if grep -Eq 'declaration uses .sorry.|sorryAx|admit|Lean.ofReduceBool' lean-output.log; then
            echo 'Forbidden dependency found in compiler report.' >&2
            exit 1
          fi
          echo 'VERIFIED NS time-reversal residual firewall.'
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ns-instantaneous-blowup-clay-firewall-evidence
          path: |
            verification/ns-instantaneous-blowup-clay-firewall/source-blob.txt
            verification/ns-instantaneous-blowup-clay-firewall/source-sha256.txt
            verification/ns-instantaneous-blowup-clay-firewall/lean-version.txt
            verification/ns-instantaneous-blowup-clay-firewall/lean-output.log
