name: Round 219 NS Projective Scaling Finite Cores

on:
  push:
    branches:
      - agent/round219-ns-projective-scaling-verify-20260812
  pull_request:
    paths:
      - 'verification/round219-ns-projective-scaling/**'
      - '.github/workflows/round219-ns-projective-scaling.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: round219-ns-projective-scaling-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Reject explicit placeholders and custom proof carriers
        shell: bash
        run: |
          set -euo pipefail
          file=verification/round219-ns-projective-scaling/Round219NSProjectiveScalingFinite.lean
          if grep -En '(^|[^[:alnum:]_])(sorry|admit|axiom|opaque|unsafe|native_decide)([^[:alnum:]_]|$)|Lean\.ofReduceBool' "$file"; then
            echo 'Forbidden proof placeholder or custom proof carrier found.' >&2
            exit 1
          fi

      - name: Install pinned Lean, fetch pinned Mathlib cache, and compile
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.32.1
          export PATH="$HOME/.elan/bin:$PATH"
          cd verification/round219-ns-projective-scaling
          lake update
          lake exe cache get
          lake env lean Round219NSProjectiveScalingFinite.lean 2>&1 | tee lean-output.log
          if grep -Eq 'declaration uses .sorry.|sorryAx|admit' lean-output.log; then
            echo 'Forbidden placeholder axiom found in compiler output.' >&2
            exit 1
          fi
          echo 'VERIFIED finite Round 219 NS projective scaling cores.'

      - name: Upload compiler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: round219-ns-projective-scaling-lean-evidence
          path: verification/round219-ns-projective-scaling/lean-output.log
          if-no-files-found: warn
