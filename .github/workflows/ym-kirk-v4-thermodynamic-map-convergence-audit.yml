name: YM Kirk v4 thermodynamic map convergence audit

on:
  push:
    branches:
      - verification/ym-kirk-v4-thermodynamic-map-convergence-audit-20260815-gpt56sol
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verification/ym-kirk-v4-thermodynamic-map-convergence-audit-20260815-gpt56sol
      - name: Ensure pdftotext
        run: |
          if ! command -v pdftotext >/dev/null; then
            sudo apt-get update && sudo apt-get install -y poppler-utils
          fi
      - name: Pin immutable Kirk source
        run: python3 tools/probe_kirk_latest_source.py >/tmp/probe.json
      - name: Extract thermodynamic-map contexts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text=Path('latest.txt').read_text(encoding='utf-8',errors='replace'); low=text.lower()
          out=Path('source_audit/kirk_v4/thermodynamic_map_convergence'); out.mkdir(parents=True,exist_ok=True)
          needles=[
            'thermodynamic map','thermodynamic maps','rooted-thermodynamic','thermodynamic limit','thermodynamic functional',
            'finite-volume map','finite-volume maps','local functional','local expectation','local observable','local observables',
            'M -> infinity','M → ∞','M_j','delta_G','Cauchy','converges uniformly','uniformly on compact','locally uniform',
            'F_j - F_infty','Fj − F∞','Sigma_j - Sigma_infty','Σj − Σ∞','Lemma 5.5','Theorem 5.18','Corollary 6.2',
            'rooted activity','infinite-volume','finite volume','wrapping','acoustic'
          ]
          counts={}
          for needle in needles:
            pos=0;n=0;chunks=[]
            while n<50:
              i=low.find(needle.lower(),pos)
              if i<0: break
              n+=1
              chunks.append(f'=== hit {n} at {i} ===\n'+text[max(0,i-9000):min(len(text),i+35000)])
              pos=i+len(needle)
            counts[needle]=n
            safe=''.join(c if c.isalnum() else '_' for c in needle)[:80]
            if chunks: (out/(safe+'.txt')).write_text('\n\n'.join(chunks),encoding='utf-8')
          (out/'COUNTS.txt').write_text('\n'.join(f'{k}: {v}' for k,v in counts.items())+'\n',encoding='utf-8')
          required=['Lemma 5.5','Corollary 6.2','rooted-thermodynamic']
          missing=[x for x in required if counts.get(x,0)==0]
          print('\n'.join(f'{k}: {v}' for k,v in counts.items()))
          if missing: raise SystemExit('missing anchors: '+', '.join(missing))
          PY
      - name: Preserve contexts
        run: |
          cp kirk_latest_record.json source_audit/kirk_v4/thermodynamic_map_convergence/
          sha256sum kirk_latest.pdf > source_audit/kirk_v4/thermodynamic_map_convergence/PDF_SHA256.txt
          git config user.name 'millennium-braid-source-audit'
          git config user.email 'actions@users.noreply.github.com'
          git add source_audit/kirk_v4/thermodynamic_map_convergence
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audit(ym): preserve thermodynamic-map contexts'
          git push origin HEAD:verification/ym-kirk-v4-thermodynamic-map-convergence-audit-20260815-gpt56sol
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kirk-v4-thermodynamic-map-convergence-audit
          if-no-files-found: warn
          retention-days: 30
          path: source_audit/kirk_v4/thermodynamic_map_convergence/
