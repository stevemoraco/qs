name: NS weak-L3 parabolic cascade hostile AXLE replay

on:
  push:
    branches: [agent/ns-weakl3-parabolic-cascade-verifier-20260812]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ns-weakl3-parabolic-cascade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            verification/ns-weakl3-parabolic-cascade/NSWeakL3ParabolicCascade.lean
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Source trust gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re
          path = pathlib.Path(
              'verification/ns-weakl3-parabolic-cascade/NSWeakL3ParabolicCascade.lean'
          )
          text = path.read_text()
          forbidden = [
              r'(^|[^A-Za-z0-9_])sorry([^A-Za-z0-9_]|$)',
              r'(^|[^A-Za-z0-9_])admit([^A-Za-z0-9_]|$)',
              r'(^|[^A-Za-z0-9_])axiom([^A-Za-z0-9_]|$)',
              r'(^|[^A-Za-z0-9_])opaque([^A-Za-z0-9_]|$)',
              r'(^|[^A-Za-z0-9_])unsafe([^A-Za-z0-9_]|$)',
          ]
          for pat in forbidden:
              if re.search(pat, text):
                  raise SystemExit(f'forbidden source construct matches {pat}')
          count = len(re.findall(r'(?m)^theorem\s+', text))
          prints = len(re.findall(r'(?m)^#print axioms\s+', text))
          if count != 8 or prints != 8:
              raise SystemExit(
                  f'expected 8 theorems and 8 axiom prints, got {count} / {prints}'
              )
          print(f'PRECHECK OK: {count} theorems, {prints} staged axiom prints')
          PY

      - name: Verify exact source with AXLE Lean 4.30
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, urllib.request

          def workflow_escape(value):
              text = value if isinstance(value, str) else json.dumps(value, sort_keys=True)
              return text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')

          path = pathlib.Path(
              'verification/ns-weakl3-parabolic-cascade/NSWeakL3ParabolicCascade.lean'
          )
          content = path.read_text()
          sha256 = hashlib.sha256(content.encode()).hexdigest()
          print('source_sha256=' + sha256)
          payload = json.dumps({
              'content': content,
              'environment': 'lean-4.30.0',
              'ignore_imports': True,
              'mathlib_options': False,
              'timeout_seconds': 900,
          }).encode()
          request = urllib.request.Request(
              'https://axle.axiommath.ai/api/v1/check',
              data=payload,
              headers={'Content-Type': 'application/json'},
              method='POST',
          )
          with urllib.request.urlopen(request, timeout=960) as response:
              result = json.load(response)
          out = pathlib.Path(
              'verification/ns-weakl3-parabolic-cascade/axle-result.json'
          )
          out.write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          print(json.dumps(result, indent=2))
          lean_errors = result.get('lean_messages', {}).get('errors', [])
          tool_errors = result.get('tool_messages', {}).get('errors', [])
          failed = result.get('failed_declarations', [])
          rendered = json.dumps(result)
          if 'sorryAx' in rendered or 'Lean.ofReduceBool' in rendered:
              print('::error title=Postcompile trust failure::forbidden axiom or escape found')
              raise SystemExit(1)
          if not result.get('okay') or lean_errors or tool_errors or failed:
              for item in lean_errors:
                  print('::error title=AXLE Lean error::' + workflow_escape(item))
              for item in tool_errors:
                  print('::error title=AXLE tool error::' + workflow_escape(item))
              for item in failed:
                  print('::error title=AXLE failed declaration::' + workflow_escape(item))
              if not lean_errors and not tool_errors and not failed:
                  print('::error title=AXLE non-okay result::' + workflow_escape(result))
              raise SystemExit(1)
          print('::notice title=AXLE successful exact result::' + workflow_escape(result))
          print('::notice title=Canonical source SHA-256::' + workflow_escape(sha256))
          print('VERIFIED: AXLE Lean 4.30 compiled all 8 finite cores')
          PY

      - name: Upload exact verifier evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ns-weakl3-parabolic-cascade-axle-evidence
          path: |
            verification/ns-weakl3-parabolic-cascade/NSWeakL3ParabolicCascade.lean
            verification/ns-weakl3-parabolic-cascade/axle-result.json
          if-no-files-found: warn
