name: RH Run10bm three-block natural-root cores

on:
  push:
    branches:
      - verification/rh-run10bm-threeblock-naturalroot-20260819-gpt56sol
    paths:
      - verification/rh-run10bm-threeblock-naturalroot/*.lean
      - .github/workflows/rh-run10bm-threeblock-naturalroot.yml
  pull_request:
    paths:
      - verification/rh-run10bm-threeblock-naturalroot/*.lean
      - .github/workflows/rh-run10bm-threeblock-naturalroot.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Verify flattened Lean theorem sources
        shell: bash
        run: |
          set -euo pipefail
          for SRC in verification/rh-run10bm-threeblock-naturalroot/*.lean; do
            if grep -nE '\b(sorry|admit|sorryAx|axiom|opaque|unsafe|native_decide|Lean\.ofReduceBool)\b' "$SRC"; then
              echo "Forbidden proof/trust token in $SRC"
              exit 1
            fi
          done
          python3 - <<'PY'
          import hashlib, json, pathlib, urllib.request

          paths = sorted(pathlib.Path('verification/rh-run10bm-threeblock-naturalroot').glob('*.lean'))
          receipts = []
          for path in paths:
              source = path.read_text()
              payload = json.dumps({
                  'content': source,
                  'environment': 'lean-4.30.0',
                  'ignore_imports': True,
                  'mathlib_options': False,
                  'timeout_seconds': 900,
              }).encode()
              req = urllib.request.Request(
                  'https://axle.axiommath.ai/api/v1/check',
                  data=payload,
                  headers={'Content-Type': 'application/json'},
                  method='POST',
              )
              with urllib.request.urlopen(req, timeout=960) as response:
                  result = json.load(response)
              receipt = {
                  'source_path': str(path),
                  'source_sha256': hashlib.sha256(source.encode()).hexdigest(),
                  'axle_environment': 'lean-4.30.0',
                  'axle_result': result,
              }
              receipts.append(receipt)
              print(json.dumps(receipt, indent=2))
              lean = result.get('lean_messages', {})
              tool = result.get('tool_messages', {})
              bad = (
                  not result.get('okay')
                  or bool(result.get('failed_declarations', []))
                  or bool(lean.get('errors', []))
                  or bool(lean.get('warnings', []))
                  or bool(tool.get('errors', []))
                  or bool(tool.get('warnings', []))
                  or 'sorryAx' in json.dumps(result)
              )
              if bad:
                  pathlib.Path('/tmp/rh-run10bm-axle-receipt.json').write_text(json.dumps(receipts, indent=2))
                  raise SystemExit(1)
          pathlib.Path('/tmp/rh-run10bm-axle-receipt.json').write_text(json.dumps(receipts, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rh-run10bm-threeblock-naturalroot-axle-receipt
          if-no-files-found: warn
          retention-days: 30
          path: /tmp/rh-run10bm-axle-receipt.json
