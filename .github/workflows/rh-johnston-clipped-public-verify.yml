name: RH Johnston clipped public verifier

on:
  push:
    branches:
      - agent/rh-johnston-clipped-public-verifier-20260813
  pull_request:
    paths:
      - 'verification/rh-johnston-clipped-public/**'
      - '.github/workflows/rh-johnston-clipped-public-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify trust boundary
        shell: bash
        run: |
          set -euo pipefail
          dir='verification/rh-johnston-clipped-public'
          clipped="$dir/RHJohnstonClippedPrimePrefix.lean"
          recurrence="$dir/RHJohnstonPrimeEnergyRecurrence.lean"
          actual="$dir/RHJohnstonActualPrimePrefix.lean"
          test "$(git hash-object "$clipped")" = '38766cb794fac3d5d934a670d8c92466fd82f9e3'
          test "$(git hash-object "$recurrence")" = 'b2eb28fc85c94a450329d77d16cb4fdc0a7cdaae'
          test "$(git hash-object "$actual")" = '8714fb11c5408a10ed8b6059c6a85708c69a2de2'
          { git hash-object "$clipped"; git hash-object "$recurrence"; git hash-object "$actual"; } | tee "$dir/source-blobs.txt"
          sha256sum "$clipped" "$recurrence" "$actual" | tee "$dir/source-sha256.txt"
          for file in "$clipped" "$recurrence" "$actual"; do
            if grep -En '(^|[^[:alnum:]_])(sorry|admit|sorryAx)([^[:alnum:]_]|$)' "$file"; then exit 1; fi
            if grep -En '^[[:space:]]*(axiom|opaque|unsafe)[[:space:]]' "$file"; then exit 1; fi
            if grep -En '(native_decide|Lean\.ofReduceBool)' "$file"; then exit 1; fi
          done
      - name: Install pinned Lean and compile exact sources
        shell: bash
        run: |
          set -euo pipefail
          dir='verification/rh-johnston-clipped-public'
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.32.1
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version | tee "$dir/lean-version.txt"
          lake --version | tee -a "$dir/lean-version.txt"
          cd "$dir"
          lake update
          lake exe cache get
          set +e
          lake env lean RHJohnstonClippedPrimePrefix.lean > clipped-output.log 2>&1
          s1=$?
          lake env lean RHJohnstonPrimeEnergyRecurrence.lean > recurrence-output.log 2>&1
          s2=$?
          lake env lean RHJohnstonActualPrimePrefix.lean > actual-output.log 2>&1
          s3=$?
          set -e
          cat clipped-output.log recurrence-output.log actual-output.log | tee lean-output.log
          if [ "$s1" -ne 0 ]; then exit "$s1"; fi
          if [ "$s2" -ne 0 ]; then exit "$s2"; fi
          if [ "$s3" -ne 0 ]; then exit "$s3"; fi
          if grep -Eq 'declaration uses .sorry.|sorryAx|admit|Lean.ofReduceBool' lean-output.log; then exit 1; fi
          echo 'VERIFIED RH Johnston clipped reduction, recurrence, and actual mathlib prime prefix.'
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rh-johnston-clipped-public-evidence
          path: |
            verification/rh-johnston-clipped-public/source-blobs.txt
            verification/rh-johnston-clipped-public/source-sha256.txt
            verification/rh-johnston-clipped-public/lean-version.txt
            verification/rh-johnston-clipped-public/lean-output.log
