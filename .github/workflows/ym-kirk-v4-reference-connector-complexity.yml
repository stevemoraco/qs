name: YM Kirk v4 reference connector complexity

on:
  push:
    branches:
      - verification/ym-kirk-v4-reference-connector-complexity-20260814-gpt56sol
    paths:
      - .github/workflows/ym-kirk-v4-reference-connector-complexity.yml

permissions:
  contents: write

jobs:
  source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verification/ym-kirk-v4-reference-connector-complexity-20260814-gpt56sol
      - name: Ensure pdftotext
        run: |
          if ! command -v pdftotext >/dev/null; then sudo apt-get update && sudo apt-get install -y poppler-utils; fi
      - name: Extract reference connector-complexity contexts
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, json, time
          from pathlib import Path
          UA='ym-reference-connector-complexity-audit/1.0'
          def get(url):
              last=None
              for i in range(7):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'*/*'})
                      with urllib.request.urlopen(req,timeout=60) as r: return r.read()
                  except (urllib.error.HTTPError,urllib.error.URLError) as e:
                      last=e
                      if isinstance(e,urllib.error.HTTPError) and e.code not in (429,500,502,503,504): raise
                      time.sleep(min(2**i,32))
              raise last
          rec=json.loads(get('https://zenodo.org/api/records/21765806'))
          if rec.get('links',{}).get('latest'): rec=json.loads(get(rec['links']['latest']))
          pdfs=[f for f in rec.get('files',[]) if str(f.get('key','')).lower().endswith('.pdf')]
          url=pdfs[0].get('links',{}).get('content') or pdfs[0].get('links',{}).get('self')
          Path('/tmp/kirk.pdf').write_bytes(get(url))
          Path('/tmp/record.json').write_text(json.dumps(rec,indent=2),encoding='utf-8')
          PY
          pdftotext -layout /tmp/kirk.pdf /tmp/kirk.txt
          python3 - <<'PY'
          from pathlib import Path
          import re, hashlib, json
          text=Path('/tmp/kirk.txt').read_text(encoding='utf-8',errors='replace'); low=text.lower()
          out=Path('source_audit/kirk_v4/reference_connector_complexity'); out.mkdir(parents=True,exist_ok=True)
          phrases=[
            'canonical connector','shortest connector','connector path','canonical connected hull',
            'canonical hull','reported hull','matrix kernel','kernel entry','bilocal','endpoint pair',
            'two-point kernel','two point kernel','finite-template incidence','finite template incidence',
            'complete allocated two-jet','complete two-jet','quadratic reference','Qtempl',
            'reference factor','reference factors','diam A','pivot incidence','active path','active paths'
          ]
          summary=[]
          for phrase in phrases:
              hits=[]; pos=0
              while True:
                  i=low.find(phrase.lower(),pos)
                  if i<0: break
                  hits.append(i); pos=i+max(1,len(phrase))
              summary.append(f'{phrase}: {len(hits)}')
              stem=re.sub(r'[^a-z0-9]+','_',phrase.lower()).strip('_')
              for j,i in enumerate(hits[:30],1):
                  (out/f'{stem}_{j}.txt').write_text(text[max(0,i-6000):min(len(text),i+14000)],encoding='utf-8')
          # targeted theorem windows independent of vocabulary
          for needle,name in [
            ('Proposition 6.8','prop_6_8'),('Theorem 6.10','theorem_6_10'),
            ('Lemma 6.17','lemma_6_17'),('Lemma 6.30','lemma_6_30'),
            ('Definition 6.33','def_6_33'),('Lemma 3.25','lemma_3_25'),
            ('Lemma 4.28','lemma_4_28')]:
              i=text.find(needle)
              if i>=0: (out/f'{name}.txt').write_text(text[max(0,i-4000):min(len(text),i+18000)],encoding='utf-8')
          pdf=Path('/tmp/kirk.pdf').read_bytes()
          (out/'PDF_SHA256.txt').write_text(hashlib.sha256(pdf).hexdigest()+'\n',encoding='utf-8')
          (out/'SUMMARY.txt').write_text('\n'.join(summary)+'\n',encoding='utf-8')
          (out/'record.json').write_text(Path('/tmp/record.json').read_text(),encoding='utf-8')
          print('\n'.join(summary))
          PY
      - name: Commit contexts
        run: |
          git config user.name 'millennium-braid-source-audit'
          git config user.email 'actions@users.noreply.github.com'
          git add source_audit/kirk_v4/reference_connector_complexity
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audit(ym): expose Kirk v4 reference connector complexity'
          git push origin HEAD:verification/ym-kirk-v4-reference-connector-complexity-20260814-gpt56sol
      - uses: actions/upload-artifact@v4
        with:
          name: kirk-v4-reference-connector-complexity
          if-no-files-found: error
          retention-days: 30
          path: source_audit/kirk_v4/reference_connector_complexity/
