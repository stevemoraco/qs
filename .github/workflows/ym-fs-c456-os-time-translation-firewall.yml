name: YM FS C456 OS time-translation firewall

on:
  push:
    branches:
      - verification/ym-fs-c456-os-time-translation-firewall-20260821
    paths:
      - .github/workflows/ym-fs-c456-os-time-translation-firewall.yml
      - verification/ym-fs-c456-os-time-translation-firewall/FSDirectClusteringOSFirewall.lean

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact Lean source
        shell: bash
        run: |
          set -euo pipefail
          SRC=verification/ym-fs-c456-os-time-translation-firewall/FSDirectClusteringOSFirewall.lean
          sha256sum "$SRC"
          if grep -nE '\b(sorry|admit|sorryAx|axiom|opaque|unsafe|native_decide|Lean\.ofReduceBool)\b' "$SRC"; then
            echo 'forbidden trust escape detected'
            exit 1
          fi
          SRC="$SRC" python3 - <<'PY'
          import json, os, pathlib, urllib.request
          path = pathlib.Path(os.environ['SRC'])
          payload = json.dumps({
              'content': path.read_text(),
              'environment': 'lean-4.30.0',
              'ignore_imports': True,
              'mathlib_options': False,
              'timeout_seconds': 900,
          }).encode()
          request = urllib.request.Request(
              'https://axle.axiommath.ai/api/v1/check',
              data=payload,
              headers={'Content-Type': 'application/json'},
              method='POST')
          with urllib.request.urlopen(request, timeout=960) as response:
              result = json.load(response)
          print(json.dumps(result, indent=2))
          lean = result.get('lean_messages', {})
          tool = result.get('tool_messages', {})
          bad = (
              not result.get('okay')
              or bool(result.get('failed_declarations', []))
              or bool(lean.get('errors', []))
              or bool(lean.get('warnings', []))
              or bool(tool.get('errors', []))
              or bool(tool.get('warnings', []))
              or 'sorryAx' in json.dumps(result)
          )
          if bad:
              raise SystemExit(1)
          pathlib.Path('axle-response.json').write_text(json.dumps(result, indent=2))
          PY
      - name: Upload exact replay receipt
        uses: actions/upload-artifact@v4
        with:
          name: ym-fs-c456-os-time-translation-firewall
          path: |
            verification/ym-fs-c456-os-time-translation-firewall/FSDirectClusteringOSFirewall.lean
            axle-response.json
          if-no-files-found: error
