name: RH log-Hardy endpoint foundation replay

on:
  pull_request:
    branches: [main]
    paths:
      - 'formal/rh-log-hardy-endpoint-quantifier-core/**'
      - '.github/workflows/rh-log-hardy-endpoint-foundation-replay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject proof holes and escape hatches
        shell: bash
        run: |
          set -euo pipefail
          SRC='formal/rh-log-hardy-endpoint-quantifier-core/RHLogHardyEndpointQuantifierCore.lean'
          test -f "$SRC"
          if grep -En '\b(sorry|admit|sorryAx|axiom|opaque|unsafe|native_decide|implemented_by)\b|Lean\.ofReduceBool' "$SRC"; then
            echo 'forbidden proof carrier found'
            exit 1
          fi

      - name: Install exact official Lean
        shell: bash
        run: |
          set -euo pipefail
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain and exact source blob
        shell: bash
        run: |
          set -euo pipefail
          lean --version | tee lean-version.txt
          grep -F 'version 4.33.0' lean-version.txt
          grep -F 'd8b18978322de05a8f3dba51ef03cf5461676c17' lean-version.txt
          SRC='formal/rh-log-hardy-endpoint-quantifier-core/RHLogHardyEndpointQuantifierCore.lean'
          test "$(git hash-object "$SRC")" = 'de1143806141fe03ca1acba6656fc1585659d88b'

      - name: Kernel compile and fresh replay
        working-directory: formal/rh-log-hardy-endpoint-quantifier-core
        shell: bash
        run: |
          set -euo pipefail
          lean -DwarningAsError=true -o RHLogHardyEndpointQuantifierCore.olean RHLogHardyEndpointQuantifierCore.lean 2>&1 | tee ../../lean-output.log
          test -f RHLogHardyEndpointQuantifierCore.olean
          rm -f RHLogHardyEndpointQuantifierCore.olean
          lean -DwarningAsError=true RHLogHardyEndpointQuantifierCore.lean 2>&1 | tee ../../axiom-output.log
          ! grep -E 'declaration has metavariables|declaration uses .sorry.|unknown constant|error:|warning:' ../../lean-output.log ../../axiom-output.log
          ! grep -F 'sorryAx' ../../axiom-output.log

      - name: Exact foundation-only axiom audit
        shell: bash
        run: |
          set -euo pipefail
          LOG=axiom-output.log
          test "$(grep -c "^'RHLogHardyEndpointQuantifierCore\." "$LOG")" -eq 4
          grep -Fx "'RHLogHardyEndpointQuantifierCore.vanishing_excludes_positive_floor' depends on axioms: [propext]" "$LOG"
          grep -Fx "'RHLogHardyEndpointQuantifierCore.positive_floor_forces_not_vanishing' depends on axioms: [propext]" "$LOG"
          grep -Fx "'RHLogHardyEndpointQuantifierCore.doubled_square_le_mixed_square' does not depend on any axioms" "$LOG"
          grep -Fx "'RHLogHardyEndpointQuantifierCore.doubled_tail_budget_transfer' does not depend on any axioms" "$LOG"

      - name: Upload replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rh-log-hardy-endpoint-foundation-replay
          path: |
            lean-version.txt
            lean-output.log
            axiom-output.log
          if-no-files-found: warn
