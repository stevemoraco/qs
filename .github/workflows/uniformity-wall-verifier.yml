name: Uniformity wall verifier

on:
  push:
    branches:
      - agent/replay-20260813-1120
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact source with AXLE
        shell: bash
        run: |
          set -euo pipefail
          SRC=verification/poincare-uniformity/YMPoincareUniformityWall.lean
          test "$(git hash-object "$SRC")" = b91d61d5e5dde6c8de92379cde611f91e2107d28
          python3 - <<'PY'
          import json, pathlib, urllib.request
          source = pathlib.Path('verification/poincare-uniformity/YMPoincareUniformityWall.lean').read_text()
          assert source.count('#print axioms') == 3
          for token in ['sorry', 'admit', 'sorryAx', 'native_decide', 'Lean.ofReduceBool']:
              assert token not in source
          payload = json.dumps({'content': source, 'environment': 'lean-4.30.0', 'ignore_imports': True, 'mathlib_options': False, 'timeout_seconds': 900}).encode()
          req = urllib.request.Request('https://axle.axiommath.ai/api/v1/check', data=payload, headers={'Content-Type':'application/json'}, method='POST')
          with urllib.request.urlopen(req, timeout=960) as response:
              result = json.load(response)
          print(json.dumps(result, indent=2))
          assert result.get('okay')
          assert not result.get('failed_declarations', [])
          assert not result.get('lean_messages', {}).get('errors', [])
          assert not result.get('lean_messages', {}).get('warnings', [])
          assert 'sorryAx' not in json.dumps(result)
          print('VERIFIED')
          PY
