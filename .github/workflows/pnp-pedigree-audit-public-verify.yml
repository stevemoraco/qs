name: PNP Pedigree Audit Finite Core Lean

on:
  push:
    branches:
      - agent/pnp-pedigree-audit-public-verifier-20260812
    paths:
      - 'verification/pnp-pedigree-audit/**'
      - '.github/workflows/pnp-pedigree-audit-public-verify.yml'
  pull_request:
    branches: [main]
    paths:
      - 'verification/pnp-pedigree-audit/**'
      - '.github/workflows/pnp-pedigree-audit-public-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Reject proof holes and verify canonical source blob
        shell: bash
        run: |
          set -euo pipefail
          file=verification/pnp-pedigree-audit/PNPPedigreeAuditFinite.lean
          if grep -En '^[[:space:]]*(sorry|admit|axiom|opaque|unsafe)([[:space:]]|$)' "$file"; then
            echo 'Forbidden Lean placeholder or custom trust declaration found.' >&2
            exit 1
          fi
          git hash-object "$file" | tee verification/pnp-pedigree-audit/lean-git-blob-sha.txt
          test "$(cat verification/pnp-pedigree-audit/lean-git-blob-sha.txt)" = 'b3cebf17d0104286f46ad1f258960c05f469be2d'

      - name: Install pinned Lean, fetch pinned Mathlib cache, and compile
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.32.1
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version | tee verification/pnp-pedigree-audit/lean-version.txt
          lake --version | tee verification/pnp-pedigree-audit/lake-version.txt
          cd verification/pnp-pedigree-audit
          lake update
          git -C .lake/packages/mathlib rev-parse HEAD | tee mathlib-commit.txt
          lake exe cache get
          set +e
          lake env lean PNPPedigreeAuditFinite.lean 2>&1 | tee lean-output.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do
              line=${line//'%'/'%25'}
              line=${line//$'\r'/'%0D'}
              line=${line//$'\n'/'%0A'}
              echo "::error file=verification/pnp-pedigree-audit/PNPPedigreeAuditFinite.lean::$line"
            done < lean-output.log
            exit "$status"
          fi
          if grep -Eq 'declaration uses .sorry.|sorryAx|admit|Lean.ofReduceBool' lean-output.log; then
            echo 'Forbidden placeholder or unaccepted computational axiom found.' >&2
            exit 1
          fi
          echo 'VERIFIED PNP pedigree audit finite core: clean pinned build.'

      - name: Upload compiler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pnp-pedigree-audit-finite-core-lean-evidence
          path: |
            verification/pnp-pedigree-audit/lean-output.log
            verification/pnp-pedigree-audit/lean-git-blob-sha.txt
            verification/pnp-pedigree-audit/lean-version.txt
            verification/pnp-pedigree-audit/lake-version.txt
            verification/pnp-pedigree-audit/mathlib-commit.txt
          if-no-files-found: warn
