name: PNP Run204 Symmetric Restriction-Density Public Verifier

on:
  push:
    branches:
      - agent/pnp-symmetric-restriction-density-public-verifier-20260812
    paths:
      - 'verification/pnp-symmetric-restriction-density/**'
      - '.github/workflows/pnp-symmetric-restriction-density-public-verify.yml'
  pull_request:
    branches: [main]
    paths:
      - 'verification/pnp-symmetric-restriction-density/**'
      - '.github/workflows/pnp-symmetric-restriction-density-public-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Verify canonical Python blobs and replay certificate
        shell: bash
        run: |
          set -euo pipefail
          cd verification/pnp-symmetric-restriction-density
          test "$(git hash-object pnp_symmetric_restriction_density_certificate.py)" \
            = '9c38a1afb3d9aefeac9f703690de73c3fe248096'
          test "$(git hash-object pnp_symmetric_restriction_density_results.json)" \
            = '49187f9d785f23a8fb0eec6bc0e25de6daec1a7e'
          python3 -m py_compile pnp_symmetric_restriction_density_certificate.py
          python3 pnp_symmetric_restriction_density_certificate.py \
            | tee replayed-results.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          observed = json.loads(Path('replayed-results.json').read_text())
          expected = json.loads(Path(
              'pnp_symmetric_restriction_density_results.json'
          ).read_text())
          if observed != expected:
              raise SystemExit(f'certificate mismatch: {observed} != {expected}')
          print('VERIFIED PNP Run204 exact certificate: canonical replay PASS.')
          PY

      - name: Upload exact-certificate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pnp-run204-python-evidence
          path: |
            verification/pnp-symmetric-restriction-density/replayed-results.json
          if-no-files-found: warn

  lean-firewall:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Reject placeholders and verify canonical Lean blob
        shell: bash
        run: |
          set -euo pipefail
          dir=verification/pnp-symmetric-restriction-density
          file="$dir/PNPSymmetricRestrictionDensity.lean"
          if grep -En '(^|[^[:alnum:]_])(sorry|admit|axiom|opaque|unsafe)([^[:alnum:]_]|$)' "$file"; then
            echo "Forbidden Lean placeholder or custom trust declaration found." >&2
            exit 1
          fi
          git hash-object "$file" | tee "$dir/lean-git-blob-sha.txt"
          test "$(cat "$dir/lean-git-blob-sha.txt")" \
            = '39721b4cf55b192ebb0bfe411fc6d048b30ac72f'

      - name: Install pinned Lean, fetch pinned Mathlib cache, and compile
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.31.0
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version | tee verification/pnp-symmetric-restriction-density/lean-version.txt
          lake --version | tee verification/pnp-symmetric-restriction-density/lake-version.txt
          cd verification/pnp-symmetric-restriction-density
          lake update
          git -C .lake/packages/mathlib rev-parse HEAD | tee mathlib-commit.txt
          lake exe cache get
          lake build 2>&1 | tee lake-build.log
          lake env lean PNPSymmetricRestrictionDensity.lean 2>&1 \
            | tee lean-output.log
          if grep -Eq 'declaration uses .sorry.|sorryAx|admit|Lean.ofReduceBool' lean-output.log; then
            echo 'Forbidden placeholder or unaccepted computational axiom found.' >&2
            exit 1
          fi
          echo 'VERIFIED PNP Run204 finite core: clean pinned build.'

      - name: Upload compiler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pnp-run204-lean-evidence
          path: |
            verification/pnp-symmetric-restriction-density/lean-output.log
            verification/pnp-symmetric-restriction-density/lake-build.log
            verification/pnp-symmetric-restriction-density/lean-git-blob-sha.txt
            verification/pnp-symmetric-restriction-density/lean-version.txt
            verification/pnp-symmetric-restriction-density/lake-version.txt
            verification/pnp-symmetric-restriction-density/mathlib-commit.txt
          if-no-files-found: warn
