name: Verify OpenAI Navier-Stokes Lean proof

on:
  push:
    branches: [verify-openai-navier-stokes-20260908]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Clone exact OpenAI proof commit
        run: |
          git clone https://github.com/openai/NavierStokesAndEuler.git proof
          cd proof
          git checkout 8937a8f4cbc7abaab5e9e97d1cc7f5d2319d9538
          test "$(git rev-parse HEAD)" = "8937a8f4cbc7abaab5e9e97d1cc7f5d2319d9538"

      - name: Install elan and pinned toolchain
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          cd proof
          cat lean-toolchain

      - name: Source trust scan
        run: |
          cd proof
          if rg -n '\bsorry\b|\badmit\b|\bsorryAx\b|\bnative_decide\b|^\s*axiom\b' --glob '*.lean' .; then
            echo 'Forbidden proof-hole/custom-axiom marker found' >&2
            exit 1
          fi

      - name: Fetch mathlib cache
        run: |
          cd proof
          lake exe cache get

      - name: Build complete project
        run: |
          cd proof
          lake build

      - name: Print main theorem axioms
        run: |
          cd proof
          printf '%s\n' \
            'import NavierStokes.ComparatorSolution' \
            '#print axioms NavierStokes.Comparator.navier_stokes_breakdown_R3' \
            '#print axioms NavierStokes.Comparator.navier_stokes_breakdown_periodic' \
            > AuditMain.lean
          lake env lean AuditMain.lean | tee ../axioms.txt
          grep -F 'propext' ../axioms.txt
          grep -F 'Classical.choice' ../axioms.txt
          grep -F 'Quot.sound' ../axioms.txt
          if grep -E 'sorryAx|native_decide' ../axioms.txt; then exit 1; fi

      - name: Run Comparator Navier-Stokes challenge
        run: |
          cd proof
          lake exe comparator ComparatorChallenges/NavierStokes.json

      - name: Run Comparator Euler challenge
        run: |
          cd proof
          lake exe comparator ComparatorChallenges/Euler.json

      - name: Record exact verification receipt
        run: |
          cd proof
          MATHLIB_REV=$(jq -r '.packages[] | select(.name=="mathlib") | .rev' lake-manifest.json)
          printf 'verified_commit=%s\nlean_toolchain=%s\nmathlib_rev=%s\n' \
            "$(git rev-parse HEAD)" "$(cat lean-toolchain)" "$MATHLIB_REV" \
            | tee ../verification_receipt.txt

      - uses: actions/upload-artifact@v4
        with:
          name: openai-navier-stokes-independent-receipt
          path: |
            axioms.txt
            verification_receipt.txt
