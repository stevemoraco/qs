name: YM Kirk v4 finite-energy endpoint audit

on:
  push:
    branches:
      - verification/ym-kirk-v4-finite-energy-endpoint-audit-20260814-gpt56sol
  pull_request:
    branches:
      - verification/ym-kirk-v4-third-jet-convergence-audit-20260814-gpt56sol
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verification/ym-kirk-v4-finite-energy-endpoint-audit-20260814-gpt56sol
      - name: Ensure pdftotext
        run: |
          if ! command -v pdftotext >/dev/null; then
            sudo apt-get update && sudo apt-get install -y poppler-utils
          fi
      - name: Pin immutable Kirk source
        run: python3 tools/probe_kirk_latest_source.py >/tmp/probe.json
      - name: Extract finite-energy and endpoint contexts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text=Path('latest.txt').read_text(encoding='utf-8',errors='replace')
          out=Path('source_audit/kirk_v4/finite_energy_endpoint'); out.mkdir(parents=True,exist_ok=True)
          targets=[
            'Theorem 10.2','Theorem 10.4','Theorem 10.5','Lemma 10.6','Corollary 10.7',
            'Appendix A','endpoint','reflected','Gaussian','V0','finite interval',
            'spectral mass','M_Y','M⋆','curvature vector','nonzero','nontriviality',
            'Theorem 9.3','mass gap'
          ]
          counts={}; ledger=[]; low=text.lower()
          for target in targets:
            pos=0; n=0
            for hit in range(40):
              i=low.find(target.lower(),pos)
              if i<0: break
              n+=1
              ledger.append(f'=== {target} hit {n} at {i} ===\n'+text[max(0,i-3600):min(len(text),i+13000)]+'\n')
              pos=i+len(target)
            counts[target]=n
          required=['Theorem 10.4','Theorem 10.5','Lemma 10.6','Corollary 10.7']
          missing=[x for x in required if counts[x]==0]
          (out/'LEDGER.txt').write_text('\n'.join(ledger),encoding='utf-8')
          (out/'COUNTS.txt').write_text('\n'.join(f'{k}: {v}' for k,v in counts.items())+'\n',encoding='utf-8')
          # Cross-references occur before the actual Section 10 declarations. Use the
          # final occurrence of each numbered theorem anchor for direct review.
          focused={
            'THEOREM_10_4.txt':('Theorem 10.4',6500,18000),
            'THEOREM_10_5.txt':('Theorem 10.5',8500,22000),
            'LEMMA_10_6.txt':('Lemma 10.6',7500,16000),
            'COROLLARY_10_7.txt':('Corollary 10.7',6500,14000),
            'APPENDIX_A.txt':('Appendix A',3500,26000),
          }
          for name,(needle,before,after) in focused.items():
            i=low.rfind(needle.lower())
            if i<0: raise SystemExit('missing focused anchor '+needle)
            (out/name).write_text(text[max(0,i-before):min(len(text),i+after)],encoding='utf-8')
          print('\n'.join(f'{k}: {v}' for k,v in counts.items()))
          if missing: raise SystemExit('missing anchors: '+', '.join(missing))
          PY
      - name: Preserve immutable contexts
        run: |
          cp kirk_latest_record.json source_audit/kirk_v4/finite_energy_endpoint/
          sha256sum kirk_latest.pdf > source_audit/kirk_v4/finite_energy_endpoint/PDF_SHA256.txt
          git config user.name 'millennium-braid-source-audit'
          git config user.email 'actions@users.noreply.github.com'
          git add source_audit/kirk_v4/finite_energy_endpoint
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audit(ym): target Kirk v4 endpoint theorem declarations'
          git push origin HEAD:verification/ym-kirk-v4-finite-energy-endpoint-audit-20260814-gpt56sol
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kirk-v4-finite-energy-endpoint-audit
          if-no-files-found: warn
          retention-days: 30
          path: source_audit/kirk_v4/finite_energy_endpoint/
