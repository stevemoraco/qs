name: Kirk v4 endpoint packet-shell audit

on:
  pull_request:
    paths:
      - .github/workflows/kirk-v4-endpoint-packet-shell-audit.yml
      - tools/probe_kirk_latest_source.py

permissions:
  contents: read

jobs:
  endpoint-packet-shell:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Ensure pdftotext
        run: |
          if ! command -v pdftotext >/dev/null; then
            sudo apt-get update && sudo apt-get install -y poppler-utils
          fi
      - name: Pin immutable latest source
        run: python3 tools/probe_kirk_latest_source.py >/tmp/probe.json
      - name: Extract Appendix-A theorem contexts and load-bearing phrases
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path('latest.txt').read_text(encoding='utf-8', errors='replace')
          a1 = text.find('Lemma A.1 (Grounded-torus curvature covariance)')
          if a1 < 0:
              raise SystemExit('Lemma A.1 anchor not found')
          tail = text[a1:]

          heading_re = re.compile(r'(?m)^\s*(Lemma|Proposition|Theorem|Corollary|Definition)\s+(A\.\d+)\b.*$')
          matches = list(heading_re.finditer(tail))
          headings = [' '.join(m.group(0).split()) for m in matches]
          if len(matches) < 5:
              raise SystemExit(f'Appendix-A heading inventory implausibly short: {headings!r}')
          Path('kirk_v4_appendix_A_headings.txt').write_text('\n'.join(headings) + '\n', encoding='utf-8')

          # Preserve bounded source contexts around every Appendix-A theorem,
          # rather than redistributing the full manuscript or depending on
          # fragile PDF-layout section-title anchors.
          theorem_contexts=[]
          for m in matches:
              s=max(0,m.start()-600)
              e=min(len(tail),m.start()+9000)
              theorem_contexts.append('=== ' + ' '.join(m.group(0).split()) + ' ===\n' + tail[s:e])
          Path('kirk_v4_appendix_A_theorem_contexts.txt').write_text('\n\n'.join(theorem_contexts),encoding='utf-8')

          targets = [
              'Theorem 10.4', 'Theorem A.9', 'terminal-shell', 'terminal remainder', 'crossing cell',
              'geometrically summable', 'summable majorant', 'twice-marked',
              'same-owner', 'owner', 'wrapping', 'compact entrance', 'conditional packet',
              'uniform', 'independent of cutoff', 'independent of volume', 'C2', 'C²'
          ]
          low=tail.lower(); out=[]
          for target in targets:
              pos=0
              for hit in range(20):
                  i=low.find(target.lower(),pos)
                  if i<0: break
                  out.append(f'=== {target} hit {hit+1} ===\n' +
                             ' '.join(tail[max(0,i-1800):min(len(tail),i+4200)].split()) + '\n')
                  pos=i+len(target)
          if not out:
              raise SystemExit('no load-bearing contexts extracted')
          Path('kirk_v4_appendix_A_audit_contexts.txt').write_text('\n'.join(out),encoding='utf-8')
          print(f'A.1 offset: {a1}; Appendix-A headings: {len(headings)}')
          print('\n'.join(headings))
          PY
      - name: Preserve source-audit certificate
        uses: actions/upload-artifact@v4
        with:
          name: kirk-v4-endpoint-packet-shell-audit
          if-no-files-found: error
          retention-days: 30
          path: |
            kirk_latest_record.json
            kirk_source_probe_report.json
            kirk_v4_appendix_A_headings.txt
            kirk_v4_appendix_A_theorem_contexts.txt
            kirk_v4_appendix_A_audit_contexts.txt
