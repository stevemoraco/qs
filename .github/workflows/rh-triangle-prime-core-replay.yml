name: RH triangular prime-core public replay

on:
  push:
    branches:
      - agent/rh-triangle-prime-core-replay-20260812
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lean-replay/rh-triangle-prime-core
    steps:
      - uses: actions/checkout@v4

      - name: Reject explicit proof holes and custom axioms
        run: |
          set -euo pipefail
          if grep -RInE '\b(sorry|admit|sorryAx)\b' . --include='*.lean'; then
            echo "Explicit proof hole found"
            exit 1
          fi
          if grep -RInE '^[[:space:]]*(axiom|opaque)[[:space:]]' . --include='*.lean'; then
            echo "Custom axiom or opaque declaration found"
            exit 1
          fi

      - name: Install pinned Lean toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve pinned dependencies and fetch cache
        run: |
          lake update
          lake exe cache get

      - name: Build and independently replay theorem source
        run: |
          set -euo pipefail
          lake build RHTrianglePrimeCore
          lake env lean RHTrianglePrimeCore/Algebra.lean

      - name: Print and enforce axiom report
        run: |
          set -euo pipefail
          lake env lean AxiomReport.lean 2>&1 | tee axiom-report.txt
          if grep -q 'sorryAx' axiom-report.txt; then
            echo "sorryAx found in axiom report"
            exit 1
          fi
