name: Verify NS periodic Golay frame

on:
  push:
    branches:
      - verification/ns-periodic-golay-frame-20260813
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Source trust preflight
        shell: bash
        run: |
          set -euo pipefail
          SRC=verification/ns-periodic-golay-frame/PeriodicGolayFrame.lean
          git hash-object "$SRC"
          python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path('verification/ns-periodic-golay-frame/PeriodicGolayFrame.lean')
          text = p.read_text()
          forbidden = re.compile(r'(^|[^A-Za-z0-9_])(sorry|admit|sorryAx|axiom|opaque|unsafe)([^A-Za-z0-9_]|$)')
          m = forbidden.search(text)
          if m:
              raise SystemExit(f'forbidden source token: {m.group(2)}')
          if 'Lean.ofReduceBool' in text or 'native_decide' in text:
              raise SystemExit('forbidden source token')
          if text.count('#print axioms') != 3:
              raise SystemExit('expected three #print axioms commands')
          PY

      - name: Execute AXLE Lean 4.30
        shell: bash
        run: |
          set -euo pipefail
          OUT=verification/ns-periodic-golay-frame/evidence
          mkdir -p "$OUT"
          python3 - <<'PY'
          import json, pathlib, urllib.request
          source = pathlib.Path('verification/ns-periodic-golay-frame/PeriodicGolayFrame.lean')
          out = pathlib.Path('verification/ns-periodic-golay-frame/evidence/axle-response.json')
          payload = json.dumps({
              'content': source.read_text(),
              'environment': 'lean-4.30.0',
              'ignore_imports': True,
              'mathlib_options': False,
              'timeout_seconds': 900,
          }).encode()
          req = urllib.request.Request(
              'https://axle.axiommath.ai/api/v1/check',
              data=payload,
              headers={'Content-Type': 'application/json'},
              method='POST',
          )
          try:
              with urllib.request.urlopen(req, timeout=960) as r:
                  result = json.load(r)
          except Exception as exc:
              result = {
                  'okay': False,
                  'request_exception': repr(exc),
                  'lean_messages': {'errors': []},
                  'tool_messages': {'errors': []},
                  'failed_declarations': [],
              }
          out.write_text(json.dumps(result, indent=2, sort_keys=True))
          print(json.dumps(result, indent=2))
          PY

      - name: Upload exact compiler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ns-periodic-golay-frame-evidence
          path: verification/ns-periodic-golay-frame/evidence/
          if-no-files-found: error

      - name: Enforce verdict
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path('verification/ns-periodic-golay-frame/evidence/axle-response.json')
          if not p.exists():
              raise SystemExit('missing AXLE response')
          r = json.loads(p.read_text())
          if (not r.get('okay') or r.get('lean_messages', {}).get('errors')
                  or r.get('tool_messages', {}).get('errors')
                  or r.get('failed_declarations')):
              raise SystemExit('Lean/AXLE verification failed')
          rendered = json.dumps(r)
          if 'sorryAx' in rendered or 'Lean.ofReduceBool' in rendered:
              raise SystemExit('forbidden postcompile dependency')
          print('VERIFIED')
          PY
