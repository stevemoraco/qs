name: YM Kirk v4 Qref entrywise repair audit

on:
  push:
    branches:
      - verification/ym-kirk-v4-qref-entrywise-repair-audit-20260814-gpt56sol
    paths:
      - .github/workflows/ym-kirk-v4-qref-entrywise-repair-audit.yml
      - tools/probe_kirk_latest_source.py

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verification/ym-kirk-v4-qref-entrywise-repair-audit-20260814-gpt56sol
      - name: Ensure pdftotext
        run: |
          if ! command -v pdftotext >/dev/null; then
            sudo apt-get update && sudo apt-get install -y poppler-utils
          fi
      - name: Pin immutable latest source
        run: python3 tools/probe_kirk_latest_source.py >/tmp/probe.json
      - name: Extract Qref entrywise structure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('latest.txt').read_text(encoding='utf-8',errors='replace')
          out=Path('source_audit/kirk_v4/qref_entrywise'); out.mkdir(parents=True,exist_ok=True)
          phrases=[
            'Qtempl','Qtail','fin tail','finite-template incidences','compact Haar completion',
            'exponential matrix algebra','precision and its first two','reference factors',
            'complete allocated two-jet','physical link logarithm','canonical hull',
            'shortest connector','reported on its canonical connected hull','actual local support',
            'Gaussian/Schur endpoints','fixed-template boundary factor','fixed finite range',
            'diameter at most the fixed number Rdet','cross-core words remain','two-jet enters the reference',
            'Summing the finite-template incidences gives','uniformly summable exponential rows'
          ]
          low=text.lower(); ledger=[]; counts=[]
          for phrase in phrases:
            pos=0; n=0
            for hit in range(100):
              i=low.find(phrase.lower(),pos)
              if i<0: break
              n += 1
              ledger.append(f'=== {phrase} hit {n} at {i} ===\n'+text[max(0,i-3000):min(len(text),i+10000)]+'\n')
              pos=i+len(phrase)
            counts.append(f'{phrase}: {n}')
          (out/'LEDGER.txt').write_text('\n'.join(ledger),encoding='utf-8')
          (out/'COUNTS.txt').write_text('\n'.join(counts)+'\n',encoding='utf-8')
          print('\n'.join(counts))
          PY
      - name: Commit audit contexts
        run: |
          cp kirk_latest_record.json source_audit/kirk_v4/qref_entrywise/
          sha256sum kirk_latest.pdf > source_audit/kirk_v4/qref_entrywise/PDF_SHA256.txt
          git config user.name 'millennium-braid-source-audit'
          git config user.email 'actions@users.noreply.github.com'
          git add source_audit/kirk_v4/qref_entrywise
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audit(ym): preserve Kirk v4 Qref entrywise contexts'
          git push origin HEAD:verification/ym-kirk-v4-qref-entrywise-repair-audit-20260814-gpt56sol
      - uses: actions/upload-artifact@v4
        with:
          name: kirk-v4-qref-entrywise-repair-audit
          if-no-files-found: error
          retention-days: 30
          path: source_audit/kirk_v4/qref_entrywise/
