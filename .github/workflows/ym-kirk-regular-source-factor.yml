name: YM Kirk v4 regular primitive source factor audit

on:
  push:
    branches:
      - verification/ym-kirk-v4-regular-source-factor-20260816-run3
    paths:
      - .github/workflows/ym-kirk-regular-source-factor.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verification/ym-kirk-v4-regular-source-factor-20260816-run3
      - name: Ensure pdftotext
        run: |
          if ! command -v pdftotext >/dev/null; then sudo apt-get update && sudo apt-get install -y poppler-utils; fi
      - name: Pin immutable Kirk source
        run: python3 tools/probe_kirk_latest_source.py >/tmp/probe.json
      - name: Extract regular source factor and source tube contexts
        run: |
          set -euo pipefail
          pdftotext -raw kirk_latest.pdf latest_raw.txt
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          text=Path('latest_raw.txt').read_text(encoding='utf-8',errors='replace')
          low=text.lower()
          out=Path('source_audit/kirk_v4/regular_source_factor'); out.mkdir(parents=True,exist_ok=True)
          targets=[
            'bounded local source parameters enter holomorphically',
            'source differentiation inserts bounded finite-range atoms',
            'source factor','source factors','local source','physical source',
            'source parameter','source parameters','source leaf','source leaves',
            'Theorem 4.6','Lemma 4.5','Proposition 4.26','Lemma 4.27',
            'passive source','factorial source norm','source norm','source tube',
            'source connector','source insertion','J-dependent','source-dependent',
            'e^{J','exp(J','exp J','J O','J·O','JO(',
            'Riemann source','source perturbation'
          ]
          chunks=[]; counts={}
          for target in targets:
            pos=0; n=0
            while True:
              i=low.find(target.lower(),pos)
              if i<0: break
              n+=1
              chunks.append(f'=== {target} hit {n} at {i} ===\n'+text[max(0,i-14000):min(len(text),i+22000)]+'\n')
              pos=i+len(target)
              if n>=80: break
            counts[target]=n
          (out/'TARGETED.txt').write_text('\n'.join(chunks),encoding='utf-8')
          (out/'COUNTS.txt').write_text('\n'.join(f'{k}: {v}' for k,v in counts.items())+'\n',encoding='utf-8')
          a=low.find('4 permanent weak renormalization group')
          b=low.find('5 dimensional transmutation')
          if a>=0 and b>a:
            (out/'SECTION4.txt').write_text(text[a:b],encoding='utf-8')
          data=Path('kirk_latest.pdf').read_bytes()
          (out/'PDF_SHA256.txt').write_text(hashlib.sha256(data).hexdigest()+'  kirk_latest.pdf\n',encoding='utf-8')
          rec=Path('kirk_latest_record.json')
          if rec.exists(): (out/'kirk_latest_record.json').write_text(rec.read_text(encoding='utf-8'),encoding='utf-8')
          print('\n'.join(f'{k}: {v}' for k,v in counts.items()))
          required=['bounded local source parameters enter holomorphically','source differentiation inserts bounded finite-range atoms','Theorem 4.6']
          missing=[x for x in required if counts.get(x,0)==0]
          if missing: raise SystemExit('missing anchors: '+', '.join(missing))
          PY
      - name: Commit audit output
        run: |
          git config user.name 'millennium-braid-source-audit'
          git config user.email 'actions@users.noreply.github.com'
          git add source_audit/kirk_v4/regular_source_factor
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audit(ym): preserve regular primitive source-factor contexts'
          git push origin HEAD:verification/ym-kirk-v4-regular-source-factor-20260816-run3
