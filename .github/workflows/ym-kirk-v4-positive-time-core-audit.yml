name: YM Kirk v4 positive-time core audit

on:
  push:
    branches:
      - verification/ym-kirk-v4-positive-time-core-audit-20260814-gpt56sol
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verification/ym-kirk-v4-positive-time-core-audit-20260814-gpt56sol
      - name: Ensure pdftotext
        run: |
          if ! command -v pdftotext >/dev/null; then
            sudo apt-get update && sudo apt-get install -y poppler-utils
          fi
      - name: Pin immutable Kirk source
        run: python3 tools/probe_kirk_latest_source.py >/tmp/probe.json
      - name: Extract OS density and positive-time contexts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('latest.txt').read_text(encoding='utf-8',errors='replace')
          out=Path('source_audit/kirk_v4/positive_time_core'); out.mkdir(parents=True,exist_ok=True)
          targets=[
            'Theorem 8.9','Corollary 8.12','Lemma 8.13','Theorem 8.45','Theorem 8.46',
            'Theorem 9.1','Lemma 9.2','Theorem 9.2','Theorem 9.3',
            'positive-time','positive time','one-time','one time','time-zero','time zero',
            'dense','cyclic','Markov','time-slice','time slice','OS Hilbert','Osterwalder'
          ]
          counts={}; ledger=[]
          low=text.lower()
          for target in targets:
            pos=0; n=0
            for hit in range(30):
              i=low.find(target.lower(),pos)
              if i<0: break
              n+=1
              ledger.append(f'=== {target} hit {n} at {i} ===\n'+text[max(0,i-2800):min(len(text),i+9500)]+'\n')
              pos=i+len(target)
            counts[target]=n
          required=['Theorem 8.9','Corollary 8.12','Theorem 8.46','Theorem 9.1','Lemma 9.2']
          missing=[x for x in required if counts[x]==0]
          (out/'LEDGER.txt').write_text('\n'.join(ledger),encoding='utf-8')
          (out/'COUNTS.txt').write_text('\n'.join(f'{k}: {v}' for k,v in counts.items())+'\n',encoding='utf-8')
          print('\n'.join(f'{k}: {v}' for k,v in counts.items()))
          if missing: raise SystemExit('missing anchors: '+', '.join(missing))
          PY
      - name: Preserve immutable audit contexts
        run: |
          cp kirk_latest_record.json source_audit/kirk_v4/positive_time_core/
          sha256sum kirk_latest.pdf > source_audit/kirk_v4/positive_time_core/PDF_SHA256.txt
          git config user.name 'millennium-braid-source-audit'
          git config user.email 'actions@users.noreply.github.com'
          git add source_audit/kirk_v4/positive_time_core
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audit(ym): preserve Kirk v4 positive-time core contexts'
          git push origin HEAD:verification/ym-kirk-v4-positive-time-core-audit-20260814-gpt56sol
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kirk-v4-positive-time-core-audit
          if-no-files-found: warn
          retention-days: 30
          path: source_audit/kirk_v4/positive_time_core/
