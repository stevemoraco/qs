name: NS Butterfly Core Replay

on:
  push:
    branches: [verification/ns-butterfly-core-20260813]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile exact source
        shell: bash
        run: |
          set -euo pipefail
          dir="$GITHUB_WORKSPACE/verification/ns-butterfly-core"
          file="$dir/NSButterflyCore.lean"
          git hash-object "$file" | tee "$dir/source-blob.txt"
          sha256sum "$file" | tee "$dir/source-sha256.txt"
          ! grep -En '(^|[^[:alnum:]_])(sorry|admit|sorryAx)([^[:alnum:]_]|$)' "$file"
          ! grep -En '^[[:space:]]*(axiom|opaque|unsafe)[[:space:]]' "$file"
          ! grep -En '(native_decide|Lean\.ofReduceBool)' "$file"
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.30.0
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version | tee "$dir/lean-version.txt"
          cd formal/millennium_audit
          lake update
          lake exe cache get
          lake env lean ../../verification/ns-butterfly-core/NSButterflyCore.lean 2>&1 | tee "$dir/lean-output.log"
          for theorem in total_energy_derivative_zero upstream_action_derivative_zero downstream_action_derivative_zero bridge_u_action_derivative_zero bridge_v_action_derivative_zero zero_pair_derivatives unequal_fluxes_give_nonzero_shared_derivative upstream_pair_weighted_floor three_four_five_old_pair_floor; do
            grep -q "$theorem" "$dir/lean-output.log"
          done
          ! grep -Eq 'declaration uses .sorry.|sorryAx|admit|Lean.ofReduceBool' "$dir/lean-output.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ns-butterfly-core-evidence
          path: verification/ns-butterfly-core/
