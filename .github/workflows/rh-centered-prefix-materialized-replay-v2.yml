name: RH centered prefix materialized Lean replay v2

on:
  push:
    branches:
      - verification/rh-bad-prime-block-tradeoff-public-replay-20260813
    paths:
      - '.github/workflows/rh-centered-prefix-materialized-replay-v2.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/rh-centered-prefix-materialized-replay-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Materialize exact canonical source
        shell: bash
        run: |
          set -euo pipefail
          root='verification/rh-centered-prefix-materialized-v2'
          mkdir -p "$root"
          cat <<'EOF' | base64 --decode > "$root/RHCenteredPrefixCriterionFinite.lean"
          
          EOF
          echo '7f5328573717514dede49b9181cbe700712ed59d3d2d8c59333506ccbf705605  verification/rh-centered-prefix-materialized-v2/RHCenteredPrefixCriterionFinite.lean' | sha256sum -c -

      - name: Reject trust escapes
        shell: bash
        run: |
          file='verification/rh-centered-prefix-materialized-v2/RHCenteredPrefixCriterionFinite.lean'
          if grep -nE '\b(sorry|admit|sorryAx|axiom|opaque|unsafe|native_decide|Lean\.ofReduceBool)\b' "$file"; then exit 1; fi

      - name: Install Lean and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.32.1
          export PATH="$HOME/.elan/bin:$PATH"
          root='verification/rh-centered-prefix-materialized-v2'
          lean --version | tee "$root/toolchain.log"
          cat > "$root/lean-toolchain" <<'EOF'
          leanprover/lean4:v4.32.1
          EOF
          cat > "$root/lakefile.toml" <<'EOF'
          name = "rh-centered-prefix-materialized-v2"
          version = "0.1.0"
          defaultTargets = []

          [[require]]
          name = "mathlib"
          git = "https://github.com/leanprover-community/mathlib4.git"
          rev = "v4.32.1"
          EOF
          cd "$root"
          lake update
          lake exe cache get
          git -C .lake/packages/mathlib rev-parse HEAD | tee mathlib-commit.log

      - name: Compile and audit axioms
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cd verification/rh-centered-prefix-materialized-v2
          lake env lean RHCenteredPrefixCriterionFinite.lean 2>&1 | tee lean-output.log
          if grep -Eq 'declaration uses .sorry.|sorryAx|admit|Lean.ofReduceBool' lean-output.log; then exit 1; fi
          python3 - <<'PY'
          import pathlib, re
          out=pathlib.Path('lean-output.log').read_text()
          names=['centered_negative_dominates','centered_square_lower','normalized_centered_identity','normalized_centered_square_identity','centered_log_threshold_positive','centered_false_block_exponent','centered_false_block_margin','centered_series_criterion']
          allowed={'propext','Classical.choice','Quot.sound'}
          for name in names:
            m=re.search(rf"RHCenteredPrefixCriterionFinite\.{name}' depends on axioms: \[([^\]]*)\]",out)
            if not m: raise SystemExit(f'missing axiom report: {name}')
            actual={x.strip() for x in m.group(1).split(',') if x.strip()}
            if actual-allowed: raise SystemExit(f'unexpected axioms: {name} {actual-allowed}')
            print(name,sorted(actual))
          PY
          echo 'VERIFIED final centered prefix finite core.'

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rh-centered-prefix-materialized-v2-evidence
          path: |
            verification/rh-centered-prefix-materialized-v2/RHCenteredPrefixCriterionFinite.lean
            verification/rh-centered-prefix-materialized-v2/lean-output.log
            verification/rh-centered-prefix-materialized-v2/toolchain.log
            verification/rh-centered-prefix-materialized-v2/mathlib-commit.log
          if-no-files-found: warn
