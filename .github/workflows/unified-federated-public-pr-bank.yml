name: Unified federated public PR Lean bank

on:
  push:
    branches:
      - agent/unified-millennium-federated-public-pr-corpus-20260813-gpt56pro
      - verification/unified-millennium-braid-federated-semantic-20260814
      - automation/federated-700-safe-manifest-20260814
    paths:
      - 'verification/federated-public-pr-bank/**'
      - 'verification/unified-exhaustive-bank/**'
      - 'verification/unified-millennium-braid-live/**'
      - '.github/workflows/unified-federated-public-pr-bank.yml'
  pull_request:
    paths:
      - 'verification/federated-public-pr-bank/**'
      - 'verification/unified-exhaustive-bank/**'
      - 'verification/unified-millennium-braid-live/**'
      - '.github/workflows/unified-federated-public-pr-bank.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  federate-and-kernel-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact private-root mirrors
        shell: bash
        run: |
          set -euo pipefail
          root=verification/unified-millennium-braid-live
          test "$(git hash-object "$root/Millennium/UnifiedMillenniumBraidLive.lean")" = \
            25fdfcb5e1cea9f267f5298ba99896749526fa22
          test "$(git hash-object "$root/Millennium/CrossProblem/UnconditionalGeometricConvergence.lean")" = \
            01956adc44d7e39541ea2903ebad3e80920b08f3
          sha256sum \
            "$root/Millennium/UnifiedMillenniumBraidLive.lean" \
            "$root/Millennium/CrossProblem/UnconditionalGeometricConvergence.lean" \
            "$root/Millennium/UnifiedMillenniumCorpusAll.lean" \
            | tee "$root/source-sha256.txt"

      - name: Fetch every public pull-request head
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --prune --filter=blob:none origin \
            '+refs/pull/*/head:refs/remotes/origin/pr/*'
          git for-each-ref --format='%(objectname) %(refname)' \
            refs/remotes/origin/pr/ \
            | tee verification/federated-public-pr-bank/fetched-pr-heads.txt
          test -s verification/federated-public-pr-bank/fetched-pr-heads.txt

      - name: Materialize one conservative copy of every unique PR-only Lean blob
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            verification/federated-public-pr-bank/extract_pr_corpus.py
          python3 verification/federated-public-pr-bank/extract_pr_corpus.py \
            --repo . \
            --out verification/federated-public-pr-bank/corpus \
            --manifest verification/federated-public-pr-bank/federated-pr-manifest.json
          cat verification/federated-public-pr-bank/federated-extraction-summary.env

      - name: Install pinned Lean and Mathlib
        shell: bash
        working-directory: verification/unified-exhaustive-bank
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.32.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version \
            | tee ../federated-public-pr-bank/lean-version.txt
          lake --version \
            | tee -a ../federated-public-pr-bank/lean-version.txt
          lake update
          lake exe cache get

      - name: Compile maximal compatible cross-PR theorem closure
        shell: bash
        working-directory: verification/unified-exhaustive-bank
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          export BANK_BASE_LEAN_PATH="$(lake env printenv LEAN_PATH)"
          export FEDERATED_SAFE_REPORT_DIR="../federated-public-pr-bank/run/generated"
          mkdir -p "$RUNNER_TEMP/empty-legacy-rh"
          python3 -m py_compile generate_bank.py generate_bank_safe.py
          python3 generate_bank_safe.py \
            --current-root ../.. \
            --legacy-root "$RUNNER_TEMP/empty-legacy-rh" \
            --out ../federated-public-pr-bank/run \
            --timeout-per-file 60 \
            --timeout-aggregate 7200
          cat ../federated-public-pr-bank/run/generated/summary.env
          cat ../federated-public-pr-bank/run/generated/syntax-safe-theorem-manifest-report.txt
          source ../federated-public-pr-bank/run/generated/summary.env
          test "$jointly_imported_modules" -gt 0
          test "$source_theorem_syntax" -ge 700
          test "$imported_bank_theorems" -ge 700
          grep -Fq 'required_giant_present=true' \
            ../federated-public-pr-bank/run/generated/syntax-safe-theorem-manifest-report.txt
          ! grep -Eq 'sorryAx|declaration uses .sorry.|error:' \
            ../federated-public-pr-bank/run/generated/unified-compile.log

      - name: Require the giant semantic theorem inside the 700-plus kernel bundle
        shell: bash
        run: |
          set -euo pipefail
          source_file=verification/federated-public-pr-bank/run/generated/UnifiedMillenniumPublicBank.lean
          log_file=verification/federated-public-pr-bank/run/generated/unified-compile.log
          grep -Fq 'Millennium.UnifiedBraidLive.everything_discovered_one_gigantic_runnable_statement' \
            "$source_file"
          grep -Fq 'bundled ' "$log_file"
          grep -Fq 'acceptedCorpusKernelBundle' "$log_file"
          echo 'Giant semantic theorem is a direct leaf of acceptedCorpusKernelBundle.' \
            | tee verification/federated-public-pr-bank/semantic-bundle-membership.txt

      - name: Enforce the foundation-only axiom boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path(
              'verification/federated-public-pr-bank/run/generated/unified-compile.log')
          text = path.read_text(encoding='utf-8', errors='replace')
          target = 'UnifiedMillenniumPublicBank.acceptedCorpusKernelBundle'
          pattern = re.compile(
              rf"'{re.escape(target)}' depends on axioms:\s*\[(.*?)\]",
              re.S)
          match = pattern.search(text)
          no_axioms = re.search(
              rf"'{re.escape(target)}' does not depend on any axioms", text)
          if match:
              deps = {
                  part.strip() for part in match.group(1).split(',') if part.strip()
              }
          elif no_axioms:
              deps = set()
          else:
              raise SystemExit('acceptedCorpusKernelBundle axiom report missing')
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          extra = deps - allowed
          if extra:
              raise SystemExit(f'non-foundation axioms: {sorted(extra)}')
          Path(
              'verification/federated-public-pr-bank/axiom-report.txt'
          ).write_text(
              f'{target}: {sorted(deps)}\n', encoding='utf-8')
          print(f'{target}: {sorted(deps)}')
          PY

      - name: Preserve exact federated corpus and kernel evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-federated-public-pr-bank-evidence
          path: |
            verification/federated-public-pr-bank/fetched-pr-heads.txt
            verification/federated-public-pr-bank/federated-extraction-summary.env
            verification/federated-public-pr-bank/federated-pr-manifest.json
            verification/federated-public-pr-bank/lean-version.txt
            verification/federated-public-pr-bank/axiom-report.txt
            verification/federated-public-pr-bank/semantic-bundle-membership.txt
            verification/federated-public-pr-bank/run/generated/**
            verification/unified-millennium-braid-live/source-sha256.txt
          if-no-files-found: warn
          retention-days: 90
