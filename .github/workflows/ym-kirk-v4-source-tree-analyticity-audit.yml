name: YM Kirk v4 source-tree analyticity audit

on:
  push:
    branches:
      - verification/ym-kirk-v4-source-tree-analyticity-audit-20260816-run3
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verification/ym-kirk-v4-source-tree-analyticity-audit-20260816-run3
      - name: Ensure pdftotext
        run: |
          if ! command -v pdftotext >/dev/null; then
            sudo apt-get update && sudo apt-get install -y poppler-utils
          fi
      - name: Pin immutable Kirk source
        run: python3 tools/probe_kirk_latest_source.py >/tmp/probe.json
      - name: Extract raw all-order/source-ball contexts
        run: |
          set -euo pipefail
          pdftotext -raw kirk_latest.pdf latest_raw.txt
          python3 - <<'PY'
          from pathlib import Path
          raw=Path('latest_raw.txt').read_text(encoding='utf-8',errors='replace')
          out=Path('source_audit/kirk_v4/source_tree_analyticity'); out.mkdir(parents=True,exist_ok=True)
          targets=[
            'Theorem 8.11','Corollary 8.12','Lemma 8.13',
            'common analytic source ball','analytic uniformly in resolution and volume',
            'local source incidence','source ball','analytic ball',
            'Theorem 4.29','passive source order','arbitrary but fixed'
          ]
          low=raw.lower(); ledger=[]; counts={}
          for target in targets:
            pos=0; n=0
            while True:
              i=low.find(target.lower(),pos)
              if i<0: break
              n+=1
              ledger.append(f'=== {target} hit {n} at {i} ===\n'+raw[max(0,i-2200):min(len(raw),i+7000)]+'\n')
              pos=i+len(target)
              if n>=20: break
            counts[target]=n
          required=['Theorem 8.11','Corollary 8.12','Lemma 8.13']
          missing=[x for x in required if counts[x]==0]
          (out/'RAW_TARGETED.txt').write_text('\n'.join(ledger),encoding='utf-8')
          (out/'COUNTS.txt').write_text('\n'.join(f'{k}: {v}' for k,v in counts.items())+'\n',encoding='utf-8')
          print('\n'.join(f'{k}: {v}' for k,v in counts.items()))
          if missing: raise SystemExit('missing anchors: '+', '.join(missing))
          PY
      - name: Preserve immutable source audit
        run: |
          cp kirk_latest_record.json source_audit/kirk_v4/source_tree_analyticity/
          sha256sum kirk_latest.pdf > source_audit/kirk_v4/source_tree_analyticity/PDF_SHA256.txt
          git config user.name 'millennium-braid-source-audit'
          git config user.email 'actions@users.noreply.github.com'
          git add source_audit/kirk_v4/source_tree_analyticity
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audit(ym): preserve source-tree analyticity contexts'
          git push origin HEAD:verification/ym-kirk-v4-source-tree-analyticity-audit-20260816-run3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kirk-v4-source-tree-analyticity-audit
          if-no-files-found: warn
          retention-days: 30
          path: source_audit/kirk_v4/source_tree_analyticity/
