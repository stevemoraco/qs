name: Verify and preserve NS Golay tight-frame core

on:
  push:
    branches:
      - verification/ns-golay-tight-frame-20260813
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  verify-and-preserve:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Canonical-source and trust preflight
        shell: bash
        run: |
          set -euo pipefail
          SRC=verification/ns-golay-tight-frame/GolayTightFrame.lean
          EXPECTED_BLOB=1fe563085660bed2bc4d505bb7baffec4a40a3a7
          ACTUAL_BLOB=$(git hash-object "$SRC")
          test "$ACTUAL_BLOB" = "$EXPECTED_BLOB"
          python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path('verification/ns-golay-tight-frame/GolayTightFrame.lean')
          text = p.read_text()
          forbidden = re.compile(r'(^|[^A-Za-z0-9_])(sorry|admit|sorryAx|axiom|opaque|unsafe)([^A-Za-z0-9_]|$)')
          match = forbidden.search(text)
          if match:
              raise SystemExit(f'forbidden source token: {match.group(2)}')
          if 'Lean.ofReduceBool' in text or 'native_decide' in text:
              raise SystemExit('forbidden source token')
          if text.count('#print axioms') != 7:
              raise SystemExit('expected exactly seven #print axioms commands')
          print('canonical blob and source trust preflight: clean')
          PY

      - name: Execute AXLE Lean 4.30
        shell: bash
        run: |
          set -euo pipefail
          OUT=verification/ns-golay-tight-frame/evidence
          mkdir -p "$OUT"
          python3 - <<'PY'
          import json
          import pathlib
          import urllib.request

          source_path = pathlib.Path(
              'verification/ns-golay-tight-frame/GolayTightFrame.lean'
          )
          out = pathlib.Path(
              'verification/ns-golay-tight-frame/evidence/axle-response.json'
          )
          payload = json.dumps({
              'content': source_path.read_text(),
              'environment': 'lean-4.30.0',
              'ignore_imports': True,
              'mathlib_options': False,
              'timeout_seconds': 900,
          }).encode()
          request = urllib.request.Request(
              'https://axle.axiommath.ai/api/v1/check',
              data=payload,
              headers={'Content-Type': 'application/json'},
              method='POST',
          )
          with urllib.request.urlopen(request, timeout=960) as response:
              result = json.load(response)
          out.write_text(json.dumps(result, indent=2, sort_keys=True))
          print(json.dumps(result, indent=2))
          PY

      - name: Enforce compiler and postcompile trust verdict
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          p = pathlib.Path(
              'verification/ns-golay-tight-frame/evidence/axle-response.json'
          )
          result = json.loads(p.read_text())
          lean_errors = result.get('lean_messages', {}).get('errors', [])
          tool_errors = result.get('tool_messages', {}).get('errors', [])
          failed = result.get('failed_declarations', [])
          if not result.get('okay') or lean_errors or tool_errors or failed:
              raise SystemExit('Lean/AXLE verification failed')
          rendered = json.dumps(result)
          for forbidden in ('sorryAx', 'Lean.ofReduceBool'):
              if forbidden in rendered:
                  raise SystemExit(f'postcompile forbidden dependency: {forbidden}')
          infos = result.get('lean_messages', {}).get('infos', [])
          if len(infos) != 7:
              raise SystemExit(f'expected seven axiom reports, got {len(infos)}')
          print('VERIFIED: exact canonical source compiled under AXLE Lean 4.30')
          PY

      - name: Record replay metadata
        shell: bash
        run: |
          set -euo pipefail
          OUT=verification/ns-golay-tight-frame/evidence
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "ref=${GITHUB_REF}"
            echo "commit=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "runner_name=${RUNNER_NAME}"
            echo "runner_os=${RUNNER_OS}"
            echo "source_git_blob=$(git hash-object verification/ns-golay-tight-frame/GolayTightFrame.lean)"
            echo "environment=lean-4.30.0"
          } > "$OUT/replay-metadata.txt"

      - name: Upload exact compiler evidence
        uses: actions/upload-artifact@v4
        with:
          name: ns-golay-tight-frame-evidence
          path: verification/ns-golay-tight-frame/evidence/
          if-no-files-found: error

      - name: Generate permanent receipt
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import urllib.request

          root = pathlib.Path('verification/ns-golay-tight-frame/evidence')
          response_path = root / 'axle-response.json'
          metadata_path = root / 'replay-metadata.txt'
          result = json.loads(response_path.read_text())

          def get_json(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with urllib.request.urlopen(req, timeout=120) as r:
                  return json.load(r)

          api = os.environ['GITHUB_API_URL']
          repo = os.environ['GITHUB_REPOSITORY']
          run_id = os.environ['GITHUB_RUN_ID']
          jobs = get_json(f'{api}/repos/{repo}/actions/runs/{run_id}/jobs')['jobs']
          job = next((j for j in jobs if j['name'] == 'verify-and-preserve'), jobs[0])
          artifacts = get_json(f'{api}/repos/{repo}/actions/runs/{run_id}/artifacts')['artifacts']
          artifact = next((a for a in artifacts if a['name'] == 'ns-golay-tight-frame-evidence'), None)

          info = result['info']
          axiom_lines = result.get('lean_messages', {}).get('infos', [])
          response_sha = hashlib.sha256(response_path.read_bytes()).hexdigest()
          metadata_sha = hashlib.sha256(metadata_path.read_bytes()).hexdigest()
          artifact_line = '- Artifact: not yet visible through the run API at receipt generation'
          if artifact:
              artifact_line = (
                  f"- Artifact ID: `{artifact['id']}`\n"
                  f"- Artifact digest: `{artifact.get('digest', 'unavailable')}`"
              )

          receipt = f'''# NS Golay tight-frame core — verification receipt

Date: 2026-08-13 UTC

Status: **finite theorem package verified; not a Navier–Stokes theorem; six-alarm off.**

## Canonical source

- Source: `verification/ns-golay-tight-frame/GolayTightFrame.lean`
- Git blob: `1fe563085660bed2bc4d505bb7baffec4a40a3a7`
- Replay input commit: `{os.environ['GITHUB_SHA']}`

## Fresh replay

- Workflow run: `{run_id}`
- Workflow job: `{job['id']}`
- Environment: AXLE `lean-4.30.0`
- AXLE request: `{info.get('request_id')}`
- AXLE executor commit: `{info.get('_executor_commit_sha')}`
- AXLE executor image: `{info.get('_executor_docker_image_id')}`
- `okay={str(result.get('okay')).lower()}`
- Lean errors: `{len(result.get('lean_messages', {}).get('errors', []))}`
- Tool errors: `{len(result.get('tool_messages', {}).get('errors', []))}`
- Failed declarations: `{len(result.get('failed_declarations', []))}`
- Warnings: `{len(result.get('lean_messages', {}).get('warnings', []))}`
{artifact_line}

## Axiom audit

All seven `#print axioms` reports are preserved verbatim in `axle-response.json`.
They report only Lean/Mathlib foundation dependencies; no theorem-specific custom axiom or `sorryAx` occurs.

## Evidence hashes

- `axle-response.json` SHA-256: `{response_sha}`
- `replay-metadata.txt` SHA-256: `{metadata_sha}`

## Exact scope

The kernel-checked source proves:

1. finite analysis–synthesis equals Gram-kernel action;
2. a delta Gram kernel reconstructs exactly as `C I`;
3. the specialization at `C=512`;
4. the complete seven-shift autocorrelation table for the explicit length-four Golay pair;
5. tensor factorization of the eight three-dimensional species;
6. exact three-dimensional correlation `512 δ₀`.

It does not identify finite translated filter rows with the abstract Gram matrix, formalize the Fourier/Leray Navier–Stokes symbol, construct lattice packets, prove leakage or feedback control, shadow Palasek’s cascade, or prove breakdown.
'''
          (root / 'EVIDENCE.md').write_text(receipt)
          (root / 'axiom-report.txt').write_text('\n'.join(axiom_lines) + '\n')
          PY

      - name: Commit preserved evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add verification/ns-golay-tight-frame/evidence/
          if git diff --cached --quiet; then
            echo 'No evidence change to commit'
            exit 0
          fi
          git commit -m 'Preserve verified Golay tight-frame AXLE evidence [skip ci]'
          git push origin "HEAD:${GITHUB_REF_NAME}"
