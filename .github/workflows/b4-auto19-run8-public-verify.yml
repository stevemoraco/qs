name: B4 AUTO19 run8 six-problem finite cores

on:
  push:
    branches:
      - agent/b4-auto19-run8-public-verifier-20260812-1016
    paths:
      - 'B4Auto19Run8/**'
      - 'verification/b4-auto19-run8/**'
      - '.github/workflows/b4-auto19-run8-public-verify.yml'
  pull_request:
    branches: [main]
    paths:
      - 'B4Auto19Run8/**'
      - 'verification/b4-auto19-run8/**'
      - '.github/workflows/b4-auto19-run8-public-verify.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Reject explicit trust escapes
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(B4Auto19Run8/*.lean)
          test ${#files[@]} -eq 6
          if grep -En '^[[:space:]]*(sorry|admit|axiom|opaque|unsafe)([^[:alnum:]_]|$)' "${files[@]}"; then
            echo 'Forbidden Lean placeholder or custom trust declaration found.' >&2
            exit 1
          fi
          if grep -En '^[[:space:]]*.*(native_decide|Lean\.ofReduceBool)' "${files[@]}"; then
            echo 'Forbidden computational trust escape found.' >&2
            exit 1
          fi

      - name: Install pinned Lean and compile exact mirrored sources
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.32.1
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version
          lake --version
          cd verification/b4-auto19-run8
          lake update
          lake exe cache get
          : > lean-output.log
          for file in ../../B4Auto19Run8/*.lean; do
            echo "=== compiling $file ===" | tee -a lean-output.log
            lake env lean "$file" 2>&1 | tee -a lean-output.log
          done
          if grep -Eq 'declaration uses .sorry.|sorryAx|admit|Lean\.ofReduceBool|error:' lean-output.log; then
            echo 'Forbidden placeholder axiom or compiler error found.' >&2
            exit 1
          fi
          test -s lean-output.log
          echo 'VERIFIED B4 AUTO19 finite/logical cores.' | tee -a lean-output.log

      - name: Upload compiler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b4-auto19-run8-sixproblem-lean-evidence
          path: verification/b4-auto19-run8/lean-output.log
          if-no-files-found: error
