name: Verify RH B106 slope-event four-bin core

on:
  push:
    branches:
      - verification/rh-b106-slope-event-four-bin-20260814-gpt56sol
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Reject proof holes and trust escapes
        shell: bash
        run: |
          set -euo pipefail
          FILE="verification/rh-b106-slope-event-four-bin/RHB106SlopeEventFourBinFinite.lean"
          if grep -En '\b(sorry|admit|sorryAx|opaque|unsafe|native_decide|Lean\.ofReduceBool)\b' "$FILE"; then
            echo "forbidden trust carrier found"
            exit 1
          fi
          if grep -En '^[[:space:]]*axiom[[:space:]]+' "$FILE"; then
            echo "custom axiom declaration found"
            exit 1
          fi

      - name: Submit exact source to AXLE Lean
        id: submit
        shell: bash
        run: |
          set -euo pipefail
          FILE="verification/rh-b106-slope-event-four-bin/RHB106SlopeEventFourBinFinite.lean"
          SOURCE_JSON=$(jq -Rs . < "$FILE")
          RESPONSE=$(curl --fail-with-body --retry 5 --retry-all-errors --retry-delay 3 -sS \
            -X POST "https://lean-compile-farm.replit.app/api/compile" \
            -H "Content-Type: application/json" \
            --data "{\"name\":\"rh-b106-slope-event-four-bin-${GITHUB_SHA}\",\"lean_source\":${SOURCE_JSON}}")
          JOB_ID=$(jq -er '.id' <<< "$RESPONSE")
          echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"
          echo "AXLE job $JOB_ID"

      - name: Require clean VERIFIED verdict
        shell: bash
        env:
          JOB_ID: ${{ steps.submit.outputs.job_id }}
        run: |
          set -euo pipefail
          ENDPOINT="https://lean-compile-farm.replit.app/api/jobs/${JOB_ID}"
          for attempt in $(seq 1 100); do
            JOB=$(curl --fail-with-body --retry 3 --retry-all-errors --retry-delay 2 -sS "$ENDPOINT")
            STATUS=$(jq -er '.status' <<< "$JOB")
            echo "poll ${attempt}: ${STATUS}"
            case "$STATUS" in
              done)
                jq '{status,verdict,sorry_count,error,axioms,verified_count,warnings}' <<< "$JOB"
                test "$(jq -r '.verdict' <<< "$JOB")" = "VERIFIED"
                test "$(jq -r '.sorry_count' <<< "$JOB")" = "0"
                test "$(jq -r '.error' <<< "$JOB")" = "null"
                test "$(jq -r '.warnings | length' <<< "$JOB")" = "0"
                exit 0
                ;;
              failed)
                jq . <<< "$JOB"
                exit 1
                ;;
              pending|compiling)
                sleep 15
                ;;
              *)
                jq . <<< "$JOB"
                exit 1
                ;;
            esac
          done
          echo "AXLE did not return a verdict before timeout"
          exit 1
