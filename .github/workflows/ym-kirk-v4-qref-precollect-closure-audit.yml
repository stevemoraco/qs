name: YM Kirk v4 Qref precollect closure audit

on:
  push:
    branches:
      - verification/ym-kirk-v4-qref-precollect-closure-audit-20260814-gpt56sol-auto3
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verification/ym-kirk-v4-qref-precollect-closure-audit-20260814-gpt56sol-auto3
      - name: Ensure pdftotext
        run: |
          if ! command -v pdftotext >/dev/null; then
            sudo apt-get update && sudo apt-get install -y poppler-utils
          fi
      - name: Pin immutable Kirk source
        run: python3 tools/probe_kirk_latest_source.py >/tmp/probe.json
      - name: Extract precollect closure contexts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text=Path('latest.txt').read_text(encoding='utf-8',errors='replace')
          low=text.lower()
          out=Path('source_audit/kirk_v4/qref_precollect_closure'); out.mkdir(parents=True,exist_ok=True)
          needles=[
            'Qtempl','Qtail','HT4','fixed optical template','tail families','uniformly summable exponential rows',
            'Summing the finite-template incidences gives (42)','permanent support reporting is unchanged',
            'internal pivot derivatives','every activity is reported in its original connected fine-link support',
            'actual local support','canonical hull of their exponential connector','shortest connector path',
            'exponential matrix algebra','complete allocated two-jet','pivot incidence','multipivot row'
          ]
          counts={}
          for needle in needles:
            pos=0;n=0;chunks=[]
            while n<40:
              i=low.find(needle.lower(),pos)
              if i<0: break
              n+=1
              chunks.append(f'=== hit {n} at {i} ===\n'+text[max(0,i-7000):min(len(text),i+22000)])
              pos=i+len(needle)
            counts[needle]=n
            safe=''.join(c if c.isalnum() else '_' for c in needle)[:80]
            if chunks:
              (out/(safe+'.txt')).write_text('\n\n'.join(chunks),encoding='utf-8')
          (out/'COUNTS.txt').write_text('\n'.join(f'{k}: {v}' for k,v in counts.items())+'\n',encoding='utf-8')
          required=['HT4','tail families','every activity is reported in its original connected fine-link support']
          missing=[x for x in required if counts.get(x,0)==0]
          print('\n'.join(f'{k}: {v}' for k,v in counts.items()))
          if missing: raise SystemExit('missing anchors: '+', '.join(missing))
          PY
      - name: Preserve immutable contexts
        run: |
          cp kirk_latest_record.json source_audit/kirk_v4/qref_precollect_closure/
          sha256sum kirk_latest.pdf > source_audit/kirk_v4/qref_precollect_closure/PDF_SHA256.txt
          git config user.name 'millennium-braid-source-audit'
          git config user.email 'actions@users.noreply.github.com'
          git add source_audit/kirk_v4/qref_precollect_closure
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audit(ym): preserve Qref precollect closure contexts'
          git push origin HEAD:verification/ym-kirk-v4-qref-precollect-closure-audit-20260814-gpt56sol-auto3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kirk-v4-qref-precollect-closure-audit
          if-no-files-found: warn
          retention-days: 30
          path: source_audit/kirk_v4/qref_precollect_closure/
