name: AXLE verify NS Golay lattice symbol gate

on:
  push:
    branches: [agent/ns-golay-lattice-symbol-gate-verifier-20260812]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ns-golay-lattice-symbol-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            verification/ns-golay-lattice-symbol-gate
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Exact-source trust preflight
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          path = Path('verification/ns-golay-lattice-symbol-gate/NSGolayLatticeSymbolGate.lean')
          text = path.read_text()
          forbidden = {
              'sorry': r'(^|[^A-Za-z0-9_])sorry([^A-Za-z0-9_]|$)',
              'admit': r'(^|[^A-Za-z0-9_])admit([^A-Za-z0-9_]|$)',
              'sorryAx': r'(^|[^A-Za-z0-9_])sorryAx([^A-Za-z0-9_]|$)',
              'custom axiom': r'(?m)^\s*axiom\s+',
              'opaque': r'(?m)^\s*opaque\s+',
              'unsafe': r'(?m)^\s*unsafe\s+',
          }
          for label, pattern in forbidden.items():
              if re.search(pattern, text):
                  raise SystemExit(f'forbidden source token: {label}')
          count = len(re.findall(r'(?m)^theorem\s+', text))
          if count != 12:
              raise SystemExit(f'expected 12 theorem declarations, found {count}')
          prints = len(re.findall(r'(?m)^#print axioms\s+', text))
          if prints != 12:
              raise SystemExit(f'expected 12 staged axiom prints, found {prints}')
          digest = hashlib.sha256(text.encode()).hexdigest()
          print(f'source_sha256={digest}')
          print('SOURCE TRUST PREFLIGHT: PASS')
          PY

      - name: AXLE Lean 4.30 compile and axiom replay
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import urllib.request

          source = pathlib.Path('verification/ns-golay-lattice-symbol-gate/NSGolayLatticeSymbolGate.lean')
          content = source.read_text()
          payload = json.dumps({
              'content': content,
              'environment': 'lean-4.30.0',
              'ignore_imports': True,
              'mathlib_options': False,
              'timeout_seconds': 900,
          }).encode()
          request = urllib.request.Request(
              'https://axle.axiommath.ai/api/v1/check',
              data=payload,
              headers={'Content-Type': 'application/json'},
              method='POST',
          )
          with urllib.request.urlopen(request, timeout=960) as response:
              result = json.load(response)
          pathlib.Path('verification/ns-golay-lattice-symbol-gate/axle-result.json').write_text(
              json.dumps(result, indent=2)
          )
          print(json.dumps(result, indent=2))
          lean_errors = result.get('lean_messages', {}).get('errors', [])
          tool_errors = result.get('tool_messages', {}).get('errors', [])
          failed = result.get('failed_declarations', [])
          output = json.dumps(result)
          if not result.get('okay') or lean_errors or tool_errors or failed:
              raise SystemExit(1)
          for forbidden in ('sorryAx', 'Lean.ofReduceBool'):
              if forbidden in output:
                  raise SystemExit(f'forbidden postcompile dependency: {forbidden}')
          print('VERIFIED: AXLE Lean 4.30 compiled all 12 finite cores with no failed declarations')
          PY

      - name: Upload exact verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: ns-golay-lattice-symbol-gate-evidence
          path: |
            verification/ns-golay-lattice-symbol-gate/NSGolayLatticeSymbolGate.lean
            verification/ns-golay-lattice-symbol-gate/axle-result.json
          if-no-files-found: error
