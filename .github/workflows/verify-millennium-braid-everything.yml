name: Verify unified Millennium braid everything

on:
  pull_request:
    paths:
      - ".github/workflows/verify-millennium-braid-everything.yml"
      - "verification/millennium-braid-everything/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout verifier
        uses: actions/checkout@v4

      - name: Checkout exact RH-Lean source commit
        uses: actions/checkout@v4
        with:
          repository: stevemoraco/RH-Lean
          ref: 2f5044d0cc191fa63597309f6ab607ada98d66f2
          path: RH-Lean
          persist-credentials: false

      - name: Pin source identity and reject proof carriers
        working-directory: RH-Lean
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "2f5044d0cc191fa63597309f6ab607ada98d66f2"
          test "$(git hash-object lean-worker/MillenniumBraidAll.lean)" = "4db30ea04f98225152d3e5efb5f7f710617e3b65"
          python3 - <<'PY'
          import pathlib, re

          def code_only(source: str) -> str:
              out = []
              i = 0
              block = 0
              line = False
              string = False
              while i < len(source):
                  if block:
                      if source.startswith('/-', i):
                          block += 1
                          i += 2
                      elif source.startswith('-/', i):
                          block -= 1
                          i += 2
                      else:
                          out.append('\n' if source[i] == '\n' else ' ')
                          i += 1
                  elif line:
                      if source[i] == '\n':
                          line = False
                          out.append('\n')
                      else:
                          out.append(' ')
                      i += 1
                  elif string:
                      if source[i] == '\\' and i + 1 < len(source):
                          out.extend('  ')
                          i += 2
                      elif source[i] == '"':
                          string = False
                          out.append(' ')
                          i += 1
                      else:
                          out.append('\n' if source[i] == '\n' else ' ')
                          i += 1
                  elif source.startswith('--', i):
                      line = True
                      out.extend('  ')
                      i += 2
                  elif source.startswith('/-', i):
                      block = 1
                      out.extend('  ')
                      i += 2
                  elif source[i] == '"':
                      string = True
                      out.append(' ')
                      i += 1
                  else:
                      out.append(source[i])
                      i += 1
              if block or string:
                  raise SystemExit('unterminated comment or string')
              return ''.join(out)

          forbidden = re.compile(
              r'\b(sorry|admit|sorryAx|native_decide|Lean\.ofReduceBool)\b'
              r'|(?m)^\s*(axiom|opaque|unsafe)\b'
          )
          files = sorted(pathlib.Path('lean-worker').glob('*.lean'))
          for path in files:
              match = forbidden.search(code_only(path.read_text()))
              if match:
                  raise SystemExit(f'forbidden {match.group(0)!r} in {path}')
          print(f'trust preflight: {len(files)} files')
          PY

      - name: Install pinned Lean
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve pinned Mathlib
        working-directory: RH-Lean
        run: |
          lake update
          lake exe cache get

      - name: Build and replay complete import spine
        working-directory: RH-Lean
        run: |
          set -euo pipefail
          lake build MillenniumBraidAll 2>&1 | tee unified-build.txt
          lake env lean lean-worker/MillenniumBraidAll.lean 2>&1 | tee unified-axioms.txt
          if grep -q 'sorryAx' unified-axioms.txt; then
            exit 1
          fi

      - name: Generate SHA and declaration manifest
        working-directory: RH-Lean
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, re, subprocess
          root = pathlib.Path('lean-worker/MillenniumBraidAll.lean')
          imports = re.findall(r'^import\s+([^\s]+)', root.read_text(), re.M)
          pat = re.compile(
              r'^\s*(theorem|lemma|def|abbrev|structure|inductive|class|instance)\b',
              re.M,
          )
          rows = []
          theorem_lines = declaration_lines = 0
          for path in sorted(pathlib.Path('lean-worker').glob('*.lean')):
              data = path.read_bytes()
              kinds = pat.findall(data.decode())
              theorem_lines += sum(k in ('theorem', 'lemma') for k in kinds)
              declaration_lines += len(kinds)
              rows.append({
                  'path': str(path),
                  'git_blob': subprocess.check_output(
                      ['git', 'hash-object', str(path)], text=True
                  ).strip(),
                  'sha256': hashlib.sha256(data).hexdigest(),
                  'bytes': len(data),
                  'declaration_lines': len(kinds),
              })
          report = {
              'source_commit': subprocess.check_output(
                  ['git', 'rev-parse', 'HEAD'], text=True
              ).strip(),
              'root_git_blob': subprocess.check_output(
                  ['git', 'hash-object', str(root)], text=True
              ).strip(),
              'toolchain': pathlib.Path('lean-toolchain').read_text().strip(),
              'explicit_imports': len(imports),
              'curated_lean_files': len(rows),
              'theorem_or_lemma_lines': theorem_lines,
              'declaration_lines': declaration_lines,
              'files': rows,
          }
          pathlib.Path('unified-manifest.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n'
          )
          print(json.dumps({k:v for k,v in report.items() if k != 'files'},
                           indent=2, sort_keys=True))
          PY

      - name: Upload replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: millennium-braid-everything-evidence
          path: |
            RH-Lean/unified-build.txt
            RH-Lean/unified-axioms.txt
            RH-Lean/unified-manifest.json
          if-no-files-found: warn
