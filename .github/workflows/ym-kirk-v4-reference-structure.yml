name: YM Kirk v4 reference support structure

on:
  push:
    branches:
      - verification/ym-kirk-v4-reference-path-geometry-20260814-gpt56sol
    paths:
      - .github/workflows/ym-kirk-v4-reference-structure.yml

permissions:
  contents: write

jobs:
  source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verification/ym-kirk-v4-reference-path-geometry-20260814-gpt56sol
      - name: Ensure pdftotext
        run: |
          if ! command -v pdftotext >/dev/null; then sudo apt-get update && sudo apt-get install -y poppler-utils; fi
      - name: Pin immutable v4 and extract reference-structure contexts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, urllib.request, time, urllib.error, hashlib
          UA='millennium-braid-reference-structure/1.0'
          def get(url):
              last=None
              for i in range(7):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'*/*'})
                      with urllib.request.urlopen(req,timeout=60) as r: return r.read(),r.geturl()
                  except (urllib.error.HTTPError,urllib.error.URLError) as e:
                      last=e
                      if isinstance(e,urllib.error.HTTPError) and e.code not in (429,500,502,503,504): raise
                      time.sleep(min(2**i,32))
              raise last
          raw,_=get('https://zenodo.org/api/records/21765806'); rec=json.loads(raw)
          latest=rec.get('links',{}).get('latest')
          if latest:
              raw,_=get(latest); rec=json.loads(raw)
          pdfs=[f for f in rec.get('files',[]) if str(f.get('key','')).lower().endswith('.pdf')]
          if len(pdfs)!=1: raise RuntimeError(len(pdfs))
          url=pdfs[0].get('links',{}).get('content') or pdfs[0].get('links',{}).get('self')
          pdf,_=get(url); Path('/tmp/kirk.pdf').write_bytes(pdf)
          out=Path('source_audit/kirk_v4/reference_path_geometry'); out.mkdir(parents=True,exist_ok=True)
          (out/'REFERENCE_STRUCTURE_RECORD.json').write_bytes(raw)
          (out/'REFERENCE_STRUCTURE_SHA256.txt').write_text(hashlib.sha256(pdf).hexdigest()+'\n')
          PY
          pdftotext -layout /tmp/kirk.pdf /tmp/kirk.txt
          python3 - <<'PY'
          from pathlib import Path
          text=Path('/tmp/kirk.txt').read_text(encoding='utf-8',errors='replace'); low=text.lower()
          out=Path('source_audit/kirk_v4/reference_path_geometry')
          phrases=[
            'Qtempl','Qtail','exponential matrix algebra','canonical hull','canonical connector',
            'reference factor','reference factors','complete allocated two-jet','finite-template incidences',
            'Proposition 4.26','Definition 3.22','matrix algebra','tree length','tree-length',
            'tau (Y )','τ (Y )','physical activity','reference activity'
          ]
          chunks=[]; summary=[]
          for phrase in phrases:
              pos=0; hits=[]
              while True:
                  i=low.find(phrase.lower(),pos)
                  if i<0: break
                  hits.append(i); pos=i+max(1,len(phrase))
              summary.append(f'{phrase}: {len(hits)}')
              for j,i in enumerate(hits[:12],1):
                  chunks.append(f'===== {phrase} hit {j} at {i} =====\n'+text[max(0,i-2200):min(len(text),i+6500)])
          (out/'REFERENCE_STRUCTURE.txt').write_text('\n\n'.join(chunks),encoding='utf-8')
          (out/'REFERENCE_STRUCTURE_SUMMARY.txt').write_text('\n'.join(summary)+'\n',encoding='utf-8')
          print('\n'.join(summary))
          PY
      - name: Commit focused contexts
        run: |
          git config user.name 'millennium-braid-source-audit'
          git config user.email 'actions@users.noreply.github.com'
          git add source_audit/kirk_v4/reference_path_geometry
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audit(ym): expose reference support structure contexts'
          git push origin HEAD:verification/ym-kirk-v4-reference-path-geometry-20260814-gpt56sol
      - uses: actions/upload-artifact@v4
        with:
          name: kirk-v4-reference-support-structure
          if-no-files-found: error
          retention-days: 30
          path: source_audit/kirk_v4/reference_path_geometry/
