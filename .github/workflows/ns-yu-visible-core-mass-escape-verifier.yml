name: Verify NS Yu visible-core mass-escape firewall

on:
  push:
    branches:
      - verification/ns-yu-visible-core-mass-escape-20260816-gpt56sol
    paths:
      - verification/ns_yu_visible_core_mass_escape/NSYuVisibleCoreMassEscape.lean
      - .github/workflows/ns-yu-visible-core-mass-escape-verifier.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Source and trust preflight
        shell: bash
        run: |
          set -euo pipefail
          SRC=verification/ns_yu_visible_core_mass_escape/NSYuVisibleCoreMassEscape.lean
          test -f "$SRC"
          python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path('verification/ns_yu_visible_core_mass_escape/NSYuVisibleCoreMassEscape.lean')
          text = p.read_text()
          forbidden = re.compile(r'(^|[^A-Za-z0-9_])(sorry|admit|sorryAx|axiom|opaque|unsafe)([^A-Za-z0-9_]|$)')
          m = forbidden.search(text)
          if m:
              raise SystemExit(f'forbidden source token: {m.group(2)}')
          for token in ('Lean.ofReduceBool', 'native_decide'):
              if token in text:
                  raise SystemExit(f'forbidden source token: {token}')
          if text.count('#print axioms') != 7:
              raise SystemExit('expected exactly seven staged axiom reports')
          print('source trust preflight: clean')
          PY
          git hash-object "$SRC"
          sha256sum "$SRC"

      - name: Compile exact source with AXLE Lean 4.30
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/ns_yu_visible_core_mass_escape
          python3 - <<'PY'
          import json, pathlib, urllib.request
          source = pathlib.Path(
              'verification/ns_yu_visible_core_mass_escape/NSYuVisibleCoreMassEscape.lean'
          ).read_text()
          payload = json.dumps({
              'content': source,
              'environment': 'lean-4.30.0',
              'ignore_imports': True,
              'mathlib_options': False,
              'timeout_seconds': 900,
          }).encode()
          req = urllib.request.Request(
              'https://axle.axiommath.ai/api/v1/check', data=payload,
              headers={'Content-Type': 'application/json'}, method='POST')
          try:
              with urllib.request.urlopen(req, timeout=960) as response:
                  result = json.load(response)
          except Exception as exc:
              result = {
                  'okay': False,
                  'request_exception': repr(exc),
                  'lean_messages': {'errors': [], 'warnings': []},
                  'tool_messages': {'errors': [], 'warnings': []},
                  'failed_declarations': [],
              }
          evidence = pathlib.Path('evidence/ns_yu_visible_core_mass_escape')
          evidence.joinpath('axle-response.json').write_text(
              json.dumps(result, indent=2, sort_keys=True))
          print(json.dumps(result, indent=2))
          errors = result.get('lean_messages', {}).get('errors', [])
          warnings = result.get('lean_messages', {}).get('warnings', [])
          tool_errors = result.get('tool_messages', {}).get('errors', [])
          tool_warnings = result.get('tool_messages', {}).get('warnings', [])
          failed = result.get('failed_declarations', [])
          if not result.get('okay') or errors or warnings or tool_errors or tool_warnings or failed:
              raise SystemExit('verification failed or emitted warnings')
          rendered = json.dumps(result)
          for token in ('sorryAx', 'Lean.ofReduceBool'):
              if token in rendered:
                  raise SystemExit(f'postcompile forbidden dependency: {token}')
          print('VERIFIED: exact warning-free source compiled')
          PY

      - name: Record replay metadata
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          SRC=verification/ns_yu_visible_core_mass_escape/NSYuVisibleCoreMassEscape.lean
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "commit=${GITHUB_SHA}"
            echo "runner_name=${RUNNER_NAME}"
            echo "runner_os=${RUNNER_OS}"
            echo "source_blob=$(git hash-object "$SRC")"
            echo "source_sha256=$(sha256sum "$SRC" | awk '{print $1}')"
            echo "environment=lean-4.30.0"
          } > evidence/ns_yu_visible_core_mass_escape/replay-metadata.txt

      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ns-yu-visible-core-mass-escape-evidence
          path: evidence/ns_yu_visible_core_mass_escape/
          if-no-files-found: error
