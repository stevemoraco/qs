name: YM Rayleigh covariance survival public replay

on:
  push:
    branches:
      - verification/ym-rayleigh-covariance-survival-20260813
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Materialize exact source and verify
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification/ym-rayleigh-covariance-survival
          cat <<'B64' | base64 -d > verification/ym-rayleigh-covariance-survival/RayleighCovarianceSurvivalCore.lean
          
          B64
          SRC=verification/ym-rayleigh-covariance-survival/RayleighCovarianceSurvivalCore.lean
          test "$(git hash-object "$SRC")" = 63637326bc92075883d35e7e4040bfed41639e9d
          python3 - <<'PY'
          import json, pathlib, re, urllib.request
          source = pathlib.Path('verification/ym-rayleigh-covariance-survival/RayleighCovarianceSurvivalCore.lean').read_text()
          forbidden = re.compile(r'(^|[^A-Za-z0-9_])(sorry|admit|sorryAx|axiom|opaque|unsafe)([^A-Za-z0-9_]|$)')
          m = forbidden.search(source)
          assert not m, m.group(2) if m else ''
          assert source.count('#print axioms') == 6
          payload = json.dumps({'content':source,'environment':'lean-4.30.0','ignore_imports':True,'mathlib_options':False,'timeout_seconds':900}).encode()
          req = urllib.request.Request('https://axle.axiommath.ai/api/v1/check',data=payload,headers={'Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req, timeout=960) as response:
              result = json.load(response)
          print(json.dumps(result, indent=2))
          lean = result.get('lean_messages', {})
          tool = result.get('tool_messages', {})
          assert result.get('okay')
          assert not result.get('failed_declarations', [])
          assert not lean.get('errors', []) and not lean.get('warnings', [])
          assert not tool.get('errors', []) and not tool.get('warnings', [])
          assert 'sorryAx' not in json.dumps(result)
          print('VERIFIED: exact source compiled under AXLE Lean 4.30')
          PY
