name: YM Kirk v4 regular source N1 audit

on:
  push:
    branches:
      - verification/ym-kirk-v4-regular-source-factor-20260816-run3
    paths:
      - .github/workflows/ym-kirk-regular-source-lipschitz.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verification/ym-kirk-v4-regular-source-factor-20260816-run3
      - name: Ensure pdftotext
        run: |
          if ! command -v pdftotext >/dev/null; then sudo apt-get update && sudo apt-get install -y poppler-utils; fi
      - name: Pin immutable Kirk source
        run: python3 tools/probe_kirk_latest_source.py >/tmp/probe.json
      - name: Extract source norm and N=1 contexts
        run: |
          set -euo pipefail
          pdftotext -layout kirk_latest.pdf latest_layout.txt
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          text=Path('latest_layout.txt').read_text(encoding='utf-8',errors='replace')
          low=text.lower()
          out=Path('source_audit/kirk_v4/regular_source_n1'); out.mkdir(parents=True,exist_ok=True)
          targets=['4.2     marked hierarchy','Theorem 4.6','bounded local source parameters','source differentiation','factorial source norm','source leaves','rooted domain','source order N','source parameters enter holomorphically','Corollary 8.12','common analytic source ball']
          chunks=[]; counts={}
          for t in targets:
            pos=0;n=0
            while True:
              i=low.find(t.lower(),pos)
              if i<0: break
              n+=1
              chunks.append(f'=== {t} hit {n} at {i} ===\n'+text[max(0,i-9000):min(len(text),i+16000)]+'\n')
              pos=i+len(t)
              if n>=30: break
            counts[t]=n
          (out/'TARGETED.txt').write_text('\n'.join(chunks),encoding='utf-8')
          (out/'COUNTS.txt').write_text('\n'.join(f'{k}: {v}' for k,v in counts.items())+'\n',encoding='utf-8')
          (out/'PDF_SHA256.txt').write_text(hashlib.sha256(Path('kirk_latest.pdf').read_bytes()).hexdigest()+'  kirk_latest.pdf\n',encoding='utf-8')
          rec=Path('kirk_latest_record.json')
          if rec.exists(): (out/'kirk_latest_record.json').write_text(rec.read_text(encoding='utf-8'),encoding='utf-8')
          if counts.get('Theorem 4.6',0)==0: raise SystemExit('missing Theorem 4.6')
          PY
      - name: Commit audit output
        run: |
          git config user.name 'millennium-braid-source-audit'
          git config user.email 'actions@users.noreply.github.com'
          git add source_audit/kirk_v4/regular_source_n1
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audit(ym): preserve N=1 regular source contexts'
          git push origin HEAD:verification/ym-kirk-v4-regular-source-factor-20260816-run3
