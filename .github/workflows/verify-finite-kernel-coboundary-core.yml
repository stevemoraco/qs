name: Verify finite-kernel coboundary core

on:
  workflow_dispatch:
  push:
    paths:
      - "verification/finite_kernel_coboundary_core/**"
      - ".github/workflows/verify-finite-kernel-coboundary-core.yml"
  pull_request:
    paths:
      - "verification/finite_kernel_coboundary_core/**"
      - ".github/workflows/verify-finite-kernel-coboundary-core.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: verification/finite_kernel_coboundary_core

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify exact source and trust gate
        shell: bash
        run: |
          set -euo pipefail
          file=FiniteKernelCoboundaryCore.lean
          test "$(git hash-object "$file")" = "c1bdd47e694074d9ca5800790bf4711c45043e8d"
          echo "5fcd95c979896a9be1ebee2cedee3298b9cac461d652a5ad09252ee87f439c3e  $file" | sha256sum -c -
          if grep -nE '\b(sorry|admit|sorryAx|unsafe|opaque|native_decide)\b|^axiom |Lean\.ofReduceBool' "$file"; then
            echo "Forbidden token found"
            exit 1
          fi

      - name: Install elan
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get

      - name: Kernel-check exact source
        shell: bash
        run: |
          set -euo pipefail
          lake env lean FiniteKernelCoboundaryCore.lean 2>&1 | tee lean-output.txt
          if grep -q 'sorryAx' lean-output.txt; then
            echo "sorryAx found in axiom report"
            exit 1
          fi

      - name: Reject compiler warnings
        shell: bash
        run: |
          set -euo pipefail
          if grep -n '^warning:' lean-output.txt; then
            echo "Lean compiler warning found"
            exit 1
          fi

      - name: Upload replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finite-kernel-coboundary-core-replay
          path: |
            verification/finite_kernel_coboundary_core/FiniteKernelCoboundaryCore.lean
            verification/finite_kernel_coboundary_core/lean-output.txt
          if-no-files-found: warn
