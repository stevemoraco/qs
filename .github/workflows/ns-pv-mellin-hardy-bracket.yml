name: Verify NS Pineau-Vicol Mellin Hardy-bracket core

on:
  push:
    branches:
      - agent/ns-pv-mellin-hardy-bracket-20260815-run52
    paths:
      - 'verification/ns-pv-mellin-hardy-bracket/**'
      - '.github/workflows/ns-pv-mellin-hardy-bracket.yml'
  pull_request:
    paths:
      - 'verification/ns-pv-mellin-hardy-bracket/**'
      - '.github/workflows/ns-pv-mellin-hardy-bracket.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trust preflight
        shell: bash
        run: |
          set -euo pipefail
          SRC=verification/ns-pv-mellin-hardy-bracket/NSPVMellinHardyBracket.lean
          test -s "$SRC"
          if grep -nE '\b(sorry|admit|sorryAx|axiom|opaque|unsafe|native_decide|Lean\.ofReduceBool)\b' "$SRC"; then
            echo "forbidden trust carrier found in $SRC" >&2
            exit 1
          fi
          test "$(grep -c '^#print axioms ' "$SRC")" = 4
          sha256sum "$SRC" | tee source.sha256

      - name: Execute exact source with AXLE Lean 4.30
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, urllib.request
          p = pathlib.Path('verification/ns-pv-mellin-hardy-bracket/NSPVMellinHardyBracket.lean')
          payload = json.dumps({
              'content': p.read_text(),
              'environment': 'lean-4.30.0',
              'ignore_imports': True,
              'mathlib_options': False,
              'timeout_seconds': 1200,
          }).encode()
          req = urllib.request.Request(
              'https://axle.axiommath.ai/api/v1/check',
              data=payload,
              headers={'Content-Type': 'application/json'},
              method='POST',
          )
          with urllib.request.urlopen(req, timeout=1260) as response:
              result = json.load(response)
          pathlib.Path('NSPVMellinHardyBracket-axle-response.json').write_text(
              json.dumps(result, indent=2, sort_keys=True))
          print(json.dumps(result, indent=2))
          PY

      - name: Enforce clean compiler verdict
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path('NSPVMellinHardyBracket-axle-response.json')
          if not p.exists():
              raise SystemExit('missing AXLE response')
          r = json.loads(p.read_text())
          lean = r.get('lean_messages', {})
          tool = r.get('tool_messages', {})
          rendered = json.dumps(r)
          groups = [
              ('Lean error', lean.get('errors', [])),
              ('Lean warning', lean.get('warnings', [])),
              ('Tool error', tool.get('errors', [])),
              ('Tool warning', tool.get('warnings', [])),
              ('Failed declaration', r.get('failed_declarations', [])),
          ]
          for label, items in groups:
              for item in items:
                  msg = json.dumps(item, ensure_ascii=False).replace('\n', ' ')
                  print(f'::error title={label}::{msg}')
          bad = (not r.get('okay') or lean.get('errors', []) or lean.get('warnings', []) or
                 tool.get('errors', []) or tool.get('warnings', []) or
                 r.get('failed_declarations', []) or 'sorryAx' in rendered or
                 'Lean.ofReduceBool' in rendered)
          print(json.dumps({
              'okay': r.get('okay'),
              'cached_response': r.get('cached_response'),
              'lean_errors': lean.get('errors', []),
              'lean_warnings': lean.get('warnings', []),
              'tool_errors': tool.get('errors', []),
              'tool_warnings': tool.get('warnings', []),
              'failed_declarations': r.get('failed_declarations', []),
          }, sort_keys=True))
          if bad:
              raise SystemExit(1)
          print('VERIFIED CLEAN')
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ns-pv-mellin-hardy-bracket-evidence
          path: |
            verification/ns-pv-mellin-hardy-bracket/NSPVMellinHardyBracket.lean
            source.sha256
            NSPVMellinHardyBracket-axle-response.json
