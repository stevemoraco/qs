name: Navier-Stokes source-amplitude diagonal exponent replay

on:
  push:
    branches:
      - agent/ns-source-amplitude-diagonal-exponents-20260813
    paths:
      - 'formal/ns-source-amplitude-diagonal/**'
      - '.github/workflows/ns-source-amplitude-diagonal-exponents.yml'
  pull_request:
    branches: [main]
    paths:
      - 'formal/ns-source-amplitude-diagonal/**'
      - '.github/workflows/ns-source-amplitude-diagonal-exponents.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Reject explicit proof holes and custom trust carriers
        shell: bash
        run: |
          set -euo pipefail
          file='formal/ns-source-amplitude-diagonal/NSSourceAmplitudeDiagonalExponentFirewall.lean'
          if grep -nE '\b(sorry|admit|axiom|opaque|unsafe|native_decide)\b' "$file"; then
            echo 'Rejected: forbidden proof carrier found.'
            exit 1
          fi

      - name: Install pinned official Lean release
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version \
            | tee formal/ns-source-amplitude-diagonal/toolchain.txt

      - name: Fresh foundation-only kernel replay
        shell: bash
        run: |
          set -euo pipefail
          file='formal/ns-source-amplitude-diagonal/NSSourceAmplitudeDiagonalExponentFirewall.lean'
          output='formal/ns-source-amplitude-diagonal/lean-kernel-output.txt'
          "$HOME/.elan/bin/lean" -DwarningAsError=true "$file" 2>&1 | tee "$output"
          if grep -q 'sorryAx' "$output"; then
            echo 'Rejected: kernel output contains sorryAx.'
            exit 1
          fi

      - name: Preserve replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ns-source-amplitude-diagonal-${{ github.sha }}
          path: |
            formal/ns-source-amplitude-diagonal/NSSourceAmplitudeDiagonalExponentFirewall.lean
            formal/ns-source-amplitude-diagonal/toolchain.txt
            formal/ns-source-amplitude-diagonal/lean-kernel-output.txt
          if-no-files-found: warn
