name: Verify NS Pineau-Vicol rotation-quotient drift

on:
  push:
    branches:
      - agent/ns-pv-rotation-quotient-drift-20260815-run42
    paths:
      - 'verification/ns-pv-rotation-quotient-drift-20260815-run42/**'
      - '.github/workflows/ns-pv-rotation-quotient-drift.yml'
  pull_request:
    paths:
      - 'verification/ns-pv-rotation-quotient-drift-20260815-run42/**'
      - '.github/workflows/ns-pv-rotation-quotient-drift.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trust preflight
        shell: bash
        run: |
          set -euo pipefail
          SRC=verification/ns-pv-rotation-quotient-drift-20260815-run42/NSPVRotationQuotientDrift.lean
          test -s "$SRC"
          if grep -nE '\b(sorry|admit|sorryAx|axiom|opaque|unsafe|native_decide|Lean\.ofReduceBool)\b' "$SRC"; then
            echo "forbidden trust carrier found in $SRC" >&2
            exit 1
          fi
          test "$(grep -c '^#print axioms ' "$SRC")" = 7
          sha256sum "$SRC" | tee source.sha256

      - name: Execute exact source with AXLE Lean 4.30
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, urllib.request
          p = pathlib.Path('verification/ns-pv-rotation-quotient-drift-20260815-run42/NSPVRotationQuotientDrift.lean')
          payload = json.dumps({
              'content': p.read_text(),
              'environment': 'lean-4.30.0',
              'ignore_imports': True,
              'mathlib_options': False,
              'timeout_seconds': 1200,
          }).encode()
          req = urllib.request.Request(
              'https://axle.axiommath.ai/api/v1/check',
              data=payload,
              headers={'Content-Type': 'application/json'},
              method='POST',
          )
          with urllib.request.urlopen(req, timeout=1260) as response:
              result = json.load(response)
          pathlib.Path('NSPVRotationQuotientDrift-axle-response.json').write_text(
              json.dumps(result, indent=2, sort_keys=True))
          print(json.dumps(result, indent=2))
          PY

      - name: Enforce clean compiler verdict
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path('NSPVRotationQuotientDrift-axle-response.json')
          if not p.exists():
              raise SystemExit('missing AXLE response')
          r = json.loads(p.read_text())
          lean = r.get('lean_messages', {})
          tool = r.get('tool_messages', {})
          compact = {
              'okay': r.get('okay'),
              'cached_response': r.get('cached_response'),
              'lean_errors': lean.get('errors', []),
              'lean_warnings': lean.get('warnings', []),
              'tool_errors': tool.get('errors', []),
              'tool_warnings': tool.get('warnings', []),
              'failed_declarations': r.get('failed_declarations', []),
          }
          rendered = json.dumps(r)
          compact['forbidden_postcompile'] = ('sorryAx' in rendered or 'Lean.ofReduceBool' in rendered)
          bad = (not compact['okay'] or compact['lean_errors'] or compact['lean_warnings'] or
                 compact['tool_errors'] or compact['tool_warnings'] or
                 compact['failed_declarations'] or compact['forbidden_postcompile'])
          print(json.dumps(compact, sort_keys=True))
          if bad:
              raise SystemExit(1)
          print('VERIFIED CLEAN')
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ns-pv-rotation-quotient-drift-evidence
          path: |
            verification/ns-pv-rotation-quotient-drift-20260815-run42/NSPVRotationQuotientDrift.lean
            source.sha256
            NSPVRotationQuotientDrift-axle-response.json
