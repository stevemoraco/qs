name: Verify NS compactness-rate firewall

on:
  workflow_dispatch:
  push:
    paths:
      - "verification/ns_compactness_rate/**"
      - ".github/workflows/verify-ns-compactness-rate-firewall.yml"
  pull_request:
    paths:
      - "verification/ns_compactness_rate/**"
      - ".github/workflows/verify-ns-compactness-rate-firewall.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: verification/ns_compactness_rate

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify exact source and trust gate
        shell: bash
        run: |
          set -euo pipefail
          file=CompactnessRateFirewall.lean
          test "$(git hash-object "$file")" = "94b45fd03085cd9d18af6f85009733ad25b2f9b3"
          if grep -nE '\b(sorry|admit|sorryAx|unsafe|opaque|native_decide)\b|^axiom |Lean\.ofReduceBool' "$file"; then
            echo "Forbidden token found"
            exit 1
          fi

      - name: Install elan
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get

      - name: Kernel-check exact source
        shell: bash
        run: |
          set -euo pipefail
          lake env lean CompactnessRateFirewall.lean 2>&1 | tee lean-output.txt
          if grep -q 'sorryAx' lean-output.txt; then
            echo "sorryAx found in axiom report"
            exit 1
          fi

      - name: Reject compiler warnings
        shell: bash
        run: |
          set -euo pipefail
          if grep -qi 'warning:' lean-output.txt; then
            cat lean-output.txt
            exit 1
          fi

      - name: Upload replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ns-compactness-rate-firewall-replay
          path: |
            verification/ns_compactness_rate/CompactnessRateFirewall.lean
            verification/ns_compactness_rate/lean-output.txt
          if-no-files-found: warn
