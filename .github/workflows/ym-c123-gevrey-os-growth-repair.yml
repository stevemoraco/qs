name: YM C123 Gevrey OS growth repair

on:
  push:
    branches:
      - verification/ym-c123-gevrey-os-growth-repair-20260817-gpt56pro
    paths:
      - .github/workflows/ym-c123-gevrey-os-growth-repair.yml
      - verification/ym-c123-gevrey-os-growth-repair/GevreyOSGrowthRepair.lean
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Trust preflight
        shell: bash
        run: |
          set -euo pipefail
          SRC=verification/ym-c123-gevrey-os-growth-repair/GevreyOSGrowthRepair.lean
          if grep -nE '\b(sorry|admit|sorryAx|axiom|opaque|unsafe|native_decide|Lean\.ofReduceBool)\b' "$SRC"; then
            echo 'Forbidden proof carrier found.' >&2
            exit 1
          fi
          sha256sum "$SRC"

      - name: Fresh AXLE Lean replay
        shell: bash
        run: |
          set -euo pipefail
          SRC=verification/ym-c123-gevrey-os-growth-repair/GevreyOSGrowthRepair.lean
          SRC="$SRC" python3 - <<'PY'
          import json, os, pathlib, urllib.request

          path = pathlib.Path(os.environ['SRC'])
          payload = json.dumps({
              'content': path.read_text(),
              'environment': 'lean-4.30.0',
              'ignore_imports': True,
              'mathlib_options': False,
              'timeout_seconds': 1200,
          }).encode()
          req = urllib.request.Request(
              'https://axle.axiommath.ai/api/v1/check',
              data=payload,
              headers={'Content-Type': 'application/json'},
              method='POST')
          with urllib.request.urlopen(req, timeout=1260) as response:
              result = json.load(response)

          pathlib.Path('ym-c123-axle-result.json').write_text(
              json.dumps(result, indent=2, sort_keys=True))
          print(json.dumps(result, indent=2))

          lean = result.get('lean_messages', {})
          tool = result.get('tool_messages', {})
          bad = (
              not result.get('okay')
              or bool(result.get('failed_declarations', []))
              or bool(lean.get('errors', []))
              or bool(lean.get('warnings', []))
              or bool(tool.get('errors', []))
              or bool(tool.get('warnings', []))
              or 'sorryAx' in json.dumps(result)
          )
          if bad:
              raise SystemExit(1)
          PY

      - name: Upload exact replay evidence
        uses: actions/upload-artifact@v4
        with:
          name: ym-c123-gevrey-os-growth-replay
          path: |
            verification/ym-c123-gevrey-os-growth-repair/GevreyOSGrowthRepair.lean
            ym-c123-axle-result.json
          if-no-files-found: error
