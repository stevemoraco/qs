name: Verify NS AO phase current
on:
  push:
    branches: [agent/ns-ao-ground-state-current-verifier-20260813]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Trust preflight
        run: |
          set -euo pipefail
          SRC=formal/millennium_audit/SixLaneAudit/NSAoGroundStateCurrent.lean
          test "$(sha256sum "$SRC" | cut -d' ' -f1)" = "338bc63d558009f7323a37c0488bc92ff2be461a8a430b634c9bbf3195d31359"
          ! grep -En '(^|[^A-Za-z0-9_])(sorry|admit|sorryAx|axiom|opaque|unsafe)([^A-Za-z0-9_]|$)' "$SRC"
          test "$(grep -c '#print axioms' "$SRC")" = 5
      - name: Compile with AXLE Lean 4.30
        run: |
          set -euo pipefail
          mkdir -p verification/ns-ao-ground-state-current/evidence
          python3 - <<'PY'
          import json, pathlib, urllib.request
          src = pathlib.Path('formal/millennium_audit/SixLaneAudit/NSAoGroundStateCurrent.lean').read_text()
          payload = json.dumps({'content': src, 'environment': 'lean-4.30.0', 'ignore_imports': True, 'mathlib_options': False, 'timeout_seconds': 900}).encode()
          req = urllib.request.Request('https://axle.axiommath.ai/api/v1/check', data=payload, headers={'Content-Type':'application/json'}, method='POST')
          with urllib.request.urlopen(req, timeout=960) as response:
              result = json.load(response)
          out = pathlib.Path('verification/ns-ao-ground-state-current/evidence/axle-response.json')
          out.write_text(json.dumps(result, indent=2, sort_keys=True))
          errors = result.get('lean_messages',{}).get('errors',[])
          warnings = result.get('lean_messages',{}).get('warnings',[])
          tool_errors = result.get('tool_messages',{}).get('errors',[])
          tool_warnings = result.get('tool_messages',{}).get('warnings',[])
          failed = result.get('failed_declarations',[])
          assert result.get('okay') and not errors and not warnings and not tool_errors and not tool_warnings and not failed, result
          rendered = json.dumps(result)
          assert 'sorryAx' not in rendered and 'Lean.ofReduceBool' not in rendered
          print(json.dumps(result, indent=2))
          PY
      - name: Metadata
        if: always()
        run: |
          mkdir -p verification/ns-ao-ground-state-current/evidence
          printf 'commit=%s\nsource_sha256=%s\nenvironment=lean-4.30.0\n' "$GITHUB_SHA" "$(sha256sum formal/millennium_audit/SixLaneAudit/NSAoGroundStateCurrent.lean | cut -d' ' -f1)" > verification/ns-ao-ground-state-current/evidence/replay-metadata.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ns-ao-ground-state-current-evidence
          path: verification/ns-ao-ground-state-current/evidence/
          if-no-files-found: error
