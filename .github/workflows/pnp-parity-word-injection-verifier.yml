name: Verify PNP parity-word injection

on:
  push:
    branches:
      - verification/ns-selective-leray-atom-20260813
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Canonical-source and trust preflight
        shell: bash
        run: |
          set -euo pipefail
          SRC=verification/pnp-parity-word-injection/PNPParityWordInjection.lean
          EXPECTED_GIT_BLOB=64687b4a58054fdb0a3f1b5a88cb0414f822c4bb
          ACTUAL_GIT_BLOB=$(git hash-object "$SRC")
          test "$ACTUAL_GIT_BLOB" = "$EXPECTED_GIT_BLOB"
          python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path('verification/pnp-parity-word-injection/PNPParityWordInjection.lean')
          source = p.read_text()
          forbidden = re.compile(r'(^|[^A-Za-z0-9_])(sorry|admit|sorryAx|axiom|opaque|unsafe)([^A-Za-z0-9_]|$)')
          match = forbidden.search(source)
          if match:
              raise SystemExit(f'forbidden source token: {match.group(2)}')
          if 'Lean.ofReduceBool' in source or 'native_decide' in source:
              raise SystemExit('forbidden source token')
          if source.count('#print axioms') != 26:
              raise SystemExit('expected exactly twenty-six staged #print axioms commands')
          print('source trust preflight: clean')
          PY

      - name: Replay bounded exact hostile checker twice
        shell: bash
        run: |
          set -euo pipefail
          CHECKER=verification/pnp-parity-word-injection/check_pnp_parity_word.py
          EXPECTED_CHECKER_GIT_BLOB=9a15dfdb2f2c584c6733a2a6cd3b90db0ed2c29b
          test "$(git hash-object "$CHECKER")" = "$EXPECTED_CHECKER_GIT_BLOB"
          OUT=verification/pnp-parity-word-injection/evidence
          mkdir -p "$OUT"
          python3 "$CHECKER" > "$OUT/checker-run-1.json"
          python3 "$CHECKER" > "$OUT/checker-run-2.json"
          cmp "$OUT/checker-run-1.json" "$OUT/checker-run-2.json"
          python3 - <<'PY'
          import json
          import pathlib
          p = pathlib.Path(
              'verification/pnp-parity-word-injection/evidence/checker-run-1.json'
          )
          result = json.loads(p.read_text())
          if result.get('status') != 'finite exact parity-word audit passed':
              raise SystemExit('checker status gate failed')
          if result.get('scope', {}).get('universal_claim') is not False:
              raise SystemExit('checker overclaim scope gate failed')
          if result.get('word_cases', 0) < 2_000_000:
              raise SystemExit('checker word coverage gate failed')
          if result.get('recurrence_cases') != 42:
              raise SystemExit('checker recurrence coverage gate failed')
          print(json.dumps(result, indent=2, sort_keys=True))
          print('DETERMINISTIC REPLAY: two byte-identical bounded exact runs')
          PY

      - name: Execute AXLE Lean 4.30 and preserve raw response
        shell: bash
        run: |
          set -euo pipefail
          OUT=verification/pnp-parity-word-injection/evidence
          mkdir -p "$OUT"
          python3 - <<'PY'
          import json
          import pathlib
          import urllib.request

          out = pathlib.Path('verification/pnp-parity-word-injection/evidence/axle-response.json')
          source = pathlib.Path(
              'verification/pnp-parity-word-injection/PNPParityWordInjection.lean'
          ).read_text()
          payload = json.dumps({
              'content': source,
              'environment': 'lean-4.30.0',
              'ignore_imports': True,
              'mathlib_options': False,
              'timeout_seconds': 900,
          }).encode()
          request = urllib.request.Request(
              'https://axle.axiommath.ai/api/v1/check',
              data=payload,
              headers={'Content-Type': 'application/json'},
              method='POST',
          )
          try:
              with urllib.request.urlopen(request, timeout=960) as response:
                  result = json.load(response)
          except Exception as exc:
              result = {
                  'okay': False,
                  'request_exception': repr(exc),
                  'lean_messages': {'errors': [], 'warnings': []},
                  'tool_messages': {'errors': []},
                  'failed_declarations': [],
              }
          out.write_text(json.dumps(result, indent=2, sort_keys=True))
          print(json.dumps(result, indent=2))
          PY

      - name: Record replay metadata
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT=verification/pnp-parity-word-injection/evidence
          mkdir -p "$OUT"
          {
            echo "repository=$GITHUB_REPOSITORY"
            echo "ref=$GITHUB_REF"
            echo "commit=$GITHUB_SHA"
            echo "runner_name=$RUNNER_NAME"
            echo "runner_os=$RUNNER_OS"
            echo "source_git_blob=$(git hash-object verification/pnp-parity-word-injection/PNPParityWordInjection.lean)"
            echo "source_sha256=$(sha256sum verification/pnp-parity-word-injection/PNPParityWordInjection.lean | awk '{print $1}')"
            echo "checker_git_blob=$(git hash-object verification/pnp-parity-word-injection/check_pnp_parity_word.py)"
            echo "checker_sha256=$(sha256sum verification/pnp-parity-word-injection/check_pnp_parity_word.py | awk '{print $1}')"
            echo "environment=lean-4.30.0"
          } > "$OUT/replay-metadata.txt"
          cat "$OUT/replay-metadata.txt"

      - name: Upload exact compiler evidence before verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pnp-parity-word-injection-evidence
          path: verification/pnp-parity-word-injection/evidence/
          if-no-files-found: error

      - name: Enforce compiler and postcompile trust verdict
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          p = pathlib.Path('verification/pnp-parity-word-injection/evidence/axle-response.json')
          if not p.exists():
              raise SystemExit('missing AXLE response evidence')
          result = json.loads(p.read_text())
          lean_errors = result.get('lean_messages', {}).get('errors', [])
          lean_warnings = result.get('lean_messages', {}).get('warnings', [])
          tool_errors = result.get('tool_messages', {}).get('errors', [])
          failed = result.get('failed_declarations', [])
          if not result.get('okay') or lean_errors or lean_warnings or tool_errors or failed:
              raise SystemExit('Lean/AXLE verification failed or warned; inspect uploaded response artifact')
          rendered = json.dumps(result)
          for forbidden in ('sorryAx', 'Lean.ofReduceBool'):
              if forbidden in rendered:
                  raise SystemExit(f'postcompile forbidden dependency: {forbidden}')
          print('VERIFIED WARNING-FREE: exact parity-word injection compiled under AXLE Lean 4.30')
          PY
