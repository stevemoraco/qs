name: Public verify B4 NS nested comb

on:
  push:
    branches: [agent/b4-ns-nested-comb-public-verifier-20260812]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-b4-ns-nested-comb-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            verification/b4_ns_nested_comb
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Trust gate and AXLE Lean 4.30 compile
        shell: bash
        run: |
          mkdir -p verification/b4_ns_nested_comb/evidence
          python3 - <<'PY'
          import hashlib
          import json
          import pathlib
          import re
          import subprocess
          import urllib.request

          sources = [
              pathlib.Path('verification/b4_ns_nested_comb/B4NSNestedComb.lean'),
              pathlib.Path('verification/b4_ns_nested_comb/B4NSHelicalPair.lean'),
              pathlib.Path('verification/b4_ns_nested_comb/B4NSStaticTransportObstruction.lean'),
          ]
          forbidden = [
              r'(^|[^A-Za-z0-9_])sorry([^A-Za-z0-9_]|$)',
              r'(^|[^A-Za-z0-9_])admit([^A-Za-z0-9_]|$)',
              r'(^|[^A-Za-z0-9_])sorryAx([^A-Za-z0-9_]|$)',
              r'^\s*axiom\b',
              r'^\s*opaque\b',
              r'^\s*unsafe\b',
          ]
          parts = []
          source_records = []
          theorem_count = 0
          print_count = 0
          for source in sources:
              text = source.read_text()
              for pattern in forbidden:
                  if re.search(pattern, text, flags=re.MULTILINE):
                      print(f'::error title=source trust gate::{source}: {pattern}')
                      raise SystemExit(f'forbidden source token matched in {source}: {pattern}')
              theorem_count += len(re.findall(r'^theorem\s+', text, flags=re.MULTILINE))
              print_count += len(re.findall(r'^#print axioms\s+', text, flags=re.MULTILINE))
              body = '\n'.join(line for line in text.splitlines()
                               if not line.startswith('import '))
              parts.append(body)
              source_records.append({
                  'path': str(source),
                  'git_blob': subprocess.check_output(
                      ['git', 'hash-object', str(source)], text=True).strip(),
                  'sha256': hashlib.sha256(text.encode()).hexdigest(),
              })
          if theorem_count != print_count:
              print(f'::error title=axiom-print mismatch::theorems={theorem_count} prints={print_count}')
              raise SystemExit(f'axiom print mismatch: {theorem_count} vs {print_count}')

          combined = 'import Mathlib\n\n' + '\n\n'.join(parts) + '\n'
          combined_sha256 = hashlib.sha256(combined.encode()).hexdigest()
          request = urllib.request.Request(
              'https://axle.axiommath.ai/api/v1/check',
              data=json.dumps({
                  'content': combined,
                  'environment': 'lean-4.30.0',
                  'ignore_imports': True,
                  'mathlib_options': False,
                  'timeout_seconds': 900,
              }).encode(),
              headers={'Content-Type': 'application/json'},
              method='POST',
          )
          with urllib.request.urlopen(request, timeout=960) as response:
              result = json.load(response)

          evidence = {
              'repository': '${{ github.repository }}',
              'branch': '${{ github.ref_name }}',
              'commit': '${{ github.sha }}',
              'sources': source_records,
              'combined_sha256': combined_sha256,
              'environment': 'lean-4.30.0',
              'theorem_count': theorem_count,
              'print_axioms_count': print_count,
              'axle_result': result,
          }
          path = pathlib.Path('verification/b4_ns_nested_comb/evidence/evidence.json')
          path.write_text(json.dumps(evidence, indent=2, sort_keys=True) + '\n')
          print(json.dumps(evidence, indent=2))

          errors = result.get('lean_messages', {}).get('errors', [])
          tool_errors = result.get('tool_messages', {}).get('errors', [])
          failed = result.get('failed_declarations', [])
          rendered = json.dumps(result)
          for i, error in enumerate(errors):
              message = json.dumps(error, ensure_ascii=False).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Lean error {i+1}::{message}')
          for i, error in enumerate(tool_errors):
              message = json.dumps(error, ensure_ascii=False).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=AXLE tool error {i+1}::{message}')
          if failed:
              message = json.dumps(failed, ensure_ascii=False).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=failed declarations::{message}')
          if 'sorryAx' in rendered or 'Lean.ofReduceBool' in rendered:
              print('::error title=postcompile trust gate::forbidden dependency detected')
              raise SystemExit('postcompile trust gate found forbidden dependency')
          if not result.get('okay') or errors or tool_errors or failed:
              raise SystemExit(1)
          print('VERIFIED: exact canonical B4 NS sources compiled under AXLE Lean 4.30')
          PY

      - name: Replay exact finite Fourier certificate
        shell: bash
        run: |
          cp verification/b4_ns_nested_comb/ns_nested_comb_exact_certificate.json /tmp/expected_nested_comb.json
          python3 verification/b4_ns_nested_comb/ns_nested_comb_exact_certificate.py
          cmp /tmp/expected_nested_comb.json verification/b4_ns_nested_comb/ns_nested_comb_exact_certificate.json
          python3 - <<'PY'
          import hashlib
          import json
          import pathlib
          import subprocess

          base = pathlib.Path('verification/b4_ns_nested_comb')
          script = base / 'ns_nested_comb_exact_certificate.py'
          receipt = base / 'ns_nested_comb_exact_certificate.json'
          result = json.loads(receipt.read_text())
          if not result.get('all_assertions_passed'):
              raise SystemExit('certificate receipt did not report all assertions passed')
          evidence = {
              'repository': '${{ github.repository }}',
              'branch': '${{ github.ref_name }}',
              'commit': '${{ github.sha }}',
              'python_version': subprocess.check_output(['python3', '--version'], text=True).strip(),
              'script_git_blob': subprocess.check_output(['git', 'hash-object', str(script)], text=True).strip(),
              'script_sha256': hashlib.sha256(script.read_bytes()).hexdigest(),
              'receipt_git_blob': subprocess.check_output(['git', 'hash-object', str(receipt)], text=True).strip(),
              'receipt_sha256': hashlib.sha256(receipt.read_bytes()).hexdigest(),
              'receipt': result,
          }
          out = base / 'evidence' / 'certificate_replay.json'
          out.write_text(json.dumps(evidence, indent=2, sort_keys=True) + '\n')
          print(json.dumps(evidence, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-b4-ns-nested-comb-${{ github.sha }}
          path: |
            verification/b4_ns_nested_comb/evidence/evidence.json
            verification/b4_ns_nested_comb/evidence/certificate_replay.json
            verification/b4_ns_nested_comb/ns_nested_comb_exact_certificate.json
          if-no-files-found: error
