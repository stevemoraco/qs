name: NS single-triad universal public verifier

on:
  push:
    branches:
      - agent/ns-single-triad-universal-public-verifier-20260813
  pull_request:
    paths:
      - 'verification/ns-single-triad-universal-core/**'
      - '.github/workflows/ns-single-triad-universal-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Verify exact canonical source and trust boundary
        shell: bash
        run: |
          set -euo pipefail
          dir='verification/ns-single-triad-universal-core'
          file="$dir/NSSingleTriadUniversalCore.lean"
          actual_blob="$(git hash-object "$file")"
          expected_blob='442128fc4e29a57e8c9c12f117efc07f46e226c7'
          printf 'expected Git blob: %s\nactual Git blob:   %s\n' "$expected_blob" "$actual_blob" \
            | tee "$dir/source-blob.txt"
          test "$actual_blob" = "$expected_blob"
          sha256sum "$file" | tee "$dir/source-sha256.txt"
          if grep -En '(^|[^[:alnum:]_])(sorry|admit|sorryAx)([^[:alnum:]_]|$)' "$file"; then
            echo 'Forbidden proof placeholder found.' >&2
            exit 1
          fi
          if grep -En '^[[:space:]]*(axiom|opaque|unsafe)[[:space:]]' "$file"; then
            echo 'Forbidden trust declaration found.' >&2
            exit 1
          fi
          if grep -En '(native_decide|Lean\.ofReduceBool)' "$file"; then
            echo 'Forbidden computational trust escape found.' >&2
            exit 1
          fi

      - name: Install pinned Lean and compile exact source
        shell: bash
        run: |
          set -euo pipefail
          dir='verification/ns-single-triad-universal-core'
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.32.1
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version | tee "$dir/lean-version.txt"
          lake --version | tee -a "$dir/lean-version.txt"
          cd "$dir"
          lake update
          lake exe cache get
          set +e
          lake env lean NSSingleTriadUniversalCore.lean > lean-output.log 2>&1
          status=$?
          set -e
          cat lean-output.log
          if [ "$status" -ne 0 ]; then
            echo "Lean compilation failed with status $status" >&2
            exit "$status"
          fi
          if grep -Eq 'declaration uses .sorry.|sorryAx|admit|Lean.ofReduceBool' lean-output.log; then
            echo 'Forbidden dependency found in compiler report.' >&2
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path('lean-output.log').read_text()
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          names = [
              'NSSingleTriadUniversalCore.sidebands_force_equilateral',
              'NSSingleTriadUniversalCore.collinear_normalization',
              'NSSingleTriadUniversalCore.desired_sum_is_pressure_coordinate',
              'NSSingleTriadUniversalCore.desired_sum_is_pressure',
              'NSSingleTriadUniversalCore.exists_pressure_scalar',
          ]
          for name in names:
              no_axioms = f"'{name}' does not depend on any axioms"
              if no_axioms in text:
                  continue
              pattern = re.escape(f"'{name}' depends on axioms: [") + r'(.*?)\]'
              match = re.search(pattern, text, flags=re.S)
              assert match, (name, text)
              axioms = {
                  item.strip()
                  for item in match.group(1).replace('\n', ' ').split(',')
                  if item.strip()
              }
              assert axioms <= allowed, (name, axioms - allowed)
          print(f'AXIOM REPORTS: {len(names)}')
          print('AXIOM ALLOWLIST: PASS')
          PY
          echo 'VERIFIED NS single-triad universal finite core.'

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ns-single-triad-universal-core-${{ github.sha }}
          path: |
            verification/ns-single-triad-universal-core/NSSingleTriadUniversalCore.lean
            verification/ns-single-triad-universal-core/lakefile.toml
            verification/ns-single-triad-universal-core/lean-toolchain
            verification/ns-single-triad-universal-core/source-blob.txt
            verification/ns-single-triad-universal-core/source-sha256.txt
            verification/ns-single-triad-universal-core/lean-version.txt
            verification/ns-single-triad-universal-core/lean-output.log
          if-no-files-found: warn
