name: YM Kirk v4 reference rereport audit

on:
  push:
    branches:
      - verification/ym-kirk-v4-reference-rereport-audit-20260814-gpt56sol
    paths:
      - .github/workflows/ym-kirk-v4-reference-rereport-audit.yml

permissions:
  contents: write

jobs:
  source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verification/ym-kirk-v4-reference-rereport-audit-20260814-gpt56sol
      - name: Ensure pdftotext
        run: |
          if ! command -v pdftotext >/dev/null; then sudo apt-get update && sudo apt-get install -y poppler-utils; fi
      - name: Pin immutable v4 and extract reference rereport contexts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, urllib.request, time, urllib.error, hashlib
          UA='millennium-braid-reference-rereport/1.0'
          def get(url):
              last=None
              for i in range(7):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'*/*'})
                      with urllib.request.urlopen(req,timeout=60) as r: return r.read(),r.geturl()
                  except (urllib.error.HTTPError,urllib.error.URLError) as e:
                      last=e
                      if isinstance(e,urllib.error.HTTPError) and e.code not in (429,500,502,503,504): raise
                      time.sleep(min(2**i,32))
              raise last
          raw,_=get('https://zenodo.org/api/records/21765806'); rec=json.loads(raw)
          latest=rec.get('links',{}).get('latest')
          if latest:
              raw,_=get(latest); rec=json.loads(raw)
          pdfs=[f for f in rec.get('files',[]) if str(f.get('key','')).lower().endswith('.pdf')]
          if len(pdfs)!=1: raise RuntimeError(len(pdfs))
          url=pdfs[0].get('links',{}).get('content') or pdfs[0].get('links',{}).get('self')
          pdf,_=get(url); Path('/tmp/kirk.pdf').write_bytes(pdf)
          out=Path('source_audit/kirk_v4/reference_rereport'); out.mkdir(parents=True,exist_ok=True)
          (out/'RECORD.json').write_bytes(raw)
          (out/'PDF_SHA256.txt').write_text(hashlib.sha256(pdf).hexdigest()+'\n')
          PY
          pdftotext -layout /tmp/kirk.pdf /tmp/kirk.txt
          python3 - <<'PY'
          from pathlib import Path
          text=Path('/tmp/kirk.txt').read_text(encoding='utf-8',errors='replace'); low=text.lower()
          out=Path('source_audit/kirk_v4/reference_rereport')
          phrases=[
            'complete allocated two-jet','allocated two-jet','reference two-jet','two-jet reference',
            'quadratic kernel','quadratic form','Hessian','matrix entry','kernel entry','bilinear',
            'shortest connector path','shortest connector','reported on a shortest','reported on the shortest',
            'canonical connected hull','canonical hull','each term is reported','each entry','each matrix',
            'compact Haar completion','Gaussian precision','Qtempl','Qtail','Qref','Q ref',
            'finite-template incidences','endpoint two-jets','cross activities','cross-core',
            'determinant endpoint','coarea endpoint','Schur endpoint','connected determinant word',
            'Definition 3.22','Lemma 3.25','Proposition 6.8','Theorem 6.10','Lemma 6.30'
          ]
          chunks=[]; summary=[]
          for phrase in phrases:
              pos=0; hits=[]
              while True:
                  i=low.find(phrase.lower(),pos)
                  if i<0: break
                  hits.append(i); pos=i+max(1,len(phrase))
              summary.append(f'{phrase}: {len(hits)}')
              for j,i in enumerate(hits[:30],1):
                  chunks.append(f'===== {phrase} hit {j} at {i} =====\n'+text[max(0,i-4500):min(len(text),i+11000)])
          (out/'CONTEXTS.txt').write_text('\n\n'.join(chunks),encoding='utf-8')
          (out/'SUMMARY.txt').write_text('\n'.join(summary)+'\n',encoding='utf-8')
          print('\n'.join(summary))
          PY
      - name: Commit focused contexts
        run: |
          git config user.name 'millennium-braid-source-audit'
          git config user.email 'actions@users.noreply.github.com'
          git add source_audit/kirk_v4/reference_rereport
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audit(ym): expose Kirk v4 reference rereport contexts'
          git push origin HEAD:verification/ym-kirk-v4-reference-rereport-audit-20260814-gpt56sol
      - uses: actions/upload-artifact@v4
        with:
          name: kirk-v4-reference-rereport
          if-no-files-found: error
          retention-days: 30
          path: source_audit/kirk_v4/reference_rereport/
