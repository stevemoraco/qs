name: NS Projective Vorticity Finite Lean

on:
  push:
    branches:
      - agent/ns-projective-vorticity-finite-verify-20260812
  pull_request:
    paths:
      - verification/ns-projective-vorticity/**
      - .github/workflows/ns-projective-vorticity-lean.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Reject placeholders and custom trust declarations
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path('verification/ns-projective-vorticity/NSProjectiveVorticityFinite.lean')
          source = p.read_text()
          stripped = re.sub(r'/-.*?-/', '', source, flags=re.S)
          stripped = re.sub(r'--.*$', '', stripped, flags=re.M)
          forbidden = [
              r'^\s*(sorry|admit)\b',
              r'^\s*(axiom|opaque)\b',
              r'^\s*unsafe\b',
              r'\bnative_decide\b',
              r'\bLean\.ofReduceBool\b',
          ]
          for pattern in forbidden:
              m = re.search(pattern, stripped, flags=re.M)
              if m:
                  raise SystemExit(f'forbidden declaration: {m.group(0)!r}')
          expected = [
              'rankOneParallelCross_first',
              'rankOneParallelCross_second',
              'rankOneParallelCross_third',
              'eraseParallel_first',
              'eraseParallel_second',
              'eraseParallel_third',
              'projectorFixesCollinear_first',
              'projectorFixesCollinear_second',
              'projectorFixesCollinear_third',
              'shearCriticalWeakScale',
              'shearEnergySquaredScale',
              'shearSubcriticalWidthScale',
          ]
          for name in expected:
              if f'#print axioms {name}' not in source:
                  raise SystemExit(f'missing axiom report: {name}')
          PY

      - name: Install pinned Lean and compile
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.32.1
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version
          lake --version
          cd verification/ns-projective-vorticity
          lake update
          lake exe cache get
          lake env lean NSProjectiveVorticityFinite.lean \
            2>&1 | tee lean-output.log
          if grep -Eq 'declaration uses .sorry.|sorryAx|admit|Lean\.ofReduceBool|native_decide' lean-output.log; then
            echo 'Forbidden placeholder or native decision artifact found.' >&2
            exit 1
          fi
          echo 'VERIFIED finite Navier–Stokes projective-vorticity scalar core.'

      - name: Upload compiler and axiom evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ns-projective-vorticity-lean-evidence
          path: verification/ns-projective-vorticity/lean-output.log
          if-no-files-found: warn
