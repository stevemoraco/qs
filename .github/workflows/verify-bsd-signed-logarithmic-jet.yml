name: Verify BSD signed logarithmic jet window

on:
  workflow_dispatch:
  push:
    paths:
      - "verification/bsd_signed_logarithmic_jet/**"
      - ".github/workflows/verify-bsd-signed-logarithmic-jet.yml"
  pull_request:
    paths:
      - "verification/bsd_signed_logarithmic_jet/**"
      - ".github/workflows/verify-bsd-signed-logarithmic-jet.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: verification/bsd_signed_logarithmic_jet

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify exact source and trust gate
        shell: bash
        run: |
          set -euo pipefail
          file=BSDSignedLogarithmicJetWindow.lean
          echo "075f1c738784f234c5b1ac544b3fcb0555f8b6b64048132ff9cc4462713c654d  $file" | sha256sum -c -
          if grep -nE '\b(sorry|admit|sorryAx|unsafe|opaque|native_decide)\b|^axiom |Lean\.ofReduceBool' "$file"; then
            echo "Forbidden token found"
            exit 1
          fi

      - name: Replay exact finite checker
        shell: bash
        run: |
          set -euo pipefail
          python check_logarithmic_window.py | tee checker-output.txt
          grep -q 'BSD_LOG_WINDOW_PASS' checker-output.txt

      - name: Install elan
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get

      - name: Kernel-check exact source
        shell: bash
        run: |
          set -euo pipefail
          lake env lean BSDSignedLogarithmicJetWindow.lean 2>&1 | tee lean-output.txt
          if grep -q 'sorryAx' lean-output.txt; then
            echo "sorryAx found in axiom report"
            exit 1
          fi

      - name: Reject compiler warnings
        shell: bash
        run: |
          set -euo pipefail
          if grep -qi 'warning:' lean-output.txt; then
            cat lean-output.txt
            exit 1
          fi

      - name: Upload replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bsd-signed-logarithmic-jet-replay
          path: |
            verification/bsd_signed_logarithmic_jet/BSDSignedLogarithmicJetWindow.lean
            verification/bsd_signed_logarithmic_jet/checker-output.txt
            verification/bsd_signed_logarithmic_jet/lean-output.txt
          if-no-files-found: warn
