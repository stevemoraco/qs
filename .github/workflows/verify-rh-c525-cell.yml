name: Verify RH C525 Chebyshev overshoot cell

on:
  workflow_dispatch:
  push:
    paths:
      - "verification/rh_c525_cell/**"
      - ".github/workflows/verify-rh-c525-cell.yml"
  pull_request:
    paths:
      - "verification/rh_c525_cell/**"
      - ".github/workflows/verify-rh-c525-cell.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: verification/rh_c525_cell

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify exact source and trust gate
        shell: bash
        run: |
          set -euo pipefail
          file=RHChebyshevOvershootCell.lean
          test "$(git hash-object "$file")" = "f6055e48330eee94340b76c77789c2a3d3b69394"
          if grep -nE '\b(sorry|admit|sorryAx|unsafe|opaque|native_decide)\b|^axiom |Lean\.ofReduceBool' "$file"; then
            echo "Forbidden token found"
            exit 1
          fi

      - name: Install elan
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get

      - name: Kernel-check exact source
        shell: bash
        run: |
          set -euo pipefail
          lake env lean RHChebyshevOvershootCell.lean 2>&1 | tee lean-output.txt
          if grep -q 'sorryAx' lean-output.txt; then
            echo "sorryAx found in axiom report"
            exit 1
          fi

      - name: Reject compiler warnings
        shell: bash
        run: |
          set -euo pipefail
          if grep -qi 'warning:' lean-output.txt; then
            echo "Compiler warning found"
            exit 1
          fi

      - name: Upload replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rh-c525-cell-replay
          path: |
            verification/rh_c525_cell/RHChebyshevOvershootCell.lean
            verification/rh_c525_cell/lean-output.txt
          if-no-files-found: warn
