name: Crossfeed run21 Lean hostile replay

on:
  push:
    branches:
      - agent/crossfeed-run21-public-verifier-20260812
    paths:
      - 'verification/crossfeed-run21/**'
      - '.github/workflows/crossfeed-run21-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Reject holes custom axioms and unsafe declarations
        shell: bash
        run: |
          set -euo pipefail
          file=verification/crossfeed-run21/CrossfeedRun21Cores.lean
          if grep -nE '(^|[^A-Za-z0-9_])(sorry|admit|sorryAx|axiom|opaque|unsafe)([^A-Za-z0-9_]|$)' "$file"; then
            echo 'Forbidden proof hole / custom axiom / unsafe declaration found'
            exit 1
          fi

      - name: Record source identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification/crossfeed-run21/evidence
          git hash-object verification/crossfeed-run21/CrossfeedRun21Cores.lean | tee verification/crossfeed-run21/evidence/GIT_BLOB.txt
          sha256sum verification/crossfeed-run21/CrossfeedRun21Cores.lean | tee verification/crossfeed-run21/evidence/SHA256.txt

      - name: Verify with AXLE Lean 4.30
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, urllib.request
          p = pathlib.Path('verification/crossfeed-run21/CrossfeedRun21Cores.lean')
          payload = json.dumps({
              'content': p.read_text(),
              'environment': 'lean-4.30.0',
              'ignore_imports': True,
              'mathlib_options': False,
              'timeout_seconds': 900,
          }).encode()
          req = urllib.request.Request(
              'https://axle.axiommath.ai/api/v1/check',
              data=payload,
              headers={'Content-Type': 'application/json'},
              method='POST')
          with urllib.request.urlopen(req, timeout=960) as r:
              result = json.load(r)
          out = pathlib.Path('verification/crossfeed-run21/evidence/AXLE_RESULT.json')
          out.write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          print(json.dumps(result, indent=2))
          errs = result.get('lean_messages', {}).get('errors', [])
          terrs = result.get('tool_messages', {}).get('errors', [])
          failed = result.get('failed_declarations', [])
          if not result.get('okay') or errs or terrs or failed:
              raise SystemExit(1)
          PY

      - name: Postcompile trust firewall
        shell: bash
        run: |
          set -euo pipefail
          file=verification/crossfeed-run21/CrossfeedRun21Cores.lean
          if grep -nE '(^|[^A-Za-z0-9_])(sorryAx|admit|Lean\.ofReduceBool)([^A-Za-z0-9_]|$)' "$file"; then
            echo 'Forbidden postcompile escape found'
            exit 1
          fi

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: crossfeed-run21-lean-evidence
          path: verification/crossfeed-run21/evidence
          if-no-files-found: error
          retention-days: 90
