name: Verify BSD all-rank signed jet minimality

on:
  workflow_dispatch:
  push:
    paths:
      - "verification/bsd_all_rank_jet_minimality/**"
      - ".github/workflows/verify-bsd-all-rank-jet-minimality.yml"
  pull_request:
    paths:
      - "verification/bsd_all_rank_jet_minimality/**"
      - ".github/workflows/verify-bsd-all-rank-jet-minimality.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: verification/bsd_all_rank_jet_minimality

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify exact source and trust gate
        shell: bash
        run: |
          set -euo pipefail
          file=BSDFiniteSignedAllRankJet.lean
          test "$(git hash-object "$file")" = "56ac9c725401e10dc7ab9ec6b809fb390ce0bb70"
          echo "e141af3c452aaf8e2e0c28363aecbc0292bd7d7a2df838f4d603801e82aab8db  $file" | sha256sum -c -
          if grep -nE '\b(sorry|admit|sorryAx|unsafe|opaque|native_decide)\b|^axiom |Lean\.ofReduceBool' "$file"; then
            echo "Forbidden token found"
            exit 1
          fi

      - name: Install elan
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get

      - name: Kernel-check exact source
        shell: bash
        run: |
          set -euo pipefail
          lake env lean BSDFiniteSignedAllRankJet.lean 2>&1 | tee lean-output.txt
          if grep -q 'sorryAx' lean-output.txt; then
            echo "sorryAx found in axiom report"
            exit 1
          fi

      - name: Reject compiler warnings
        shell: bash
        run: |
          set -euo pipefail
          if grep -n '^warning:' lean-output.txt; then
            echo "Lean compiler warning found"
            exit 1
          fi

      - name: Upload replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bsd-all-rank-signed-jet-minimality-replay
          path: |
            verification/bsd_all_rank_jet_minimality/BSDFiniteSignedAllRankJet.lean
            verification/bsd_all_rank_jet_minimality/lean-output.txt
          if-no-files-found: warn
