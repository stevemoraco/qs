name: NS helicity truncation and sideband finite cores

on:
  push:
    branches:
      - agent/ns-full-helicity-decomposition-public-20260813-gpt56pro
    paths:
      - 'formal/millennium_audit/SixLaneAudit/NSFullHelicityDecomposition.lean'
      - 'formal/millennium_audit/SixLaneAudit/NSOnePumpSidebandFirewall.lean'
      - '.github/workflows/ns-full-helicity-decomposition.yml'
  pull_request:
    branches: [main]
    paths:
      - 'formal/millennium_audit/SixLaneAudit/NSFullHelicityDecomposition.lean'
      - 'formal/millennium_audit/SixLaneAudit/NSOnePumpSidebandFirewall.lean'
      - '.github/workflows/ns-full-helicity-decomposition.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact replay branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify exact source blobs and trust preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re, subprocess

          expected = {
              pathlib.Path('formal/millennium_audit/SixLaneAudit/NSFullHelicityDecomposition.lean'):
                  ('1a15d089d71631be674ad36fb97fcd6bcde6d9f6', 14),
              pathlib.Path('formal/millennium_audit/SixLaneAudit/NSOnePumpSidebandFirewall.lean'):
                  ('b5ac743d8c3c4fbd4a4c7d5d5ad0760584e60721', 7),
          }
          forbidden = re.compile(
              r'(^|[^A-Za-z0-9_])(sorry|admit|sorryAx|axiom|opaque|unsafe|native_decide)([^A-Za-z0-9_]|$)'
          )
          for path, (expected_blob, expected_axioms) in expected.items():
              text = path.read_text()
              actual_blob = subprocess.check_output(
                  ['git', 'hash-object', str(path)], text=True
              ).strip()
              print(f'{path}: expected blob {expected_blob}; actual blob {actual_blob}')
              if actual_blob != expected_blob:
                  raise SystemExit(f'{path}: Git blob mismatch')
              match = forbidden.search(text)
              if match:
                  raise SystemExit(f'{path}: forbidden token {match.group(2)}')
              if 'Lean.ofReduceBool' in text:
                  raise SystemExit(f'{path}: forbidden proof shortcut')
              count = text.count('#print axioms')
              if count != expected_axioms:
                  raise SystemExit(
                      f'{path}: expected {expected_axioms} axiom reports, found {count}'
                  )
              print(f'{path}: trust preflight clean with {count} axiom reports')
          PY

      - name: Execute AXLE Lean 4.30 on both exact sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, urllib.request

          root = pathlib.Path('formal/millennium_audit/SixLaneAudit')
          files = [
              root / 'NSFullHelicityDecomposition.lean',
              root / 'NSOnePumpSidebandFirewall.lean',
          ]
          out = root / 'ns-helicity-evidence'
          out.mkdir(exist_ok=True)
          summary = {}

          for path in files:
              payload = json.dumps({
                  'content': path.read_text(),
                  'environment': 'lean-4.30.0',
                  'ignore_imports': True,
                  'mathlib_options': False,
                  'timeout_seconds': 900,
              }).encode()
              request = urllib.request.Request(
                  'https://axle.axiommath.ai/api/v1/check',
                  data=payload,
                  headers={'Content-Type': 'application/json'},
                  method='POST',
              )
              try:
                  with urllib.request.urlopen(request, timeout=960) as response:
                      result = json.load(response)
              except Exception as exc:
                  result = {
                      'okay': False,
                      'request_exception': repr(exc),
                      'lean_messages': {'errors': [], 'warnings': []},
                      'tool_messages': {'errors': [], 'warnings': []},
                      'failed_declarations': [],
                  }
              (out / f'{path.stem}-axle-response.json').write_text(
                  json.dumps(result, indent=2, sort_keys=True) + '\n'
              )
              summary[path.name] = {
                  'okay': result.get('okay'),
                  'failed_declarations': result.get('failed_declarations', []),
                  'lean_errors': result.get('lean_messages', {}).get('errors', []),
                  'lean_warnings': result.get('lean_messages', {}).get('warnings', []),
                  'tool_errors': result.get('tool_messages', {}).get('errors', []),
                  'tool_warnings': result.get('tool_messages', {}).get('warnings', []),
                  'request_exception': result.get('request_exception'),
              }
              print(path.name, json.dumps(summary[path.name], indent=2))

          (out / 'summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n'
          )
          PY

      - name: Record replay metadata
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT='formal/millennium_audit/SixLaneAudit/ns-helicity-evidence'
          mkdir -p "$OUT"
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "ref=${GITHUB_REF}"
            echo "commit=${GITHUB_SHA}"
            echo "runner_name=${RUNNER_NAME}"
            echo "runner_os=${RUNNER_OS}"
            echo "environment=lean-4.30.0"
            sha256sum \
              formal/millennium_audit/SixLaneAudit/NSFullHelicityDecomposition.lean \
              formal/millennium_audit/SixLaneAudit/NSOnePumpSidebandFirewall.lean
          } > "$OUT/replay-metadata.txt"

      - name: Upload exact compiler evidence before verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ns-helicity-truncation-sideband-evidence-${{ github.sha }}
          path: formal/millennium_audit/SixLaneAudit/ns-helicity-evidence/
          if-no-files-found: error

      - name: Enforce compiler and postcompile trust verdict
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib

          path = pathlib.Path(
              'formal/millennium_audit/SixLaneAudit/ns-helicity-evidence/summary.json'
          )
          if not path.exists():
              raise SystemExit('missing AXLE summary evidence')
          summary = json.loads(path.read_text())
          if len(summary) != 2:
              raise SystemExit('expected two compiler responses')
          for name, result in summary.items():
              if not result.get('okay'):
                  raise SystemExit(f'{name}: AXLE did not return okay=true')
              if result.get('failed_declarations'):
                  raise SystemExit(f'{name}: failed declarations')
              if result.get('lean_errors') or result.get('lean_warnings'):
                  raise SystemExit(f'{name}: Lean errors or warnings')
              if result.get('tool_errors') or result.get('tool_warnings'):
                  raise SystemExit(f'{name}: tool errors or warnings')
              if result.get('request_exception'):
                  raise SystemExit(f'{name}: request exception')
          print('BOTH NS FINITE SOURCES VERIFIED WARNING-FREE')
          PY
