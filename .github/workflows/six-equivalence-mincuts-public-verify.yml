name: Six Equivalence Mincuts Public Verifier

on:
  push:
    branches:
      - agent/six-equivalence-mincuts-public-verifier-20260812
  pull_request:
    paths:
      - 'verification/six-equivalence-mincuts-public/**'
      - '.github/workflows/six-equivalence-mincuts-public-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact private-source blob and reject trust escapes
        shell: bash
        run: |
          set -euo pipefail
          dir='verification/six-equivalence-mincuts-public'
          file="$dir/SixEquivalenceMincutsFinite.lean"
          actual_blob="$(git hash-object "$file")"
          expected_blob='06782da17bf089c75956834e8db65ea4c80afef4'
          test "$actual_blob" = "$expected_blob"
          printf 'private_source_blob=%s\n' "$actual_blob" | tee "$dir/source-blob.txt"
          sha256sum "$file" | tee "$dir/source-sha256.txt"
          if grep -En '(^|[^[:alnum:]_])(sorry|admit|sorryAx)([^[:alnum:]_]|$)' "$file"; then
            echo 'Forbidden proof placeholder found.' >&2
            exit 1
          fi
          if grep -En '^[[:space:]]*(axiom|opaque|unsafe)[[:space:]]' "$file"; then
            echo 'Forbidden custom trust declaration found.' >&2
            exit 1
          fi
          if grep -En '(native_decide|Lean\.ofReduceBool)' "$file"; then
            echo 'Forbidden computational trust escape found.' >&2
            exit 1
          fi
      - name: Install pinned Lean, fetch pinned Mathlib, and compile
        shell: bash
        run: |
          set -euo pipefail
          dir='verification/six-equivalence-mincuts-public'
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.32.1
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version | tee "$dir/lean-version.txt"
          lake --version | tee -a "$dir/lean-version.txt"
          cd "$dir"
          lake update
          lake exe cache get
          lake env lean SixEquivalenceMincutsFinite.lean > lean-output.log 2>&1
          cat lean-output.log
          if grep -Eq 'declaration uses .sorry.|sorryAx|admit|Lean.ofReduceBool' lean-output.log; then
            echo 'Forbidden dependency found in compiler report.' >&2
            exit 1
          fi
          echo 'VERIFIED exact finite six-equivalence minimum-cut cores.'
      - name: Upload verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: six-equivalence-mincuts-public-evidence
          path: |
            verification/six-equivalence-mincuts-public/source-blob.txt
            verification/six-equivalence-mincuts-public/source-sha256.txt
            verification/six-equivalence-mincuts-public/lean-version.txt
            verification/six-equivalence-mincuts-public/lean-output.log
