name: Seventh Object Equivalence Firewall

on:
  push:
    branches:
      - agent/seventh-object-native-bridge-equivalence-firewall-20260813
  pull_request:
    paths:
      - 'verification/seventh-object-equivalence-firewall/**'
      - '.github/workflows/seventh-object-equivalence-public-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Reject trust escapes
        shell: bash
        run: |
          set -euo pipefail
          dir='verification/seventh-object-equivalence-firewall'
          file="$dir/SeventhObjectEquivalenceFirewall.lean"
          git hash-object "$file" | tee "$dir/source-blob.txt"
          sha256sum "$file" | tee "$dir/source-sha256.txt"
          if grep -En '(^|[^[:alnum:]_])(sorry|admit|sorryAx)([^[:alnum:]_]|$)' "$file"; then
            echo 'Forbidden proof placeholder found.' >&2
            exit 1
          fi
          if grep -En '^[[:space:]]*(axiom|opaque|unsafe)[[:space:]]' "$file"; then
            echo 'Forbidden custom trust declaration found.' >&2
            exit 1
          fi
          if grep -En '(native_decide|Lean\.ofReduceBool)' "$file"; then
            echo 'Forbidden computational trust escape found.' >&2
            exit 1
          fi
      - name: Install pinned Lean and compile
        shell: bash
        run: |
          set -euo pipefail
          dir='verification/seventh-object-equivalence-firewall'
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.32.1
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version | tee "$dir/lean-version.txt"
          lake --version | tee -a "$dir/lean-version.txt"
          cd "$dir"
          lake update
          lake exe cache get
          lake env lean SeventhObjectEquivalenceFirewall.lean > lean-output.log 2>&1
          cat lean-output.log
          if grep -Eq 'declaration uses .sorry.|sorryAx|admit|Lean.ofReduceBool' lean-output.log; then
            echo 'Forbidden dependency found in compiler report.' >&2
            exit 1
          fi
          echo 'VERIFIED seventh-object native-bridge equivalence firewall.'
      - name: Upload verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: seventh-object-equivalence-firewall-evidence
          path: |
            verification/seventh-object-equivalence-firewall/source-blob.txt
            verification/seventh-object-equivalence-firewall/source-sha256.txt
            verification/seventh-object-equivalence-firewall/lean-version.txt
            verification/seventh-object-equivalence-firewall/lean-output.log
