name: Verify C428 gift-shop RP and Weil-Gram cores

on:
  push:
    branches:
      - verification/c428-giftshop-rp-weilgram-20260821-gpt56pro
    paths:
      - verification/c428_giftshop/SliceLocalRegulatorReflectionPositivityRepair.lean
      - verification/c428_giftshop/CountableWeilGramCertificateCore.lean
      - .github/workflows/c428-giftshop-verifier.yml
  pull_request:
    branches:
      - main
    paths:
      - verification/c428_giftshop/SliceLocalRegulatorReflectionPositivityRepair.lean
      - verification/c428_giftshop/CountableWeilGramCertificateCore.lean
      - .github/workflows/c428-giftshop-verifier.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact sources
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Source and trust preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re
          files = [
              pathlib.Path('verification/c428_giftshop/SliceLocalRegulatorReflectionPositivityRepair.lean'),
              pathlib.Path('verification/c428_giftshop/CountableWeilGramCertificateCore.lean'),
          ]
          forbidden = re.compile(r'(^|[^A-Za-z0-9_])(sorry|admit|sorryAx|axiom|opaque|unsafe)([^A-Za-z0-9_]|$)')
          for p in files:
              text = p.read_text()
              m = forbidden.search(text)
              if m:
                  raise SystemExit(f'{p}: forbidden source token: {m.group(2)}')
              for token in ('Lean.ofReduceBool', 'native_decide'):
                  if token in text:
                      raise SystemExit(f'{p}: forbidden source token: {token}')
              if text.count('#print axioms') != 4:
                  raise SystemExit(f'{p}: expected exactly four axiom reports')
              print(f'{p}: source trust preflight clean')
          PY
          git hash-object verification/c428_giftshop/*.lean
          sha256sum verification/c428_giftshop/*.lean

      - name: Compile exact sources with AXLE Lean 4.30
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/c428_giftshop
          python3 - <<'PY'
          import json, pathlib, urllib.request
          sources = [
              pathlib.Path('verification/c428_giftshop/SliceLocalRegulatorReflectionPositivityRepair.lean'),
              pathlib.Path('verification/c428_giftshop/CountableWeilGramCertificateCore.lean'),
          ]
          all_results = {}
          for p in sources:
              payload = json.dumps({
                  'content': p.read_text(),
                  'environment': 'lean-4.30.0',
                  'ignore_imports': True,
                  'mathlib_options': False,
                  'timeout_seconds': 900,
              }).encode()
              req = urllib.request.Request(
                  'https://axle.axiommath.ai/api/v1/check', data=payload,
                  headers={'Content-Type': 'application/json'}, method='POST')
              try:
                  with urllib.request.urlopen(req, timeout=960) as response:
                      result = json.load(response)
              except Exception as exc:
                  result = {
                      'okay': False,
                      'request_exception': repr(exc),
                      'lean_messages': {'errors': [], 'warnings': []},
                      'tool_messages': {'errors': [], 'warnings': []},
                      'failed_declarations': [],
                  }
              all_results[p.name] = result
              errors = result.get('lean_messages', {}).get('errors', [])
              warnings = result.get('lean_messages', {}).get('warnings', [])
              tool_errors = result.get('tool_messages', {}).get('errors', [])
              tool_warnings = result.get('tool_messages', {}).get('warnings', [])
              failed = result.get('failed_declarations', [])
              if not result.get('okay') or errors or warnings or tool_errors or tool_warnings or failed:
                  print(json.dumps(all_results, indent=2, sort_keys=True))
                  raise SystemExit(f'{p}: verification failed or emitted warnings')
              rendered = json.dumps(result)
              for token in ('sorryAx', 'Lean.ofReduceBool'):
                  if token in rendered:
                      raise SystemExit(f'{p}: postcompile forbidden dependency: {token}')
              print(f'VERIFIED: {p}')
          evidence = pathlib.Path('evidence/c428_giftshop')
          evidence.joinpath('axle-responses.json').write_text(
              json.dumps(all_results, indent=2, sort_keys=True))
          print(json.dumps(all_results, indent=2, sort_keys=True))
          PY

      - name: Record replay metadata
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "commit=${GITHUB_SHA}"
            echo "runner_name=${RUNNER_NAME}"
            echo "runner_os=${RUNNER_OS}"
            echo "environment=lean-4.30.0"
            for SRC in verification/c428_giftshop/*.lean; do
              echo "source=$SRC"
              echo "source_blob=$(git hash-object "$SRC")"
              echo "source_sha256=$(sha256sum "$SRC" | awk '{print $1}')"
            done
          } > evidence/c428_giftshop/replay-metadata.txt

      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c428-giftshop-evidence
          path: evidence/c428_giftshop/
          if-no-files-found: error
