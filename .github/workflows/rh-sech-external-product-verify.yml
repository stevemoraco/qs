name: RH Sech External Product Finite Core

on:
  push:
    branches:
      - research/rh-sech-external-product-public-verifier-20260812
    paths:
      - 'verification/rh-sech-external-product/**'
      - '.github/workflows/rh-sech-external-product-verify.yml'
  pull_request:
    branches: [main]
    paths:
      - 'verification/rh-sech-external-product/**'
      - '.github/workflows/rh-sech-external-product-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Record source hashes and reject placeholders
        shell: bash
        run: |
          set -euo pipefail
          root=verification/rh-sech-external-product
          sha256sum "$root/RHSechExternalProductFinite.lean" \
                    "$root/verify_sech_external_product.py" \
            | tee "$root/source-sha256.txt"
          if grep -En '(^|[^[:alnum:]_])(sorry|admit|axiom|opaque|unsafe)([^[:alnum:]_]|$)' \
              "$root/RHSechExternalProductFinite.lean"; then
            echo 'Forbidden Lean placeholder or custom trust declaration found.' >&2
            exit 1
          fi

      - name: Replay deterministic sech external-product falsifier
        shell: bash
        run: |
          set -euo pipefail
          root=verification/rh-sech-external-product
          python3 --version | tee "$root/python-version.txt"
          python3 -m pip install --disable-pip-version-check --no-input \
            'numpy==2.3.2' 'mpmath==1.3.0'
          python3 "$root/verify_sech_external_product.py" \
            --seed 260812 \
            --tolerance 1e-10 \
            --precision 90 \
            --output "$root/finite-certificate.json"
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('verification/rh-sech-external-product/finite-certificate.json')
          data = json.loads(path.read_text())
          assert data['odd_product_case_count'] == 48
          assert data['floor_comparison_case_count'] == 1000
          assert data['selector_comparison_case_count'] == 20
          assert data['cluster_gram_case_count'] == 180
          assert data['external_product_case_count'] == 51200
          required = [
              'all_odd_product_cases_verified',
              'all_floor_comparisons_verified',
              'all_selector_comparisons_verified',
              'all_cluster_gram_cases_verified',
              'all_external_product_cases_verified',
          ]
          assert all(data[key] is True for key in required)
          print('odd_product_cases=', data['odd_product_case_count'])
          print('external_product_cases=', data['external_product_case_count'])
          print('minimum_odd_product_margin=', data['minimum_odd_product_margin'])
          print('maximum_floor_ratio_identity_error=', data['maximum_floor_ratio_identity_error'])
          print('minimum_selector_improvement_ratio=', data['minimum_selector_improvement_ratio'])
          print('minimum_cluster_eigenvalue=', data['minimum_cluster_eigenvalue'])
          print('minimum_external_product_margin=', data['minimum_external_product_margin'])
          PY

      - name: Install pinned Lean, fetch pinned Mathlib, and compile
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.32.1
          export PATH="$HOME/.elan/bin:$PATH"
          root=verification/rh-sech-external-product
          lean --version | tee "$root/lean-version.txt"
          lake --version | tee -a "$root/lean-version.txt"
          cd "$root"
          lake update
          lake exe cache get
          set +e
          lake env lean RHSechExternalProductFinite.lean 2>&1 | tee lean-output.log
          status=${PIPESTATUS[0]}
          set -e
          if grep -Eq 'declaration uses .sorry.|sorryAx|admit|Lean.ofReduceBool' lean-output.log; then
            echo 'Forbidden dependency found in compiler report.' >&2
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          echo 'VERIFIED finite RH sech external-product scalar and type firewalls.'

      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rh-sech-external-product-finite-evidence
          path: |
            verification/rh-sech-external-product/source-sha256.txt
            verification/rh-sech-external-product/python-version.txt
            verification/rh-sech-external-product/finite-certificate.json
            verification/rh-sech-external-product/lean-version.txt
            verification/rh-sech-external-product/lean-output.log
          if-no-files-found: warn
