name: Kirk v4 OS rotation bridge audit

on:
  pull_request:
    paths:
      - .github/workflows/kirk-v4-os-rotation-audit.yml
      - tools/probe_kirk_latest_source.py

permissions:
  contents: read

jobs:
  os-rotation-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Ensure pdftotext
        run: |
          if ! command -v pdftotext >/dev/null; then
            sudo apt-get update && sudo apt-get install -y poppler-utils
          fi
      - name: Pin and extract immutable latest source
        run: python3 tools/probe_kirk_latest_source.py >/tmp/probe.json
      - name: Extract OS and rotation bridge contexts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('latest.txt').read_text(encoding='utf-8',errors='replace')
          targets=['Lemma 8.13','Lemma 8.14','Theorem 8.15','Theorem 8.28','Corollary 8.29','Theorem 8.34','Theorem 8.35','Theorem 8.36','Theorem 8.37','Theorem 8.38','Theorem 8.39','Theorem 8.40','Theorem 8.41','Theorem 8.42','Theorem 8.43','Theorem 8.44','Theorem 8.45','Theorem 8.46','rotation defect','O(4)','reflection positivity','translation continuity','locality','Schwinger']
          out=[]; low=text.lower()
          for target in targets:
            start=0
            for hit in range(10):
              i=low.find(target.lower(),start)
              if i<0: break
              s=' '.join(text[max(0,i-1500):min(len(text),i+3600)].split())
              out.append(f'=== {target} hit {hit+1} ===\n{s}\n')
              start=i+len(target)
          Path('kirk_v4_os_rotation_contexts.txt').write_text('\n'.join(out),encoding='utf-8')
          print('\n'.join(out))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kirk-v4-os-rotation-contexts
          if-no-files-found: error
          retention-days: 30
          path: |
            kirk_latest_record.json
            kirk_source_probe_report.json
            kirk_v4_os_rotation_contexts.txt
