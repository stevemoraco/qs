name: Verify YM localization-degree quantifier gap

on:
  push:
    branches:
      - verification/ym-localization-degree-quantifier-gap-20260821
  pull_request:
    paths:
      - "verification/ym_localization_degree_gap/**"
      - ".github/workflows/verify-ym-localization-degree-gap.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: verification/ym_localization_degree_gap

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify exact source and reject trust escapes
        shell: bash
        run: |
          set -euo pipefail
          file=LocalizationDegreeQuantifierGap.lean
          test "$(git hash-object "$file")" = "bb423281825d03458d61352e3411583d13c5d59d"
          if grep -nE '\b(sorry|admit|sorryAx|unsafe|opaque|native_decide)\b|^axiom |Lean\.ofReduceBool' "$file"; then
            echo "Forbidden token found"
            exit 1
          fi

      - name: Install elan
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get

      - name: Kernel-check exact source
        shell: bash
        run: |
          set -euo pipefail
          lake env lean LocalizationDegreeQuantifierGap.lean 2>&1 | tee lean-output.txt
          if grep -q 'sorryAx' lean-output.txt; then
            echo "sorryAx found in axiom report"
            exit 1
          fi

      - name: Reject compiler warnings
        shell: bash
        run: |
          set -euo pipefail
          if grep -i 'warning:' lean-output.txt; then
            echo "Compiler warning found"
            exit 1
          fi

      - name: Upload replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ym-localization-degree-gap-replay
          path: |
            verification/ym_localization_degree_gap/LocalizationDegreeQuantifierGap.lean
            verification/ym_localization_degree_gap/lean-output.txt
          if-no-files-found: warn
