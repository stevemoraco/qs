name: Hodge basket-B root-moving extremal finite verifier

on:
  push:
    branches:
      - agent/hodge-q1a8-basketb-rootmoving-extremal-verifier-20260814-gpt56pro
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Exact-source and trust preflight
        shell: bash
        run: |
          set -euo pipefail
          SRC=verification/hodge_basketb_rootmoving_extremal/HodgeBasketBRootMovingExtremalFinite.lean
          test "$(git hash-object "$SRC")" = cdc6b4b373d6ba9623357c23b64ea3b6f567f80a
          python3 - <<'PY'
          import pathlib, re
          path = pathlib.Path('verification/hodge_basketb_rootmoving_extremal/HodgeBasketBRootMovingExtremalFinite.lean')
          text = path.read_text()
          forbidden = re.compile(r'(^|[^A-Za-z0-9_])(sorry|admit|sorryAx|axiom|opaque|unsafe)([^A-Za-z0-9_]|$)')
          m = forbidden.search(text)
          if m:
              raise SystemExit(f'forbidden source token: {m.group(2)}')
          for token in ('Lean.ofReduceBool', 'native_decide'):
              if token in text:
                  raise SystemExit(f'forbidden source token: {token}')
          if text.count('#print axioms') != 8:
              raise SystemExit('expected exactly eight staged axiom reports')
          print('source trust preflight: clean')
          PY

      - name: Compile exact source with AXLE Lean 4.30
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/hodge_basketb_rootmoving_extremal
          python3 - <<'PY'
          import json, pathlib, urllib.request
          source = pathlib.Path(
              'verification/hodge_basketb_rootmoving_extremal/HodgeBasketBRootMovingExtremalFinite.lean'
          ).read_text()
          payload = json.dumps({
              'content': source,
              'environment': 'lean-4.30.0',
              'ignore_imports': True,
              'mathlib_options': False,
              'timeout_seconds': 900,
          }).encode()
          req = urllib.request.Request(
              'https://axle.axiommath.ai/api/v1/check',
              data=payload,
              headers={'Content-Type': 'application/json'},
              method='POST')
          try:
              with urllib.request.urlopen(req, timeout=960) as response:
                  result = json.load(response)
          except Exception as exc:
              result = {
                  'okay': False,
                  'request_exception': repr(exc),
                  'lean_messages': {'errors': [], 'warnings': []},
                  'tool_messages': {'errors': [], 'warnings': []},
                  'failed_declarations': [],
              }
          pathlib.Path(
              'evidence/hodge_basketb_rootmoving_extremal/axle-response.json'
          ).write_text(json.dumps(result, indent=2, sort_keys=True))
          print(json.dumps(result, indent=2))
          errors = result.get('lean_messages', {}).get('errors', [])
          warnings = result.get('lean_messages', {}).get('warnings', [])
          tool_errors = result.get('tool_messages', {}).get('errors', [])
          tool_warnings = result.get('tool_messages', {}).get('warnings', [])
          failed = result.get('failed_declarations', [])
          if not result.get('okay') or errors or warnings or tool_errors or tool_warnings or failed:
              raise SystemExit('verification failed or emitted warnings')
          rendered = json.dumps(result)
          for token in ('sorryAx', 'Lean.ofReduceBool'):
              if token in rendered:
                  raise SystemExit(f'postcompile forbidden dependency: {token}')
          print('VERIFIED: exact warning-free source compiled')
          PY

      - name: Record replay metadata
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "commit=${GITHUB_SHA}"
            echo "runner_name=${RUNNER_NAME}"
            echo "runner_os=${RUNNER_OS}"
            echo "source_blob=$(git hash-object verification/hodge_basketb_rootmoving_extremal/HodgeBasketBRootMovingExtremalFinite.lean)"
            echo "source_sha256=$(sha256sum verification/hodge_basketb_rootmoving_extremal/HodgeBasketBRootMovingExtremalFinite.lean | awk '{print $1}')"
            echo "environment=lean-4.30.0"
          } > evidence/hodge_basketb_rootmoving_extremal/replay-metadata.txt

      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hodge-basketb-rootmoving-extremal-evidence
          path: evidence/hodge_basketb_rootmoving_extremal/
          if-no-files-found: error
