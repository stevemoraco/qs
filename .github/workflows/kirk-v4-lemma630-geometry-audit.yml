name: Kirk v4 Lemma 6.30 geometry audit

on:
  push:
    branches:
      - verification/ym-kirk-v4-lemma630-geometry-audit-20260814-gpt56sol
    paths:
      - .github/workflows/kirk-v4-lemma630-geometry-audit.yml
      - tools/probe_kirk_latest_source.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verification/ym-kirk-v4-lemma630-geometry-audit-20260814-gpt56sol
      - name: Ensure pdftotext
        run: |
          if ! command -v pdftotext >/dev/null; then
            sudo apt-get update && sudo apt-get install -y poppler-utils
          fi
      - name: Pin latest immutable source
        run: python3 tools/probe_kirk_latest_source.py >/tmp/probe.json
      - name: Extract narrow load-bearing geometry slices
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('latest.txt').read_text(encoding='utf-8', errors='replace')
          out = Path('source_audit/kirk_v4/lemma630_geometry')
          out.mkdir(parents=True, exist_ok=True)

          def exact_section(start_pat, end_pat, name):
              s=re.search(start_pat,text,re.I)
              if not s: raise SystemExit(f'missing {start_pat}')
              e=re.search(end_pat,text[s.end():],re.I)
              end=s.end()+e.start() if e else min(len(text),s.start()+30000)
              (out/name).write_text(text[s.start():end],encoding='utf-8')

          exact_section(r'Lemma 6\.17\s*\(',r'Lemma 6\.18\s*\(','LEMMA_6_17_EXACT.txt')
          exact_section(r'Theorem 6\.10\s*\(',r'Corollary 6\.11\s*\(','THEOREM_6_10_EXACT.txt')
          exact_section(r'Lemma 6\.30\s*\(',r'Lemma 6\.31\s*\(','LEMMA_6_30_EXACT.txt')
          exact_section(r'Proposition 6\.8\s*\(',r'Lemma 6\.9\s*\(','PROPOSITION_6_8_EXACT.txt')
          exact_section(r'Definition 6\.15\s*\(',r'Lemma 6\.16\s*\(','DEFINITION_6_15_EXACT.txt')

          pats={
            'QTAIL':r'Qtail',
            'CANONICAL_CONNECTOR':r'canonical connector',
            'SHORTEST_CONNECTOR':r'shortest connector',
            'EXP_MATRIX':r'exponential matrix algebra',
            'QTEMPL':r'Qtempl',
            'QOPT':r'Qopt',
            'DIAM_A':r'diam A',
            'INDEPENDENT_Q':r'independent of Q',
            'SOURCE_ORDER':r'source order',
            'FIXED_Q':r'fixed Q',
          }
          for label,pat in pats.items():
              hits=list(re.finditer(pat,text,re.I))
              chunks=[f'pattern={pat}\nhits={len(hits)}\n']
              for i,m in enumerate(hits[:12],1):
                  chunks.append(f'\n=== hit {i} offset {m.start()} ===\n')
                  chunks.append(text[max(0,m.start()-2500):min(len(text),m.start()+5000)])
              (out/f'{label}_SLICES.txt').write_text(''.join(chunks),encoding='utf-8')
          PY
      - name: Preserve immutable contexts
        run: |
          cp kirk_latest_record.json source_audit/kirk_v4/lemma630_geometry/
          cp kirk_source_probe_report.json source_audit/kirk_v4/lemma630_geometry/
          git config user.name 'millennium-braid-source-audit'
          git config user.email 'actions@users.noreply.github.com'
          git add source_audit/kirk_v4/lemma630_geometry
          git commit -m 'audit(ym): preserve narrow reference geometry slices'
          git push origin HEAD:verification/ym-kirk-v4-lemma630-geometry-audit-20260814-gpt56sol
