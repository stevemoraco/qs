name: YM Kirk v4 transition outer source holomorphy audit

on:
  push:
    branches:
      - verification/ym-kirk-v4-transition-outer-source-holomorphy-20260816-run3
    paths:
      - .github/workflows/ym-kirk-transition-outer-source-holomorphy.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verification/ym-kirk-v4-transition-outer-source-holomorphy-20260816-run3
      - name: Ensure pdftotext
        run: |
          if ! command -v pdftotext >/dev/null; then sudo apt-get update && sudo apt-get install -y poppler-utils; fi
      - name: Pin immutable Kirk source
        run: python3 tools/probe_kirk_latest_source.py >/tmp/probe.json
      - name: Extract transition/outer source-holomorphy contexts
        run: |
          set -euo pipefail
          pdftotext -raw kirk_latest.pdf latest_raw.txt
          python3 - <<'PY'
          from pathlib import Path
          text=Path('latest_raw.txt').read_text(encoding='utf-8',errors='replace')
          low=text.lower()
          out=Path('source_audit/kirk_v4/transition_outer_source_holomorphy'); out.mkdir(parents=True,exist_ok=True)
          targets=[
            'Theorem 3.16','Theorem 3.20','Theorem 4.6',
            'transition-collar','outer-anchor','rho_col','rho_out','ρcol','ρout',
            'lambda_curv','λcurv','source factor','source factors','source parameter','source parameters',
            'source tube','exterior/source product tube','bounded local source parameters enter holomorphically',
            'differentiate the smooth finite-dimensional density directly','Bell-polynomial loss',
            'D_J','DJ','local source','source perturbation','source insertion'
          ]
          chunks=[]; counts={}
          for target in targets:
            pos=0; n=0
            while True:
              i=low.find(target.lower(),pos)
              if i<0: break
              n+=1
              chunks.append(f'=== {target} hit {n} at {i} ===\n'+text[max(0,i-10000):min(len(text),i+18000)]+'\n')
              pos=i+len(target)
              if n>=80: break
            counts[target]=n
          (out/'TARGETED.txt').write_text('\n'.join(chunks),encoding='utf-8')
          (out/'COUNTS.txt').write_text('\n'.join(f'{k}: {v}' for k,v in counts.items())+'\n',encoding='utf-8')
          # Preserve the whole bad-core source neighborhood from the exterior tube through the irregular map.
          a=low.find('3.3 exterior complex tube')
          b=low.find('4 permanent weak renormalization group')
          if a>=0 and b>a:
            (out/'BAD_CORE_SOURCE_SECTION.txt').write_text(text[a:b],encoding='utf-8')
          cp=Path('kirk_latest_record.json')
          if cp.exists(): (out/'kirk_latest_record.json').write_text(cp.read_text(encoding='utf-8'),encoding='utf-8')
          import hashlib
          data=Path('kirk_latest.pdf').read_bytes()
          (out/'PDF_SHA256.txt').write_text(hashlib.sha256(data).hexdigest()+'  kirk_latest.pdf\n',encoding='utf-8')
          print('\n'.join(f'{k}: {v}' for k,v in counts.items()))
          required=['Theorem 3.16','Theorem 3.20','Theorem 4.6','transition-collar','outer-anchor']
          missing=[x for x in required if counts.get(x,0)==0]
          if missing: raise SystemExit('missing anchors: '+', '.join(missing))
          PY
      - name: Commit audit output
        run: |
          git config user.name 'millennium-braid-source-audit'
          git config user.email 'actions@users.noreply.github.com'
          git add source_audit/kirk_v4/transition_outer_source_holomorphy
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audit(ym): preserve transition/outer source holomorphy contexts'
          git push origin HEAD:verification/ym-kirk-v4-transition-outer-source-holomorphy-20260816-run3
