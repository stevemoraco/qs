name: Unified eight-lane braid replay

on:
  push:
    branches:
      - 'agent/unified-braid-replay-20260813'
    paths:
      - 'verification/unified-eight-lane-replay/**'
      - '.github/workflows/unified-eight-lane-replay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Reject explicit proof holes and trust escapes
        shell: bash
        run: |
          set -euo pipefail
          f=verification/unified-eight-lane-replay/ExecutableResearchBraid.lean
          if grep -nE '\b(sorry|admit|sorryAx|axiom|opaque|unsafe|native_decide|Lean\.ofReduceBool)\b' "$f"; then
            echo 'Forbidden proof carrier found'
            exit 1
          fi

      - name: Install Lean
        shell: bash
        run: |
          set -euo pipefail
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve pinned Mathlib and cache
        shell: bash
        working-directory: verification/unified-eight-lane-replay
        run: |
          set -euo pipefail
          lake update
          lake exe cache get

      - name: Kernel replay and axiom report
        shell: bash
        working-directory: verification/unified-eight-lane-replay
        run: |
          set -euo pipefail
          lake env lean ExecutableResearchBraid.lean | tee replay.log
          grep -q '^true$' replay.log
          if grep -q 'sorryAx' replay.log; then
            echo 'sorryAx found'
            exit 1
          fi
