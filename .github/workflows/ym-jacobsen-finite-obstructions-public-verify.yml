name: YM Jacobsen Finite Obstructions Lean

on:
  push:
    branches:
      - ym/jacobsen-finite-obstructions-public-verify-20260811
    paths:
      - 'verification/ym-jacobsen-finite-obstructions/**'
      - '.github/workflows/ym-jacobsen-finite-obstructions-public-verify.yml'
  pull_request:
    branches: [main]
    paths:
      - 'verification/ym-jacobsen-finite-obstructions/**'
      - '.github/workflows/ym-jacobsen-finite-obstructions-public-verify.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Reject explicit placeholders
        shell: bash
        run: |
          set -euo pipefail
          file=verification/ym-jacobsen-finite-obstructions/YMJacobsenFiniteObstructions.lean
          if grep -En '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' "$file"; then
            echo 'Forbidden Lean placeholder found.' >&2
            exit 1
          fi
      - name: Install pinned Lean, fetch pinned Mathlib cache, and compile
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.32.1
          export PATH="$HOME/.elan/bin:$PATH"
          cd verification/ym-jacobsen-finite-obstructions
          lake update
          lake exe cache get
          lake env lean YMJacobsenFiniteObstructions.lean 2>&1 | tee lean-output.log
          if grep -Eq 'declaration uses .sorry.|sorryAx|admit' lean-output.log; then
            echo 'Forbidden placeholder axiom found in compiler output.' >&2
            exit 1
          fi
          echo 'VERIFIED finite YM Jacobsen obstruction cores: clean pinned build, zero reported sorry/admit.'
      - name: Upload compiler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ym-jacobsen-finite-obstructions-lean-evidence
          path: verification/ym-jacobsen-finite-obstructions/lean-output.log
          if-no-files-found: warn
