name: RH prime-prefix linear-response public verifier

on:
  push:
    branches:
      - agent/rh-prime-prefix-linear-response-public-verifier-20260813
  pull_request:
    paths:
      - 'verification/rh-prime-prefix-linear-response-public/**'
      - '.github/workflows/rh-prime-prefix-linear-response-public-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Verify exact source trust boundary
        shell: bash
        run: |
          set -euo pipefail
          dir='verification/rh-prime-prefix-linear-response-public'
          declare -A expected
          expected[RHPrimePrefixLinearResponse.lean]='0b03be5ce2be5e79a1e2246086174b4005e92d7c'
          expected[RHPrimePrefixBregmanReserve.lean]='a640ce97dfa5a6dfa0fa2adde24f1618e91d2be0'
          : > "$dir/source-blobs.txt"
          : > "$dir/source-sha256.txt"
          for name in RHPrimePrefixLinearResponse.lean RHPrimePrefixBregmanReserve.lean; do
            file="$dir/$name"
            actual_blob="$(git hash-object "$file")"
            test "$actual_blob" = "${expected[$name]}"
            printf '%s=%s\n' "$name" "$actual_blob" | tee -a "$dir/source-blobs.txt"
            sha256sum "$file" | tee -a "$dir/source-sha256.txt"
            if grep -En '(^|[^[:alnum:]_])(sorry|admit|sorryAx)([^[:alnum:]_]|$)' "$file"; then
              echo "Forbidden proof placeholder found in $name." >&2
              exit 1
            fi
            if grep -En '^[[:space:]]*(axiom|opaque|unsafe)[[:space:]]' "$file"; then
              echo "Forbidden trust declaration found in $name." >&2
              exit 1
            fi
            if grep -En '(native_decide|Lean\.ofReduceBool)' "$file"; then
              echo "Forbidden computational trust escape found in $name." >&2
              exit 1
            fi
          done

      - name: Install pinned Lean and compile exact sources
        shell: bash
        run: |
          set -euo pipefail
          dir='verification/rh-prime-prefix-linear-response-public'
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.32.1
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version | tee "$dir/lean-version.txt"
          lake --version | tee -a "$dir/lean-version.txt"
          cd "$dir"
          lake update
          lake exe cache get
          : > lean-output.log
          status=0
          for src in RHPrimePrefixLinearResponse.lean RHPrimePrefixBregmanReserve.lean; do
            printf '\n===== %s =====\n' "$src" | tee -a lean-output.log
            set +e
            lake env lean "$src" >> lean-output.log 2>&1
            one_status=$?
            set -e
            if [ "$one_status" -ne 0 ]; then
              status=$one_status
              break
            fi
          done
          cat lean-output.log
          if [ "$status" -ne 0 ]; then
            echo "Lean compilation failed with status $status" >&2
            exit "$status"
          fi
          if grep -Eq 'declaration uses .sorry.|sorryAx|admit|Lean.ofReduceBool' lean-output.log; then
            echo 'Forbidden dependency found in compiler report.' >&2
            exit 1
          fi

      - name: Enforce foundation-only axiom report
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import re

          path = pathlib.Path('verification/rh-prime-prefix-linear-response-public/lean-output.log')
          text = path.read_text()
          with_axioms = re.findall(
              r"'([^']+)' depends on axioms:\s*\[(.*?)\]",
              text,
              flags=re.S,
          )
          without_axioms = re.findall(
              r"'([^']+)' does not depend on any axioms",
              text,
          )
          expected = 10
          found = len(with_axioms) + len(without_axioms)
          if found != expected:
              raise SystemExit(f'expected {expected} staged axiom reports, found {found}')
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          rows = []
          for theorem, payload in with_axioms:
              deps = {part.strip() for part in payload.split(',') if part.strip()}
              extra = deps - allowed
              if extra:
                  raise SystemExit(f'{theorem} has non-foundation axioms: {sorted(extra)}')
              rows.append(f'{theorem}: {sorted(deps)}')
          for theorem in without_axioms:
              rows.append(f'{theorem}: []')
          report = '\n'.join(sorted(rows)) + '\n'
          out = pathlib.Path('verification/rh-prime-prefix-linear-response-public/axiom-report.txt')
          out.write_text(report)
          print(report, end='')
          PY
          echo 'VERIFIED RH prime-prefix linear-response and Bregman finite cores.'

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rh-prime-prefix-linear-response-public-evidence
          path: |
            verification/rh-prime-prefix-linear-response-public/source-blobs.txt
            verification/rh-prime-prefix-linear-response-public/source-sha256.txt
            verification/rh-prime-prefix-linear-response-public/lean-version.txt
            verification/rh-prime-prefix-linear-response-public/lean-output.log
            verification/rh-prime-prefix-linear-response-public/axiom-report.txt
