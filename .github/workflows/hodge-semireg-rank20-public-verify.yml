name: Hodge Semiregularity Rank-20 Finite Core Lean

on:
  push:
    branches:
      - agent/hodge-semiregularity-rank20-public-20260811
    paths:
      - 'verification/hodge-semireg-rank20/**'
      - '.github/workflows/hodge-semireg-rank20-public-verify.yml'
  pull_request:
    branches: [main]
    paths:
      - 'verification/hodge-semireg-rank20/**'
      - '.github/workflows/hodge-semireg-rank20-public-verify.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Reject placeholders and custom trust declarations
        shell: bash
        run: |
          set -euo pipefail
          file=verification/hodge-semireg-rank20/HodgeSemiregRank20.lean
          if grep -En '(^|[^[:alnum:]_])(sorry|admit|axiom|opaque|unsafe)([^[:alnum:]_]|$)' "$file"; then
            echo 'Forbidden Lean placeholder or custom trust declaration found.' >&2
            exit 1
          fi

      - name: Install pinned Lean, fetch pinned Mathlib cache, and compile
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.32.1
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version
          lake --version
          cd verification/hodge-semireg-rank20
          lake update
          lake exe cache get
          lake env lean HodgeSemiregRank20.lean 2>&1 | tee lean-output.log
          if grep -Eq 'declaration uses .sorry.|sorryAx|admit|Lean.ofReduceBool' lean-output.log; then
            echo 'Forbidden placeholder or unaccepted computational axiom found.' >&2
            exit 1
          fi
          echo 'VERIFIED Hodge semiregularity rank-20 finite core: clean pinned build.'

      - name: Upload compiler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hodge-semireg-rank20-finite-core-lean-evidence
          path: verification/hodge-semireg-rank20/lean-output.log
          if-no-files-found: warn
