name: NS distributed volume-tiling public verifier

on:
  push:
    branches:
      - agent/ns-distributed-volume-tiling-public-verifier-20260813
  pull_request:
    paths:
      - 'verification/ns-distributed-volume-tiling/**'
      - '.github/workflows/ns-distributed-volume-tiling-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Verify exact source trust boundary
        shell: bash
        run: |
          set -euo pipefail
          dir='verification/ns-distributed-volume-tiling'
          file="$dir/NSDistributedVolumeTilingFinite.lean"
          actual_blob="$(git hash-object "$file")"
          expected_blob='7ab455e9418e407315f52cbfd87ee6e412f7be8e'
          test "$actual_blob" = "$expected_blob"
          printf 'canonical_private_blob=%s\n' "$actual_blob" | tee "$dir/source-blob.txt"
          sha256sum "$file" | tee "$dir/source-sha256.txt"
          if grep -En '(^|[^[:alnum:]_])(sorry|admit|sorryAx)([^[:alnum:]_]|$)' "$file"; then
            echo 'Forbidden proof placeholder found.' >&2
            exit 1
          fi
          if grep -En '^[[:space:]]*(axiom|opaque|unsafe)[[:space:]]' "$file"; then
            echo 'Forbidden trust declaration found.' >&2
            exit 1
          fi
          if grep -En '(native_decide|Lean\.ofReduceBool)' "$file"; then
            echo 'Forbidden computational trust escape found.' >&2
            exit 1
          fi

      - name: Install pinned Lean and compile exact source
        shell: bash
        run: |
          set -euo pipefail
          dir='verification/ns-distributed-volume-tiling'
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.32.1
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version | tee "$dir/lean-version.txt"
          lake --version | tee -a "$dir/lean-version.txt"
          cd "$dir"
          lake update
          lake exe cache get
          set +e
          lake env lean NSDistributedVolumeTilingFinite.lean > lean-output.log 2>&1
          status=$?
          set -e
          cat lean-output.log
          if [ "$status" -ne 0 ]; then
            echo "Lean compilation failed with status $status" >&2
            exit "$status"
          fi
          if grep -Eq 'declaration uses .sorry.|sorryAx|admit|Lean.ofReduceBool' lean-output.log; then
            echo 'Forbidden dependency found in compiler report.' >&2
            exit 1
          fi

      - name: Enforce foundation-only axiom report
        shell: bash
        run: |
          set -euo pipefail
          dir='verification/ns-distributed-volume-tiling'
          python3 - <<'PY'
          import pathlib
          import re
          path = pathlib.Path('verification/ns-distributed-volume-tiling/lean-output.log')
          text = path.read_text()
          with_axioms = re.findall(r"'([^']+)' depends on axioms:\s*\[(.*?)\]", text, flags=re.S)
          without_axioms = re.findall(r"'([^']+)' does not depend on any axioms", text)
          expected = 6
          found = len(with_axioms) + len(without_axioms)
          if found != expected:
              raise SystemExit(f'expected {expected} staged axiom reports, found {found}')
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          rows = []
          for theorem, payload in with_axioms:
              deps = {part.strip() for part in payload.split(',') if part.strip()}
              extra = deps - allowed
              if extra:
                  raise SystemExit(f'{theorem} has non-foundation axioms: {sorted(extra)}')
              rows.append(f'{theorem}: {sorted(deps)}')
          for theorem in without_axioms:
              rows.append(f'{theorem}: []')
          report = '\n'.join(sorted(rows)) + '\n'
          pathlib.Path('verification/ns-distributed-volume-tiling/axiom-report.txt').write_text(report)
          print(report, end='')
          PY
          echo 'VERIFIED NS distributed volume-tiling finite algebra.'

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ns-distributed-volume-tiling-evidence
          path: |
            verification/ns-distributed-volume-tiling/source-blob.txt
            verification/ns-distributed-volume-tiling/source-sha256.txt
            verification/ns-distributed-volume-tiling/lean-version.txt
            verification/ns-distributed-volume-tiling/lean-output.log
            verification/ns-distributed-volume-tiling/axiom-report.txt
