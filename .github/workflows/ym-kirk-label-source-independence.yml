name: YM Kirk v4 bad label source independence audit

on:
  push:
    branches:
      - verification/ym-kirk-v4-transition-outer-source-holomorphy-20260816-run3
    paths:
      - .github/workflows/ym-kirk-label-source-independence.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verification/ym-kirk-v4-transition-outer-source-holomorphy-20260816-run3
      - name: Ensure pdftotext
        run: |
          if ! command -v pdftotext >/dev/null; then sudo apt-get update && sudo apt-get install -y poppler-utils; fi
      - name: Pin immutable Kirk source
        run: python3 tools/probe_kirk_latest_source.py >/tmp/probe.json
      - name: Extract label definitions and nearby source words
        run: |
          set -euo pipefail
          pdftotext -raw kirk_latest.pdf latest_raw.txt
          python3 - <<'PY'
          from pathlib import Path
          text=Path('latest_raw.txt').read_text(encoding='utf-8',errors='replace')
          low=text.lower()
          out=Path('source_audit/kirk_v4/transition_outer_source_holomorphy'); out.mkdir(parents=True,exist_ok=True)
          needles=['χin','χcurv','χcol','χout','gamma_D','γD','D_Q','DQ','T_Q','TQ','transition-collar','outer-anchor']
          chunks=[]
          positions=[]
          for needle in needles:
            pos=0; n=0
            while True:
              i=low.find(needle.lower(),pos)
              if i<0: break
              n+=1; positions.append(i)
              chunks.append(f'=== {needle} hit {n} at {i} ===\n'+text[max(0,i-6000):min(len(text),i+9000)]+'\n')
              pos=i+len(needle)
              if n>=20: break
          (out/'LABEL_DEFINITIONS.txt').write_text('\n'.join(chunks),encoding='utf-8')
          # Preserve a concise earliest label-definition window and count source terminology inside it.
          if positions:
            i=min(positions)
            window=text[max(0,i-12000):min(len(text),i+16000)]
            (out/'LABEL_EARLY_WINDOW.txt').write_text(window,encoding='utf-8')
            terms=['source',' J ','DJ','source parameter','source factor']
            (out/'LABEL_EARLY_SOURCE_COUNTS.txt').write_text('\n'.join(f'{t}: {window.lower().count(t.lower())}' for t in terms)+'\n',encoding='utf-8')
          if not positions: raise SystemExit('no label-definition anchors found')
          PY
      - name: Commit output
        run: |
          git config user.name 'millennium-braid-source-audit'
          git config user.email 'actions@users.noreply.github.com'
          git add source_audit/kirk_v4/transition_outer_source_holomorphy/LABEL_*.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audit(ym): preserve bad-label source-independence contexts'
          git push origin HEAD:verification/ym-kirk-v4-transition-outer-source-holomorphy-20260816-run3
