name: Hodge Shimizu foundation-only replay

on:
  push:
    branches:
      - agent/hodge-shimizu-foundation-public-20260813
    paths:
      - 'formal/hodge-shimizu-foundation/**'
      - '.github/workflows/hodge-shimizu-foundation-replay.yml'
  pull_request:
    branches: [main]
    paths:
      - 'formal/hodge-shimizu-foundation/**'
      - '.github/workflows/hodge-shimizu-foundation-replay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Verify byte-identical canonical source
        shell: bash
        run: |
          set -euo pipefail
          file='formal/hodge-shimizu-foundation/HodgeShimizuFoundationOnly.lean'
          expected='7e1525e7cf844e611bd5e8037174b54e6567074a'
          actual="$(git hash-object "$file")"
          printf 'expected Git blob: %s\nactual Git blob:   %s\n' "$expected" "$actual"
          test "$actual" = "$expected"

      - name: Reject proof holes and trust escapes
        shell: bash
        run: |
          set -euo pipefail
          file='formal/hodge-shimizu-foundation/HodgeShimizuFoundationOnly.lean'
          if grep -nE '\b(sorry|admit|axiom|opaque|unsafe|native_decide)\b|Lean\.ofReduceBool' "$file"; then
            echo 'Rejected: proof hole or custom trust carrier found.'
            exit 1
          fi

      - name: Install pinned official Lean release
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version \
            | tee formal/hodge-shimizu-foundation/toolchain.txt

      - name: Fresh foundation-only kernel replay
        shell: bash
        run: |
          set -euo pipefail
          file='formal/hodge-shimizu-foundation/HodgeShimizuFoundationOnly.lean'
          output='formal/hodge-shimizu-foundation/lean-kernel-output.txt'
          "$HOME/.elan/bin/lean" -DwarningAsError=true "$file" 2>&1 | tee "$output"
          if grep -q 'sorryAx' "$output"; then
            echo 'Rejected: kernel output contains sorryAx.'
            exit 1
          fi
          count="$(grep -c 'does not depend on any axioms' "$output")"
          echo "foundation-only axiom reports: $count"
          test "$count" -eq 8

      - name: Preserve replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hodge-shimizu-foundation-replay-${{ github.sha }}
          path: |
            formal/hodge-shimizu-foundation/HodgeShimizuFoundationOnly.lean
            formal/hodge-shimizu-foundation/lean-toolchain
            formal/hodge-shimizu-foundation/toolchain.txt
            formal/hodge-shimizu-foundation/lean-kernel-output.txt
          if-no-files-found: warn
