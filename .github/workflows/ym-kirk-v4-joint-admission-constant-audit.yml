name: YM Kirk v4 joint admission constant audit

on:
  push:
    branches:
      - verification/ym-kirk-v4-joint-admission-constant-audit-20260816-run3-gpt56sol
    paths:
      - .github/workflows/ym-kirk-v4-joint-admission-constant-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verification/ym-kirk-v4-joint-admission-constant-audit-20260816-run3-gpt56sol
      - name: Ensure pdftotext
        run: |
          if ! command -v pdftotext >/dev/null; then
            sudo apt-get update && sudo apt-get install -y poppler-utils
          fi
      - name: Pin immutable latest source
        run: python3 tools/probe_kirk_latest_source.py >/tmp/probe.json
      - name: Extract joint-admission constants and dependencies
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('latest.txt').read_text(encoding='utf-8',errors='replace')
          out=Path('source_audit/kirk_v4/joint_admission_constants'); out.mkdir(parents=True,exist_ok=True)
          targets=[
            ('theorem_3_31','Theorem 3.31'),
            ('lemma_4_27','Lemma 4.27'),
            ('proposition_4_26','Proposition 4.26'),
            ('lemma_6_41','Lemma 6.41'),
            ('theorem_6_43','Theorem 6.43'),
          ]
          summary=[]
          for slug,target in targets:
            m=re.search(r'(?m)^\s*'+re.escape(target)+r'\b.*$',text)
            if not m:
              summary.append(f'{target}: NOT FOUND'); continue
            start=max(0,m.start()-4500); end=min(len(text),m.start()+15000)
            (out/f'{slug}.txt').write_text(text[start:end],encoding='utf-8')
            summary.append(f'{target}: offset {m.start()}, chars {end-start}')
          pats=[
            r'\bC\s*E\b', r'\bCE\b', r'\bC0\b', r'\bCtree\b', r'\bCalloc\b',
            r'δB', r'δBKAR', r'admission threshold', r'strict admission',
            r'ηH', r'etaH', r'mbase', r'branch mass', r'standing convention',
            r'uniform in volume', r'preceding weak depth', r'RG\s*→\s*∞',
          ]
          hits=[]; counts=[]
          for pat in pats:
            ms=list(re.finditer(pat,text,re.I))
            counts.append(f'{pat}\tcount={len(ms)}\toffsets={[m.start() for m in ms[:64]]}')
            for k,m in enumerate(ms[:24]):
              hits.append(f'===== {pat} HIT {k+1} @ {m.start()} =====\n'+text[max(0,m.start()-1800):min(len(text),m.end()+4200)]+'\n')
          ce=list(re.finditer(r'\bCE\b',text))
          exact=[]
          for k,m in enumerate(ce):
            exact.append(f'===== EXACT CE {k+1}/{len(ce)} @ {m.start()} =====\n'+text[max(0,m.start()-3000):min(len(text),m.end()+6000)]+'\n')
          (out/'TARGETED.txt').write_text('\n'.join(hits),encoding='utf-8')
          (out/'COUNTS.txt').write_text('\n'.join(counts)+'\n',encoding='utf-8')
          (out/'EXACT_CE.txt').write_text('\n'.join(exact),encoding='utf-8')
          (out/'SUMMARY.txt').write_text('\n'.join(summary)+'\n',encoding='utf-8')
          for p in ['kirk_latest_record.json','kirk_source_probe_report.json']:
            q=Path(p)
            if q.exists(): (out/p).write_bytes(q.read_bytes())
          print('\n'.join(summary)); print('\n'.join(counts))
          PY
      - name: Commit audit
        run: |
          git config user.name 'millennium-braid-source-audit'
          git config user.email 'actions@users.noreply.github.com'
          git add source_audit/kirk_v4/joint_admission_constants
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audit(ym): expose exact joint-admission constant occurrences'
          git push origin HEAD:verification/ym-kirk-v4-joint-admission-constant-audit-20260816-run3-gpt56sol
      - uses: actions/upload-artifact@v4
        with:
          name: kirk-v4-joint-admission-constant-audit
          if-no-files-found: error
          retention-days: 30
          path: source_audit/kirk_v4/joint_admission_constants/
