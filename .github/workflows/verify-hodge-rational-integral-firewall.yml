name: Verify Hodge rational-integral firewall
# Replay registration refresh: 2026-08-13

on:
  push:
    branches: [verification/ns-selective-leray-atom-20260813]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Canonical-source and trust preflight
        shell: bash
        run: |
          set -euo pipefail
          SRC=verification/hodge-rational-integral-firewall/HodgeRationalIntegralFirewall.lean
          EXPECTED_GIT_BLOB=3de215048f9c00655463c39378e727843360f12e
          test "$(git hash-object "$SRC")" = "$EXPECTED_GIT_BLOB"
          python3 - <<'PY'
          import pathlib, re
          source = pathlib.Path('verification/hodge-rational-integral-firewall/HodgeRationalIntegralFirewall.lean').read_text()
          forbidden = re.compile(r'(^|[^A-Za-z0-9_])(sorry|admit|sorryAx|axiom|opaque|unsafe)([^A-Za-z0-9_]|$)')
          match = forbidden.search(source)
          if match:
              raise SystemExit(f'forbidden source token: {match.group(2)}')
          if 'Lean.ofReduceBool' in source or 'native_decide' in source:
              raise SystemExit('forbidden source token')
          if source.count('#print axioms') != 1:
              raise SystemExit('expected exactly one staged #print axioms command')
          print('source trust preflight: clean')
          PY

      - name: Execute AXLE Lean 4.30 and preserve raw response
        shell: bash
        run: |
          set -euo pipefail
          OUT=verification/hodge-rational-integral-firewall/evidence
          mkdir -p "$OUT"
          python3 - <<'PY'
          import json, pathlib, urllib.request
          out = pathlib.Path('verification/hodge-rational-integral-firewall/evidence/axle-response.json')
          source = pathlib.Path('verification/hodge-rational-integral-firewall/HodgeRationalIntegralFirewall.lean').read_text()
          payload = json.dumps({'content': source, 'environment': 'lean-4.30.0', 'ignore_imports': True, 'mathlib_options': False, 'timeout_seconds': 900}).encode()
          request = urllib.request.Request('https://axle.axiommath.ai/api/v1/check', data=payload, headers={'Content-Type': 'application/json'}, method='POST')
          try:
              with urllib.request.urlopen(request, timeout=960) as response:
                  result = json.load(response)
          except Exception as exc:
              result = {'okay': False, 'request_exception': repr(exc), 'lean_messages': {'errors': [], 'warnings': []}, 'tool_messages': {'errors': []}, 'failed_declarations': []}
          out.write_text(json.dumps(result, indent=2, sort_keys=True))
          print(json.dumps(result, indent=2))
          PY

      - name: Record replay metadata
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT=verification/hodge-rational-integral-firewall/evidence
          mkdir -p "$OUT"
          {
            echo "repository=$GITHUB_REPOSITORY"
            echo "ref=$GITHUB_REF"
            echo "commit=$GITHUB_SHA"
            echo "runner_name=$RUNNER_NAME"
            echo "runner_os=$RUNNER_OS"
            echo "source_git_blob=$(git hash-object verification/hodge-rational-integral-firewall/HodgeRationalIntegralFirewall.lean)"
            echo "source_sha256=$(sha256sum verification/hodge-rational-integral-firewall/HodgeRationalIntegralFirewall.lean | awk '{print $1}')"
            echo "environment=lean-4.30.0"
          } > "$OUT/replay-metadata.txt"
          cat "$OUT/replay-metadata.txt"

      - name: Upload exact compiler evidence before verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hodge-rational-integral-firewall-evidence
          path: verification/hodge-rational-integral-firewall/evidence/
          if-no-files-found: error

      - name: Enforce compiler and postcompile trust verdict
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path('verification/hodge-rational-integral-firewall/evidence/axle-response.json')
          if not p.exists():
              raise SystemExit('missing AXLE response evidence')
          result = json.loads(p.read_text())
          if (not result.get('okay') or result.get('lean_messages', {}).get('errors', [])
                  or result.get('lean_messages', {}).get('warnings', [])
                  or result.get('tool_messages', {}).get('errors', [])
                  or result.get('failed_declarations', [])):
              raise SystemExit('Lean/AXLE verification failed or warned; inspect uploaded response artifact')
          rendered = json.dumps(result)
          for forbidden in ('sorryAx', 'Lean.ofReduceBool'):
              if forbidden in rendered:
                  raise SystemExit(f'postcompile forbidden dependency: {forbidden}')
          print('VERIFIED WARNING-FREE: exact Hodge rational-integral firewall compiled under AXLE Lean 4.30')
          PY
