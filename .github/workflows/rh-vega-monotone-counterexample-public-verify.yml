name: RH Vega monotone counterexample public verifier

on:
  push:
    branches:
      - agent/rh-vega-monotone-counterexample-public-20260813
  pull_request:
    paths:
      - 'verification/rh-vega-monotone-counterexample-public/**'
      - '.github/workflows/rh-vega-monotone-counterexample-public-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify trust boundary
        shell: bash
        run: |
          set -euo pipefail
          dir='verification/rh-vega-monotone-counterexample-public'
          file="$dir/RHVegaMonotoneSubsequenceCounterexample.lean"
          actual_blob="$(git hash-object "$file")"
          expected_blob='55190e8ca912224e98c2a2a86ec790ecdf364b6a'
          test "$actual_blob" = "$expected_blob"
          printf 'canonical_private_blob=%s\n' "$actual_blob" | tee "$dir/source-blob.txt"
          sha256sum "$file" | tee "$dir/source-sha256.txt"
          if grep -En '(^|[^[:alnum:]_])(sorry|admit|sorryAx)([^[:alnum:]_]|$)' "$file"; then exit 1; fi
          if grep -En '^[[:space:]]*(axiom|opaque|unsafe)[[:space:]]' "$file"; then exit 1; fi
          if grep -En '(native_decide|Lean\.ofReduceBool)' "$file"; then exit 1; fi
      - name: Install pinned Lean and compile exact source
        shell: bash
        run: |
          set -euo pipefail
          dir='verification/rh-vega-monotone-counterexample-public'
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.32.1
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version | tee "$dir/lean-version.txt"
          lake --version | tee -a "$dir/lean-version.txt"
          cd "$dir"
          lake update
          lake exe cache get
          lake env lean RHVegaMonotoneSubsequenceCounterexample.lean > lean-output.log 2>&1
          cat lean-output.log
          if grep -Eq 'declaration uses .sorry.|sorryAx|admit|Lean.ofReduceBool' lean-output.log; then exit 1; fi
          echo 'VERIFIED RH Vega monotone-subsequence counterexample.'
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rh-vega-monotone-counterexample-public-evidence
          path: |
            verification/rh-vega-monotone-counterexample-public/source-blob.txt
            verification/rh-vega-monotone-counterexample-public/source-sha256.txt
            verification/rh-vega-monotone-counterexample-public/lean-version.txt
            verification/rh-vega-monotone-counterexample-public/lean-output.log
