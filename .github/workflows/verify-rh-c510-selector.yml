name: Verify RH C510 selector positive-part core

on:
  workflow_dispatch:
  push:
    paths:
      - "verification/rh_c510_selector/**"
      - ".github/workflows/verify-rh-c510-selector.yml"
  pull_request:
    paths:
      - "verification/rh_c510_selector/**"
      - ".github/workflows/verify-rh-c510-selector.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: verification/rh_c510_selector

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify exact source and trust gate
        shell: bash
        run: |
          set -euo pipefail
          file=RHSelectorPositivePart.lean
          test "$(git hash-object "$file")" = "8728c4b334badbb1504b22bd9c3a7a0b2f0d3099"
          if grep -nE '\b(sorry|admit|sorryAx|unsafe|opaque|native_decide)\b|^axiom |Lean\.ofReduceBool' "$file"; then
            echo "Forbidden token found"
            exit 1
          fi

      - name: Install elan
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get

      - name: Kernel-check exact source
        shell: bash
        run: |
          set -euo pipefail
          lake env lean RHSelectorPositivePart.lean 2>&1 | tee lean-output.txt
          if grep -q 'sorryAx' lean-output.txt; then
            echo "sorryAx found in axiom report"
            exit 1
          fi

      - name: Reject compiler warnings
        shell: bash
        run: |
          set -euo pipefail
          if grep -qi 'warning:' lean-output.txt; then
            echo "Compiler warning found"
            exit 1
          fi

      - name: Upload replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rh-c510-selector-replay
          path: |
            verification/rh_c510_selector/RHSelectorPositivePart.lean
            verification/rh_c510_selector/lean-output.txt
          if-no-files-found: warn
