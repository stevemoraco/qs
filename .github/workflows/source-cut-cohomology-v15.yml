name: source-cut-cohomology-v15

on:
  pull_request:
    paths:
      - 'MillenniumFiniteHorizonCohomologyExactifier.lean'
      - 'lakefile.toml'
      - 'lean-toolchain'
      - '.github/workflows/source-cut-cohomology-v15.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve pinned Mathlib and fetch cache
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get

      - name: Verify immutable source receipt
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum MillenniumFiniteHorizonCohomologyExactifier.lean | awk '{print $1}')" = "7bb40f52d8831eecc8f4e0dcd98f5cb50a873fae44d81dee507516b6efa6a324"
          test "$(git hash-object MillenniumFiniteHorizonCohomologyExactifier.lean)" = "f8d254df0d9e66f4a94bafc88380e625c6b39545"

      - name: Reject forbidden proof tokens
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '\b(sorry|admit|sorryAx|unsafe|opaque|native_decide)\b|^axiom |Lean\.ofReduceBool' MillenniumFiniteHorizonCohomologyExactifier.lean; then
            echo "Forbidden token found"
            exit 1
          fi

      - name: Kernel-check exact source
        shell: bash
        run: |
          set -euo pipefail
          lake env lean MillenniumFiniteHorizonCohomologyExactifier.lean 2>&1 | tee lean.log
          if grep -q 'sorryAx' lean.log; then
            echo "sorryAx found in axiom report"
            exit 1
          fi

      - name: Reject compiler warnings
        shell: bash
        run: |
          set -euo pipefail
          if grep -n '^warning:' lean.log; then
            echo "Lean compiler warning found"
            exit 1
          fi

      - name: Upload replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-cut-cohomology-v15-replay
          path: |
            MillenniumFiniteHorizonCohomologyExactifier.lean
            lean.log
          if-no-files-found: warn
