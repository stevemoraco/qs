name: PNP Coordinate Sampling Uniform Finite Core

on:
  push:
    branches:
      - research/pnp-coordinate-sampling-uniform-public-verifier-20260812
    paths:
      - 'verification/pnp-coordinate-sampling-uniform/**'
      - '.github/workflows/pnp-coordinate-sampling-uniform-verify.yml'
  pull_request:
    branches: [main]
    paths:
      - 'verification/pnp-coordinate-sampling-uniform/**'
      - '.github/workflows/pnp-coordinate-sampling-uniform-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Record source hashes and reject placeholders
        shell: bash
        run: |
          set -euo pipefail
          root=verification/pnp-coordinate-sampling-uniform
          sha256sum "$root/PNPCoordinateSamplingUniformFinite.lean" \
                    "$root/verify_coordinate_sampling_uniform.py" \
            | tee "$root/source-sha256.txt"
          if grep -En '(^|[^[:alnum:]_])(sorry|admit|axiom|opaque|unsafe)([^[:alnum:]_]|$)' \
              "$root/PNPCoordinateSamplingUniformFinite.lean"; then
            echo 'Forbidden Lean placeholder or custom trust declaration found.' >&2
            exit 1
          fi

      - name: Replay exact finite coordinate sampler
        shell: bash
        run: |
          set -euo pipefail
          root=verification/pnp-coordinate-sampling-uniform
          python3 --version | tee "$root/python-version.txt"
          python3 "$root/verify_coordinate_sampling_uniform.py" \
            --seed 260812 \
            --trial-budget 5000 \
            --output "$root/finite-certificate.json"
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('verification/pnp-coordinate-sampling-uniform/finite-certificate.json')
          data = json.loads(path.read_text())
          assert data['all_cases_verified'] is True
          assert len(data['cases']) == 2
          for case in data['cases']:
              assert case['single_error_below_quarter'] is True
              assert case['yes_perfect_completeness'] is True
              assert case['all_no_inputs_rejected'] is True
          print('verified_exact_finite_cases=2')
          PY

      - name: Install pinned Lean, fetch pinned Mathlib, and compile
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.32.1
          export PATH="$HOME/.elan/bin:$PATH"
          root=verification/pnp-coordinate-sampling-uniform
          lean --version | tee "$root/lean-version.txt"
          lake --version | tee -a "$root/lean-version.txt"
          cd "$root"
          lake update
          lake exe cache get
          set +e
          lake env lean PNPCoordinateSamplingUniformFinite.lean 2>&1 | tee lean-output.log
          status=${PIPESTATUS[0]}
          set -e
          if grep -Eq 'declaration uses .sorry.|sorryAx|admit|Lean.ofReduceBool' lean-output.log; then
            echo 'Forbidden dependency found in compiler report.' >&2
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          echo 'VERIFIED finite PNP coordinate-sampling scalar and type firewalls.'

      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pnp-coordinate-sampling-uniform-finite-evidence
          path: |
            verification/pnp-coordinate-sampling-uniform/source-sha256.txt
            verification/pnp-coordinate-sampling-uniform/python-version.txt
            verification/pnp-coordinate-sampling-uniform/finite-certificate.json
            verification/pnp-coordinate-sampling-uniform/lean-version.txt
            verification/pnp-coordinate-sampling-uniform/lean-output.log
          if-no-files-found: warn
