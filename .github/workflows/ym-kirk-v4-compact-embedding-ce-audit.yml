name: YM Kirk v4 compact embedding CE audit

on:
  push:
    branches:
      - verification/ym-kirk-v4-compact-embedding-ce-audit-20260816-run3-gpt56sol
    paths:
      - .github/workflows/ym-kirk-v4-compact-embedding-ce-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verification/ym-kirk-v4-compact-embedding-ce-audit-20260816-run3-gpt56sol
      - name: Ensure pdftotext
        run: |
          if ! command -v pdftotext >/dev/null; then
            sudo apt-get update && sudo apt-get install -y poppler-utils
          fi
      - name: Pin immutable latest source
        run: python3 tools/probe_kirk_latest_source.py >/tmp/probe.json
      - name: Extract compact analytic tube and joint-embedding contexts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('latest.txt').read_text(encoding='utf-8',errors='replace')
          out=Path('source_audit/kirk_v4/compact_embedding_ce'); out.mkdir(parents=True,exist_ok=True)
          targets=[
            ('lemma_6_22','Lemma 6.22'),
            ('lemma_6_23','Lemma 6.23'),
            ('lemma_6_27','Lemma 6.27'),
            ('lemma_6_30','Lemma 6.30'),
            ('theorem_6_39','Theorem 6.39'),
            ('corollary_6_40','Corollary 6.40'),
            ('lemma_6_41','Lemma 6.41'),
            ('theorem_6_43','Theorem 6.43'),
            ('theorem_4_4','Theorem 4.4'),
            ('lemma_4_27','Lemma 4.27'),
          ]
          summary=[]
          for slug,target in targets:
            m=re.search(r'(?m)^\s*'+re.escape(target)+r'\b.*$',text)
            if not m:
              summary.append(f'{target}: NOT FOUND'); continue
            start=max(0,m.start()-5000); end=min(len(text),m.start()+17000)
            (out/f'{slug}.txt').write_text(text[start:end],encoding='utf-8')
            summary.append(f'{target}: offset {m.start()}, chars {end-start}')
          pats=[
            r'common positive source radius', r'common analytic', r'joint.*tube', r'Cauchy',
            r'Fourier.Wiener', r'weighted row', r'species row', r'joint rooted ball',
            r'compact row', r'nonvacuum compact', r'branch mass', r'CE\s*ηH', r'C_E',
            r'fixed.*constant', r'uniform under the standing convention',
          ]
          hits=[]
          for pat in pats:
            ms=list(re.finditer(pat,text,re.I))
            for k,m in enumerate(ms[:32]):
              hits.append(f'===== {pat} HIT {k+1} @ {m.start()} =====\n'+text[max(0,m.start()-2500):min(len(text),m.end()+7000)]+'\n')
          (out/'TARGETED.txt').write_text('\n'.join(hits),encoding='utf-8')
          (out/'SUMMARY.txt').write_text('\n'.join(summary)+'\n',encoding='utf-8')
          for p in ['kirk_latest_record.json','kirk_source_probe_report.json']:
            q=Path(p)
            if q.exists(): (out/p).write_bytes(q.read_bytes())
          print('\n'.join(summary))
          PY
      - name: Commit audit
        run: |
          git config user.name 'millennium-braid-source-audit'
          git config user.email 'actions@users.noreply.github.com'
          git add source_audit/kirk_v4/compact_embedding_ce
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audit(ym): expose compact-to-joint embedding constants'
          git push origin HEAD:verification/ym-kirk-v4-compact-embedding-ce-audit-20260816-run3-gpt56sol
      - uses: actions/upload-artifact@v4
        with:
          name: kirk-v4-compact-embedding-ce-audit
          if-no-files-found: error
          retention-days: 30
          path: source_audit/kirk_v4/compact_embedding_ce/
