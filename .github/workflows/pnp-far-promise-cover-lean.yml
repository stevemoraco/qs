name: PNP Far-Promise Cover Finite Lean

on:
  push:
    branches:
      - verification/pnp-far-promise-cover-20260812
    paths:
      - 'verification/pnp-far-promise-cover/**'
      - '.github/workflows/pnp-far-promise-cover-lean.yml'
  pull_request:
    paths:
      - 'verification/pnp-far-promise-cover/**'
      - '.github/workflows/pnp-far-promise-cover-lean.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Reject explicit placeholders and custom trust declarations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import re
          path = pathlib.Path('verification/pnp-far-promise-cover/PNPFarPromiseCoverFinite.lean')
          text = path.read_text(encoding='utf-8')
          text = re.sub(r'/-.*?-/', '', text, flags=re.S)
          text = re.sub(r'--.*$', '', text, flags=re.M)
          patterns = [
              r'^\s*(sorry|admit)\b',
              r'^\s*axiom\b',
              r'^\s*opaque\b',
              r'^\s*unsafe\b',
              r'\bnative_decide\b',
              r'Lean\.ofReduceBool',
          ]
          for pattern in patterns:
              match = re.search(pattern, text, flags=re.M)
              if match:
                  raise SystemExit(f'forbidden declaration/token: {match.group(0)!r}')
          PY

      - name: Install pinned Lean, fetch pinned Mathlib cache, and compile
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.32.1
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version | tee lean-version.log
          lake --version | tee lake-version.log
          cd verification/pnp-far-promise-cover
          lake update
          lake exe cache get
          lake env lean PNPFarPromiseCoverFinite.lean 2>&1 | tee lean-output.log
          if grep -Eq 'declaration uses .sorry.|sorryAx|admit|error:' lean-output.log; then
            echo 'Forbidden placeholder axiom or compiler error found.' >&2
            exit 1
          fi
          echo 'VERIFIED finite PNP far-promise covering core.'

      - name: Upload compiler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pnp-far-promise-cover-lean-evidence
          path: |
            verification/pnp-far-promise-cover/lean-output.log
            lean-version.log
            lake-version.log
          if-no-files-found: warn
