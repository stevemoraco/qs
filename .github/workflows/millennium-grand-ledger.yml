name: Grand Ledger Lean

on:
  push:
    branches:
      - agent/grand-ledger-verify-20260813-gpt56
  pull_request:
    paths:
      - verification/millennium-grand-ledger/**
      - .github/workflows/millennium-grand-ledger.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Reject placeholders and hidden declarations
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re
          root = pathlib.Path('verification/millennium-grand-ledger')
          forbidden = [
              r'^\s*(sorry|admit)\b',
              r'^\s*(axiom|opaque)\b',
              r'\bunsafe\b',
              r'\bnative_decide\b',
              r'\bLean\.ofReduceBool\b',
          ]
          for p in sorted(root.glob('*.lean')):
              text = p.read_text()
              stripped = re.sub(r'/-.*?-/', '', text, flags=re.S)
              stripped = re.sub(r'--.*$', '', stripped, flags=re.M)
              for pattern in forbidden:
                  m = re.search(pattern, stripped, flags=re.M)
                  if m:
                      raise SystemExit(
                          f'{p}: forbidden declaration or proof device: {m.group(0)!r}')
          PY

      - name: Install pinned Lean and compile entrypoint
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.32.1
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version
          lake --version
          cd verification/millennium-grand-ledger
          lake update
          lake exe cache get
          lake env lean UnifiedEntrypoint.lean 2>&1 | tee lean-output.log
          if grep -Eq 'declaration uses .sorry.|sorryAx|admit' lean-output.log; then
            echo 'Forbidden placeholder axiom found in compiler output.' >&2
            exit 1
          fi
          echo 'VERIFIED integrated finite and algebraic ledger.'

      - name: Upload compiler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grand-ledger-lean-evidence
          path: verification/millennium-grand-ledger/lean-output.log
          if-no-files-found: warn
